title = "J'Toye OaaS gitleaks config"

[extend]
useDefault = true

# ---- Path-based allowlists ---------------------------------------------------
[[allowlists]]
description = "Placeholder template files containing CHANGE_ME / REPLACE_WITH_*"
condition = "OR"
paths = [
  '''\.env\.example$''',
  # Old path kept for full-history scans (fetch-depth 0); renamed to
  # *.yaml.example by #100 so it is no longer a live kustomize resource.
  '''k8s/base/secrets-template\.yaml$''',
  '''k8s/base/secrets-template\.yaml\.example$''',
  '''\.gitleaks\.toml$''',
  # Planning artifacts contain curl examples with env var placeholders
  # (e.g. curl -u ${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}).
  # These are code snippets, not actual credentials.
  '''\.planning/phases/.*-PLAN\.md$''',
  '''\.planning/phases/.*-RESEARCH\.md$''',
  # CONTEXT.md captures dev ports/creds (e.g. the KC_SEED_USER_PASSWORD dev seed
  # already committed on main in .env/realm) — same planning-prose risk class as
  # PLAN/RESEARCH above, not a live credential source.
  '''\.planning/phases/.*-CONTEXT\.md$''',
  # CONTROL-ARMS.md records falsifiability evidence: pasted psql command lines,
  # curl -sSI header dumps and container role NAMES. Same planning-prose risk
  # class as PLAN/RESEARCH/CONTEXT above. The widening is bounded by the plan
  # itself, which forbids pasting any command line carrying a literal password
  # value — the allowlist covers the prose risk, not a genuine secret.
  '''\.planning/phases/.*-CONTROL-ARMS\.md$''',
  '''scripts/smoke-test.*\.sh$''',
]

# ---- Content-based allowlists (defence-in-depth for any file) ----------------
[[allowlists]]
description = "Placeholder literal strings used across docs and examples"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''CHANGE_ME''',
  '''REPLACE_WITH_[A-Z_]+''',
  '''your-[a-z-]+-here''',
  '''<[A-Z_]+>''',
]

# ---- Fingerprint-based allowlists (specific historical false positives) ------
[[allowlists]]
description = "curl -u examples in planning docs and smoke test scripts (env var placeholders, not real credentials)"
condition = "OR"
commits = [
  "51edf6f52c4e3d5a25c68e1eac2299718dc26aa5",
  "d2834bae09ab74ebfcb9bc0449fb4770e79f8854",
  "3d62ed44899a0394881bd91de7051c1c8fbb1268",
  "76fcf55d756a5b87e7b827f528a8783e662727d6",
]
