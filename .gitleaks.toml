title = "J'Toye OaaS gitleaks config"

[extend]
useDefault = true

# ---- Path-based allowlists: NONE, deliberately -------------------------------
# SEC-3 (QA-council 20260902-134741). This file used to carry a `paths` allowlist
# over .env.example, k8s/base/secrets-template*, .gitleaks.toml, 140 planning
# files (.planning/phases/*-{PLAN,RESEARCH,CONTEXT,CONTROL-ARMS}.md) and
# scripts/smoke-test*.sh. A bare path allowlist suppresses EVERY rule in those
# files, so a real AWS key, GitHub PAT or private key pasted into planning prose
# was invisible — measured with identical bytes differing only in path: 3 findings
# under core-java/, 0 under .planning/phases/*-PLAN.md and scripts/smoke-test*.sh.
#
# The documented remedy, `targetRules` on the path allowlist, was measured on
# gitleaks 8.27.2 — the version .github/workflows/gitleaks.yml pins — and is
# INERT there: a targeted path allowlist suppressed nothing in six of six runs
# (planning paths still flagged all three planted rules under it, and the five
# historical curl-auth-user placeholders it was meant to keep covered resurfaced
# in a full-history scan). No side effects were observed. 8.30.1 honours it
# exactly as documented. The version pin is a deliberate act (issue #274,
# full-history rerun) and is not bumped to make a config trick work, so the path
# allowlists are removed instead and the placeholder shapes they existed for are
# expressed as CONTENT allowlists below, which are rule-agnostic but
# shape-precise and behave identically on 8.27.2 and 8.30.1.
#
# Scope measured over the FULL git history on 8.27.2 with the path allowlists
# removed: the only hits they ever suppressed were five curl-auth-user matches on
# `curl -u "${VAR:-default}:${VAR:-default}"` (11-02-PLAN.md and
# smoke-test-stomp-relay.sh, one commit) — all covered by the shell-expansion
# regex below, so the working tree (10) and full-history (11) finding sets are
# byte-identical before and after this change. Nothing in .env.example,
# secrets-template* or this file ever needed the path exemption: the CHANGE_ME /
# REPLACE_WITH_* content rules already cover them. A future planning document
# that trips generic-api-key fails the PR scan and is handled on its own merits
# (rewrite, or a commit fingerprint below) instead of pre-emptively blinding the
# scanner to 140 files.

# ---- Content-based allowlists (defence-in-depth for any file) ----------------
[[allowlists]]
description = "Placeholder literal strings used across docs and examples"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''CHANGE_ME''',
  '''REPLACE_WITH_[A-Z_]+''',
  '''your-[a-z-]+-here''',
  '''<[A-Z_]+>''',
  # SEC-3: a captured secret that consists ENTIRELY of shell parameter
  # expansions — ${VAR} or ${VAR:-default}, optionally two of them joined by ':'
  # as curl -u user:pass writes them, with or without the surrounding quotes
  # gitleaks captures — is a placeholder by construction. Anchored at BOTH ends
  # on purpose: "${SVC_USER}:hunter2" and admin:${PASS} do NOT match and stay
  # flagged (measured on 8.27.2 and 8.30.1).
  '''^["']?\$\{[A-Za-z_][A-Za-z0-9_]*(?::-[^}]*)?\}(?::\$\{[A-Za-z_][A-Za-z0-9_]*(?::-[^}]*)?\})?["']?$''',
]

# ---- The Azurite published development-storage key (Phase 36, blobctl) -------
# Microsoft publishes this key for the emulator's "devstoreaccount1" account
# (Azurite README, "Default Storage Account"); it authenticates to nothing but a
# local emulator. The Go SDK cannot resolve UseDevelopmentStorage=true itself, so
# infra/backups/blobctl/emulator.go must carry the literal, and generic-api-key
# flags it (measured on 8.27.2 and 8.30.1: rc=1, the captured secret is exactly
# the 88-character key). ONE regex, anchored at both ends, matching exactly that
# key: any other AccountKey value, including one differing by a single character,
# still fails the scan. Content-scoped, NOT a path allowlist (SEC-3 above).
[[allowlists]]
description = "Azurite published development-storage key (public, Microsoft-documented, emulator-only; Phase 36 blobctl)"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq\/K1SZFPTOtr\/KBHBeksoGMGw\=\=$''',
]

# ---- The Boot-3.5 golden fixtures' idempotency key (Phase 38, plan 38-01) ----
# core-java/src/test/resources/jackson2-golden/idempotency/storefront.guest-order
# {,.legacy}.request.json carry "idempotencyKey":"golden-guest-key-0001", the
# client-supplied order de-duplication key of a FIXTURE request, captured by the
# Boot 3.5.16 serializers (commit e12177e1). It authenticates to nothing. The files
# are byte-guarded by GoldenFixturesIntegrityTest, so no inline gitleaks:allow can be
# added, and a commit fingerprint would not cover the squash commit that main's
# push scan reads. generic-api-key flags it on 8.30.1 (measured 38-18: rc=1, the
# captured secret is exactly this 21-character value). ONE regex, anchored at both
# ends: golden-guest-key-0002, or any other value, still fails the scan.
[[allowlists]]
description = "Phase 38 Jackson-2 golden fixture idempotency key (a fixture order de-duplication key, not a credential)"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^golden-guest-key-0001$''',
]

# ---- Fingerprint-based allowlists (specific historical false positives) ------
[[allowlists]]
description = "curl -u examples in planning docs and smoke test scripts (env var placeholders, not real credentials)"
condition = "OR"
commits = [
  "51edf6f52c4e3d5a25c68e1eac2299718dc26aa5",
  "d2834bae09ab74ebfcb9bc0449fb4770e79f8854",
  "3d62ed44899a0394881bd91de7051c1c8fbb1268",
  "76fcf55d756a5b87e7b827f528a8783e662727d6",
]

# ---- Phase 31.1 fixtures and RED-arm evidence (plan 31.1 ship, 2026-10-07) ---
# The pre-push range scan (222 commits) flagged 26 generic-api-key hits, every one
# a value that authenticates to nothing, in four shapes. Each is allowlisted by
# CONTENT and anchored at both ends (SEC-3 above), never by path, so a real key
# pasted into the same files still fails the scan. Measured on 8.27.2 (the CI pin)
# and 8.30.1: the 26 clear; a planted ghp_ PAT, an AWS key and a near-miss of each
# shape (one character off, a non-UUID tail, an unlisted prefix) still fire.
#
# 1. The DsarVerificationMailerTest fixture token: base64("foobar") followed by a
#    literal alphabet run — read as a URL-safe token by the test and by the
#    31.1-20 RED evidence that captured it. ONE exact value.
# 2. Idempotency keys the 31.1-03 / 31.1-09 RED arms sent as `Idempotency-Key:
#    <prefix>-<uuid>`: a client-supplied order de-duplication key (the Phase 38
#    golden-fixture argument above). The prefix set is closed; the tail must be a
#    well-formed lower-case UUID.
# 3. The DSAR worker's `dsar_access_completed request=<uuid>` log line captured in
#    31.1-16 RED evidence: a row id, matched on the LINE so a bare UUID elsewhere
#    (which may be a tenant-scoped identifier) is not blanket-allowed.
# 4. A plan-evidence FILENAME (`<phase>-<plan>-<slug>.<ext>`) that SUMMARY.md
#    prose names after `key=`-like punctuation; the extension set is closed.
[[allowlists]]
description = "Phase 31.1 test-fixture token and RED-arm idempotency keys (fixtures, not credentials)"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^Zm9vYmFy-_0123456789abcdefghijABCDEFGHIJxyz$''',
  '''^(vendor|ack-missing|ack-idem|ack-race)-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
  '''^[0-9]+(\.[0-9]+)?-[0-9]{2}-[a-z0-9][a-z0-9-]*\.(tsv|json|txt|md|log|csv)$''',
]

[[allowlists]]
description = "Phase 31.1 DSAR worker log line captured in RED-arm evidence (a request row id on the line, not a credential)"
condition = "OR"
regexTarget = "line"
regexes = [
  '''dsar_access_completed request=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b''',
]

# ---- Phase 37 fixture (plan 37-08, 2026-10-08) -------------------------------
# `EmailNotificationServiceStaffInviteTest.LINK` is the emailed invite link in its
# 37-08 shape, `{base}#token={tenantId}.{token}`. The `token=` key followed by a
# UUID trips `generic-api-key` on gitleaks 8.30.1. The value is a fixture: the
# tenant id is a literal UUID chosen for the test and the token decodes to
# "CheckOnlyThisIsATestTokenThatIsLong". ONE exact value, matched on the secret.
[[allowlists]]
description = "Phase 37 test fixtures: the 37-08 invite link (a literal tenant id in the fragment) and the 37-09 accept-page password marker (PwMarker-7c1f-correct…, a test string chosen so a log leak is greppable); neither is a credential"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^6f318039-1f48-40f2-b7a0-1132ce4bb369\.?$''',
  '''^PwMarker-7c1f-correct$''',
]

[[allowlists]]
description = "Phase 37-20 RED-arm evidence (37-20-red-dto-schedule.json, 37-20-red-hours-it.json): ShopPauseIntegrationTest shop SLUGS of the form indef-after-<uuid> / no-hours-<uuid>, captured inside the JUnit XML the arm recorded; a shop slug is not a credential. Exact values, not a pattern (gitleaks 8.30.1 generic-api-key)"
regexTarget = "secret"
regexes = [
  '''^indef-after-8d132ce5-3179-41b2-88c3-cba8ed486a6d$''',
  '''^indef-after-e58d290e-84a6-402a-9307-5efadbde1dd0$''',
  '''^no-hours-b1aa2e13-1cde-4411-bd84-1f2625b453b8$''',
]

[[allowlists]]
description = "Phase 37-27 RED-arm evidence (37-27-red-task2.json, 37-27-red-task3.json): CashOrderCapIntegrationTest Idempotency-Key values of the form cash-<n>-<uuid> / closed-<n>-<uuid> that the assertion message of the card-exemption and closed-orders arms carries as `key=…` inside the JUnit XML the arm recorded. A client-supplied order de-duplication key, the Phase 31.1 shape above: the prefix set is closed, the ordinal is one digit and the tail must be a well-formed lower-case UUID (gitleaks 8.30.1 generic-api-key; 14 hits over the 37-27 range, 0 after; cash-12-<uuid>, a non-UUID tail and an unlisted prefix still fire)"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^(cash|closed)-[0-9]-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]

[[allowlists]]
description = "Phase 37-28 test fixtures: the four 64-hex HMAC keys ClientIpDigesterTest (KEY_A, KEY_B), PublicStorefrontServiceTest (TEST_HMAC_KEY) and ClientIpCapIntegrationTest (HMAC_KEY) construct ClientIpDigester with. Each is a recognisable pattern chosen so a leak is greppable (0123456789abcdef x4, its reverse, and a 3728-prefixed run), authenticates to nothing and is not the shape openssl rand -hex 32 produces. Exact values, matched on the secret (gitleaks 8.30.1 generic-api-key; 4 hits over the 37-28 range, 0 after; a value differing in one character still fires)"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef$''',
  '''^fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210$''',
  '''^37280000111122223333444455556666777788889999aaaabbbbccccddddeeee$''',
]

[[allowlists]]
description = "Phase 37-33 RED-arm evidence (evidence/37-33-tdd/red-task1-record.json, red-task2-record.json): BasketRevalidationIntegrationTest Idempotency-Key values of the form missing-<uuid> / reprice-<uuid> / mixed-<uuid> that the arms' assertion messages carry as `key=…` inside the JUnit XML the arm recorded. The 37-27 block's shape with this plan's closed prefix set and no ordinal; the tail must be a well-formed lower-case UUID (gitleaks 8.30.1 generic-api-key; 5 hits over the 37-33 range, 0 after; an unlisted prefix and a non-UUID tail still fire)"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^(missing|reprice|mixed)-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]

[[allowlists]]
description = "Phase 37-40 RED-arm evidence (evidence/37-40-red-task3.json): OrderShopLessProductIntegrationTest sends Idempotency-Key 37-40-<uuid>, and IdempotencyService's `Idempotency reserve+complete: … key=…` DEBUG line carries it inside the captured test log the arm recorded. A client-supplied order de-duplication key, the 37-27/37-33 shape with this plan's one literal prefix; the tail must be a well-formed lower-case UUID (gitleaks 8.30.1 generic-api-key; 3 hits over the 37-40 range, 0 after; another plan prefix and a non-UUID tail still fire)"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^37-40-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]

[[allowlists]]
description = "Phase 37-42 RED-arm evidence (evidence/37-42-red-task1.json): OrderCreateSubmitIntegrationTest sends Idempotency-Key 37-42-<uuid>, and IdempotencyService's `Idempotency reserve+complete: … key=…` DEBUG line carries it inside the captured test log the arm recorded. A client-supplied order de-duplication key, the 37-27/37-33/37-40 shape with this plan's one literal prefix; the tail must be a well-formed lower-case UUID (gitleaks 8.30.1 generic-api-key; 6 hits in the record before, 0 after; another plan prefix and a non-UUID tail still fire)"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^37-42-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]

# ---- Phase 29 staging-estate identifiers (plans 29-09, 29-13, 2026-10-19) ----
# k8s/staging/azure-identity.yaml holds the IDENTIFIERS of the staging estate, read
# back from Azure (threat T-29-32, accepted: a client id, an object id or the AKS
# API host is not a credential; a Workload Identity token still needs the federated
# subject). 29-13's access evidence names each identity's principal id and the
# built-in "Key Vault Secrets User" role-definition id, which is Microsoft's
# published constant (identical in every tenant). generic-api-key flags them on
# 8.30.1 (6 hits over the 29 range). Matched on the LINE, anchored at both ends,
# so only these exact key shapes clear: a UUID under any other key, a non-UUID
# value under client_id_*, an FQDN outside *.hcp.<region>.azmk8s.io, and a real
# key on any of these lines still fire. Plan 29-21 adds principal_id_* (the same
# identities' object ids, which the CI preflight resolves grants through; 2 hits on
# the keycloak and secret_sync keys), under the same anchored UUID shape.
[[allowlists]]
description = "Phase 29 staging-estate identifiers: azure-identity.yaml client_id_*/principal_id_*/aks_api_server_fqdn, 29-13 principal-id access lines and the built-in Key Vault Secrets User role id (identifiers, not credentials; T-29-32)"
condition = "OR"
regexTarget = "line"
regexes = [
  '''^\s*(client|principal)_id_[a-z_]+: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"\s*$''',
  '''^\s*aks_api_server_fqdn: "[a-z0-9-]+\.hcp\.[a-z0-9]+\.azmk8s\.io"\s*$''',
  '''^\s*\+?jtoye-staging-[a-z-]+-id principal=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12} want=[0-9]+ got=[0-9]+ vault-wide=[0-9]+ scopes-equal=(yes|no)\s*$''',
  '''^\s*\+?role definition 'Key Vault Secrets User' = 4633458b-17de-408a-b874-0445c86b69e6\s*$''',
]

# ---- Phase 29-14 Kubernetes object UIDs (2026-10-19) ----
# evidence/29-14-tracer.txt Task 4 (A7) tracks the synced Secret rabbitmq-default-user
# by its Kubernetes metadata.uid across a pod deletion. A uid is a server-assigned
# object identifier, not a credential; generic-api-key flags "secret uid=<uuid>" and
# "secret=<uuid>" (4 hits). Anchored on the whole line in exactly the tracer's two
# shapes, so a uid under any other key, or a real key on these lines, still fires.
[[allowlists]]
description = "Phase 29-14 A7 evidence: Kubernetes Secret metadata.uid tracking lines (object identifiers, not credentials)"
condition = "OR"
regexTarget = "line"
regexes = [
  '''^\s*\+?## [0-9TZ:-]+ (before|after): secret uid=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12} created=[0-9TZ:-]+ owners=[A-Za-z]+/[a-z0-9-]+\s*$''',
  '''^\s*\+?[0-9:.]+ secret=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12} pods=\[[A-Za-z0-9:. -]*\]\s*$''',
]

# ---- Phase 29-22 Mailpit message ids (2026-10-19) ----
# evidence/29-22-mail-tls.txt records the id Mailpit assigned to the Keycloak SMTP test
# message. It is Mailpit's own 22-character message identifier, not a credential.
# generic-api-key reads "test message: ... id=<22 chars>" as a key (1 hit). Anchored on
# the full line shape, so the same token anywhere else, or a real key on this line, fires.
[[allowlists]]
description = "Phase 29-22 evidence: Mailpit message id of the Keycloak SMTP test message (an identifier, not a credential)"
condition = "OR"
regexTarget = "line"
regexes = [
  '''^\s*\+?[0-9TZ:-]+ Mailpit received the Keycloak test message: id=[A-Za-z0-9]{22} subject="[^"]*" to=[a-z0-9.@-]+ from=[a-z0-9.@-]+ date=[0-9TZ:-]+\s*$''',
]

# ---- Phase 29-26 Mailpit message ids (2026-10-19) ----
# evidence/29-26-config.txt lists Mailpit messages after a header ending "unsubscribe
# tokens redacted:". Each listing line starts with Mailpit's 22-character message id.
# generic-api-key reads the id as that "token"'s value across the line break (1 hit).
# The unsubscribe tokens themselves are already redacted. Anchored on the header and the
# "<id> Date: <RFC 5322 date> (GMT)" line, so an id-shaped string anywhere else, or a
# real key on either line, still fires. gitleaks hands the allowlist the whole two-line
# fragment (header + id line) for this cross-line match, so the regex spans both.
[[allowlists]]
description = "Phase 29-26 evidence: Mailpit message-id listing lines (identifiers, not credentials; unsubscribe tokens redacted)"
condition = "OR"
regexTarget = "line"
regexes = [
  '''^\s*\+?Mailpit after the transition \([0-9TZ:-]+\), [a-z]+ new messages?; unsubscribe tokens redacted:\s*\n\s*\+?[A-Za-z0-9]{22} Date: [A-Z][a-z]{2}, [0-9]{1,2} [A-Z][a-z]{2} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} \+0000 \(GMT\)\s*$''',
]
