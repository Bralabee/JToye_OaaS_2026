basePath: /
definitions:
  main.ComponentHealth:
    properties:
      healthy:
        description: Whether the downstream passed its readiness check.
        example: true
        type: boolean
    type: object
  main.CoreProblem:
    properties:
      detail:
        description: Human-readable explanation specific to this occurrence.
        example: You have no access to this shop
        type: string
      instance:
        description: The request path core refused.
        example: /api/v1/sync/batch
        type: string
      status:
        description: HTTP status code, repeated in the body.
        example: 403
        type: integer
      title:
        description: Short human-readable summary of the problem type.
        example: Forbidden
        type: string
      type:
        description: Stable problem type URI, e.g. https://jtoye.uk/errors/shop-access-denied.
        example: https://jtoye.uk/errors/shop-access-denied
        type: string
    type: object
  main.ErrorResponse:
    properties:
      error:
        description: Human-readable error message.
        example: invalid request body
        type: string
    type: object
  main.HealthResponse:
    properties:
      edge:
        description: Edge liveness indicator. Always "OK" when the process is up.
        example: OK
        type: string
      uptime:
        description: Unix timestamp (seconds) at the moment the probe was served.
        example: 1713484800
        type: integer
    type: object
  main.ProblemDetail:
    properties:
      code:
        description: Stable machine-readable code. RATE_LIMITED for a 429.
        example: RATE_LIMITED
        type: string
      detail:
        description: Human-readable explanation specific to this occurrence.
        example: Rate limit exceeded. Please try again in 1 seconds.
        type: string
      retryAfterSeconds:
        description: Whole seconds to wait before retrying; equals the Retry-After
          header.
        example: 1
        type: integer
      status:
        description: HTTP status code, repeated in the body.
        example: 429
        type: integer
      title:
        description: Short human-readable summary of the problem type.
        example: Too Many Requests
        type: string
      type:
        description: Stable problem type URI. https://jtoye.uk/errors/rate-limited
          for a 429.
        example: https://jtoye.uk/errors/rate-limited
        type: string
    type: object
  main.ReadyResponse:
    properties:
      core:
        allOf:
        - $ref: '#/definitions/main.ComponentHealth'
        description: Core Java API health (via its /health endpoint).
      edge:
        description: Edge self-status. Always "OK" when the process is up.
        example: OK
        type: string
      jwks:
        allOf:
        - $ref: '#/definitions/main.ComponentHealth'
        description: Keycloak JWKS endpoint health.
    type: object
  main.SyncBatchRequest:
    properties:
      items:
        description: Opaque list of sync items. Each map is forwarded to Core as-is.
        items:
          additionalProperties: true
          type: object
        type: array
    type: object
  main.SyncBatchResponse:
    properties:
      processed_count:
        description: Number of items written (CREATED plus UPDATED).
        example: 1
        type: integer
      results:
        description: One result per request item, in request order.
        items:
          $ref: '#/definitions/main.SyncItemResult'
        type: array
      status:
        description: |-
          SUCCESS when every item was written (or the batch was empty); PARTIAL
          when some were written and some rejected; REJECTED when none was
          written. Never SUCCESS when any item was refused: read results.
        enum:
        - SUCCESS
        - PARTIAL
        - REJECTED
        example: PARTIAL
        type: string
    type: object
  main.SyncItemResult:
    properties:
      code:
        description: Why the item was rejected (absent unless REJECTED).
        enum:
        - UNKNOWN_TYPE
        - SKU_REQUIRED
        - NAME_REQUIRED
        - SHOP_REQUIRED
        - SHOP_MISMATCH
        - SHOP_ACCESS_DENIED
        - SHOP_NOT_FOUND
        - INVALID_FIELDS
        - WRITE_CONFLICT
        - WRITE_FAILED
        example: SHOP_REQUIRED
        type: string
      id:
        description: Id of the product or shop written (absent when REJECTED).
        format: uuid
        type: string
      index:
        description: Position of the item in the request's items array (0-based).
        example: 1
        type: integer
      key:
        description: 'The item''s upsert key: the sku for a product, the name for
          a shop.'
        example: PLANTAIN-1
        type: string
      message:
        description: Human-readable detail for a rejection (absent unless REJECTED).
        example: shopId is required on every product item
        type: string
      outcome:
        description: What happened to the item.
        enum:
        - CREATED
        - UPDATED
        - REJECTED
        example: REJECTED
        type: string
      type:
        description: The item's type as sent.
        example: product
        type: string
    type: object
  main.WebhookAck:
    properties:
      accepted:
        description: True after receipt. Processing result is available in logs only.
        example: true
        type: boolean
    type: object
info:
  contact:
    name: J'Toye Platform Team
    url: https://github.com/jtoye/oaas
  description: Edge gateway for J'Toye OaaS multi-tenant retail platform. Routes authenticated
    traffic to core-java with rate limiting + circuit breakers, plus handles WhatsApp
    order-intake webhooks with HMAC-SHA256 signature verification.
  license:
    name: Proprietary
  termsOfService: https://github.com/jtoye/oaas
  title: J'Toye Edge Gateway API
  version: "1.0"
paths:
  /api/v1/sync/batch:
    post:
      consumes:
      - application/json
      description: |-
        Forwards an opaque list of domain items to the Core Java
        API's /api/v1/sync/batch endpoint, wrapped in a circuit
        breaker so edge degrades gracefully when Core is down. The
        caller must present a Keycloak JWT — the tenant_id claim
        is extracted and used to scope the write.

        Rate-limited per tenant AFTER authentication, keyed on the
        token's tenant_id (RATE_LIMIT_TENANT_RPS / _BURST), beneath a
        per-replica pre-auth valve (RATE_LIMIT_RPS / _BURST) that only
        guards against floods. A 429 from either layer is
        application/problem+json with type
        https://jtoye.uk/errors/rate-limited and code RATE_LIMITED;
        wait Retry-After seconds, then retry the same request.

        Core's answer is passed through. A batch core processed is
        200 with core's status (SUCCESS, PARTIAL or REJECTED),
        processed_count and one result per item, in request order,
        each CREATED, UPDATED or REJECTED with a stable code. A
        partially refused batch is still 200: read status and
        results, never the HTTP status alone. A 4xx refusal from
        core (application/problem+json) is relayed verbatim: same
        status, content type and body, Retry-After kept. A core
        outage, an open circuit breaker or any core 5xx is the
        edge's own 502.
      parameters:
      - description: Batch payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.SyncBatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Core processed the batch: status, processed_count and per-item
            results'
          schema:
            $ref: '#/definitions/main.SyncBatchResponse'
        "202":
          description: Core accepted the batch (a core that predates per-item results;
            no results)
          schema:
            $ref: '#/definitions/main.SyncBatchResponse'
        "400":
          description: 'The edge''s own refusal: invalid body or missing tenant_id
            claim (application/json). Core''s batch validation refusal is relayed
            verbatim as application/problem+json (see CoreProblem)'
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "401":
          description: 'The edge''s own refusal: missing or malformed Bearer token
            (application/json). Core''s refusal of an expired or invalid token is
            relayed verbatim as application/problem+json (see CoreProblem)'
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "403":
          description: 'Core''s refusal, relayed verbatim (application/problem+json):
            the token lacks catalog:write (errors/forbidden) or the caller holds no
            grant on the target shop (errors/shop-access-denied)'
          schema:
            $ref: '#/definitions/main.CoreProblem'
        "429":
          description: 'Rate limit exceeded: the caller''s tenant bucket or this replica''s
            pre-auth valve is empty. application/problem+json, type https://jtoye.uk/errors/rate-limited,
            code RATE_LIMITED. Wait Retry-After seconds.'
          headers:
            Retry-After:
              description: Whole seconds to wait before retrying (at least 1); equals
                retryAfterSeconds in the body
              type: integer
            X-RateLimit-Limit:
              description: 'Capacity of the bucket that refused: the per-tenant burst,
                or the valve''s burst'
              type: integer
            X-RateLimit-Remaining:
              description: Tokens left in that bucket (always 0 on a 429)
              type: integer
            X-RateLimit-Reset:
              description: Unix epoch second at which that bucket is full again
              type: integer
          schema:
            $ref: '#/definitions/main.ProblemDetail'
        "502":
          description: Core API unreachable, the circuit breaker is open, or core
            failed (5xx); core's body is never relayed
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Batch-sync edge-collected items into Core
      tags:
      - sync
  /api/v1/webhooks/whatsapp:
    post:
      consumes:
      - application/json
      description: |-
        Accepts WhatsApp message-events, verifies the HMAC-SHA256
        signature in `X-Hub-Signature-256` against
        `WHATSAPP_APP_SECRET`, parses the message body into an
        order, resolves each product-name query to a product UUID
        via the Core search endpoint, and creates an order scoped
        to the vendor identified by `WHATSAPP_DEFAULT_SHOP_ID`. The
        endpoint is fail-closed, and the two refusals are distinct:
        an absent or invalid signature is 401, while an unset
        `WHATSAPP_APP_SECRET` is 503 with `Retry-After` — a known,
        operator-fixable unconfigured state rather than an internal
        error. Neither reads the body nor calls anything downstream.

        Processing outcomes (bad payload, ambiguous product, missing
        default shop, Core error) always return HTTP 200 to prevent
        WhatsApp from entering its 3-day exponential retry loop.
        Real error signals are in the structured logs.

        This is a PUBLIC route: Meta authenticates via the HMAC
        signature alone (it cannot present a Keycloak JWT). The edge
        mints its own client-credentials service token for the
        edge->Core call and scopes the order to WHATSAPP_DEFAULT_TENANT_ID.
      parameters:
      - description: HMAC-SHA256 of the raw body, prefixed with 'sha256='
        in: header
        name: X-Hub-Signature-256
        required: true
        type: string
      - description: WhatsApp message-event payload (shape defined by Meta)
        in: body
        name: payload
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Webhook received (processing outcome in logs)
          schema:
            $ref: '#/definitions/main.WebhookAck'
        "401":
          description: Missing or invalid HMAC signature
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "429":
          description: This replica's pre-auth valve is empty (a per-replica flood
            guard, not a quota; the route is public, so no tenant bucket applies).
            application/problem+json, type https://jtoye.uk/errors/rate-limited, code
            RATE_LIMITED. Wait Retry-After seconds.
          headers:
            Retry-After:
              description: Whole seconds to wait before retrying (at least 1); equals
                retryAfterSeconds in the body
              type: integer
            X-RateLimit-Limit:
              description: Capacity of the valve (its burst)
              type: integer
            X-RateLimit-Remaining:
              description: Tokens left in the valve (always 0 on a 429)
              type: integer
            X-RateLimit-Reset:
              description: Unix epoch second at which the valve is full again
              type: integer
          schema:
            $ref: '#/definitions/main.ProblemDetail'
        "503":
          description: WHATSAPP_APP_SECRET not configured — the route is unavailable
            until an operator sets it (fails closed)
          headers:
            Retry-After:
              description: Seconds to wait before retrying. This is an operator-fixable
                configuration state, not transient load.
              type: integer
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: WhatsApp order-intake webhook
      tags:
      - webhooks
  /health:
    get:
      description: |-
        Returns 200 whenever the edge process is alive. Does not
        touch any downstream dependency, so it never fails because
        Core or Keycloak is having a bad day. Used by kubelet as
        the liveness probe — a failing /health causes the pod to
        be restarted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /ready:
    get:
      description: |-
        Checks downstream dependencies (Core API /health + Keycloak
        JWKS). Returns 503 with a per-component health map when any
        dependency is unhealthy so kubelet pulls the pod out of the
        Service endpoint set without restarting it.
      produces:
      - application/json
      responses:
        "200":
          description: All downstream dependencies healthy
          schema:
            $ref: '#/definitions/main.ReadyResponse'
        "503":
          description: One or more dependencies unhealthy
          schema:
            $ref: '#/definitions/main.ReadyResponse'
      summary: Readiness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Keycloak-issued JWT. Prefix the value with `Bearer `.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
