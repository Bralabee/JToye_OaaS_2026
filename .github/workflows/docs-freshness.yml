name: docs-freshness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: docs-freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git ls-files sees the whole tree deterministically.
          fetch-depth: 0
      - name: Verify documentation metrics match source
        run: bash scripts/docs-freshness.sh
      # Runs even when the metrics check above fails, so one PR reports BOTH
      # kinds of doc drift instead of hiding the second behind the first.
      - name: Verify documented dependency versions match the build files
        if: always()
        run: bash scripts/check-doc-versions.sh
