name: docs-freshness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # check-handoff-contract.sh H-2 resolves capitalised issue/PR state claims in
  # HANDOFF.md through `gh api repos/{slug}/issues/{n}`. That path serves BOTH
  # issues and pull requests, so both scopes are required. Without them the gate
  # VOIDs at exit 2 (unverified) rather than passing — it never reports an
  # unresolvable claim as clean.
  issues: read
  pull-requests: read

jobs:
  check:
    name: docs-freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git ls-files sees the whole tree deterministically.
          fetch-depth: 0
      # docs-freshness.sh counts Jest/Playwright/vitest blocks with
      # scripts/count-test-blocks.mjs (issue #291) instead of a regex that matched
      # `RegExp.prototype.test(` and could not see `it.each` tables. The counter is
      # dependency-free — no npm ci — but it does need a node binary, and the script
      # exits 2 (VOID) rather than emitting a number when node is absent.
      - name: Set up Node.js (for the test-block counter)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Falsification of the counter itself, run BEFORE the gate that depends on it.
      # #291 was a measurement that could not fail; replacing it with a second
      # measurement that could not fail would be no improvement. These arms include
      # the refusals — a construct the counter cannot resolve must exit 2, never
      # produce a plausible number.
      - name: Verify the test-block counter still refuses what it cannot count
        run: bash scripts/check-test-block-counter.sh
      - name: Verify documentation metrics match source
        if: always()
        run: bash scripts/docs-freshness.sh
      # Runs even when the metrics check above fails, so one PR reports BOTH
      # kinds of doc drift instead of hiding the second behind the first.
      - name: Verify documented dependency versions match the build files
        if: always()
        run: bash scripts/check-doc-versions.sh
      # The other half of the docs-freshness loop. docs-freshness.sh proves
      # docs/metrics.json matches the source tree; this proves the numbers a
      # human actually reads (README.md, CLAUDE.md, AGENTS.md) match
      # docs/metrics.json. Without it README drifted to 921 against a tree of
      # 1851 with docs-freshness.sh green throughout — it never opened the file.
      - name: Verify prose metric claims match docs/metrics.json
        if: always()
        run: bash scripts/check-doc-metrics.sh
      # One project version across build.gradle.kts, frontend/package.json, its
      # lockfile (both places npm records it) and the README claims. It sat at
      # 2.1.0 through the v2.1 AND v2.2 releases because nothing compared the
      # sites to each other — four different answers to one question.
      - name: Verify the project version agrees across every site that claims it
        if: always()
        run: bash scripts/check-project-version.sh
      # The bundled OS Code-Point Open postcode dataset ships under the Open
      # Government Licence v3. Commercial use inside a proprietary product is
      # permitted and there is no share-alike clause — acknowledgement is the ONE
      # obligation it imposes, so an attribution that silently rots is a licence
      # breach rather than a cosmetic defect.
      #
      # This is the same value-vs-source shape as the steps above: it ties the
      # attribution the public footer RENDERS to the dataset release actually
      # committed in geo/SOURCE.md. It asserts all three rights holders, not just
      # the year — a footer carrying only the Ordnance Survey line would pass a
      # year-only check while omitting Royal Mail and National Statistics.
      # Fails closed at exit 2 when either input is missing or unparseable.
      - name: Verify the OGL geo attribution matches the committed dataset
        if: always()
        run: bash scripts/check-geo-attribution.sh
      # The generic claim-gate engine, running the SAME 43 assertions as the two
      # steps above (37 + 6) from a declarative rule table instead of bespoke bash.
      # Deliberately additive for now: it cross-checks those two while the engine
      # earns trust in CI, and they carry documentation the manifest does not yet.
      # Consolidation is tracked as a real issue, not a comment that quietly rots —
      # see scripts/gates/claims.manifest for the issue reference.
      # Engine is vendored (scripts/gates/) because a runner has only this repo.
      - name: Verify documented claims match their sources (claim-gate engine)
        if: always()
        run: bash scripts/check-claims.sh
      # docs/CHANGELOG.md was the one doc NOTHING read. The four steps above open
      # CLAUDE.md, AGENTS.md, README.md, the .planning/codebase docs, k8s/DEPLOYMENT.md
      # and terminal-states.yaml — and not it. So it drifted 24 PRs deep (last entry
      # #363, nine further feat/fix PRs merged) with every one of those steps green.
      # Backfilled in #392. This asserts SET COVERAGE — every merged feat/fix PR is
      # cited — which is a different shape from the claim engine's value-vs-source
      # rules, hence its own script rather than a manifest row.
      # It reads MERGED history (origin/HEAD), so a PR that forgets its entry goes red
      # on the push-to-main run right after it merges.
      - name: Verify every merged feat/fix PR is in the changelog
        if: always()
        run: bash scripts/check-changelog-contract.sh
      # ...and because it reads MERGED history, it is structurally incapable of firing on
      # the PR that omits its own entry. It goes red AFTERWARDS, on main, in front of
      # whoever opens the next unrelated PR. Six instances in two days — #568, #572, #575,
      # #577, #573, #574 — every one an entry heading citing the ISSUE rather than the PR.
      # This is the PR-TIME half (#579). Both are wanted: C-1 still backstops a PR that
      # merged with no entry at all, which this step cannot see if it is skipped.
      #
      # The title goes through env, NEVER interpolated into the run: line. A PR title is
      # attacker-controlled text and `${{ }}` inside a shell command is a script injection.
      - name: Verify THIS PR is cited in the changelog
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-changelog-cites-pr.sh
      # The repo's own documented first-run sequence is `cp .env.example .env` then
      # `bash scripts/verify-env.sh`, and it could not pass: verify-env.sh has required
      # KC_ADMIN_PASSWORD since the infra/ stack started guarding it with ${VAR:?}, and
      # the template never carried the key (QA run 20260902-134741, INT-16).
      #
      # CI could not see it, and that is the interesting half. e2e-nightly.yml reads the
      # credential list FROM `verify-env.sh --list-required` and appends generated values
      # after `cp .env.example .env`, so CI MANUFACTURES every required variable — the
      # template's omission is invisible to the one workflow that exercises it. This step
      # compares the two artefacts directly instead. Fails closed at exit 2 on an empty or
      # unreadable required list.
      - name: Verify .env.example offers a line for every required variable
        if: always()
        run: bash scripts/check-env-example-contract.sh
      # HANDOFF.md went stale TWICE on 2026-07-31, both times under the work it was
      # describing (#391, then #394), because nothing read it. This checks the claims
      # that ARE mechanically checkable: the gate count, capitalised issue/PR state
      # claims, and how far the document is behind the base branch. It deliberately
      # does NOT gate narrative prose — the file is half live state, half history, and
      # a gate that cannot tell them apart gets `|| true` appended to it. It therefore
      # cannot catch semantic rot; a green run is not "the handoff is accurate".
      - name: Verify the live claims in HANDOFF.md still hold
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-handoff-contract.sh
