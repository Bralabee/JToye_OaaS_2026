name: CI/CD Pipeline

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
    branches: [main]
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/jtoye

jobs:
  # Job 1: Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: jtoye
          POSTGRES_PASSWORD: password
          POSTGRES_DB: jtoye
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Go 1.25
        uses: actions/setup-go@v7
        with:
          # Must match edge-go/go.mod (go 1.25.0). Pinning an older version
          # (was 1.22) made GOTOOLCHAIN auto-download 1.25 mid-build, and that
          # switched toolchain broke `go tool covdata` during coverage
          # ("no such tool covdata"). Install 1.25 natively so covdata exists.
          go-version: '1.26'
          cache-dependency-path: edge-go/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Java tests
        run: ./gradlew :core-java:test --no-daemon
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: jtoye
          DB_USER: jtoye
          DB_PASSWORD: password

      - name: Install swaggo/swag CLI (needed by edge-go OpenAPI freshness test)
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.3

      - name: Run Go tests
        # -race dropped: requires cgo + gcc; GH Actions ubuntu-latest Go setup
        # doesn't install gcc by default, and race detection isn't required for
        # Phase 16 DOC-01 scope. Keep race-test as a local-only lint.
        run: go test -v -coverprofile=coverage.out ./...
        working-directory: edge-go
        env:
          # swag is installed to $(go env GOPATH)/bin; make sure the
          # OpenAPI freshness test can find it.
          PATH: ${{ env.PATH }}:/home/runner/go/bin

      - name: Validate edge-go OpenAPI spec (@seriousme/openapi-schema-validator)
        # ROADMAP DOC-01 success criterion #1: /openapi.json is a valid
        # OpenAPI spec per an openapi-spec-validator. We use
        # @seriousme/openapi-schema-validator on npm (its binary is
        # `validate-api`) — it accepts Swagger 2.0 and OpenAPI 3.x
        # alike. swaggo/swag v1 emits 2.0; the tradeoff is documented
        # in .planning/phases/16-go-edge-openapi/16-RESEARCH.md.
        # Exits non-zero on invalid spec; emits `{"valid": true}` on success.
        run: npx --yes -p @seriousme/openapi-schema-validator validate-api edge-go/docs/swagger.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend build (validates TypeScript)
        run: npm run build
        working-directory: frontend

      # --json --outputFile is here so the count oracle below can reuse THIS run
      # rather than executing the suite a second time. The human-readable reporter
      # output is unaffected.
      - name: Run frontend Jest tests
        run: npm test -- --ci --watchAll=false --json --outputFile="$RUNNER_TEMP/jest-report.json"
        working-directory: frontend

      # Issue #291. docs-freshness.sh asserts docs/metrics.json against the source
      # tree and check-doc-metrics.sh asserts the prose against docs/metrics.json —
      # a loop closed on itself, which stayed green for months over a Jest count
      # that was simply wrong (manifest 745, runner 789). These two steps are the
      # only ones that ask a RUNNER. They also cover the one case no static reader
      # can: a test declared inside a loop is one declaration and N executions.
      - name: Verify docs/metrics.json against the Jest runner (#291)
        if: always()
        run: bash scripts/check-test-count-oracle.sh jest --report "$RUNNER_TEMP/jest-report.json"

      # `playwright test --list` enumerates declarations without launching a browser,
      # so this needs no `playwright install`. It lives in THIS job, not in the
      # path-filtered E2E job, because a paths-filtered gate can report success in
      # six seconds without having run.
      - name: Verify docs/metrics.json against the Playwright declaration list (#291)
        if: always()
        run: bash scripts/check-test-count-oracle.sh playwright

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            core-java/build-local/reports/tests/
            edge-go/coverage.out

  # Job 1b: Testcontainers integration suite (QA-council #71).
  # Runs the @Tag("testcontainers") classes — real Postgres + FORCE RLS — that
  # the fast `test` job above excludes. GitHub-hosted runners provide a Docker
  # daemon; Testcontainers spins one throwaway Postgres per class. No external
  # services needed: application-test.yml + IntegrationTestSupport boot the
  # context brokerless (RabbitMQ dead-port) and cache-less.
  integration-tests:
    name: Integration Tests (Testcontainers RLS)
    runs-on: ubuntu-latest
    # Explicit because the repo's default GITHUB_TOKEN is restricted (contents +
    # packages read only): dorny/paths-filter lists the PR's changed files via
    # the pulls API, which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Path-filter the ~24.5-min Gradle integrationTest work: on pull_request runs
      # whose diff cannot affect the Java integration suite (docs-only / frontend-only
      # / edge-go-only / k8s-only PRs) the suite is skipped, but the job still reports
      # SUCCESS (in-job STEP gating, never a job-level `if:`) so it stays a satisfiable
      # required check. push/release bypass the filter (see the reusable gate below).
      - name: Filter paths affecting the Java integration suite
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            integration:
              - 'core-java/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/ci-cd.yaml'

      - name: Skip notice (integration suite not affected by this PR)
        if: github.event_name == 'pull_request' && steps.filter.outputs.integration != 'true'
        run: |
          echo "Integration suite skipped: this pull_request's diff touches none of the trigger paths"
          echo "  (core-java/**, build.gradle.kts, settings.gradle.kts, gradle.properties, gradle/**, gradlew, gradlew.bat, .github/workflows/ci-cd.yaml)"
          echo "so ./gradlew :core-java:integrationTest cannot be affected. This job reports SUCCESS on purpose"
          echo "so it stays a satisfiable required check. push/release runs always execute the full suite."

      - name: Set up JDK 21
        if: github.event_name != 'pull_request' || steps.filter.outputs.integration == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # The integrationTest fork count is derived from availableProcessors(), so the
      # runner's shape IS the input to that decision. Record it in the log rather
      # than assuming a runner size that GitHub can change under us — the previous
      # divisor was inert on CI for exactly that reason and nobody noticed, because
      # nothing ever printed the number it resolved to.
      - name: Runner shape (input to the integrationTest fork count)
        if: github.event_name != 'pull_request' || steps.filter.outputs.integration == 'true'
        run: |
          echo "nproc            : $(nproc)"
          echo "memory           : $(free -h | awk '/^Mem:/ {print $2 " total, " $7 " available"}')"
          echo "disk (workspace) : $(df -h . | awk 'NR==2 {print $4 " available"}')"

      - name: Run Testcontainers integration suite
        if: github.event_name != 'pull_request' || steps.filter.outputs.integration == 'true'
        run: ./gradlew :core-java:integrationTest --no-daemon

      - name: Upload integration test results
        if: always() && (github.event_name != 'pull_request' || steps.filter.outputs.integration == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: core-java/build-local/reports/tests/integrationTest/

  # Job 1b2: Frontend browser gate for the PUBLIC surfaces.
  #
  # WHY THIS EXISTS: until now nothing in CI opened a browser. Every other spec
  # in frontend/e2e needs the full docker stack (Postgres + Keycloak + core-java
  # + MinIO), so none of them run here — which left layout, image rendering and
  # interaction with ZERO automated coverage while text had three static gates.
  # Four consecutive user-reported defects landed in exactly that blind spot
  # (a modal that changed shape per photo, content gated behind scroll, a search
  # box that was a decorative link, a basket wiped on navigation).
  #
  # It stays cheap because e2e/public-layout.spec.ts stubs the public API
  # entirely: a built frontend and nothing else. ~1 min including the build.
  #
  # KEEP IT STACK-FREE. The moment this spec needs a backend it stops running in
  # CI and the blind spot comes back.
  frontend-e2e:
    name: Frontend E2E (public surfaces)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same in-job STEP gating as the integration suite: a PR that cannot
      # affect the frontend skips the work but still reports SUCCESS, so this
      # stays a satisfiable required check.
      - name: Filter paths affecting the frontend
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yaml'

      - name: Skip notice (frontend not affected by this PR)
        if: github.event_name == 'pull_request' && steps.filter.outputs.frontend != 'true'
        run: |
          echo "Frontend E2E skipped: this pull_request's diff touches no frontend/** path,"
          echo "so the public-surface layout cannot be affected. Reports SUCCESS on purpose"
          echo "so it stays a satisfiable required check. push/release always run it."

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        run: npm ci
        working-directory: frontend

      - name: Install Playwright chromium
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        run: npm run build
        working-directory: frontend
        env:
          # The public API is stubbed by the spec; this only has to be a
          # consistent origin for the stub to intercept and for CSP connect-src.
          NEXT_PUBLIC_API_URL: http://localhost:9090
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret # gitleaks:allow

      - name: Start frontend (production build)
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        run: |
          npx next start -p 3000 &
          # Poll rather than add a wait-on dependency for one line.
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/shop)" = "200" ]; then
              echo "frontend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "frontend did not come up within 60s"; exit 1
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:9090
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret # gitleaks:allow

      - name: Run public-surface layout conformance (mobile + desktop)
        if: github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true'
        run: npx playwright test e2e/public-layout.spec.ts
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-public-layout-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # Job 1c: K8s manifest validation (#100 / P2-9, #94 / P2-3, Phase 26 INFRA-02).
  # Client-side only (no cluster access) — five static gates, all under
  # k8s/scripts/, all sharing the exit-code convention 0 = clean / 1 = violation /
  # 2 = parse-or-tooling failure. Full local run + rationale for each:
  # k8s/DEPLOYMENT.md "K8s static gates".
  #
  #   1. check-no-plaintext-secrets.sh — builds k8s/base + every overlay with
  #      `kubectl kustomize` and fails if any output contains a top-level
  #      `kind: Secret` (committed plaintext/placeholder Secret material) or a
  #      REPLACE_WITH_* placeholder in anything other than the known
  #      deployment.timestamp annotation. SealedSecrets (ciphertext) are allowed.
  #   2. check-connection-math.sh — the DB connection budget: HPA maxReplicas ×
  #      Hikari pool (+ Keycloak + backup + exporter) must fit Postgres
  #      max_connections with >=20% headroom, and the core-java HPA must not
  #      scale on memory (#94).
  #   3. check-env-contract.sh — the two-direction env contract for ALL THREE
  #      built services: core-java, edge-go and the frontend (D-07/D-08,
  #      widened from core-java-only by #298 — the same bug class was live in
  #      edge-go and invisible to a core-java-only gate: JWT_EXPECTED_ISSUER
  #      had been read since #87 and no manifest ever supplied it).
  #      Direction (a): no env is injected that the service does not read
  #      (DEF-4). Direction (b): nothing the service reads is left unsupplied
  #      without a REASONED allowlist entry (DEF-6). The frontend additionally
  #      encodes the build-time/runtime channel split — a NEXT_PUBLIC_* name
  #      that is BOTH Dockerfile-ARG-declared and injected as a runtime `env:`
  #      is dead config and is not allowlistable (D-18).
  #      Every extractor is self-tested against a synthetic control, so a regex
  #      that matches nothing exits 2 (VOID) rather than reporting a clean
  #      contract over a service it never actually parsed. Needs GNU
  #      `grep -P`, which ubuntu-latest provides; it exits 2 without it.
  #   4. check-render-invariants.sh — RENDER-level assertions that pin the
  #      Phase 26 fixes: no hardcoded Postgres port, no EnvVar with both `value`
  #      and `valueFrom` (the API server rejects that apply), no common labels
  #      injected into the kube-dns DNS-egress podSelector (D-17 — a total DNS
  #      outage under an enforcing CNI), no localhost/minioadmin literal in a
  #      non-local render, and no DB superuser in the secret recipe or template.
  #   5. render-golden.sh — byte-compares the staging and production renders
  #      against the reviewed goldens in k8s/goldens/. A k8s/base edit that
  #      changes either render without a regenerated, reviewed golden fails the
  #      PR. Regenerate with `k8s/scripts/render-golden.sh --write` and commit
  #      the golden diff in the SAME PR; never hand-edit a golden.
  k8s-validate:
    name: K8s Kustomize Secret Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.33.3'

      - name: Assert no plaintext Secrets in any kustomize build
        run: |
          chmod +x ./k8s/scripts/check-no-plaintext-secrets.sh
          ./k8s/scripts/check-no-plaintext-secrets.sh

      - name: Assert connection-pool math fits Postgres max_connections (#94)
        run: |
          chmod +x ./k8s/scripts/check-connection-math.sh
          ./k8s/scripts/check-connection-math.sh

      - name: Assert the core-java, edge-go and frontend env contracts hold in both directions (D-07/D-08)
        run: |
          chmod +x ./k8s/scripts/check-env-contract.sh
          ./k8s/scripts/check-env-contract.sh

      - name: Assert rendered-manifest invariants (DB_PORT, kube-dns selector, no localhost, DB role)
        run: |
          chmod +x ./k8s/scripts/check-render-invariants.sh
          ./k8s/scripts/check-render-invariants.sh

      - name: Assert the staging/production render matches its reviewed golden
        run: |
          chmod +x ./k8s/scripts/render-golden.sh
          ./k8s/scripts/render-golden.sh

  # Job 1c: Branch-parity gate (2026-07-26).
  #
  # Asserts the PR branch contains every commit already on its base branch. A
  # branch behind its base ships missing work that NO rebuild can fix, and every
  # other job here will pass while measuring that out-of-date tree — which is
  # exactly how Phase 26 verified green with a frontend missing three merged UI
  # PRs. See k8s/DEPLOYMENT.md "Runtime-parity gates".
  #
  # THE `--head` ARGUMENT IS LOAD-BEARING, NOT A REFINEMENT. On a pull_request
  # event actions/checkout checks out GitHub's SYNTHETIC MERGE COMMIT of the PR
  # head into the base, so the checkout's own HEAD contains the base BY
  # CONSTRUCTION and `HEAD..origin/base` is always empty. Asserting on it would be
  # a permanently, vacuously green job. github.event.pull_request.head.sha is the
  # branch tip as actually pushed, which is the thing reviewers and local runtimes
  # are looking at.
  #
  # The runtime half of this pair — scripts/check-runtime-freshness.sh — is
  # DELIBERATELY ABSENT from CI and must stay absent: a runner has no running
  # containers, so it could only ever exit 2 (VOID) here, and a permanently-VOID
  # job invites a `|| true` that would turn it into a gate that passes because it
  # measures nothing. It runs where a runtime exists (k8s/LOCAL.md §10).
  branch-parity:
    name: Branch Not Behind Base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the gate walks HEAD..base, which a shallow clone cannot.
          fetch-depth: 0

      - name: Assert this branch is not behind its base branch
        run: |
          chmod +x ./scripts/check-branch-behind-base.sh
          ./scripts/check-branch-behind-base.sh --head "${PR_HEAD_SHA}"
        env:
          # Consumed by the script's resolution order; GITHUB_BASE_REF is already
          # in the environment and names the branch this PR actually targets, so
          # the base is never hardcoded to `main`.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Job 1d: OpenAPI breaking-change gate (#97 AC3).
  # Regenerates the core-java OpenAPI spec from source — the
  # generateOpenApiSpec Gradle task boots the FULL Spring context against a
  # throwaway Testcontainers Postgres and captures a normalized (byte-stable)
  # /v3/api-docs — then compares it with the reviewed snapshot at
  # docs/api/openapi-snapshot.json using a pinned, checksum-verified oasdiff:
  #   byte-identical              -> pass
  #   breaking change             -> FAIL with oasdiff's breaking-change report
  #   non-breaking drift          -> FAIL telling the author to regenerate
  #
  # INTENTIONAL API changes (including reviewed breaking ones): run
  #   ./gradlew :core-java:updateOpenApiSnapshot
  # and commit the snapshot diff in the SAME PR — the snapshot diff is the
  # reviewable contract change that makes this gate green. Never edit the
  # snapshot by hand. See docs/api/README.md.
  openapi-compat:
    name: OpenAPI Breaking-Change Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Regenerate OpenAPI spec from source (Testcontainers Postgres)
        run: ./gradlew :core-java:generateOpenApiSpec --no-daemon

      - name: Install oasdiff (pinned, checksum-verified)
        run: |
          OASDIFF_VERSION="1.23.0"
          OASDIFF_SHA256="972b10535c3db4366b9dc3ebc11ca021279af3095267c3cffdca854a3a3c4f89"
          curl -sSfL -o oasdiff.tar.gz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  oasdiff.tar.gz" | sha256sum -c -
          tar -xzf oasdiff.tar.gz oasdiff
          ./oasdiff --version

      - name: Gate — reviewed snapshot vs regenerated spec
        run: |
          chmod +x ./scripts/openapi-gate.sh
          OASDIFF=./oasdiff ./scripts/openapi-gate.sh

      - name: Upload regenerated spec (debugging aid)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-current
          path: core-java/build-local/openapi/openapi-current.json

  # Job 1e: MCP server tests (Phase 20 / #203, review WR-01).
  # The docs-freshness gate only COUNTS the mcp-server vitest blocks; this job
  # actually runs them — and, since #291, reconciles the two: the count oracle step
  # at the end asserts docs/metrics.json against what vitest itself reports.
  # `npm run build` (tsc) is the type-check gate — vitest
  # alone does not type-check (same gap class as #87/PR #130 for Jest).
  # No permissions block on purpose: the restricted default GITHUB_TOKEN
  # (contents + packages read) is all a plain build/test job needs.
  mcp-server-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install mcp-server dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Build mcp-server (tsc — the type-check gate)
        run: npm run build
        working-directory: mcp-server

      - name: Run mcp-server vitest suite
        run: npx vitest run
        working-directory: mcp-server

      # Issue #291 — the third runner-side reconciliation. Runs from the repo root
      # (the script cds into mcp-server itself) and fails closed at exit 2 if vitest
      # reports zero tests, because a suite that fails to boot must never read as
      # agreement.
      - name: Verify docs/metrics.json against the vitest runner (#291)
        if: always()
        run: bash scripts/check-test-count-oracle.sh vitest

  # Job 1f: Operational contracts (Phase 27 / OPS-01, OPS-02).
  # SIX STATIC gates. None needs a running stack; all run in seconds.
  # (The header said "Three" while listing four — corrected when the fifth was added,
  # and again when #276 added the sixth. If you add a seventh, this line is part of
  # the change.)
  # Full local run + rationale for each: k8s/DEPLOYMENT.md "Operational contracts".
  #
  #   1. check-terminal-states.sh — 27-00 F-9. Pins the chain
  #      discovery -> register -> alert -> runbook across docs/ops/terminal-states.yaml.
  #      A new DLQ constant, poison-outbox migration or terminal FAILED enum constant
  #      that has no register row fails the build, as does a register row naming an
  #      alert that does not exist, an EXPIRED dated deferral, or a live alert with no
  #      runbook section. This is what stops a terminal failure state from being
  #      silently unowned.
  #   2. check-dependency-horizons.sh — 27-00 F-6. Every pinned image and toolchain
  #      carries a support horizon. Past horizon, inside the 90-day warn window, a
  #      stale cache, a wrong eol slug, a catalogue-`false`-vs-vendor-date conflict,
  #      manifest<->source pin drift in EITHER direction, and an UNKNOWN row whose
  #      dated `manual_review` has lapsed all fail.
  #   3. check-alert-rules.sh — 27-03 F-8, whose measurement was blunt: "there is no
  #      CI validation of alerts.yml at all". Runs `promtool check rules`, then asserts
  #      every live rule carries its labels and annotations and has a matching
  #      `## <AlertName>` section in docs/runbooks/alerts.md. THIS GATE WAS ORPHANED:
  #      27-03 dropped CI wiring to its brief, 27-00 never picked it up, and each
  #      believed the other owned it. It is wired here.
  #   4. check-doc-citations.sh — every `file:line` citation in a LIVE doc resolves to
  #      a line that says what the doc claims. Measured before it existed: of 11
  #      dependency citations in STACK.md exactly ONE was still correct, and 12 more
  #      used a bare `build.gradle.kts` that resolves to the 22-line ROOT file rather
  #      than core-java's. check-doc-versions.sh cannot see this — it compares version
  #      STRINGS and has no notion of where a claim points. Scans live-claim docs only;
  #      historical records under .planning/phases/** are deliberately excluded, since
  #      validating them would force a choice between a red gate and rewriting the record.
  #
  #   5. check-image-supply-chain.sh — #276. The container-image gate's red/green
  #      stopped tracking our own code: a floating base tag's CONTENT and Trivy's
  #      daily vulnerability DB both move without us, so build-and-push failed on
  #      main twice with no change between the runs, and default fail-fast turned
  #      one leg's CVE into `cancelled` for the other two. Asserts the three
  #      properties that make that survivable — fail-fast:false on the publish
  #      matrix, the table-vs-sarif split that keeps the gate on fixable
  #      CRITICAL/HIGH only, dependabot docker coverage of every tracked
  #      Dockerfile — plus that the scheduled scan in base-image-freshness.yml
  #      still asks the gate's EXACT question (same flags, same pinned action).
  #      A detector that has drifted reports "clean" about a different question.
  #
  # EXIT CONVENTION, shared by all of them: 0 = clean · 1 = violation · 2 = VOID.
  # **EXIT 2 FAILS THIS JOB.** A missing tool, an unreachable endoflife.date, an absent
  # docker or an empty discovery result turns this job RED — never silently green,
  # because "could not check" is never "clean". Do not add `continue-on-error`,
  # `|| true` or `if: always()` to any step here; that would invert the one property
  # these gates exist to have.
  #
  # DELIBERATELY ABSENT, and the absence is the point:
  #   - scripts/check-alert-liveness.sh (27-00) and scripts/check-alert-metrics.sh
  #     (27-03) are RUNTIME gates. Same reasoning already recorded above for
  #     check-runtime-freshness.sh: a runner has no Prometheus and no running
  #     containers, so they could only ever exit 2 (VOID) here, and a permanently-VOID
  #     job invites a `|| true` that would turn it into a gate that passes because it
  #     measures nothing. They run where a runtime exists, and every phase SUMMARY
  #     records check-alert-liveness.sh's exit code and timestamp instead.
  #   - infra/load-testing/baseline.sh is out for a different reason (27-00 D-11): a
  #     shared runner's throughput numbers are noise, and a noisy gate gets disabled.
  #
  # TWO OUTBOUND DEPENDENCIES, accepted deliberately:
  #   - check-dependency-horizons.sh fetches endoflife.date;
  #   - check-alert-rules.sh pulls prom/prometheus:v2.48.0 to run promtool (promtool
  #     is not installed on runners, and the image's ENTRYPOINT is /bin/prometheus, so
  #     the call must use --entrypoint=promtool).
  # An outage of either fails this job at exit 2. Treating an unreachable source as
  # clean is the exact inversion this phase exists to prevent.
  #
  # THIS JOB GOES AMBER AND RED ON DATES, WITH NO CODE CHANGE. RabbitMQ 4.3's vendor
  # horizon is 2026-11-30 against a 90-day warn window, so expect:
  #   ~2026-09-01  amber — inside the warn window, gate still exits 0
  #    2026-12-01  RED   — past horizon; resolve by upgrading the pin or re-dating the
  #                        exemption in infra/dependency-horizons.yaml, NEVER by
  #                        weakening this job.
  # Without this note the first horizon-driven red reads as a broken gate.
  #
  # NO JOB-LEVEL `if:` — AND IT MUST NEVER GAIN ONE. This job is eligible for a deploy
  # `needs:` list precisely because it cannot skip (see the comment above
  # build-and-push: a SKIPPED `needs:` entry silently blocks every deploy). It is not
  # in that list today — see 27-06-SUMMARY.md for the dated reason and its trigger.
  ops-contracts:
    name: Operational Contracts
    runs-on: ubuntu-latest
    # Explicit because the repo's default GITHUB_TOKEN is restricted. No gate here
    # writes to the repo, opens a PR, or needs a package scope — read is sufficient.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Needed by the edge↔core contract gate below, which is a Go test that
      # reflects over the edge's real client types. Kept in this job rather than
      # bolted onto `test`: it is a static contract assertion, it shares the
      # 0/1/2 VOID convention with the gates around it, and it stays green on a
      # docs-only PR where the heavy test job has nothing to say.
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: edge-go/go.sum

      - name: Assert every terminal failure state has a detection path (27-00 F-9)
        run: |
          chmod +x ./scripts/check-terminal-states.sh
          ./scripts/check-terminal-states.sh

      - name: Assert every pinned dependency has a live support horizon (27-00 F-6)
        run: |
          chmod +x ./scripts/check-dependency-horizons.sh
          ./scripts/check-dependency-horizons.sh

      - name: Assert every alert rule is valid, labelled and documented (27-03 F-8)
        run: |
          chmod +x ./scripts/check-alert-rules.sh
          ./scripts/check-alert-rules.sh

      - name: Assert every doc citation resolves to what it claims
        run: |
          chmod +x ./scripts/check-doc-citations.sh
          ./scripts/check-doc-citations.sh

      # 5. check-image-supply-chain.sh — #276. The container-image gate compares two
      #    things that BOTH move on their own (a floating base tag's content, and
      #    Trivy's daily-refreshed vulnerability DB), so build-and-push went red on
      #    main twice with no code change between the runs. Three properties have to
      #    hold for that to be survivable, and all three are one-line YAML edits away
      #    from silently regressing: fail-fast:false on the publish matrix, the
      #    table-vs-sarif split that keeps the gate on CRITICAL/HIGH+fixable only, and
      #    a scheduled scan whose flags and pinned action still match the gate's.
      #
      #    This gate is STATIC — it reads YAML and the git index, runs no scanner and
      #    makes no network call, so it belongs in this job rather than being a fourth
      #    outbound dependency. It says nothing about whether the images are currently
      #    clean; only .github/workflows/base-image-freshness.yml answers that, daily.
      - name: Assert the container-image supply chain has a refresh path (#276)
        run: |
          chmod +x ./scripts/check-image-supply-chain.sh
          ./scripts/check-image-supply-chain.sh --explain

      # 6. install-hooks.sh --check — the only half of the runtime-parity pair that a
      #    GitHub-hosted runner CAN assert. The gate itself (check-runtime-freshness.sh)
      #    is deliberately NOT here: this repo has no self-hosted runner and
      #    DEPLOY_ENABLED is unset, so a runner has no runtime to inspect and the gate
      #    could only ever exit 2 — a permanently-VOID job, which trains people to add
      #    `|| true`. What IS checkable here is that the hook carrying it is capable of
      #    running at all: a hook committed 100644 is skipped SILENTLY by both git and
      #    the global dispatcher's `[[ -x ]]`, and the symptom is identical to a clean
      #    run. Asserted against the git INDEX, so an uncommitted local chmod cannot
      #    make this pass for one machine and fail for every clone.
      #    H-3 (repo-level core.hooksPath shadowing) self-skips here: a runner has no
      #    global dispatcher, and asserting against an absent mechanism would be a
      #    permanently-red job over nothing.
      - name: Assert the repo hooks can actually run (executable in the index)
        run: |
          chmod +x ./scripts/install-hooks.sh
          ./scripts/install-hooks.sh --check

      # 6. The edge↔core contract (issue #337 / P3-13). The two OpenAPI gates
      #    that already exist are both same-side: the Breaking-Change Gate diffs
      #    core's spec against core's reviewed snapshot, and edge-go's
      #    openapi_test.go diffs the edge's published spec against the edge's own
      #    routes. Neither crosses the boundary, so a core field rename was
      #    invisible on both sides — Go's encoding/json drops a field it cannot
      #    place and returns no error, so the edge decodes a zero value and
      #    reports it as fact. This gate walks the edge's real client types
      #    against core's snapshot and names the field that diverged.
      #    No step-level `if:` and no job-level `if:` — this job is a required
      #    check and must always report, per the repo's paths-filter convention.
      - name: Assert the edge's calls match core's OpenAPI contract (#337 / P3-13)
        run: |
          chmod +x ./scripts/check-edge-core-contract.sh
          ./scripts/check-edge-core-contract.sh

      #   7. check-postgres-major-parity.sh — the backup tooling's PostgreSQL major
      #      must equal the server's, at every site that declares either. Added after
      #      dependabot #525 bumped infra/backups/Dockerfile to postgres:18 while every
      #      server stayed on 15, with ALL CI green. Measured against the live 15.17
      #      server: a postgres:18 pg_dump succeeds, and postgres:15 pg_restore then
      #      refuses the result with "unsupported version (1.16) in file header" — so
      #      backups keep succeeding and silently stop being restorable by the server's
      #      own client. k8s-backup.sh's own `pg_restore --list` cannot catch this: it
      #      runs inside the image that produced the dump, so it agrees by construction.
      #      This gate does NOT forbid postgres 18 — it forbids the halves diverging.
      #      Sites are declared in scripts/gates/postgres-major-parity.conf; a declared
      #      site that matches nothing is a VOID (2), never a silent pass.
      - name: Assert postgres server and backup tooling agree on a major version
        run: |
          chmod +x ./scripts/check-postgres-major-parity.sh
          ./scripts/check-postgres-major-parity.sh

      #   8-10. Three gates that existed on disk and ran NOWHERE.
      #
      #      Measured 2026-08-05: of the 24 scripts/check-*.sh, six had zero references
      #      in .github/workflows/. Three of those are deliberate — check-infra-exposure
      #      (part B), check-container-config-drift and check-alert-mute all inspect a
      #      RUNNING stack, so on a hosted runner they could only ever exit 2, the same
      #      reason check-runtime-freshness is deliberately absent from this file.
      #
      #      The three below are not deliberate. Each is purely static — no docker, no
      #      curl, no psql, no network (asserted by grepping each script for runtime
      #      binaries: all three return nothing, while check-infra-exposure returns
      #      `curl docker`, so the check distinguishes) — and each was written to stop a
      #      SPECIFIC defect from recurring. A gate that cannot fire on a PR does not do
      #      that. It is the same shape as the defect its sibling #510 fixed: the
      #      exposure gate is green, and nothing stopped anyone re-adding 0.0.0.0.
      #
      #      All three were shown to FAIL before being wired, against the exact defect
      #      each was filed for, then restored and verified by `git hash-object`:
      #        - mobile contract  : hasTouch removed from the mobile project  -> rc=1
      #        - base-URL contract: a spec-local fallback to an unpublished port -> rc=1
      #        - placeholders     : a <<MEASURED>> default left in application.yml -> rc=1
      #      Clean tree: all three rc=0. A gate observed only passing is not evidence.
      - name: Assert playwright.config.ts is the only base-URL authority (#505)
        run: |
          chmod +x ./scripts/check-e2e-baseurl-contract.sh
          ./scripts/check-e2e-baseurl-contract.sh

      - name: Assert the mobile Playwright project can actually feel touch (#503)
        run: |
          chmod +x ./scripts/check-playwright-mobile-contract.sh
          ./scripts/check-playwright-mobile-contract.sh

      - name: Assert no unfilled measurement placeholder reached shipped config (27-04 D-05)
        run: |
          chmod +x ./scripts/check-no-measured-placeholders.sh
          ./scripts/check-no-measured-placeholders.sh

      #   11. The meta-gate, so the three steps above are the LAST time this is found by
      #      hand. It asserts that every scripts/check-*.sh either runs in a workflow or
      #      carries a reasoned entry in scripts/gates/gate-enforcement.conf saying why a
      #      hosted runner cannot run it. Default-deny: a new gate that is neither wired
      #      nor declared fails, because forgetting to think about a new gate is exactly
      #      the case it exists to catch.
      #
      #      It is self-covering — it is itself a check-*.sh, so it must appear here or
      #      fail itself. It did, on its first run, which is the cheapest possible proof
      #      that it can fire. (That first run ALSO reported itself as invoking all nine
      #      runtime binaries, because the script necessarily names every one it looks
      #      for. Fixed by stripping the definition line; the trap is documented in the
      #      script, since this repo has hit it before with doc-lint rules.)
      - name: Assert every gate either runs in CI or says why it cannot
        run: |
          chmod +x ./scripts/check-gate-enforcement.sh
          ./scripts/check-gate-enforcement.sh

  # Job 2: Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem, SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Trivy gate — fail build on fixable CRITICAL/HIGH
        # Separate step from the SARIF report above: `format: sarif` forces Trivy
        # to scan ALL severities, so pairing it with exit-code would gate on
        # LOW/MEDIUM too. This table-format step gates precisely on fixable
        # CRITICAL,HIGH and prints the offending CVEs in the job log.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run Snyk security scan
        # Real gate on HIGH+ vulns. Skipped (not failed) when SNYK_TOKEN is
        # unset, so an unconfigured secret does not hard-fail every build.
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/gradle@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          command: test
          args: --all-projects --severity-threshold=high

  # Job 2b: Lint gate (#99 do-now). Resurrects linting that was silently dead —
  # `npm run lint` used to be `next lint` (removed in Next 16) and the installed
  # ESLint v9 is flat-config-only, so nothing ran. Frontend now runs `eslint .`
  # against the flat config; edge-go runs gofmt + go vet. Both baselines are
  # clean, so this job goes green on the PR that introduces it.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend (eslint .)
        run: npm run lint
        working-directory: frontend

      - name: Set up Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: edge-go/go.sum

      - name: Check edge-go formatting (gofmt)
        working-directory: edge-go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet edge-go (go vet ./...)
        working-directory: edge-go
        run: go vet ./...

  # Job 3: Build and push Docker images
  #
  # CR-01 (Phase 26 code review): this `needs:` list used to be
  # [test, integration-tests, security-scan], which meant k8s-validate, lint,
  # openapi-compat and mcp-server-tests gated NOTHING on the deploy path — both
  # deploy jobs depend only on build-and-push, so a push to main with
  # DEPLOY_ENABLED=true could `kubectl apply -k k8s/production` while
  # check-render-invariants.sh / render-golden.sh / check-env-contract.sh were
  # simultaneously RED in the same workflow run. Plan 26-03's whole deliverable
  # ("a one-time fix without a gate is a fix that returns") was defeated on the one
  # path where a returning defect actually reaches a cluster.
  #
  # WHY A BARE `needs:` IS SAFE HERE (checked, not assumed). In GitHub Actions a
  # job whose `needs:` entry is SKIPPED is itself skipped, so adding a skippable
  # job here would silently BLOCK every deploy instead of gating it. None of the
  # four added jobs can skip: none carries a job-level `if:`, and the workflow has
  # no `paths:`/`paths-ignore:` filter. integration-tests does use
  # dorny/paths-filter, but only for in-job STEP gating — its own comment says
  # "never a job-level `if:`" precisely so it stays a satisfiable required check
  # that always reports SUCCESS. That is the pattern any future conditional gate
  # must follow; a job-level `if:` on any job listed below would turn this gate
  # into a deploy blocker.
  build-and-push:
    name: Build and Push Images
    needs: [test, integration-tests, security-scan, k8s-validate, lint, openapi-compat, mcp-server-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      # fail-fast: false (#276). DEFAULT fail-fast turns ONE leg's failure into a
      # total publishing outage. Observed on two consecutive main runs (e01e654,
      # d964a85) where the frontend leg hit a base-image CVE:
      #
      #   Build and Push Images (frontend):  failure
      #   Build and Push Images (core-java): cancelled
      #   Build and Push Images (edge-go):   cancelled
      #
      # core-java and edge-go had NO findings and were cancelled mid-build. Those
      # two images are independently useful — the deploy jobs pin all three by
      # ${{ github.sha }}, so a partial publish still leaves core-java/edge-go
      # pullable at that sha for a manual rollout or a local pull, whereas a
      # cancelled leg leaves nothing at all.
      #
      # This does NOT weaken the deploy path. deploy-staging/deploy-production
      # `needs: [build-and-push]`, and a matrix job is `failure` if ANY leg failed
      # regardless of fail-fast — so a red frontend still blocks both deploys. The
      # only thing that changes is that the other two legs are allowed to finish.
      fail-fast: false
      matrix:
        service: [core-java, edge-go, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            # Immutable full-sha tag: the two deploy jobs pin the running image
            # to ghcr.io/.../jtoye-<svc>:${{ github.sha }} via `kustomize edit set
            # image`. Without this tag the reference never resolves → guaranteed
            # ImagePullBackOff on every deploy (the latent bug this PR closes).
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.service == 'core-java' && '.' || matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CR-02 (Phase 26 code review): this step used to pass NO build-args at
          # all. Next.js INLINES every NEXT_PUBLIC_* that is present in the build
          # environment, and frontend/Dockerfile makes them present-but-EMPTY, so
          # the pushed frontend image baked apiOrigin:"" and shipped an ENFORCING
          # CSP with no API/ws/Keycloak origin in connect-src — every browser fetch
          # refused, while pods stayed READY and the server-side smoke tests passed.
          # Observed on an image built exactly as this step built it:
          #   connect-src 'self' https://api.stripe.com https://*.stripe.com
          #
          # These are PUBLIC origins and non-secret onboarding copy, so they are
          # repo `vars` (the existing convention here — cf. vars.DEPLOY_ENABLED),
          # NOT secrets. No new secret name is introduced. Set them under
          # Settings > Secrets and variables > Actions > Variables:
          #   FRONTEND_PUBLIC_API_URL                     (required)
          #   FRONTEND_PUBLIC_CUSTOMER_KEYCLOAK_URL       (required)
          #   FRONTEND_PUBLIC_SUPPORT_EMAIL               (optional)
          #   FRONTEND_PUBLIC_SUPPORT_URL                 (optional)
          #   FRONTEND_PUBLIC_ONBOARDING_REVIEW_SLA_DAYS  (optional)
          # If either required var is unset the frontend Dockerfile's guard FAILS
          # THE BUILD (exit 1) instead of pushing a broken image — fail-closed, and
          # the whole point of the fix. The three optional ones degrade gracefully
          # (frontend/lib/env-validation.ts optionalEnvVars / resolveSupportChannel).
          #
          # Passed on ALL THREE matrix legs on purpose. core-java/Dockerfile and
          # edge-go/Dockerfile declare no matching ARG, so BuildKit logs
          # "one or more build-args were not consumed" for those two legs — a
          # warning, not an error. Do NOT "fix" that warning by deleting these
          # lines; a conditional per-leg expression cannot emit a multi-line
          # build-args block (GitHub expressions have no newline literal), and
          # splitting the step in two duplicates it and invites drift.
          #
          # NEXT_PUBLIC_KEYCLOAK_URL is deliberately absent: it has no ARG in the
          # Dockerfile, which is what keeps it RUNTIME-resolvable. See the comment
          # block in frontend/Dockerfile before you add it here.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.FRONTEND_PUBLIC_API_URL }}
            NEXT_PUBLIC_CUSTOMER_KEYCLOAK_URL=${{ vars.FRONTEND_PUBLIC_CUSTOMER_KEYCLOAK_URL }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.FRONTEND_PUBLIC_SUPPORT_EMAIL }}
            NEXT_PUBLIC_SUPPORT_URL=${{ vars.FRONTEND_PUBLIC_SUPPORT_URL }}
            NEXT_PUBLIC_ONBOARDING_REVIEW_SLA_DAYS=${{ vars.FRONTEND_PUBLIC_ONBOARDING_REVIEW_SLA_DAYS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # frontend is amd64-only: its arm64 build runs under QEMU emulation
          # (Next.js npm-install + next build) and took ~30 min vs ~1-7 min for
          # the Go/Java services, whose arm64 builds are cheap. Drop arm64 for
          # frontend, keep multi-arch for core-java/edge-go.
          platforms: ${{ matrix.service == 'frontend' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

      - name: Scan Docker image with Trivy (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

      - name: Trivy image gate — fail on fixable CRITICAL/HIGH
        # Table-format gate (see filesystem gate rationale): precise CRITICAL,HIGH
        # gating with the offending CVEs printed in the job log.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  # Job 4: Deploy to staging
  #
  # CR-01: k8s-validate is listed DIRECTLY as well as transitively through
  # build-and-push. Deliberate redundancy — it makes "the deploy path is gated by
  # the five k8s static gates" a property of this job rather than something that
  # depends on build-and-push's needs list staying correct. Safe for the same
  # reason documented on build-and-push: k8s-validate has no job-level `if:` and
  # the workflow has no path filter, so it cannot skip and cannot cascade a skip.
  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push, k8s-validate]
    runs-on: ubuntu-latest
    # Gated OFF by default, mirroring the deploy-production DEPLOY_ENABLED gate
    # below. Runs only on main AND when the repo variable DEPLOY_STAGING_ENABLED
    # is set to 'true' (the old branch-name gate could never fire — that branch
    # does not exist on the remote).
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_STAGING_ENABLED == 'true'
    environment:
      name: staging
      url: https://app-staging.olajay.co.uk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.28.0'

      - name: Install kustomize (pinned, checksum-verified)
        # Same checksum-verified-pinned-binary shape as the oasdiff install in the
        # openapi-compat job. Version + linux_amd64 sha256 taken from the official
        # kustomize/v5.6.0 release checksums.txt and proven locally before pinning.
        run: |
          KUSTOMIZE_VERSION="5.6.0"
          KUSTOMIZE_SHA256="54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f"
          curl -sSfL -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      # CR-02: the baked frontend origin must match the environment being deployed.
      # Runs BEFORE kubeconfig is written — it needs no cluster access, so it fails
      # before any credential is materialised.
      #
      # build-and-push produces ONE frontend image per commit, and NEXT_PUBLIC_API_URL
      # is INLINED into it at build time. A single image therefore carries a single
      # API origin and can only be correct for the environment whose app-config
      # api.url equals it. Nothing enforced that, so supplying the build-arg without
      # this check would trade CR-02's silent empty origin for an equally silent
      # WRONG origin (e.g. a production-baked image serving staging). Asserting it
      # here keeps the fix additive instead of moving the defect.
      #
      # This is also the first real consumer of app-config `api.url` in CI: the key
      # had zero configMapKeyRef consumers in any render after D-18 deleted the dead
      # runtime env, which is the DEF-4/DEF-6 "config that reaches nothing" shape.
      #
      # EXPECTED CONSEQUENCE, stated plainly: k8s/staging api.url is
      # https://api-staging.olajay.co.uk and k8s/production api.url is
      # https://api.olajay.co.uk, so with one image and one FRONTEND_PUBLIC_API_URL
      # only ONE of the two deploys can pass this gate. That is the honest state of
      # a single-image pipeline, and failing loudly here is the point. The durable
      # fix is per-environment frontend images (or a genuinely runtime CSP origin);
      # both are larger changes than this review finding, and both deploy jobs are
      # gated OFF by repo variable today.
      - name: Assert the baked frontend API origin matches this environment (CR-02)
        env:
          BAKED_API_URL: ${{ vars.FRONTEND_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          kustomize build k8s/staging > /tmp/staging-render.yaml
          # awk reads a FILE, so there is no pipe and no SIGPIPE-under-pipefail risk.
          RENDER_API_URL="$(awk '/^[[:space:]]*api\.url:[[:space:]]/ { v = $2; gsub(/^"|"$/, "", v); print v; exit }' /tmp/staging-render.yaml)"
          if [ -z "$RENDER_API_URL" ]; then
            echo "FATAL: could not read app-config api.url from the k8s/staging render — this guard is blind, so it fails closed." >&2
            exit 2
          fi
          if [ -z "$BAKED_API_URL" ]; then
            echo "FATAL: repo variable FRONTEND_PUBLIC_API_URL is unset, so the frontend image baked an EMPTY API origin." >&2
            echo "       The build should already have failed in build-and-push (frontend/Dockerfile guard); if you are seeing" >&2
            echo "       this, that guard was bypassed. Set the variable rather than relaxing either check." >&2
            exit 2
          fi
          if [ "$RENDER_API_URL" != "$BAKED_API_URL" ]; then
            echo "FATAL: the frontend image was built for a DIFFERENT environment." >&2
            echo "         baked NEXT_PUBLIC_API_URL (vars.FRONTEND_PUBLIC_API_URL): $BAKED_API_URL" >&2
            echo "         k8s/staging app-config api.url:                           $RENDER_API_URL" >&2
            echo "       NEXT_PUBLIC_* is inlined at image build time, so this cannot be corrected by a runtime env." >&2
            echo "       Deploying anyway would give every browser an enforcing CSP whose connect-src names the wrong" >&2
            echo "       origin — refused fetches, with READY pods and passing server-side smoke tests (CR-02)." >&2
            exit 1
          fi
          echo "OK: baked NEXT_PUBLIC_API_URL matches k8s/staging app-config api.url ($RENDER_API_URL)"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Pin full-sha images + deploy staging overlay
        run: |
          (cd k8s/staging && kustomize edit set image \
            ghcr.io/bralabee/jtoye-core-java=ghcr.io/bralabee/jtoye-core-java:${{ github.sha }} \
            ghcr.io/bralabee/jtoye-edge-go=ghcr.io/bralabee/jtoye-edge-go:${{ github.sha }} \
            ghcr.io/bralabee/jtoye-frontend=ghcr.io/bralabee/jtoye-frontend:${{ github.sha }})
          # Premortem guard: assert the RENDERED overlay actually pins :<sha> on
          # all three jtoye images BEFORE apply. A silent images[].name key
          # mismatch would fall back to the static 2.1.0 default and deploy the
          # wrong (or non-existent) image — fail loudly here instead.
          RENDERED="$(kustomize build k8s/staging)"
          for svc in core-java edge-go frontend; do
            if ! echo "$RENDERED" | grep -q "ghcr.io/bralabee/jtoye-${svc}:${{ github.sha }}"; then
              echo "FATAL: rendered staging overlay does not pin ghcr.io/bralabee/jtoye-${svc}:${{ github.sha }}"
              echo "Rendered jtoye image refs were:"
              echo "$RENDERED" | grep -E "image: ghcr.io/bralabee/jtoye-" || true
              exit 1
            fi
          done
          kubectl apply -k k8s/staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/core-java -n jtoye-staging --timeout=5m
          kubectl rollout status deployment/edge-go -n jtoye-staging --timeout=3m
          kubectl rollout status deployment/frontend -n jtoye-staging --timeout=3m

      - name: Health check after core-java deployment
        # issue #98 [P2-7] item 4: actuator now lives on the INTERNAL management
        # port (9091). The public smoke tests below flip to asserting actuator is
        # NOT publicly exposed (EXPECT_PUBLIC_ACTUATOR=false default), so this
        # in-cluster kubectl-exec check preserves POSITIVE actuator-health
        # verification for staging (mirrors the deploy-production step).
        run: |
          sleep 30
          kubectl exec -n jtoye-staging deployment/core-java -- curl -f http://localhost:9091/actuator/health || exit 1

      - name: Run smoke tests
        # Staging exposes Swagger (application-staging.yml) — assert it is reachable.
        run: |
          chmod +x ./scripts/smoke-test.sh
          EXPECT_SWAGGER=true ./scripts/smoke-test.sh https://api-staging.olajay.co.uk

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/core-java -n jtoye-staging
          kubectl rollout undo deployment/edge-go -n jtoye-staging
          kubectl rollout undo deployment/frontend -n jtoye-staging
          exit 1

  # Job 5: Deploy to production
  #
  # CR-01: k8s-validate listed directly as well as transitively — see the
  # deploy-staging comment above for why that redundancy is deliberate and why a
  # bare `needs:` on it cannot skip-cascade.
  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, k8s-validate]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.event_name == 'release') && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://app.olajay.co.uk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.28.0'

      - name: Install kustomize (pinned, checksum-verified)
        # Same checksum-verified-pinned-binary shape as the oasdiff install in the
        # openapi-compat job. Version + linux_amd64 sha256 taken from the official
        # kustomize/v5.6.0 release checksums.txt and proven locally before pinning.
        run: |
          KUSTOMIZE_VERSION="5.6.0"
          KUSTOMIZE_SHA256="54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f"
          curl -sSfL -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      # CR-02: identical guard to deploy-staging's — see the long rationale there
      # (one image bakes one inlined API origin, so it is only correct for the
      # environment whose app-config api.url equals it). Runs before kubeconfig is
      # written, needs no cluster access, and fails closed on an unreadable render.
      - name: Assert the baked frontend API origin matches this environment (CR-02)
        env:
          BAKED_API_URL: ${{ vars.FRONTEND_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          kustomize build k8s/production > /tmp/production-render.yaml
          # awk reads a FILE, so there is no pipe and no SIGPIPE-under-pipefail risk.
          RENDER_API_URL="$(awk '/^[[:space:]]*api\.url:[[:space:]]/ { v = $2; gsub(/^"|"$/, "", v); print v; exit }' /tmp/production-render.yaml)"
          if [ -z "$RENDER_API_URL" ]; then
            echo "FATAL: could not read app-config api.url from the k8s/production render — this guard is blind, so it fails closed." >&2
            exit 2
          fi
          if [ -z "$BAKED_API_URL" ]; then
            echo "FATAL: repo variable FRONTEND_PUBLIC_API_URL is unset, so the frontend image baked an EMPTY API origin." >&2
            echo "       The build should already have failed in build-and-push (frontend/Dockerfile guard); if you are seeing" >&2
            echo "       this, that guard was bypassed. Set the variable rather than relaxing either check." >&2
            exit 2
          fi
          if [ "$RENDER_API_URL" != "$BAKED_API_URL" ]; then
            echo "FATAL: the frontend image was built for a DIFFERENT environment." >&2
            echo "         baked NEXT_PUBLIC_API_URL (vars.FRONTEND_PUBLIC_API_URL): $BAKED_API_URL" >&2
            echo "         k8s/production app-config api.url:                        $RENDER_API_URL" >&2
            echo "       NEXT_PUBLIC_* is inlined at image build time, so this cannot be corrected by a runtime env." >&2
            echo "       Deploying anyway would give every browser an enforcing CSP whose connect-src names the wrong" >&2
            echo "       origin — refused fetches, with READY pods and passing server-side smoke tests (CR-02)." >&2
            exit 1
          fi
          echo "OK: baked NEXT_PUBLIC_API_URL matches k8s/production app-config api.url ($RENDER_API_URL)"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Pin full-sha images + deploy production overlay
        run: |
          (cd k8s/production && kustomize edit set image \
            ghcr.io/bralabee/jtoye-core-java=ghcr.io/bralabee/jtoye-core-java:${{ github.sha }} \
            ghcr.io/bralabee/jtoye-edge-go=ghcr.io/bralabee/jtoye-edge-go:${{ github.sha }} \
            ghcr.io/bralabee/jtoye-frontend=ghcr.io/bralabee/jtoye-frontend:${{ github.sha }})
          # Premortem guard: assert the RENDERED overlay actually pins :<sha> on
          # all three jtoye images BEFORE apply. A silent images[].name key
          # mismatch would fall back to the static 2.1.0 default and deploy the
          # wrong (or non-existent) image — fail loudly here instead.
          RENDERED="$(kustomize build k8s/production)"
          for svc in core-java edge-go frontend; do
            if ! echo "$RENDERED" | grep -q "ghcr.io/bralabee/jtoye-${svc}:${{ github.sha }}"; then
              echo "FATAL: rendered production overlay does not pin ghcr.io/bralabee/jtoye-${svc}:${{ github.sha }}"
              echo "Rendered jtoye image refs were:"
              echo "$RENDERED" | grep -E "image: ghcr.io/bralabee/jtoye-" || true
              exit 1
            fi
          done
          kubectl apply -k k8s/production

      - name: Wait for core-java rollout
        run: kubectl rollout status deployment/core-java -n jtoye-production --timeout=10m

      - name: Health check after core-java deployment
        # issue #98 [P2-7] item 4: actuator now lives on the INTERNAL management
        # port (9091), not the public app port (9090). kubectl exec runs inside
        # the container, so localhost:9091 is reachable even though 9091 is not
        # published via the Service/Ingress.
        run: |
          sleep 30
          kubectl exec -n jtoye-production deployment/core-java -- curl -f http://localhost:9091/actuator/health || exit 1

      - name: Wait for edge-go + frontend rollout
        run: |
          kubectl rollout status deployment/edge-go -n jtoye-production --timeout=5m
          kubectl rollout status deployment/frontend -n jtoye-production --timeout=5m

      - name: Run comprehensive smoke tests
        run: |
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh https://api.olajay.co.uk

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Production deployment successful: ${{ github.sha }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Successful*\n\nCommit: `${{ github.sha }}`\nActor: ${{ github.actor }}\nURL: https://app.olajay.co.uk"
                  }
                }
              ]
            }

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/core-java -n jtoye-production
          kubectl rollout undo deployment/edge-go -n jtoye-production
          kubectl rollout undo deployment/frontend -n jtoye-production
          echo "❌ Deployment failed, rolled back to previous version"
          exit 1

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Production deployment FAILED: ${{ github.sha }} - Rolled back",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed*\n\nCommit: `${{ github.sha }}`\nActor: ${{ github.actor }}\n\n:warning: *Rolled back to previous version*"
                  }
                }
              ]
            }
