# Nightly full-suite E2E against a REAL compose stack (#420).
#
# WHY THIS EXISTS
#
#   The per-PR job (`frontend-e2e` in ci-cd.yaml) runs `e2e/public-layout.spec.ts` and
#   nothing else — 2 of 126 tests. It is deliberately stack-free and must stay that way;
#   the moment it needs a backend it stops running on every PR and the cheap layout gate
#   is lost. The consequence, though, is that 124 of 126 E2E tests never ran on ANY PR.
#
#   #404 is the record of what that costs: a broken customer sign-in shipped and sat
#   undetected, because the suite that would have caught it was itself broken and
#   unwatched. Closing #404 on "0 failed" would have lost that; #420 kept it.
#
#   So this job is the other half: the full suite, against a real stack, on a schedule.
#   Nightly rather than per-PR because the stack build is ~20 min and the suite ~20 min —
#   a tax no single change should pay. Nightly catches a regression within a day, which
#   is strictly better than the status quo of never.
#
# WHY OLLAMA IS EXCLUDED
#
#   `ollama-init` pulls `gemma3:12b` (~8 GB; a GitHub-hosted runner has ~14 GB of disk in
#   total) and `ollama` declares `deploy.resources.reservations.devices: [nvidia]`, which
#   no GitHub-hosted runner provides. Neither is reachable from the rest of the stack's
#   startup path: `core-java.depends_on` is postgres/keycloak/redis/rabbitmq/azurite only, and the
#   sole consumer of ollama is image analysis, which no spec asserts on. The service list
#   below is therefore explicit rather than "everything" — see SERVICES.
#
# FAIL-CLOSED CONTRACT — every one of these is a FAILURE, never a pass:
#   * the CI Stripe sandbox credentials fail `check-stripe-ci-keys.sh`
#   * the stack does not become healthy within the deadline
#   * the Playwright JSON report (main or Stripe phase) is absent, empty, or reports ZERO tests
#   * `stripe listen` does not reach Ready, or the payment_intent.succeeded / refund.* events do not land in processed_stripe_events
#   * `check-e2e-skip-budget.sh` exits non-zero across the union of both reports (1 = violation, 2 = VOID)
#   * `check-backup-restore-drill.sh` exits non-zero (1 = an arm failed, 2 = VOID)
#   Step-level error swallowing appears NOWHERE in this file on purpose. A job that cannot go red
#   is the exact failure mode #420 exists to remove.
#
# A11Y-5 (E1): `e2e/dashboard-a11y-nightly.spec.ts` runs as part of the SAME
# "Run the full Playwright suite" step below (no extra step needed — the suite
# is unfiltered, so any `*.spec.ts` under `e2e/` is picked up automatically)
# and axe-scans the vendor dashboard against this REAL Keycloak-backed stack,
# which the stack-free per-PR jest-axe gate (`__tests__/dashboard-a11y-axe.
# test.tsx`) cannot reach. It is REPORT-ONLY BY CONSTRUCTION, not by a workflow
# exception carved into the contract above: the spec itself never calls a
# throwing `expect()` against an axe result, so it cannot contribute to the
# `failed` count the verdict step below computes — findings land in the
# uploaded Playwright report's test annotations instead. See that file's own
# header for why a genuinely blocking assertion here would be wrong under this
# job's fail-closed contract.
#
# CREDENTIALS
#   Phase 1 (the full cash/storefront/dashboard suite) runs against a core-java
#   with STRIPE_API_KEY left empty so #793 (cash-checkout-no-stripe.spec.ts) can
#   prove a cash checkout loads zero Stripe resources; all of verify-env.sh's
#   REQUIRED_VARS are generated per-run for a stack that lives ~40 minutes and is
#   then destroyed.
#   Phase 2 (the Stripe test-mode phase, plan 30-22 / PAY-01) consumes ONE repository
#   secret (`secrets.STRIPE_TEST_SECRET_KEY`, `sk_test_...`) and ONE repository variable
#   (`vars.CI_STRIPE_PUBLISHABLE_KEY`, `pk_test_...`) from a dedicated CI Stripe sandbox
#   account (D-09; never the staging Stripe account so `stripe listen` cannot steal or
#   duplicate staging webhooks, Pitfall 5), guarded by `scripts/check-stripe-ci-keys.sh`
#   before the stack starts.

name: E2E Nightly (full stack)

on:
  schedule:
    # 02:00 UTC daily. Deliberately not on push/pull_request — see the header.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A scheduled run and a manual dispatch must not fight over the same docker daemon.
  group: e2e-nightly
  cancel-in-progress: false

env:
  COMPOSE_FILE: docker-compose.full-stack.yml
  # Every compose service EXCEPT ollama / ollama-init (see header). Explicit rather than
  # implicit so adding a service to compose is a deliberate decision here too.
  SERVICES: >-
    postgres keycloak-realm-render keycloak redis rabbitmq
    core-java edge-go frontend mcp-server azurite mailhog

jobs:
  full-suite:
    # Job-level, because the workflow default above is `contents: read` and the
    # escalation-on-failure step below files an issue. Declared here rather than
    # widening the workflow default, so only this job can write.
    permissions:
      contents: read
      issues: write
    name: Full Playwright suite against a real stack
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      CI_STRIPE_PUBLISHABLE_KEY: ${{ vars.CI_STRIPE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate — Stripe test-mode CI keys (T-30-09, T-30-10)
        run: |
          set -euo pipefail
          [ -n "${STRIPE_TEST_SECRET_KEY:-}" ] && echo "::add-mask::${STRIPE_TEST_SECRET_KEY}"
          [ -n "${CI_STRIPE_PUBLISHABLE_KEY:-}" ] && echo "::add-mask::${CI_STRIPE_PUBLISHABLE_KEY}"
          bash scripts/check-stripe-ci-keys.sh

      # The stack builds four images and pulls eight. A stock runner has ~14 GB free,
      # and a mid-build ENOSPC surfaces as an unrelated-looking compose error.
      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "after:"; df -h / | tail -1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Start from the committed example so every NON-secret key (ports, hostnames,
      # feature flags) stays in sync with the repo, then append generated values for the
      # credentials. Both consumers take the LAST occurrence — docker compose by dotenv
      # semantics, verify-env.sh because it `set -a; . "$ENV_FILE"` (shell sourcing) —
      # so appending is a genuine override, not a duplicate-key hazard.
      - name: Generate an ephemeral .env
        run: |
          set -euo pipefail
          cp .env.example .env

          # NOT EVERY CREDENTIAL IS INDEPENDENT. Some of these name the SAME
          # Postgres role from two different services, and giving those a
          # separate random value each guarantees an authentication failure:
          #
          #   POSTGRES_USER=jtoye and KC_DB_USERNAME=jtoye are one role. Postgres
          #   initialises it with POSTGRES_PASSWORD; Keycloak then connects with
          #   KC_DB_PASSWORD. Generated independently they can never match, and
          #   the stack died at `FATAL: password authentication failed for user
          #   "jtoye"` on every scheduled run this workflow ever had.
          #
          # So generate the INDEPENDENT credentials in the loop, then derive the
          # paired ones. scripts/verify-env.sh now asserts the pairing, so a
          # future edit that re-adds KC_DB_PASSWORD to the loop fails preflight
          # instead of failing 4 minutes into the stack build.
          # The list of credentials to manufacture is READ from verify-env.sh, not
          # copied here. A copy is exactly what broke: PR #510 added two variables
          # to that script's REQUIRED_VARS and not to this loop, so the next run
          # would have failed preflight on CHANGE_ME values inherited from
          # .env.example. One list, one source of truth.
          # DB_MIGRATION_USER / DB_MIGRATION_PASSWORD are DERIVED, not generated (SEC-04 / #552,
          # D-01). DB_MIGRATION_USER is a role NAME — the owner/migrator jtoye_app that Flyway
          # migrates AS — and randomising a name points Flyway at a role that does not exist, so
          # every migration fails auth (the same class of break KC_DB_PASSWORD was added here for).
          # DB_MIGRATION_PASSWORD = DB_PASSWORD is a SIMPLIFICATION, no longer a requirement:
          # since #684, infra/db/init/00-create-db.sql creates jtoye_app with
          # DB_MIGRATION_PASSWORD (falling back to DB_PASSWORD when unset/empty), so differing
          # credentials provision correctly on a fresh volume. Equal values remain valid and are
          # kept here so this lane exercises the single-credential fallback path; the local dev
          # .env holds DIFFERING values, so the split path is exercised there. DB_USER itself is
          # NOT in REQUIRED_VARS, so it is never in this loop and keeps .env.example's jtoye_runtime.
          DERIVED="KC_DB_PASSWORD POSTGRES_EXPORTER_PASSWORD RABBITMQ_PASSWORD KC_SEED_USER_PASSWORD DB_MIGRATION_USER DB_MIGRATION_PASSWORD DSAR_ENCRYPTION_KEY CLIENT_IP_HMAC_KEY"
          required=$(bash scripts/verify-env.sh --list-required)
          [ -n "$required" ] || { echo "FATAL: verify-env.sh --list-required produced nothing" >&2; exit 1; }

          {
            echo ""
            echo "# --- generated by e2e-nightly.yml, ephemeral, destroyed with the runner ---"
            while read -r v; do
              [ -n "$v" ] || continue
              case " ${DERIVED} " in *" ${v} "*) continue ;; esac
              echo "${v}=ci$(openssl rand -hex 24)"
            done <<< "$required"
          } >> .env

          # Derived, not generated: these name the SAME Postgres role, so they
          # must carry the same password. Read the value back out of the file
          # just written so they cannot drift from the loop above. Both consumers
          # take the LAST occurrence, so appending is a genuine override.
          #   KC_DB_USERNAME              = jtoye  (= POSTGRES_USER)
          #   POSTGRES_EXPORTER_USER      unset    -> defaults to jtoye
          pg_pw=$(sed -n 's/^POSTGRES_PASSWORD=//p' .env | tail -n1)
          [ -n "$pg_pw" ] || { echo "FATAL: POSTGRES_PASSWORD not found in .env after generation" >&2; exit 1; }
          echo "KC_DB_PASSWORD=${pg_pw}" >> .env
          echo "POSTGRES_EXPORTER_PASSWORD=${pg_pw}" >> .env

          # The migrator role NAME must stay jtoye_app, and its password must equal the (generated)
          # DB_PASSWORD that 00-create-db.sql created jtoye_app with. Read DB_PASSWORD back out of the
          # file just written so the two cannot drift, exactly as KC_DB_PASSWORD mirrors POSTGRES_PASSWORD.
          db_pw=$(sed -n 's/^DB_PASSWORD=//p' .env | tail -n1)
          [ -n "$db_pw" ] || { echo "FATAL: DB_PASSWORD not found in .env after generation" >&2; exit 1; }
          echo "DB_MIGRATION_USER=jtoye_app" >> .env
          echo "DB_MIGRATION_PASSWORD=${db_pw}" >> .env

          # Not only Postgres. RABBITMQ_DEFAULT_USER (what the broker is
          # provisioned with) and RABBITMQ_USER (what core-java presents) are
          # both 'jtoye', so their passwords must agree too. Independent values
          # give ACCESS_REFUSED *after* Tomcat has started, which reads as a
          # healthy container for a few seconds before the context aborts.
          mq_pw=$(sed -n 's/^RABBITMQ_DEFAULT_PASS=//p' .env | tail -n1)
          [ -n "$mq_pw" ] || { echo "FATAL: RABBITMQ_DEFAULT_PASS not found in .env after generation" >&2; exit 1; }
          echo "RABBITMQ_PASSWORD=${mq_pw}" >> .env

          # .env.example is written for a REAL deployment, so it points SMTP at
          # smtp.example.com:587. Copying it here overrides compose's own
          # `${SMTP_HOST:-mailhog}` / `${SMTP_PORT:-1025}` defaults, and core-java
          # then tries to reach a host that does not exist from inside a
          # container. MailHealthIndicator fails, /actuator/health goes DOWN, the
          # container healthcheck fails, and `depends_on: service_healthy` takes
          # the whole stack down with it.
          #
          # A developer .env does not hit this because it simply OMITS these keys
          # and lets compose's defaults apply — the working configuration here is
          # the absence of a value, which is exactly what copying an example file
          # destroys.
          {
            echo "SMTP_HOST=mailhog"
            echo "SMTP_PORT=1025"
            echo "SMTP_USERNAME="
            echo "SMTP_PASSWORD="
            echo "SMTP_AUTH=false"
            echo "SMTP_STARTTLS=false"
          } >> .env

          # The same trap for the Keycloak admin seam. .env.example ships
          # KC_ADMIN_ENABLED=false (a real deployment opts in), which overrides
          # compose's `${KC_ADMIN_ENABLED:-true}`. With the seam off, every
          # staff-invite preview and accept answers 503
          # `staff-invite-account-service-unavailable` by design, so
          # staff-invite.spec.ts read "We couldn't check your invitation" every
          # night from its first run (2026-10-12, #683). A developer .env omits
          # the key and gets compose's true, which is why it passed locally.
          echo "KC_ADMIN_ENABLED=true" >> .env

          # The whole suite runs as ONE tenant against core's per-tenant bucket (100 a
          # minute, capacity 120). Run 38539157660 on the fix branch passed 386 tests and
          # failed one on `POST /api/v1/onboarding -> 429 rate-limited` (retry 18 s), right
          # after a burst of earlier specs. No spec depends on this limiter firing for real
          # (kitchen-flow injects its 429s; the order caps are a different mechanism), so
          # the nightly sizes it for a suite, not for one vendor's traffic.
          echo "RATE_LIMIT_PER_MINUTE=1000" >> .env

          # KC_SEED_USER_PASSWORD is imported into the realm as a USER PASSWORD
          # (infra/keycloak/realm-export.template.json), so it must satisfy that
          # realm's own passwordPolicy:
          #   length(12) and upperCase(1) and lowerCase(1) and digits(1)
          #   and specialChars(1) and notUsername
          # `openssl rand -hex` emits [0-9a-f] ONLY — no upper case, no special
          # character — so the loop's value fails two of those rules and realm
          # import aborts with `invalidPasswordMinSpecialCharsMessage`, leaving
          # Keycloak unhealthy and the whole stack down. This was invisible until
          # the database credentials were fixed, because Keycloak previously died
          # at the JDBC step and never reached realm import.
          # The suffix supplies the two character classes hex cannot; the random
          # body still carries the entropy. verify-env.sh check (e) asserts the
          # result against the policy parsed from the realm file itself.
          seed_pw="Aa1!$(openssl rand -hex 24)"
          echo "KC_SEED_USER_PASSWORD=${seed_pw}" >> .env

          # DSAR_ENCRYPTION_KEY (31.1-07, D-19) is the AES-256-GCM key for the DSAR
          # subject address, and core-java REFUSES TO START unless it is exactly 64
          # hexadecimal characters. The generic loop above writes `ci` + 48 hex
          # characters: 50 characters, two of them not hex, so core-java would die
          # at boot and take every test with it. It is therefore in DERIVED and
          # generated here as a real 32-byte key. Like every value in this file it
          # is never echoed; verify-env.sh checks its format before the build.
          echo "DSAR_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> .env
          # CLIENT_IP_HMAC_KEY (37-28, D-27) has the identical contract: the HMAC key for the
          # client-IP digest behind the per-IP cash-order cap, exactly 64 hex characters or
          # core-java refuses to start. DERIVED for the same reason, generated the same way.
          echo "CLIENT_IP_HMAC_KEY=$(openssl rand -hex 32)" >> .env
          echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${CI_STRIPE_PUBLISHABLE_KEY}" >> .env

          echo "appended $(wc -l < .env) total lines"

      # Credential half only: --with-stack probes a running stack, which does not exist
      # yet. Running it here means a malformed .env fails BEFORE a 20-minute build.
      - name: Preflight the env contract
        run: bash scripts/verify-env.sh

      - name: Build and start the stack (no ollama)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          docker compose -f "$COMPOSE_FILE" up -d --build $SERVICES

      # Explicit polling rather than `--wait`: one of these services is a one-shot
      # container that exits 0 (keycloak-realm-render), and a health probe
      # that cannot distinguish "exited cleanly" from "died" is not evidence. Poll the
      # things the SUITE actually needs, and dump logs on timeout rather than failing mute.
      - name: Wait for core-java and the frontend
        id: stack-up
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 600 ))
          up_core=0 up_front=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$up_core" -eq 0 ]; then
              status=$(curl -fsS http://localhost:9090/actuator/health 2>/dev/null | jq -r '.status // empty' || true)
              [ "$status" = "UP" ] && { up_core=1; echo "core-java UP after ${SECONDS}s"; }
            fi
            if [ "$up_front" -eq 0 ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/shop || true)
              [ "$code" = "200" ] && { up_front=1; echo "frontend 200 after ${SECONDS}s"; }
            fi
            [ "$up_core" -eq 1 ] && [ "$up_front" -eq 1 ] && exit 0
            sleep 5
          done
          echo "::error::stack did not become healthy within 600s (core=$up_core front=$up_front)"
          docker compose -f "$COMPOSE_FILE" ps
          docker compose -f "$COMPOSE_FILE" logs --tail 200
          exit 1

      # BLOB-05 / BLOB-09 (Phase 36). Every image URL the API can serve — products.image_url,
      # additional_image_urls, shop logo/banner, review photos, and every ACTIVE media_asset's
      # derivative (+ _thumb) — must answer an ANONYMOUS HEAD 200 on this stack's Azurite, and
      # no stored value may still point at the retired :9000 origin. A green upload and a 200
      # page title say nothing about whether stored URLs resolve; this does.
      #
      # WHY RIGHT AFTER THE WAIT: DemoDataSeeder writes the demo products and their seed
      # images in ONE transaction, and under the dev profile's health probes /actuator/health
      # stays OUT_OF_SERVICE until ApplicationReadyEvent, i.e. until every ApplicationRunner
      # (the seeder included) has returned. So "core-java UP" above already implies the seed
      # rows and their blobs are committed. An empty checked set is VOID (exit 2), never a
      # pass, so a seeder that did nothing fails here rather than reading as clean.
      - name: Gate — every stored image URL resolves on the object store
        run: bash scripts/check-media-urls-resolve.sh

      # T-36-44 / #488. Every blob in the PUBLIC container (jtoye-images) must carry a stored
      # Content-Type inside MediaNormalizer's allowlist: the store serves a blob with the type
      # it was stored with, so a text/html blob on this origin is a stored-XSS primitive on the
      # storefront's own origin whatever its bytes are. Listed with the runner's preinstalled
      # az CLI against this stack's Azurite; the emulator connection string reaches az through
      # the environment (the script's default), never argv. The private quarantine container is
      # out of scope by design. Exit 2 (VOID) on an empty listing, a failed listing or a missing
      # az — never a pass.
      - name: Gate — stored Content-Types on the public container stay inside the image allowlist
        run: bash scripts/check-media-content-types.sh

      # The OpenAPI contract, checked against the SERVICE rather than against the source
      # tree (33-06). This is the ONLY workflow in the repository with a running core-java,
      # which is why the gate is wired here and not in ci-cd.yaml: a hosted runner with no
      # stack could only ever exit 2 (VOID), and a permanently-VOID required job teaches
      # people to add `|| true`.
      #
      # It is not a duplicate of the openapi-compat job or of OpenApiSnapshotTest. Both of
      # those compare the committed snapshot with a spec generated from the SOURCE TREE, and
      # are green whether or not the deployed service was ever rebuilt from that source.
      # This asks the other half: does the thing actually listening on 9090 emit what
      # docs/api/openapi-snapshot.json claims. Placed BEFORE the Playwright install so a
      # contract failure costs seconds rather than the whole suite.
      #
      # Exit 2 is VOID (service unreachable, empty fetch, unparseable JSON), never a pass.
      - name: Gate — the committed OpenAPI contract vs the RUNNING service
        run: bash scripts/check-openapi-snapshot-fresh.sh

      # FE-1 / E-5 (QA council 20260902-134741). The vendor sign-out's Keycloak return
      # leg is /api/vendor-auth/logout-complete (VENDOR_LOGOUT_COMPLETE_ENABLED is "true"
      # in docker-compose.full-stack.yml), and that URI is only safe where the realm has
      # it registered: an UNREGISTERED post_logout_redirect_uri makes Keycloak answer 400
      # WITHOUT ending the SSO session (#504), handing the P0 back. This is the only
      # workflow with a running Keycloak, so the compose realm's registration is proven
      # here on every nightly, with its two control arms (garbage host / wrong port must
      # 400 — a realm that accepts anything fails). The deploy jobs in ci-cd.yaml run the
      # same script against the DEPLOYED realm. Defaults are the compose values
      # (localhost:8085, jtoye-dev, core-api, http://localhost:3000/...). Exit 2 is VOID.
      - name: Gate — Keycloak accepts the vendor post-logout redirect URI (FE-1 / E-5)
        run: bash scripts/check-keycloak-logout-uri.sh

      # DemoDataSeeder (@Profile("dev"), ApplicationRunner) has already created the demo
      # tenant's shops/products/customers against the fresh DB. This adds only what the
      # suite would otherwise SKIP over: the DRAFT order and the in-window promotion.
      # Exit 2 is VOID (no container, no shop) — not a pass. `set -e` catches both.
      # `id` so the cart-identity gate below can key its `if:` on THIS step: that
      # gate must survive a failing Playwright suite, but not a stack that never
      # came up. See the comment on that step.
      - name: Seed E2E fixtures
        id: seed-fixtures
        run: bash scripts/seed-e2e-fixtures.sh

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The suite drives the compose frontend on :3000, not a runner-local `next start`.
      # E2E_VENDOR_PASSWORD mirrors KC_SEED_USER_PASSWORD because vendor-credentials.ts
      # reads either; passing it explicitly keeps the spec's fallback chain honest.
      #
      # `|| true` is deliberate and is NOT a swallowed failure: a suite with real test
      # failures must still produce a report for the skip-budget gate and the artifact
      # upload. The next step re-derives pass/fail FROM the report and exits non-zero.
      - name: Run the full Playwright suite
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          set -uo pipefail
          mkdir -p e2e-artifacts
          set -a; . ../.env; set +a
          export E2E_VENDOR_PASSWORD="${KC_SEED_USER_PASSWORD}"
          npx playwright test --reporter=json > e2e-artifacts/report.json || true

      # Prove the instrument before trusting it. A report that is absent, empty, or
      # contains ZERO results is the shape that makes a green summary meaningless — the
      # same class as the stale-XML read that once reported a pass over a failed compile.
      - name: Assert the report is real, then read the verdict from it
        working-directory: frontend
        run: |
          set -euo pipefail
          report=e2e-artifacts/report.json
          [ -s "$report" ] || { echo "::error::no Playwright report at $report — the suite produced nothing"; exit 1; }
          total=$(jq '[.. | objects | select(has("results")) | .results] | flatten | length' "$report")
          case "$total" in ''|*[!0-9]*) echo "::error::could not count tests in $report"; exit 1 ;; esac
          [ "$total" -gt 0 ] || { echo "::error::report contains ZERO test results — a run that executed nothing is not a pass"; exit 1; }

          passed=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.status == "passed")] | length' "$report")
          failed=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.status == "failed" or .status == "timedOut" or .status == "interrupted")] | length' "$report")
          skipped=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.status == "skipped")] | length' "$report")
          echo "total=$total passed=$passed failed=$failed skipped=$skipped"
          echo "### E2E nightly: $passed passed, $failed failed, $skipped skipped (of $total)" >> "$GITHUB_STEP_SUMMARY"

          [ "$failed" -eq 0 ] || { echo "::error::$failed E2E test(s) failed"; exit 1; }

      # Phase 30 plan 30-22 (PAY-01): Phase 2 runs stripe-refund-flow.spec.ts against
      # real Stripe test mode after Phase 1 has proven #793 (cash-checkout-no-stripe)
      # on the cash-only stack.
      - name: Install the Stripe CLI (pinned, checksum-verified)
        run: |
          set -euo pipefail
          STRIPE_CLI_VERSION="1.55.6"
          STRIPE_CLI_SHA256="1759a13a0c48f15e11979696df7b5958a73a8e6c1b92bea2a3ccb73ea97d5854"
          curl -fsSL "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}/stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz" \
            -o /tmp/stripe-cli.tar.gz
          echo "${STRIPE_CLI_SHA256}  /tmp/stripe-cli.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/stripe-cli.tar.gz -C /usr/local/bin stripe
          rm -f /tmp/stripe-cli.tar.gz
          stripe --version

      - name: Start the Stripe forwarder
        run: |
          set -euo pipefail
          # Derive the account's test webhook signing secret via env (never argv, T-30-12)
          # and register it with GitHub Actions' log masker before writing to .env.
          whsec=$(STRIPE_API_KEY="$STRIPE_TEST_SECRET_KEY" stripe listen --print-secret)
          case "$whsec" in
            whsec_*) echo "::add-mask::$whsec" ;;
            *) echo "::error::stripe listen --print-secret did not return a whsec_ secret"; exit 1 ;;
          esac

          {
            echo "STRIPE_API_KEY=${STRIPE_TEST_SECRET_KEY}"
            echo "STRIPE_WEBHOOK_SECRET=${whsec}"
            echo "STRIPE_CONNECT_WEBHOOK_SECRET=${whsec}"
            echo "STRIPE_ENVIRONMENT_TAG=ci-nightly"
          } >> .env

          STRIPE_API_KEY="$STRIPE_TEST_SECRET_KEY" nohup stripe listen \
            --forward-to http://localhost:9090/api/v1/public/payments/webhook \
            --forward-connect-to http://localhost:9090/api/v1/public/payments/webhook/connect \
            > "$RUNNER_TEMP/stripe-listen.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/stripe-listen.pid"

          deadline=$(( SECONDS + 60 ))
          ready=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            kill -0 "$(cat "$RUNNER_TEMP/stripe-listen.pid")" 2>/dev/null || {
              echo "::error::stripe listen exited prematurely"
              cat "$RUNNER_TEMP/stripe-listen.log" >&2 || true
              exit 1
            }
            if grep -q "Ready" "$RUNNER_TEMP/stripe-listen.log" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || {
            echo "::error::stripe listen did not become ready within 60s"
            cat "$RUNNER_TEMP/stripe-listen.log" >&2 || true
            exit 1
          }

      - name: Recreate core-java with the CI Stripe key
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate core-java
          deadline=$(( SECONDS + 300 ))
          up_core=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl -fsS http://localhost:9090/actuator/health 2>/dev/null | jq -r '.status // empty' || true)
            if [ "$status" = "UP" ]; then
              up_core=1
              echo "core-java UP (Stripe test mode) after ${SECONDS}s"
              break
            fi
            sleep 3
          done
          [ "$up_core" -eq 1 ] || {
            echo "::error::core-java did not become UP within 300s after Stripe recreate"
            docker compose -f "$COMPOSE_FILE" logs --tail 200 core-java
            exit 1
          }
          accepts=$(curl -fsS http://localhost:9090/api/v1/public/shops/mama-ades-kitchen | jq -r '.acceptsCardPayments')
          [ "$accepts" = "true" ] || {
            echo "::error::mama-ades-kitchen acceptsCardPayments is '$accepts' (expected true)"
            exit 1
          }

      - name: Run the Stripe-keyed specs
        id: stripe-run
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          STRIPE_E2E: '1'
          STRIPE_E2E_EVIDENCE: e2e-artifacts/stripe-refund.json
        run: |
          set -uo pipefail
          mkdir -p e2e-artifacts
          set -a; . ../.env; set +a
          export E2E_VENDOR_PASSWORD="${KC_SEED_USER_PASSWORD}"
          npx playwright test e2e/stripe-refund-flow.spec.ts --project=desktop --reporter=json > e2e-artifacts/report-stripe.json || true

      - name: Assert the Stripe report is real, zero skips, zero failures
        working-directory: frontend
        run: |
          set -euo pipefail
          report=e2e-artifacts/report-stripe.json
          [ -s "$report" ] || { echo "::error::no Stripe Playwright report at $report"; exit 1; }
          total=$(jq '[.. | objects | select(has("results")) | .results] | flatten | length' "$report")
          case "$total" in ''|*[!0-9]*) echo "::error::could not count tests in $report"; exit 1 ;; esac
          [ "$total" -gt 0 ] || { echo "::error::Stripe report contains ZERO test results"; exit 1; }

          passed=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.status == "passed")] | length' "$report")
          failed=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.status == "failed" or .status == "timedOut" or .status == "interrupted")] | length' "$report")
          skipped=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.status == "skipped")] | length' "$report")
          echo "stripe_phase: total=$total passed=$passed failed=$failed skipped=$skipped"
          echo "### E2E nightly (Stripe phase): $passed passed, $failed failed, $skipped skipped (of $total)" >> "$GITHUB_STEP_SUMMARY"

          [ "$passed" -ge 1 ] || { echo "::error::Stripe phase passed $passed test(s) (expected >= 1)"; exit 1; }
          [ "$failed" -eq 0 ] || { echo "::error::$failed Stripe E2E test(s) failed"; exit 1; }
          [ "$skipped" -eq 0 ] || { echo "::error::$skipped Stripe E2E test(s) skipped — PAY-01 requires zero skips in the Stripe phase"; exit 1; }

      - name: Stripe events reached the app
        run: |
          set -euo pipefail
          ev=frontend/e2e-artifacts/stripe-refund.json
          [ -s "$ev" ] || { echo "::error::missing $ev from Stripe spec"; exit 1; }
          pi=$(jq -r '.intent // empty' "$ev")
          re=$(jq -r '.refund // empty' "$ev")
          [ -n "$pi" ] && [ -n "$re" ] || { echo "::error::missing intent or refund id in $ev"; exit 1; }

          cfg="$RUNNER_TEMP/stripe-curl.cfg"
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "$STRIPE_TEST_SECRET_KEY" > "$cfg"
          trap 'rm -f "$cfg"' EXIT

          pi_ev=$(curl -fsS -K "$cfg" "https://api.stripe.com/v1/events?type=payment_intent.succeeded&limit=25" \
            | jq -r --arg id "$pi" '.data[] | select(.data.object.id == $id) | .id' | head -n 1)
          re_ev=$(curl -fsS -K "$cfg" "https://api.stripe.com/v1/events?types%5B%5D=refund.created&types%5B%5D=refund.updated&types%5B%5D=charge.refunded&limit=25" \
            | jq -r --arg re "$re" --arg pi "$pi" '.data[] | select(.data.object.id == $re or .data.object.payment_intent == $pi) | .id' | head -n 1)
          [ -n "$pi_ev" ] || { echo "::error::no payment_intent.succeeded event found on Stripe for $pi"; exit 1; }
          [ -n "$re_ev" ] || { echo "::error::no refund event found on Stripe for $re ($pi)"; exit 1; }

          set -a; . ./.env; set +a
          db="${POSTGRES_DB:-jtoye}"
          pi_rows=$(docker compose -f "$COMPOSE_FILE" exec -T postgres psql -U "$POSTGRES_USER" -d "$db" -tAc \
            "SELECT count(*) FROM processed_stripe_events WHERE event_id = '$pi_ev';")
          re_rows=$(docker compose -f "$COMPOSE_FILE" exec -T postgres psql -U "$POSTGRES_USER" -d "$db" -tAc \
            "SELECT count(*) FROM processed_stripe_events WHERE event_id = '$re_ev';")
          echo "processed_stripe_events: pi_event=$pi_ev rows=$pi_rows refund_event=$re_ev rows=$re_rows"
          [ "${pi_rows:-0}" -ge 1 ] || { echo "::error::event $pi_ev not found in processed_stripe_events"; exit 1; }
          [ "${re_rows:-0}" -ge 1 ] || { echo "::error::event $re_ev not found in processed_stripe_events"; exit 1; }

      # S-1..S-5 across the union of Phase 1 (cash/full) and Phase 2 (Stripe): total
      # within budget, every skip declared with a justification + REMOVE WHEN block,
      # no stale ALLOW, and both reports stamped with the current e2e-spec-digest.
      - name: Enforce the declared skip budget
        if: always() && steps.stack-up.outcome == 'success'
        run: >-
          bash scripts/check-e2e-skip-budget.sh
          --report frontend/e2e-artifacts/report.json
          --report frontend/e2e-artifacts/report-stripe.json

      - name: Stop the Stripe forwarder
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/stripe-listen.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/stripe-listen.pid")" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/stripe-listen.pid"
          fi

      # R-16 / #459. WHY HERE AND NOT IN ci-cd.yaml: `frontend-e2e` there is
      # deliberately stack-free, and this script drives THREE real Keycloak
      # registrations against a live realm plus a placed order. The nightly is
      # the only lane with that stack.
      #
      # WHY AT ALL: it previously ran in no workflow, gate or npm script — it was
      # manual-only, and it had been silently unrunnable since PR #522 moved one
      # paragraph from `text-slate-500` to `text-slate-600`. A guard nothing
      # executes decays without anyone learning it decayed.
      #
      # THE `if:` IS LOAD-BEARING, AND IT IS NOT `always()` (WR-04). With no
      # `if:` a step inherits `success()`, so this gate would be SKIPPED whenever
      # ANY earlier step failed — including the Playwright suite and the skip
      # budget. This workflow's own escalation history records 14 consecutive
      # scheduled failures (2026-08-11 → 2026-08-24); across every one of those
      # nights this gate would have executed ZERO times, which is the exact
      # decay it was added to stop. So it keys on the SEED step instead:
      #
      #   - a red suite, a red verdict step or a red skip budget must NOT skip
      #     this gate — they say nothing about cart identity;
      #   - a stack that never came up, or fixtures that never seeded, MUST skip
      #     it — the shops it drives (peckham-jollof-co, mama-ades-kitchen) would
      #     not exist and the failure would be noise about the wrong thing.
      #
      # `always()` alone would produce that noise; `steps.seed-fixtures.outcome`
      # is the narrowest precondition that distinguishes the two.
      #
      # ORDERING TRADE-OFF, recorded rather than left implicit: this runs AFTER
      # the suite because each pass registers three real Keycloak users and
      # places a real order against the same seeded shops the suite asserts on.
      # Hoisting it above the suite trades a skipped gate for perturbed fixtures,
      # which is the worse failure — a suite failing for reasons it did not
      # cause. No cheap smoke subset is carved out for PR CI either: every arm
      # here needs either a real registration (C1c, C1, C2) or a placed order
      # (C4), and the two that need neither (C3, and C1c's seed half) would
      # still need the full compose stack that `frontend-e2e` deliberately does
      # not have. The boundary is therefore: this class of check lives in the
      # nightly, and the PR lane covers the same invariants in jsdom.
      #
      # Deliberately no step-level error swallowing — that directive appears nowhere in
      # this file on purpose (see the header). The script fails closed on its own:
      # exit 1 on any failed check, exit 2 when KC_SEED_USER_PASSWORD is unset or
      # when it runs fewer checks than it declares, and every arm pushes a
      # failing result from its catch so a thrown exception can never read as a
      # pass.
      #
      # No NODE_PATH: it is a CommonJS/`require` mechanism that Node's ESM
      # resolver does not consult, so setting it here would document a mechanism
      # that does not exist. `import … from "@playwright/test"` resolves by
      # walking up from the importing file's own directory — which is why the
      # script must stay under `frontend/`.
      - name: Gate — cart identity boundary (#459 / R-16)
        if: always() && steps.seed-fixtures.outcome == 'success'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: node --env-file=.env frontend/e2e/cart-identity-boundary.verify.mjs

      # BLOB-06 (Phase 36). The two-arm restore drill of docs/runbooks/backups.md, EXECUTED.
      # Every check inside the backup pipeline (the size floor, `pg_restore --list`) passes on
      # a dump that holds no tenant rows; only restore-and-count falsifies it, and until this
      # step that recipe was prose that had run once, by hand. The pg-backup image is built
      # HERE — nothing else in CI builds it — and runs exactly as the CronJob does, uploading to
      # this stack's Azurite with blobctl. Arm B (dump as the BYPASSRLS jtoye_backup) must
      # restore from Blob to exactly the live products count, > 0; arm A (the app role) must
      # fail the job and upload nothing, and its zero-row dump must restore 0 products.
      #
      # POSITION AND `if:` — the cart-identity reasoning above applies unchanged. The drill
      # needs only postgres + azurite, so it keys on the stack having come up (`stack-up`), not
      # on the suite: a red Playwright run must not skip the backup proof, and a red backup
      # proof must not skip the suite, which is why it sits at the end rather than straight
      # after the Wait step.
      #
      # DB_BACKUP_PASSWORD is not in verify-env.sh's REQUIRED_VARS, so the generator leaves
      # .env.example's CHANGE_ME and the drill would VOID on it. An ephemeral value is appended
      # here (never printed); the drill creates the jtoye_backup role with it from
      # infra/backups/create-backup-role.sql. Exit 1 = an arm failed, 2 = VOID; both fail the job.
      - name: Gate — a backup restored from Blob carries tenant rows, and a zero-row dump is caught
        if: always() && steps.stack-up.outcome == 'success'
        run: |
          set -euo pipefail
          docker build -t ghcr.io/bralabee/jtoye-pg-backup:18-blob infra/backups
          cur=$(sed -n 's/^DB_BACKUP_PASSWORD=//p' .env | tail -n 1)
          case "$cur" in
            ''|CHANGE_ME*)
              echo "DB_BACKUP_PASSWORD=ci$(openssl rand -hex 24)" >> .env
              echo "appended an ephemeral DB_BACKUP_PASSWORD to .env"
              ;;
          esac
          bash scripts/check-backup-restore-drill.sh

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-nightly-report
          path: |
            frontend/e2e-artifacts/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" ps
          docker compose -f "$COMPOSE_FILE" logs --tail 400

      # ESCALATION. Until this existed the nightly told nobody: its only failure
      # handling dumped logs INTO the failed run, visible to someone already looking.
      # Measured 2026-08-24: 14 consecutive scheduled failures, 2026-08-11 through
      # 2026-08-24, produced zero issues and zero notifications. Every merge in that
      # window — Phase 31 (#633, 18 plans) included — landed with no full-suite E2E
      # evidence on any tree, and the cause (a missing TRUNCATE grant, #647) was found
      # only because a human went looking at run history.
      #
      # Scheduled runs only. A workflow_dispatch is somebody watching the tab already,
      # and filing an issue under them is noise, not signal.
      - name: Escalate a failed nightly
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Nightly E2E is failing — the full-suite lane is dark"

          # De-duplicate on an EXACT title match, done in the shell rather than trusted
          # from `gh issue list --search`, which is substring-ish. stderr goes to its own
          # file and never into the value: gh can exit 0 while printing a warning, and
          # folding that text into `existing` would make it non-empty, select the
          # "refresh" branch, and run `gh issue comment "<warning text>"` — failing the
          # step under set -e and losing the report entirely.
          lrc=0
          errf="$(mktemp)"
          # --search narrows SERVER-side to title matches, so the result window no
          # longer depends on how many issues are open; the jq select below stays the
          # exact-title filter. A bare `--limit 100` saw only the 100 NEWEST open
          # issues and filed duplicates once more than 100 were newer than the
          # tracker (#883 duplicated #683 on 2026-10-04 with 177 open; #885).
          existing=$(gh issue list --state open --search "in:title \"${TITLE}\"" --limit 1000 \
                       --json number,title \
                       --jq ".[] | select(.title == \"${TITLE}\") | .number" 2>"${errf}") || lrc=$?
          if [ "${lrc}" -ne 0 ]; then
            echo "WARN: could not list open issues (rc=${lrc}); de-duplication DISABLED for this run." >&2
            cat "${errf}" >&2
            existing=""
          fi

          body_file="$(mktemp)"
          cat > "${body_file}" <<'EOF'
          The scheduled full-stack Playwright run failed. This lane is the project's
          **only** full-suite E2E instrument, so while it is red **no merge has
          full-suite evidence on any tree**.

          ### Triage, in order

          1. **Did the stack come up at all?** The common failure is that core-java
             never becomes healthy, so Playwright never runs and no `report.json` is
             produced. Check the `Wait for core-java and the frontend` step first — if
             it timed out, this is a stack problem, not a test problem.
          2. **Read the container logs in the `Dump stack logs on failure` step.** Note
             it runs `docker compose logs --tail 400`, so a crash-looping container's
             FIRST failure may be truncated out. If the tail looks like a clean
             shutdown, look for a repeating error earlier.
          3. **A fresh volume is not the developer's machine.** `Tear down` runs
             `down -v`, so every night starts from an empty database and only
             `infra/db/init/00-create-db.sql` has run. Anything requiring a manual
             provisioning step will work locally and fail here every single night —
             that was #647.
          4. **If Playwright DID run**, the failure is a real test regression: pull the
             uploaded report artifact and read the verdict from `report.json`.

          ### Do not

          Do not close this because a re-run went green without a code change — an
          intermittent nightly is still a lane you cannot trust. Close it when you know
          which change fixed it.

          EOF
          {
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
          } >> "${body_file}"

          if [ -n "${existing}" ]; then
            # Parameter expansion, not `head -n 1`: head exits after the first line, the
            # writer takes SIGPIPE, and pipefail promotes that to 141 — killing the step
            # under set -e instead of filing the comment.
            num="${existing%%$'\n'*}"
            gh issue comment "${num}" --body-file "${body_file}"
            echo "Refreshed existing issue #${num}."
          else
            gh issue create --title "${TITLE}" --body-file "${body_file}" \
              --label ci --label P1 || {
              echo "Label-qualified create failed; retrying without labels." >&2
              gh issue create --title "${TITLE}" --body-file "${body_file}"
            }
          fi

      - name: Tear down
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/stripe-listen.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/stripe-listen.pid")" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/stripe-listen.pid"
          fi
          docker compose -f "$COMPOSE_FILE" down -v --remove-orphans
