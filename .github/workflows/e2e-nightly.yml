# Nightly full-suite E2E against a REAL compose stack (#420).
#
# WHY THIS EXISTS
#
#   The per-PR job (`frontend-e2e` in ci-cd.yaml) runs `e2e/public-layout.spec.ts` and
#   nothing else — 2 of 126 tests. It is deliberately stack-free and must stay that way;
#   the moment it needs a backend it stops running on every PR and the cheap layout gate
#   is lost. The consequence, though, is that 124 of 126 E2E tests never ran on ANY PR.
#
#   #404 is the record of what that costs: a broken customer sign-in shipped and sat
#   undetected, because the suite that would have caught it was itself broken and
#   unwatched. Closing #404 on "0 failed" would have lost that; #420 kept it.
#
#   So this job is the other half: the full suite, against a real stack, on a schedule.
#   Nightly rather than per-PR because the stack build is ~20 min and the suite ~20 min —
#   a tax no single change should pay. Nightly catches a regression within a day, which
#   is strictly better than the status quo of never.
#
# WHY OLLAMA IS EXCLUDED
#
#   `ollama-init` pulls `gemma3:12b` (~8 GB; a GitHub-hosted runner has ~14 GB of disk in
#   total) and `ollama` declares `deploy.resources.reservations.devices: [nvidia]`, which
#   no GitHub-hosted runner provides. Neither is reachable from the rest of the stack's
#   startup path: `core-java.depends_on` is postgres/keycloak/redis/rabbitmq only, and the
#   sole consumer of ollama is image analysis, which no spec asserts on. The service list
#   below is therefore explicit rather than "everything" — see SERVICES.
#
# FAIL-CLOSED CONTRACT — every one of these is a FAILURE, never a pass:
#   * the stack does not become healthy within the deadline
#   * the Playwright JSON report is absent, empty, or reports ZERO tests
#   * `check-e2e-skip-budget.sh` exits non-zero (1 = violation, 2 = VOID)
#   `continue-on-error` appears NOWHERE in this file on purpose. A job that cannot go red
#   is the exact failure mode #420 exists to remove.
#
# A11Y-5 (E1): `e2e/dashboard-a11y-nightly.spec.ts` runs as part of the SAME
# "Run the full Playwright suite" step below (no extra step needed — the suite
# is unfiltered, so any `*.spec.ts` under `e2e/` is picked up automatically)
# and axe-scans the vendor dashboard against this REAL Keycloak-backed stack,
# which the stack-free per-PR jest-axe gate (`__tests__/dashboard-a11y-axe.
# test.tsx`) cannot reach. It is REPORT-ONLY BY CONSTRUCTION, not by a workflow
# exception carved into the contract above: the spec itself never calls a
# throwing `expect()` against an axe result, so it cannot contribute to the
# `failed` count the verdict step below computes — findings land in the
# uploaded Playwright report's test annotations instead. See that file's own
# header for why a genuinely blocking assertion here would be wrong under this
# job's fail-closed contract.
#
# CREDENTIALS
#   No repository secret is consumed. All 16 of verify-env.sh's REQUIRED_VARS are
#   generated per-run for a stack that lives ~40 minutes and is then destroyed. They must
#   be genuinely random: verify-env.sh rejects the weak deny-list and any CHANGE_ME*
#   value, so placeholders would fail the preflight rather than silently weaken the run.

name: E2E Nightly (full stack)

on:
  schedule:
    # 02:00 UTC daily. Deliberately not on push/pull_request — see the header.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A scheduled run and a manual dispatch must not fight over the same docker daemon.
  group: e2e-nightly
  cancel-in-progress: false

env:
  COMPOSE_FILE: docker-compose.full-stack.yml
  # Every compose service EXCEPT ollama / ollama-init (see header). Explicit rather than
  # implicit so adding a service to compose is a deliberate decision here too.
  SERVICES: >-
    postgres keycloak-realm-render keycloak redis rabbitmq
    core-java edge-go frontend mcp-server minio minio-init mailhog

jobs:
  full-suite:
    # Job-level, because the workflow default above is `contents: read` and the
    # escalation-on-failure step below files an issue. Declared here rather than
    # widening the workflow default, so only this job can write.
    permissions:
      contents: read
      issues: write
    name: Full Playwright suite against a real stack
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The stack builds four images and pulls eight. A stock runner has ~14 GB free,
      # and a mid-build ENOSPC surfaces as an unrelated-looking compose error.
      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "after:"; df -h / | tail -1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Start from the committed example so every NON-secret key (ports, hostnames,
      # feature flags) stays in sync with the repo, then append generated values for the
      # credentials. Both consumers take the LAST occurrence — docker compose by dotenv
      # semantics, verify-env.sh because it `set -a; . "$ENV_FILE"` (shell sourcing) —
      # so appending is a genuine override, not a duplicate-key hazard.
      - name: Generate an ephemeral .env
        run: |
          set -euo pipefail
          cp .env.example .env

          # NOT EVERY CREDENTIAL IS INDEPENDENT. Some of these name the SAME
          # Postgres role from two different services, and giving those a
          # separate random value each guarantees an authentication failure:
          #
          #   POSTGRES_USER=jtoye and KC_DB_USERNAME=jtoye are one role. Postgres
          #   initialises it with POSTGRES_PASSWORD; Keycloak then connects with
          #   KC_DB_PASSWORD. Generated independently they can never match, and
          #   the stack died at `FATAL: password authentication failed for user
          #   "jtoye"` on every scheduled run this workflow ever had.
          #
          # So generate the INDEPENDENT credentials in the loop, then derive the
          # paired ones. scripts/verify-env.sh now asserts the pairing, so a
          # future edit that re-adds KC_DB_PASSWORD to the loop fails preflight
          # instead of failing 4 minutes into the stack build.
          # The list of credentials to manufacture is READ from verify-env.sh, not
          # copied here. A copy is exactly what broke: PR #510 added two variables
          # to that script's REQUIRED_VARS and not to this loop, so the next run
          # would have failed preflight on CHANGE_ME values inherited from
          # .env.example. One list, one source of truth.
          # DB_MIGRATION_USER / DB_MIGRATION_PASSWORD are DERIVED, not generated (SEC-04 / #552,
          # D-01). DB_MIGRATION_USER is a role NAME — the owner/migrator jtoye_app that Flyway
          # migrates AS — and randomising a name points Flyway at a role that does not exist, so
          # every migration fails auth (the same class of break KC_DB_PASSWORD was added here for).
          # DB_MIGRATION_PASSWORD must equal DB_PASSWORD: on a fresh volume
          # infra/db/init/00-create-db.sql creates jtoye_app AND jtoye_runtime BOTH with DB_PASSWORD,
          # the app connects as DB_USER=jtoye_runtime and Flyway as jtoye_app, so the migrator's
          # password is DB_PASSWORD. DB_USER itself is NOT in REQUIRED_VARS, so it is never in this
          # loop and keeps .env.example's jtoye_runtime.
          DERIVED="KC_DB_PASSWORD POSTGRES_EXPORTER_PASSWORD RABBITMQ_PASSWORD KC_SEED_USER_PASSWORD DB_MIGRATION_USER DB_MIGRATION_PASSWORD"
          required=$(bash scripts/verify-env.sh --list-required)
          [ -n "$required" ] || { echo "FATAL: verify-env.sh --list-required produced nothing" >&2; exit 1; }

          {
            echo ""
            echo "# --- generated by e2e-nightly.yml, ephemeral, destroyed with the runner ---"
            while read -r v; do
              [ -n "$v" ] || continue
              case " ${DERIVED} " in *" ${v} "*) continue ;; esac
              echo "${v}=ci$(openssl rand -hex 24)"
            done <<< "$required"
          } >> .env

          # Derived, not generated: these name the SAME Postgres role, so they
          # must carry the same password. Read the value back out of the file
          # just written so they cannot drift from the loop above. Both consumers
          # take the LAST occurrence, so appending is a genuine override.
          #   KC_DB_USERNAME              = jtoye  (= POSTGRES_USER)
          #   POSTGRES_EXPORTER_USER      unset    -> defaults to jtoye
          pg_pw=$(sed -n 's/^POSTGRES_PASSWORD=//p' .env | tail -n1)
          [ -n "$pg_pw" ] || { echo "FATAL: POSTGRES_PASSWORD not found in .env after generation" >&2; exit 1; }
          echo "KC_DB_PASSWORD=${pg_pw}" >> .env
          echo "POSTGRES_EXPORTER_PASSWORD=${pg_pw}" >> .env

          # The migrator role NAME must stay jtoye_app, and its password must equal the (generated)
          # DB_PASSWORD that 00-create-db.sql created jtoye_app with. Read DB_PASSWORD back out of the
          # file just written so the two cannot drift, exactly as KC_DB_PASSWORD mirrors POSTGRES_PASSWORD.
          db_pw=$(sed -n 's/^DB_PASSWORD=//p' .env | tail -n1)
          [ -n "$db_pw" ] || { echo "FATAL: DB_PASSWORD not found in .env after generation" >&2; exit 1; }
          echo "DB_MIGRATION_USER=jtoye_app" >> .env
          echo "DB_MIGRATION_PASSWORD=${db_pw}" >> .env

          # Not only Postgres. RABBITMQ_DEFAULT_USER (what the broker is
          # provisioned with) and RABBITMQ_USER (what core-java presents) are
          # both 'jtoye', so their passwords must agree too. Independent values
          # give ACCESS_REFUSED *after* Tomcat has started, which reads as a
          # healthy container for a few seconds before the context aborts.
          mq_pw=$(sed -n 's/^RABBITMQ_DEFAULT_PASS=//p' .env | tail -n1)
          [ -n "$mq_pw" ] || { echo "FATAL: RABBITMQ_DEFAULT_PASS not found in .env after generation" >&2; exit 1; }
          echo "RABBITMQ_PASSWORD=${mq_pw}" >> .env

          # .env.example is written for a REAL deployment, so it points SMTP at
          # smtp.example.com:587. Copying it here overrides compose's own
          # `${SMTP_HOST:-mailhog}` / `${SMTP_PORT:-1025}` defaults, and core-java
          # then tries to reach a host that does not exist from inside a
          # container. MailHealthIndicator fails, /actuator/health goes DOWN, the
          # container healthcheck fails, and `depends_on: service_healthy` takes
          # the whole stack down with it.
          #
          # A developer .env does not hit this because it simply OMITS these keys
          # and lets compose's defaults apply — the working configuration here is
          # the absence of a value, which is exactly what copying an example file
          # destroys.
          {
            echo "SMTP_HOST=mailhog"
            echo "SMTP_PORT=1025"
            echo "SMTP_USERNAME="
            echo "SMTP_PASSWORD="
            echo "SMTP_AUTH=false"
            echo "SMTP_STARTTLS=false"
          } >> .env

          # KC_SEED_USER_PASSWORD is imported into the realm as a USER PASSWORD
          # (infra/keycloak/realm-export.template.json), so it must satisfy that
          # realm's own passwordPolicy:
          #   length(12) and upperCase(1) and lowerCase(1) and digits(1)
          #   and specialChars(1) and notUsername
          # `openssl rand -hex` emits [0-9a-f] ONLY — no upper case, no special
          # character — so the loop's value fails two of those rules and realm
          # import aborts with `invalidPasswordMinSpecialCharsMessage`, leaving
          # Keycloak unhealthy and the whole stack down. This was invisible until
          # the database credentials were fixed, because Keycloak previously died
          # at the JDBC step and never reached realm import.
          # The suffix supplies the two character classes hex cannot; the random
          # body still carries the entropy. verify-env.sh check (e) asserts the
          # result against the policy parsed from the realm file itself.
          seed_pw="Aa1!$(openssl rand -hex 24)"
          echo "KC_SEED_USER_PASSWORD=${seed_pw}" >> .env

          echo "appended $(wc -l < .env) total lines"

      # Credential half only: --with-stack probes a running stack, which does not exist
      # yet. Running it here means a malformed .env fails BEFORE a 20-minute build.
      - name: Preflight the env contract
        run: bash scripts/verify-env.sh

      - name: Build and start the stack (no ollama)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          docker compose -f "$COMPOSE_FILE" up -d --build $SERVICES

      # Explicit polling rather than `--wait`: two of these services are one-shot
      # containers that exit 0 (keycloak-realm-render, minio-init), and a health probe
      # that cannot distinguish "exited cleanly" from "died" is not evidence. Poll the
      # things the SUITE actually needs, and dump logs on timeout rather than failing mute.
      - name: Wait for core-java and the frontend
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 600 ))
          up_core=0 up_front=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$up_core" -eq 0 ]; then
              status=$(curl -fsS http://localhost:9090/actuator/health 2>/dev/null | jq -r '.status // empty' || true)
              [ "$status" = "UP" ] && { up_core=1; echo "core-java UP after ${SECONDS}s"; }
            fi
            if [ "$up_front" -eq 0 ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/shop || true)
              [ "$code" = "200" ] && { up_front=1; echo "frontend 200 after ${SECONDS}s"; }
            fi
            [ "$up_core" -eq 1 ] && [ "$up_front" -eq 1 ] && exit 0
            sleep 5
          done
          echo "::error::stack did not become healthy within 600s (core=$up_core front=$up_front)"
          docker compose -f "$COMPOSE_FILE" ps
          docker compose -f "$COMPOSE_FILE" logs --tail 200
          exit 1

      # The OpenAPI contract, checked against the SERVICE rather than against the source
      # tree (33-06). This is the ONLY workflow in the repository with a running core-java,
      # which is why the gate is wired here and not in ci-cd.yaml: a hosted runner with no
      # stack could only ever exit 2 (VOID), and a permanently-VOID required job teaches
      # people to add `|| true`.
      #
      # It is not a duplicate of the openapi-compat job or of OpenApiSnapshotTest. Both of
      # those compare the committed snapshot with a spec generated from the SOURCE TREE, and
      # are green whether or not the deployed service was ever rebuilt from that source.
      # This asks the other half: does the thing actually listening on 9090 emit what
      # docs/api/openapi-snapshot.json claims. Placed BEFORE the Playwright install so a
      # contract failure costs seconds rather than the whole suite.
      #
      # Exit 2 is VOID (service unreachable, empty fetch, unparseable JSON), never a pass.
      - name: Gate — the committed OpenAPI contract vs the RUNNING service
        run: bash scripts/check-openapi-snapshot-fresh.sh

      # DemoDataSeeder (@Profile("dev"), ApplicationRunner) has already created the demo
      # tenant's shops/products/customers against the fresh DB. This adds only what the
      # suite would otherwise SKIP over: the DRAFT order and the in-window promotion.
      # Exit 2 is VOID (no container, no shop) — not a pass. `set -e` catches both.
      - name: Seed E2E fixtures
        run: bash scripts/seed-e2e-fixtures.sh

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The suite drives the compose frontend on :3000, not a runner-local `next start`.
      # E2E_VENDOR_PASSWORD mirrors KC_SEED_USER_PASSWORD because vendor-credentials.ts
      # reads either; passing it explicitly keeps the spec's fallback chain honest.
      #
      # `|| true` is deliberate and is NOT a swallowed failure: a suite with real test
      # failures must still produce a report for the skip-budget gate and the artifact
      # upload. The next step re-derives pass/fail FROM the report and exits non-zero.
      - name: Run the full Playwright suite
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          set -uo pipefail
          mkdir -p e2e-artifacts
          set -a; . ../.env; set +a
          export E2E_VENDOR_PASSWORD="${KC_SEED_USER_PASSWORD}"
          npx playwright test --reporter=json > e2e-artifacts/report.json || true

      # Prove the instrument before trusting it. A report that is absent, empty, or
      # contains ZERO results is the shape that makes a green summary meaningless — the
      # same class as the stale-XML read that once reported a pass over a failed compile.
      - name: Assert the report is real, then read the verdict from it
        working-directory: frontend
        run: |
          set -euo pipefail
          report=e2e-artifacts/report.json
          [ -s "$report" ] || { echo "::error::no Playwright report at $report — the suite produced nothing"; exit 1; }
          total=$(jq '[.. | objects | select(has("results")) | .results] | flatten | length' "$report")
          case "$total" in ''|*[!0-9]*) echo "::error::could not count tests in $report"; exit 1 ;; esac
          [ "$total" -gt 0 ] || { echo "::error::report contains ZERO test results — a run that executed nothing is not a pass"; exit 1; }

          passed=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.status == "passed")] | length' "$report")
          failed=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.status == "failed" or .status == "timedOut" or .status == "interrupted")] | length' "$report")
          skipped=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.status == "skipped")] | length' "$report")
          echo "total=$total passed=$passed failed=$failed skipped=$skipped"
          echo "### E2E nightly: $passed passed, $failed failed, $skipped skipped (of $total)" >> "$GITHUB_STEP_SUMMARY"

          [ "$failed" -eq 0 ] || { echo "::error::$failed E2E test(s) failed"; exit 1; }

      # S-1..S-4: total within budget, every skip declared, no stale ALLOW, and the
      # matcher self-tested in both directions. Exits 2 (VOID) on an absent or stale
      # report rather than passing.
      - name: Enforce the declared skip budget
        run: bash scripts/check-e2e-skip-budget.sh

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nightly-report
          path: |
            frontend/e2e-artifacts/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" ps
          docker compose -f "$COMPOSE_FILE" logs --tail 400

      # ESCALATION. Until this existed the nightly told nobody: its only failure
      # handling dumped logs INTO the failed run, visible to someone already looking.
      # Measured 2026-08-24: 14 consecutive scheduled failures, 2026-08-11 through
      # 2026-08-24, produced zero issues and zero notifications. Every merge in that
      # window — Phase 31 (#633, 18 plans) included — landed with no full-suite E2E
      # evidence on any tree, and the cause (a missing TRUNCATE grant, #647) was found
      # only because a human went looking at run history.
      #
      # Scheduled runs only. A workflow_dispatch is somebody watching the tab already,
      # and filing an issue under them is noise, not signal.
      - name: Escalate a failed nightly
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Nightly E2E is failing — the full-suite lane is dark"

          # De-duplicate on an EXACT title match, done in the shell rather than trusted
          # from `gh issue list --search`, which is substring-ish. stderr goes to its own
          # file and never into the value: gh can exit 0 while printing a warning, and
          # folding that text into `existing` would make it non-empty, select the
          # "refresh" branch, and run `gh issue comment "<warning text>"` — failing the
          # step under set -e and losing the report entirely.
          lrc=0
          errf="$(mktemp)"
          existing=$(gh issue list --state open --limit 100 \
                       --json number,title \
                       --jq ".[] | select(.title == \"${TITLE}\") | .number" 2>"${errf}") || lrc=$?
          if [ "${lrc}" -ne 0 ]; then
            echo "WARN: could not list open issues (rc=${lrc}); de-duplication DISABLED for this run." >&2
            cat "${errf}" >&2
            existing=""
          fi

          body_file="$(mktemp)"
          cat > "${body_file}" <<'EOF'
          The scheduled full-stack Playwright run failed. This lane is the project's
          **only** full-suite E2E instrument, so while it is red **no merge has
          full-suite evidence on any tree**.

          ### Triage, in order

          1. **Did the stack come up at all?** The common failure is that core-java
             never becomes healthy, so Playwright never runs and no `report.json` is
             produced. Check the `Wait for core-java and the frontend` step first — if
             it timed out, this is a stack problem, not a test problem.
          2. **Read the container logs in the `Dump stack logs on failure` step.** Note
             it runs `docker compose logs --tail 400`, so a crash-looping container's
             FIRST failure may be truncated out. If the tail looks like a clean
             shutdown, look for a repeating error earlier.
          3. **A fresh volume is not the developer's machine.** `Tear down` runs
             `down -v`, so every night starts from an empty database and only
             `infra/db/init/00-create-db.sql` has run. Anything requiring a manual
             provisioning step will work locally and fail here every single night —
             that was #647.
          4. **If Playwright DID run**, the failure is a real test regression: pull the
             uploaded report artifact and read the verdict from `report.json`.

          ### Do not

          Do not close this because a re-run went green without a code change — an
          intermittent nightly is still a lane you cannot trust. Close it when you know
          which change fixed it.

          EOF
          {
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
          } >> "${body_file}"

          if [ -n "${existing}" ]; then
            # Parameter expansion, not `head -n 1`: head exits after the first line, the
            # writer takes SIGPIPE, and pipefail promotes that to 141 — killing the step
            # under set -e instead of filing the comment.
            num="${existing%%$'\n'*}"
            gh issue comment "${num}" --body-file "${body_file}"
            echo "Refreshed existing issue #${num}."
          else
            gh issue create --title "${TITLE}" --body-file "${body_file}" \
              --label ci --label P1 || {
              echo "Label-qualified create failed; retrying without labels." >&2
              gh issue create --title "${TITLE}" --body-file "${body_file}"
            }
          fi

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v --remove-orphans
