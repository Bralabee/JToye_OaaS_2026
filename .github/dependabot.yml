# Dependabot configuration (v2) — supply-chain gate (#91).
# Weekly update PRs across every dependency surface in the repo. Minor + patch
# updates are grouped per ecosystem to avoid PR spam; majors still open singly
# so breaking bumps get individual review. open-pull-requests-limit caps churn.
# Manages GitHub-owned actions/* + github/codeql-action/* pins that the
# workflow deliberately leaves on @vN float.
version: 2
updates:
  # --- Java / Spring Boot (Gradle) ---
  #
  # There is deliberately only ONE gradle entry, scoped to /core-java.
  #
  # A second entry at `directory: "/"` used to sit here and produced an exact DUPLICATE
  # of every Gradle PR: dependabot's gradle scanner walks subprojects from the root, and
  # the root build.gradle.kts declares NO dependencies block of its own (only plugins and
  # allprojects/subprojects config). So both entries resolved the same coordinates in the
  # same file — core-java/build.gradle.kts — and opened two PRs for each bump.
  #
  # Measured on 2026-07-28: of 22 open dependabot PRs, four were pure duplicate pairs
  # (awssdk #235/#238, stripe-java #236/#240, Spring Boot #237/#242, springdoc #241/#246),
  # i.e. ~18% of the backlog was the same work proposed twice. Reviewing a duplicate costs
  # the same as reviewing a real one, and merging one silently strands its twin.
  #
  # If a future root-level Gradle dependency is ever declared, re-add the "/" entry AND
  # scope both with `exclude-paths` so they cannot overlap again.
  - package-ecosystem: "gradle"
    directory: "/core-java"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # --- Edge gateway (Go modules) ---
  - package-ecosystem: "gomod"
    directory: "/edge-go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # --- Frontend (npm) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # eslint 10 is BLOCKED UPSTREAM, not deferred by preference. Measured 2026-07-29
      # on PR #330 (eslint 9.39.4 -> 10.8.0):
      #
      #   TypeError: Error while loading rule 'react/display-name':
      #             contextOrFilename.getFilename is not a function
      #     at resolveBasedir (eslint-plugin-react/lib/util/version.js:31)
      #
      # eslint 10 removed `context.getFilename()`; eslint-plugin-react still calls it.
      # There is no version to bump TO:
      #   - eslint-plugin-react latest published  = 7.37.5 (what we resolve to)
      #   - its peer range                        = ^3 || ... || ^8 || ^9.7   <- no 10
      #   - its only dist-tag besides latest      = next -> 7.8.0-rc.0, an OLDER line
      #   - eslint-config-next@latest             = 16.2.12, peer eslint >=9.0.0,
      #                                             depends on eslint-plugin-react ^7.37.0
      # so the plugin arrives transitively and cannot be forward-bumped or overridden to
      # anything that supports eslint 10.
      #
      # The only way to make eslint 10 lint clean today is to drop the react/* ruleset,
      # which trades away working coverage for a version number. Not doing that.
      #
      # REMOVE THIS IGNORE when eslint-plugin-react publishes a release whose peer range
      # includes eslint 10. One command decides it:
      #     npm view eslint-plugin-react peerDependencies.eslint
      # If the output contains `^10`, delete this block and let the bump through.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # --- Container base images (Docker) ---
  #
  # ONE ENTRY PER DIRECTORY THAT CONTAINS A Dockerfile. There must be no gap:
  # scripts/check-image-supply-chain.sh derives the directory list from the git
  # index and fails when one is unlisted here. Measured 2026-08-03 (#276), before
  # that gate existed: the repo had five tracked Dockerfiles and three entries —
  # /mcp-server and /infra/backups had no base-image update path at all, and
  # nothing said so.
  #
  # WHAT THIS DOES AND DOES NOT COVER, because the difference is the whole of
  # #276. Dependabot's docker updater moves the TAG STRING (node:24 -> node:25).
  # It does NOT and cannot refresh the CONTENT of a floating tag — `node:24-alpine`
  # is republished upstream with new package versions under the same name, and
  # there is no version bump for Dependabot to propose. That content drift is what
  # flips the CI Trivy image gate red with no code change, and it is covered by a
  # different mechanism: .github/workflows/base-image-freshness.yml, which scans
  # the published images daily with the gate's exact flags.
  - package-ecosystem: "docker"
    directory: "/core-java"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/edge-go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # mcp-server is NOT in ci-cd.yaml's build-and-push matrix, so its image is
  # never Trivy-scanned by CI — which is precisely why it needs the update path.
  # Its runner stage is node:24-alpine and, unlike frontend/Dockerfile, it keeps
  # npm (it runs `npm ci --omit=dev`). Measured 2026-08-03 against the CI gate's
  # exact flags, `node:24-alpine` scores 6 findings (5 HIGH + 1 CRITICAL), every
  # one of them inside npm's own bundled dependency tree. Nothing in CI would
  # report that today.
  - package-ecosystem: "docker"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # infra/backups is postgres:15-bookworm (Debian, not Alpine) and holds the
  # backup job that #119 exists over. Same reasoning: an image with no update
  # path rots silently.
  - package-ecosystem: "docker"
    directory: "/infra/backups"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # --- GitHub Actions (pins the actions/* left on @vN float) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
