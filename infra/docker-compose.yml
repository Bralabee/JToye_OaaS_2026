# Infrastructure Docker Compose
# This file provides PostgreSQL, Keycloak and Azurite (the Azure Blob emulator) for local
# development — the HYBRID runtime driven by scripts/start-dev.sh, where core-java runs as a
# host process.
#
# NEVER run this file together with docker-compose.full-stack.yml. The two share container
# names (jtoye-postgres, jtoye-keycloak, jtoye-azurite) and host ports (5433, 8085, 10000),
# as scripts/start-dev.sh already states; the second one to start fails on the collision.
#
# SETUP REQUIRED:
# 1. Copy .env.example to .env in this directory
# 2. Update values if needed (defaults work for local dev)
# 3. Run: docker compose up -d      (Compose v2; the v1 `docker-compose` binary is not installed)
#
# See docs/guides/ENVIRONMENT_SETUP.md for detailed instructions

services:
  postgres:
    image: postgres:15
    container_name: jtoye-postgres
    environment:
      # Creates both 'jtoye' and 'keycloak' databases via init scripts
      POSTGRES_USER: ${DB_USER:-jtoye}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-jtoye}
    ports:
      # Loopback-only by default (#438) — same reasoning as the full-stack
      # compose. This file is the infra-only path used by scripts/start-dev.sh,
      # so leaving it on all interfaces would make the fix bypassable through
      # the documented start command.
      - "${JTOYE_BIND_HOST:-127.0.0.1}:5433:5432" # 5433 on host to avoid conflicts with an existing postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - jtoye-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jtoye}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak realm render (issue #80) — renders the gitignored realm-export.json
  # from the tracked realm-export.template.json using rotated secrets from .env,
  # so NO literal client secret / seed password is ever committed. Runs once,
  # exits 0; keycloak waits on service_completed_successfully.
  keycloak-realm-render:
    image: alpine:3.20
    container_name: jtoye-keycloak-realm-render
    environment:
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET must be set (renders realm core-api client)}
      EDGE_API_CLIENT_SECRET: ${EDGE_API_CLIENT_SECRET:?EDGE_API_CLIENT_SECRET must be set (renders realm edge-api client)}
      KC_SEED_USER_PASSWORD: ${KC_SEED_USER_PASSWORD:?KC_SEED_USER_PASSWORD must be set (renders realm seed-user password)}
      INTEGRATION_CATALOG_RO_SECRET: ${INTEGRATION_CATALOG_RO_SECRET:?INTEGRATION_CATALOG_RO_SECRET must be set (renders realm integration-catalog-ro client)}
      INTEGRATION_ORDERS_RW_SECRET: ${INTEGRATION_ORDERS_RW_SECRET:?INTEGRATION_ORDERS_RW_SECRET must be set (renders realm integration-orders-rw client)}
    volumes:
      - ./keycloak:/keycloak
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache gettext >/dev/null
        envsubst '$$KEYCLOAK_CLIENT_SECRET $$EDGE_API_CLIENT_SECRET $$KC_SEED_USER_PASSWORD $$INTEGRATION_CATALOG_RO_SECRET $$INTEGRATION_ORDERS_RW_SECRET' \
          < /keycloak/realm-export.template.json > /keycloak/realm-export.json
        echo "Rendered infra/keycloak/realm-export.json from template"
    networks:
      - jtoye-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: jtoye-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD must be set}
    ports:
      - "${JTOYE_BIND_HOST:-127.0.0.1}:8085:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Custom `jtoye` login theme — the imported realm sets loginTheme=jtoye, so without
      # this mount the theme name would dangle on this stack and Keycloak would fall back
      # to the built-in theme. Path is relative to infra/, this file's context.
      #
      # NOTE: that same imported realm also carries `smtpServer.host: "mailhog"`, and this
      # stack defines NO mailhog service — the value is inert here. Latent rather than
      # broken, because jtoye-dev has resetPasswordAllowed=false so nothing sends mail;
      # it becomes real if that flag is flipped or required-action mail is triggered.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - jtoye-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-realm-render:
        condition: service_completed_successfully

  # Azurite — the Azure Blob emulator for the hybrid runtime (Phase 36, D-08). Without it a
  # host-process core-java has no object store at all, and its fail-fast startup check (36-06)
  # would have to be switched off here. It stays ON in every runtime instead: core-java's
  # default connection string (UseDevelopmentStorage=true) targets 127.0.0.1:10000, which this
  # service publishes, and scripts/start-dev.sh exports STORAGE_CREATE_CONTAINERS=true so the
  # host process creates jtoye-images (access level blob, #626) and the private
  # jtoye-quarantine on a fresh volume.
  #
  # The image line is IDENTICAL to docker-compose.full-stack.yml's, character for character:
  # infra/dependency-horizons.yaml declares both as sites of the one `azurite` pin, and the
  # horizons gate fails if either drifts. The flags are explained on that file's service.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:${AZURITE_IMAGE_TAG:-3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5}
    container_name: jtoye-azurite
    restart: unless-stopped
    command: >-
      azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
      --disableProductStyleUrl --skipApiVersionCheck --disableTelemetry
    ports:
      # Loopback-only by default (#438/#441), like the other services in this file. The
      # host-process core-java AND the browser both reach the emulator here.
      - "${JTOYE_BIND_HOST:-127.0.0.1}:10000:10000"
    volumes:
      - azuritedata:/data
    healthcheck:
      # node is in the image, curl is not. Any HTTP status (an unauthenticated LIST is
      # refused with one) exits 0; a connection error exits 1.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:10000/devstoreaccount1?comp=list', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jtoye-net

networks:
  jtoye-net:
    driver: bridge

volumes:
  pgdata:
  azuritedata:
