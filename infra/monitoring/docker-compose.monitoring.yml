# Monitoring Stack for JToye OaaS
# Includes Prometheus, Grafana, and metrics exporters
# Usage: docker-compose -f docker-compose.monitoring.yml up -d
#
# PUBLISHED-PORT BIND ADDRESS (issue #439)
# ----------------------------------------
# All ports below are published on ${JTOYE_BIND_HOST}, default 127.0.0.1. They
# previously carried no bind address, which Docker expands to 0.0.0.0.
#
# GRAFANA ADMIN CREDENTIAL. The variable indirection below is not new and was
# never the defect — GF_SECURITY_ADMIN_PASSWORD has always been injected from
# the environment, with no literal in this file. What went wrong is that the
# INJECTED VALUE was itself the factory default, so a config-level reading of
# this file ("the credential is injected, therefore it is not the default") was
# true and useless at the same time. That is why the check for this lives in
# scripts/check-infra-exposure.sh (assertion C) and interrogates the RUNNING
# instance, rather than asserting anything about these lines.
#
# Two follow-ons close the loop:
#   - scripts/verify-env.sh now covers GRAFANA_ADMIN_PASSWORD and rejects
#     product-default and short values, so start-dev.sh refuses to boot on one;
#   - Grafana only applies GF_SECURITY_ADMIN_PASSWORD when it first CREATES the
#     admin user. On a volume that already has one, editing .env changes
#     nothing — the password must be reset against the running instance
#     (grafana cli admin reset-admin-password) or the volume recreated. A
#     config-only "fix" here would have looked complete and changed no
#     behaviour whatsoever.
#
# When the k8s monitoring manifests land (DPLY-03) they should take the
# credential the same way, so this is fixed once rather than twice.

services:
  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: jtoye-prometheus
    # Shell wrapper renders prometheus.yml.tmpl -> prometheus.yml at start, because
    # Prometheus has no native env-var substitution in scrape configs. Same idiom as
    # alertmanager below. The flags stay in `command:` and the entrypoint forwards
    # them via "$@", so they remain visible and editable here.
    entrypoint:
      - /bin/sh
      - /etc/prometheus/entrypoint.sh
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    environment:
      # The core-java actuator port differs by runtime: 9091 in prod/k8s (separate
      # management port) vs the app port in dev/compose. This Prometheus serves the
      # compose runtime, hence the 9090 default. See prometheus/entrypoint.sh.
      - CORE_JAVA_METRICS_PORT=${CORE_JAVA_METRICS_PORT:-9090}
    volumes:
      # Only the template and the wrapper are mounted. The rendered prometheus.yml is
      # written into the container's own /etc/prometheus, which is writable by the
      # image's `nobody` user — mounting the rendered path would shadow it read-only.
      - ./prometheus/prometheus.yml.tmpl:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${JTOYE_BIND_HOST:-127.0.0.1}:9091:9090"
    networks:
      - monitoring
      - jtoye-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:10.2.2
    container_name: jtoye-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Host port is env-tunable (GRAFANA_PORT): cohabiting stacks on this
      # machine may already hold 3001.
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-3001}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${JTOYE_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Alertmanager - Alert routing (phase 9)
  # Config is rendered from alertmanager.yml.tmpl by entrypoint.sh at container start,
  # because Alertmanager has no native env-var substitution (see RESEARCH Pitfall 1).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: jtoye-alertmanager
    entrypoint:
      - /bin/sh
      - /etc/alertmanager/entrypoint.sh
    environment:
      # Defaults target Mailhog on jtoye-network (docker-compose.full-stack.yml).
      # Override for prod SMTP by setting these in .env or deploy manifests.
      - ALERTMANAGER_SMTP_SMARTHOST=${ALERTMANAGER_SMTP_SMARTHOST:-mailhog:1025}
      - ALERTMANAGER_SMTP_FROM=${ALERTMANAGER_SMTP_FROM:-alerts@jtoye.local}
      - ALERTMANAGER_SMTP_TO=${ALERTMANAGER_SMTP_TO:-ops@jtoye.local}
      - ALERTMANAGER_SMTP_REQUIRE_TLS=${ALERTMANAGER_SMTP_REQUIRE_TLS:-false}
      # Slack (phase 27, additive — email remains the default route). WITHOUT
      # THESE TWO LINES the template and entrypoint changes are completely
      # INERT: verified before the fix, the container received only the four
      # ALERTMANAGER_SMTP_* vars, so a fully-configured .env reached nothing.
      # A placeholder-shaped URL is treated as unset by entrypoint.sh.
      - ALERTMANAGER_SLACK_WEBHOOK_URL=${ALERTMANAGER_SLACK_WEBHOOK_URL:-}
      - ALERTMANAGER_SLACK_CHANNEL=${ALERTMANAGER_SLACK_CHANNEL:-}
      # Environment-scoped NOTIFICATION mute — comma-separated alertnames, empty
      # by default so this compose file is loud out of the box. It exists because
      # NoOrdersCreated fires ~30 min after the last order and a quiet local stack
      # therefore pages forever; the alert is correct and WANTED in production.
      # Muting withholds the notification only — the rule still evaluates and the
      # alert still shows as firing in Prometheus and the Alertmanager UI.
      # This line is what makes the entrypoint's mute reachable at all: without it
      # a fully-configured .env reaches nothing (see the Slack note directly above,
      # which records that exact failure happening once already).
      # Enforced local-only by scripts/check-alert-mute.sh (assertion M-5).
      - ALERTMANAGER_MUTE_ALERTNAMES=${ALERTMANAGER_MUTE_ALERTNAMES:-}
    volumes:
      - ./alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${JTOYE_BIND_HOST:-127.0.0.1}:9093:9093"
    networks:
      - monitoring
      - jtoye-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis Exporter - Cache metrics (referenced by prometheus.yml redis scrape job)
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: jtoye-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    ports:
      - "${JTOYE_BIND_HOST:-127.0.0.1}:9121:9121"
    networks:
      - monitoring
      - jtoye-network
    depends_on:
      - prometheus
    # No container healthcheck: the redis_exporter image is scratch-based
    # (no shell/wget), so an exec-style check can never pass and the container
    # showed permanently "unhealthy" while working fine. Prometheus's redis
    # scrape job is the real health signal for this exporter.
    restart: unless-stopped

  # PostgreSQL Exporter - Database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: jtoye-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_EXPORTER_USER:-jtoye}:${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-jtoye}?sslmode=${POSTGRES_EXPORTER_SSLMODE:-require}"
    ports:
      - "${JTOYE_BIND_HOST:-127.0.0.1}:9187:9187"
    networks:
      - monitoring
      - jtoye-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
  jtoye-network:
    external: true
    # Compose auto-prefixes network names with the project dir. The full-stack
    # compose's `jtoye-network` is created as `jtoye_oaas_2026_jtoye-network`.
    # Point the external reference at the actual name so this file can run
    # standalone against an already-up full stack.
    name: jtoye_oaas_2026_jtoye-network

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
