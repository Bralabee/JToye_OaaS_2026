# J'Toye overrides of Keycloak's English login messages (SW-JRD-04).
#
# Only these keys change; every other message falls through to the parent
# theme's messages_en.properties. Keycloak reads these as MessageFormat
# patterns, so a single quote must be written as two; the text below avoids
# apostrophes instead.
#
# An email-verification link opened a second time (or already consumed by a
# mail scanner or a closed tab) lands on Keycloak's info page with no auth
# session, and the stock text only says the address is verified. Say what to
# do next: sign in, or set a password through "Forgot password?" when the
# account was never given one.
emailVerifiedAlreadyMessage=Your email address is already verified. You can sign in now. If you have not set a password yet, choose "Forgot password?" on the sign-in page.
staleEmailVerificationLink=This verification link has already been used, so your email address is probably verified. Sign in, or choose "Forgot password?" on the sign-in page to set a password.

# The password rules, shown on the register page BEFORE a failed submit (#848 / P2-GRA-16). They
# restate the realm's passwordPolicy (length(12) and upperCase(1) and lowerCase(1) and digits(1)
# and specialChars(1) and notUsername); scripts/check-keycloak-theme-ftl.sh fails when the length
# named here and the policy in the realm templates disagree, so a changed policy cannot leave this
# sentence telling people the old rule.
passwordPolicyHint=At least 12 characters, with an uppercase letter, a lowercase letter, a number and a special character. It cannot be the same as your email address.

# The register page's privacy line (SW-SAM-10). {0} is the app's /legal/privacy URL, built from the
# storefront client's baseUrl in register.ftl. Informational, not a consent claim.
registerPrivacyNotice=How we use your details is explained in our <a href="{0}">privacy notice</a>.
