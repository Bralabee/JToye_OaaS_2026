# Dependency support-horizon manifest — J'Toye OaaS
#
# One row per distinct pinned artifact in this repo. Enforced by
# scripts/check-dependency-horizons.sh (phase 27, plan 27-00, Task 5).
#
# WHY THIS FILE EXISTS
#
#   The original brief named ONE end-of-life dependency. Building the mechanism found SIX
#   (measured 2026-07-27 against endoflife.date, baseline B-4):
#
#     rabbitmq/3.12      EOL 2024-02-21   2y5m past
#     prometheus/2.48    EOL 2023-12-28   2y7m past
#     grafana/10.2       EOL 2024-07-24   2y   past
#     keycloak/24.0      EOL 2024-06-10   2y1m past
#     nodejs/20          EOL 2026-04-30   3m   past
#     alpine-linux/3.20  EOL 2026-04-01   4m   past
#
#   That difference — one believed, six measured — is the argument for the mechanism. A
#   horizon that lives in someone's memory is not a horizon.
#
# ON `eol_slug`: IT IS MEASURED, NEVER DERIVED FROM THE IMAGE NAME
#
#   This is the single trap this schema exists to close. The image name is NOT the API slug.
#   Measured with `curl -o /dev/null -w '%{http_code} %{redirect_url}'` on 2026-07-27:
#
#     node      -> 301 -> nodejs           alpine   -> 301 -> alpine-linux
#     postgres  -> 301 -> postgresql       golang   -> (image name; slug is `go`)
#     minio 404 · minio/mc 404 · ollama 404 · mailhog 404 · alertmanager 404
#     redis-exporter 404 · postgres-exporter 404 · scratch 404
#     java 404 · openjdk 404  (the Java horizon is tracked via `eclipse-temurin`, the
#                              distribution this repo actually builds on)
#
#   A gate built on the naive image name either silently follows a redirect it never
#   recorded, or reads a 404 body as "no EOL data" and passes. Both are how a check earns
#   a `|| true`. Every slug below returns 200 DIRECTLY, with no redirect.
#
# ON `eol_cycle` vs `resolved_cycle`: FLOATING TAGS ARE RESOLVED WITH EVIDENCE
#
#   `redis:7-alpine` has no cycle "7" in the catalogue (cycles are 8.8 … 7.4, 7.2, 7.0 …).
#   `gradle-8.10.2` has no cycle "8.10" — that catalogue is major-only (9, 8, 7 …).
#   Guessing either would make the gate VOID forever. Both carry a `resolved_cycle` with the
#   evidence that produced it.
#
# ON `owner`: THERE IS NO PLATFORM-OPERATOR IDENTITY IN THIS SYSTEM
#
#   Same recorded architectural fact as docs/ops/terminal-states.yaml. All admin here is
#   tenant-scoped; there is no cross-tenant operator role and no ops rota. Writing
#   `owner: platform` (as 27-00-PLAN.md's schema example shows) would be fabrication.
#   `maintainer` is used wherever the maintainer can actually act. `UNASSIGNED` appears on
#   exactly one row, and only because that row's whole point is that nobody owns it — and
#   the gate requires a dated `manual_review` before it will accept UNASSIGNED at all.
#
# ON `kind`: FIVE VALUES, ONE MORE THAN THE PLAN NAMED
#
#   27-00-PLAN.md Task 5(a) declares `image | toolchain | first_party | out_of_repo`.
#   `edge-go/Dockerfile:30` is `FROM scratch`, which H-1 discovery extracts and which
#   therefore needs a row. But `scratch` is not a dependency: it is Docker's reserved empty
#   build stage — the ABSENCE of a base image. It has no upstream, so it cannot age, and
#   filing it as an UNKNOWN awaiting `manual_review` would schedule a human to re-check a
#   fact that cannot change. `kind: pseudo` is added for it, exempt from EOL lookup by rule
#   (like first_party) but still subject to every other rule. The width of that exemption is
#   asserted, not assumed — see the gate header.
#
# EXEMPTIONS
#
#   Six rows are past horizon today. Each carries a non-empty reason, a dated `expires`, and
#   a `tracked_by`. An expired exemption is a FAIL, and an exemption on a row that is NOT
#   past horizon is a FAIL (STALE) — so this file cannot silently become a permanent
#   allowlist in either direction.
#
# WHEN CI GOES AMBER AND RED WITH NO CODE CHANGE — INTENDED, STATED IN ADVANCE
#
#   rabbitmq 4.3 (the only viable upgrade target) carries a vendor community-support horizon
#   of 2026-11-30. With HORIZON_WARN_DAYS=90 this manifest turns the `ops-contracts` job
#   AMBER on ~2026-09-01 and RED on 2026-12-01 with no commit in between. That is the
#   mechanism working, not an outage. Do not diagnose it as a broken gate.

version: 1

dependencies:

  # ------------------------------------------------------------------ runtime images
  - id: postgres
    pin: "postgres:15-alpine"
    sites: ["docker-compose.full-stack.yml:14"]
    kind: image
    owner: maintainer
    eol_slug: postgresql
    eol_cycle: "15"
    eol_date: "2027-11-11"

  - id: alpine
    pin: "alpine:3.20"
    sites: ["docker-compose.full-stack.yml:48"]
    kind: image
    owner: maintainer
    eol_slug: alpine-linux
    eol_cycle: "3.20"
    eol_date: "2026-04-01"
    exemption:
      reason: >-
        Alpine 3.20 went EOL 2026-04-01. This pin is the seed/init helper in the dev compose
        stack only — it is not a build base and ships in nothing. 3.22 is current. Deferred
        because the upgrade is trivial but untested against the seed scripts, and doing it
        blind during an ops-spine phase would risk the local stack every other 27-xx plan
        measures against.
      expires: "2026-11-30"
      tracked_by: "DEFERRED-27"

  - id: keycloak
    pin: "quay.io/keycloak/keycloak:24.0.5"
    sites: ["docker-compose.full-stack.yml:81"]
    kind: image
    owner: maintainer
    eol_slug: keycloak
    eol_cycle: "24.0"
    eol_date: "2024-06-10"
    exemption:
      reason: >-
        Keycloak 24.0 went EOL 2024-06-10 (777 days past). Upgrading is NOT a tag bump: KC 25+
        changes the admin API and the user-profile handling this repo already has a recorded
        trap for (unmanaged tenant_id attributes are stripped on admin-API user creation), the
        realm import path is Postgres-backed, and JWT issuer/JWKS split-horizon has caused a
        total live-auth outage here before. It needs its own plan with a live auth rehearsal,
        not a line in an ops-spine phase.
      expires: "2026-12-31"
      tracked_by: "DEFERRED-27"

  - id: redis
    pin: "redis:7-alpine"
    sites: ["docker-compose.full-stack.yml:126"]
    kind: image
    owner: maintainer
    eol_slug: redis
    eol_cycle: "7.4"
    resolved_cycle: "7.4"
    resolved_evidence: >-
      The tag is the floating `7-alpine`; the catalogue has no cycle "7" (cycles are
      8.8, 8.6, 8.4, 8.2, 8.0, 7.4, 7.2, 7.0, 6.2, 6.0, 5.0). Resolved by reading the
      RUNNING container: `docker exec jtoye-redis redis-server --version` reports v=7.4.8,
      so 7.4 is the deployed series. Catalogue `eol: false` for 7.4.
    eol_date: "2029-12-01"

  - id: rabbitmq
    pin: "rabbitmq:4.3.4-management-alpine"
    sites: ["docker-compose.full-stack.yml:149"]
    kind: image
    owner: maintainer
    eol_slug: rabbitmq
    eol_cycle: "4.3"
    eol_date: "false"
    eol_source: vendor
    vendor_eol: "2026-11-30"
    vendor_source: "https://www.rabbitmq.com/release-information"
    note: >-
      UPGRADED BY 27-02 (2026-07-29): 3.12.14 -> 4.3.4, by FRESH INSTALL. There is no in-place
      3.12 -> 4.x path (the chain is 3.12 -> 3.13 -> 4.2 -> 4.3) and 4.3 has no Mnesia reader
      at all, so the volume was snapshotted, destroyed and recreated; the topology is code
      (RabbitAdmin re-declares from RabbitMQConfig), not data. Procedure and rollback:
      docs/runbooks/rabbitmq-broker-upgrade.md. 27-00's past-horizon exemption is REMOVED, not
      re-dated: H-4 fails an exemption on a row that is no longer past horizon, so leaving it
      would itself be a violation.

      VENDOR OVERRIDE, AND IT IS LOAD-BEARING — HANDED TO 27-00 (D-10 item 2 / D-H.5).
      `eol_date` here is the VENDOR date. The endoflife.date catalogue returns
      `"eol": false` and `"extendedSupport": true` for cycle 4.3 — verified live, on the exact
      pin this row adopts — while the vendor publishes community support ending 2026-11-30.
      Under a rule that treats catalogue-vs-vendor disagreement as always a NOTE, this gate
      stays green straight through 2026-11-30 with no code change: the gate reporting clean on
      a finding. The rule 27-00's gate must honour is narrower: both concrete dates -> NOTE
      (the old 3.12 case, 2024-02-21 vs 2024-02-29); catalogue `false`/`null`/boolean where the
      vendor publishes a DATE -> FAIL (exit 1), naming the row and both values.

      4.3's community window closes 2026-11-30, so at HORIZON_WARN_DAYS=90 this row goes AMBER
      ~2026-09-01 and RED on 2026-12-01 with no commit in between. Intended, and already stated
      in this file's header. It is a treadmill, and the mechanism is what makes it survivable.

  - id: minio
    pin: "minio/minio:${MINIO_IMAGE_TAG:-latest}"
    sites: ["docker-compose.full-stack.yml:407"]
    kind: image
    owner: maintainer
    eol_slug: null
    note: >-
      endoflife.date has no `minio` product (404, measured 2026-07-27), and the pin is a
      floating `:latest` behind an env override, so there is no cycle to resolve even if the
      product existed. Horizon is UNKNOWN by construction, not by omission.
    manual_review:
      last_checked: "2026-07-27"
      expires: "2027-01-27"
      url: "https://github.com/minio/minio/releases"

  - id: minio-mc
    pin: "minio/mc:${MINIO_MC_IMAGE_TAG:-latest}"
    sites: ["docker-compose.full-stack.yml:429"]
    kind: image
    owner: maintainer
    eol_slug: null
    note: >-
      Same 404 + floating-tag position as `minio`. Separate row because it is a separate
      pinned artifact with its own env override.
    manual_review:
      last_checked: "2026-07-27"
      expires: "2027-01-27"
      url: "https://github.com/minio/mc/releases"

  - id: ollama
    pin: "ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}"
    sites:
      - "docker-compose.full-stack.yml:449"
      - "docker-compose.full-stack.yml:510"
    kind: image
    owner: maintainer
    eol_slug: null
    note: >-
      endoflife.date 404 (measured 2026-07-27), floating `:latest`. Pinned at TWO sites —
      the model-puller and the server — and H-5 asserts the pin at both, so bumping one and
      not the other is a drift failure rather than an invisible skew.
    manual_review:
      last_checked: "2026-07-27"
      expires: "2027-01-27"
      url: "https://github.com/ollama/ollama/releases"

  - id: mailhog
    pin: "mailhog/mailhog:v1.0.1"
    sites: ["docker-compose.full-stack.yml:526"]
    kind: image
    owner: maintainer
    eol_slug: null
    note: >-
      endoflife.date 404 (measured 2026-07-27). MailHog is archived upstream and receives no
      releases; the horizon is not "unknown pending a check" so much as "there will never be
      another version". Dev-only SMTP sink, never deployed to staging or production.
    manual_review:
      last_checked: "2026-07-27"
      expires: "2027-01-27"
      url: "https://github.com/mailhog/MailHog"

  # ------------------------------------------------------------------ monitoring images
  #  27-02's draft manifest omitted this entire block. 27-02 now consumes THIS file (D-B),
  #  so the omission is closed here rather than inherited.
  - id: prometheus
    pin: "prom/prometheus:v2.48.0"
    sites: ["infra/monitoring/docker-compose.monitoring.yml:8"]
    kind: image
    owner: maintainer
    eol_slug: prometheus
    eol_cycle: "2.48"
    eol_date: "2023-12-28"
    exemption:
