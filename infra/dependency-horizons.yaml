  - id: mailhog
    pin: "mailhog/mailhog:v1.0.1"
    # TWO SITES since plan 29-09 (D-13), and the compose line is corrected in the same
    # edit (it read :526; the pin is at :702, which had been producing an advisory NOTE
    # on every run). Same discipline as the `prometheus` row below: H-5 asserts the
    # declared pin at EVERY declared site, so a bump that moved one and not the other is
    # a drift failure rather than an invisible skew between dev and staging.
    sites:
      - "docker-compose.full-stack.yml:702"
      - "k8s/staging/mailhog.yaml:108"
    kind: image
    owner: maintainer
    eol_slug: null
    note: >-
      endoflife.date 404 (measured 2026-07-27). MailHog is archived upstream and receives no
      releases; the horizon is not "unknown pending a check" so much as "there will never be
      another version".

      THE LAST SENTENCE OF THIS NOTE USED TO READ "Dev-only SMTP sink, never deployed to
      staging or production." That was true when written and is FALSE from 2026-08-11: D-13
      deploys this image to STAGING as the application-email capture sink
      (k8s/staging/mailhog.yaml). It remains absent from production BY DESIGN — an
      application-email black hole there would silently swallow real vendor mail — and that
      absence is asserted two-directionally in the render rather than merely intended.

      COVERAGE IS ONE-DIRECTIONAL FOR THE NEW SITE, AND SAYING SO IS THE POINT. H-1 discovery
      scans the compose files and `k8s/base` only (this gate's `K8S_GLOB_DIR`), never the
      overlays, so the staging pin is invisible to coverage and visible only to H-5 drift via
      the site declared above. Deleting that site line would therefore make the staging pin
      unwatched by BOTH rules at once, which is precisely how a row goes on describing a tree
      it no longer covers.
    manual_review:
      last_checked: "2026-07-27"
      expires: "2027-01-27"
      url: "https://github.com/mailhog/MailHog"

