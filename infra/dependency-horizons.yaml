  - id: golang
    pin: "golang:1.26-alpine"
    sites: ["edge-go/Dockerfile:10"]
    kind: image
    owner: maintainer
    eol_slug: go
    eol_cycle: "1.26"
    eol_date: "false"
    note: >-
      Catalogue `eol: false`. Go's real policy is support until two newer majors ship. 1.26
      released 2026-02-10 and 1.27 has not shipped, so 1.26 loses support when 1.28 does.
      That is a horizon without a date, so no `vendor_eol` is recorded — inventing one would
      be the same fabrication this file exists to prevent.

  - id: node
    pin: "node:20-alpine"
    sites:
      - "frontend/Dockerfile:5"
      - "frontend/Dockerfile:129"
      - "mcp-server/Dockerfile:7"
      - "mcp-server/Dockerfile:21"
    kind: image
    owner: maintainer
    eol_slug: nodejs
    eol_cycle: "20"
    eol_date: "2026-04-30"
    exemption:
      reason: >-
        Node 20 went EOL 2026-04-30 — the most recent of the six breaches, and the one with
        the largest blast radius: this pin is the build AND runtime base for BOTH the frontend
        (Next.js 16 / React 19) and the mcp-server, across four sites. Node 22 is the LTS
        successor. Deferred because the move must be made with the frontend typecheck gate and
