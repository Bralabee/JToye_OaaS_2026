  - id: gradle
    pin: "gradle-8.10.2-bin.zip"
    sites: ["gradle/wrapper/gradle-wrapper.properties:3"]
    kind: toolchain
    owner: maintainer
    eol_slug: gradle
    eol_cycle: "8"
