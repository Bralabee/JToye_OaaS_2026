      expires: "2026-11-30"
      tracked_by: "DEFERRED-27"

  - id: scratch
    pin: "scratch"
    sites: ["edge-go/Dockerfile:33"]
    kind: pseudo
    owner: maintainer
    eol_slug: null
    note: >-
      Docker's reserved empty build stage — the absence of a base image, not a dependency.
      No upstream, no releases, nothing to age; endoflife.date 404 as expected. Exempt from
      EOL lookup by rule (`kind: pseudo`), and from nothing else: it still requires a pin, an
      owner and a site, and H-5 still asserts `FROM scratch` is really at that line.

  # ------------------------------------------------------------------ toolchains
  - id: go-toolchain
    pin: "go 1.26.0"
    sites: ["edge-go/go.mod:3"]
    kind: toolchain
    owner: maintainer
    eol_slug: go
    eol_cycle: "1.26"
    eol_date: "false"
    note: >-
      Distinct from the `golang` image row: go.mod's directive sets the LANGUAGE version the
      module compiles against, the image sets the compiler that builds it. They can drift
      apart, so they are two rows and H-5 checks both sites.

  - id: go-ci-setup
    pin: "go-version: '1.26'"
    sites: [".github/workflows/ci-cd.yaml:52", ".github/workflows/ci-cd.yaml:686"]
    kind: toolchain
    owner: maintainer
    eol_slug: go
    eol_cycle: "1.26"
    eol_date: "false"
    note: >-
      THE THIRD GO PIN, and until 2026-07-30 the only one no gate watched. edge-go/Dockerfile
      declares the lockstep invariant in a comment — image, go.mod directive, and the CI
      setup-go pins must match — but only the first two had horizon rows, so the CI pin could
      silently stay a major behind and every gate stayed green while CI compiled and tested on
      a different Go than production ships. Proven by break arm on 2026-07-30: with both
      go-version pins reverted to '1.25' and everything else at 1.26,
      check-dependency-horizons.sh exited 0. It exits 2 now.
      TWO sites deliberately: the test job at :52 and the build job at :667. A single-site row
      would leave the other free to drift, which is the same defect one level down.

  - id: java-toolchain
    pin: "JavaLanguageVersion.of(21)"
    sites: ["core-java/build.gradle.kts:9"]
    kind: toolchain
    owner: maintainer
    eol_slug: eclipse-temurin
    eol_cycle: "21"
