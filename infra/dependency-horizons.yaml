  # ------------------------------------------------------------------ out of repo
  #  The shape 27-02 hands back (D-Q). Seeded EMPTY here so 27-02 only fills it in.
  #  `pin: unknown` + `manual_review` is the honest state, not a placeholder for forgotten
  #  work — and the gate PRINTS it on every run so it cannot become invisible.
  - id: rabbitmq-k8s
    pin: unknown
    sites: []
    kind: out_of_repo
    owner: UNASSIGNED
    eol_slug: null
    note: >-
      The staging/production broker is not deployed from this repo. MEASURED 2026-07-26 and
      re-verified 2026-10-16 (39-01): `rg -uu -n 'image:.*rabbitmq' k8s/` returns NOTHING —
      the only rabbitmq strings under k8s/ are the configmap host/port (`k8s/base/configmap.yaml`
      and `k8s/local/configmap-patch.yaml`, which routes local minikube pods to the host Compose
      broker via `host.minikube.internal`) and the `rabbitmq-credentials` Secret refs. Its
      staging/production version is therefore unresolvable from this repo by construction, which
      is why this row is UNASSIGNED: there is no platform-operator identity here to assign it to,
      and saying so is more useful than inventing a name. Re-checked 2026-10-16 against
      https://www.rabbitmq.com/release-information: 4.3.6 (released 16 Sept 2026) is the newest
      upstream release (no 4.4 series published yet), and the vendor extended 4.3 End of
      Community Support to 31 Jan 2027 (2027-01-31). ADR-0002 was ACCEPTED on 2026-08-10 (recorded on
      main 2026-10-18), choosing the in-cluster RabbitMQ cluster operator. The route is decided; this
      row closes when Phase 29 ships that manifest with a declared broker pin, not before. See ADR-0002
      and docs/runbooks/rabbitmq-broker-upgrade.md.
    manual_review:
      last_checked: "2026-10-16"
      expires: "2027-01-16"
      url: "https://www.rabbitmq.com/release-information"
