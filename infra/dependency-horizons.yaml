      expires: "2026-12-31"
      tracked_by: "DEFERRED-27"

  - id: grafana
    pin: "grafana/grafana:10.2.2"
    sites: ["infra/monitoring/docker-compose.monitoring.yml:50"]
    kind: image
    owner: maintainer
    eol_slug: grafana
    eol_cycle: "10.2"
    eol_date: "2024-07-24"
    exemption:
      reason: >-
        Grafana 10.2 went EOL 2024-07-24 (733 days past). Dev-stack visualisation only — it
        is not on the request path and holds no tenant data; the dashboards it renders are
        provisioned from files in this repo, so the blast radius of a bad upgrade is the
        dashboards, not the platform. Deferred with prometheus so the monitoring stack moves
