  # ------------------------------------------------------------------ out of repo
  #  The shape 27-02 hands back (D-Q). Seeded EMPTY here so 27-02 only fills it in.
  #  `pin: unknown` + `manual_review` is the honest state, not a placeholder for forgotten
  #  work — and the gate PRINTS it on every run so it cannot become invisible.
  - id: rabbitmq-k8s
    pin: unknown
    sites: []
    kind: out_of_repo
    owner: UNASSIGNED
    eol_slug: null
    note: >-
      The staging/production broker is not deployed from this repo. MEASURED 2026-07-26:
      `grep -rn 'image:.*rabbitmq' k8s/` returns NOTHING — the only rabbitmq strings under
      k8s/ are the configmap host/port and the `rabbitmq-credentials` Secret refs. Its
      version is therefore unresolvable from this repo by construction, which is why this row
      is UNASSIGNED: there is no platform-operator identity here to assign it to, and saying
      so is more useful than inventing a name. See ADR-0002 and
      docs/runbooks/rabbitmq-broker-upgrade.md.
    manual_review:
      last_checked: "2026-07-26"
      expires: "2026-10-26"
      url: "https://www.rabbitmq.com/release-information"
