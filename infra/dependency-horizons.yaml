  - id: rabbitmq
    pin: "rabbitmq:4.3.6-management-alpine"
    sites: ["docker-compose.full-stack.yml:224"]
    kind: image
    owner: maintainer
    eol_slug: rabbitmq
    eol_cycle: "4.3"
    eol_date: "false"
    eol_source: vendor
    vendor_eol: "2027-01-31"
    vendor_source: "https://www.rabbitmq.com/release-information"
    note: >-
      UPGRADED BY 27-02 (2026-07-29): 3.12.14 -> 4.3.4, by FRESH INSTALL. PATCHED BY 39-02
      (2026-10-16): 4.3.4 -> 4.3.6 (the newest upstream release in the 4.3 series; no 4.4 series
      exists upstream yet). There is no in-place 3.12 -> 4.x path (the chain is 3.12 -> 3.13 ->
      4.2 -> 4.3) and 4.3 has no Mnesia reader at all, so the initial 3.12 -> 4.3 move was a
      fresh install; 4.3.4 -> 4.3.6 is an in-series Khepri patch. Procedure and rollback:
      docs/runbooks/rabbitmq-broker-upgrade.md.

      VENDOR OVERRIDE, AND IT IS LOAD-BEARING — HANDED TO 27-00 (D-10 item 2 / D-H.5).
      `eol_date` here is the VENDOR date. The endoflife.date catalogue returns
      `"eol": false` and `"extendedSupport": true` for cycle 4.3 — verified live, on the exact
      pin this row adopts — while the vendor publishes community support ending 2027-01-31
      (extended by upstream from the earlier 2026-11-30 estimate; re-verified 2026-10-16 against
      https://www.rabbitmq.com/release-information). Because 2027-01-31 is 107 days out (outside
      the 90-day HORIZON_WARN_DAYS window until ~2026-11-02), the #724 exemption is REMOVED here
      (H-4 fails a stale exemption on a row outside the warn window). When the row re-enters the
      90-day window around 2026-11-02, either upgrade to 4.4 if published by then or re-open a
      dated exemption under #724.

  - id: azurite
    pin: "mcr.microsoft.com/azure-storage/azurite:${AZURITE_IMAGE_TAG:-3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5}"
    sites: ["docker-compose.full-stack.yml:690", "infra/docker-compose.yml:110"]
    kind: image
    owner: maintainer
    eol_slug: null
    note: >-
      Phase 36 (36-02): the Azure Blob emulator that replaced the retired self-hosted object
      store in BOTH local runtimes (the canonical compose stack and the hybrid start-dev.sh
      stack, D-08) and in the nightly's SERVICES list. endoflife.date has no Azurite product, so
      the horizon is UNKNOWN by construction and this row passes only while its dated
      manual_review is unexpired.

      Azurite 3.37.0 = Blob service version 2026-06-06 = azure-storage-blob 12.35.1's default
      service version (both verified in 36-RESEARCH.md). The compose command also passes
      --skipApiVersionCheck, so an SDK bump does not require an emulator bump; the trade-off,
      accepted, is that a genuinely unsupported newer feature fails at runtime rather than at
      the version check. Re-check this row whenever azure-storage-blob moves a service version.

      The default is DIGEST-PINNED (tag@sha256) because the tag alone is mutable. TWO sites are
      declared, one per compose file, and both carry the identical string. H-1 discovers only
      docker-compose.full-stack.yml (infra/docker-compose.yml is not in its declared set), so the
      hybrid file's line is protected by H-5 alone: a divergent pin there removes this string
      from every non-comment line of that file, which is exit 2 (VOID), not a NOTE.
      Re-checked 2026-10-16 against https://github.com/Azure/Azurite/releases: latest release
      remains v3.37.0 (published 2026-08-26).
    manual_review:
      last_checked: "2026-10-16"
      expires: "2027-01-16"
      url: "https://github.com/Azure/Azurite/releases"

  - id: ollama
