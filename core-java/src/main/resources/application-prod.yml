# Production profile - Hardened security and performance settings
# Usage: SPRING_PROFILES_ACTIVE=prod or --spring.profiles.active=prod
# ⚠️ Override sensitive values via environment variables

spring:
  datasource:
    hikari:
      # Issue #94 [P2-3]: sized against the HPA replica CEILING, not a single pod.
      # Budget: (maxReplicas 10 + rolling-update surge 1) × 10 = 110, plus
      # Keycloak (≤20) + pg-backup (1) + postgres-exporter (2) = 133, against
      # Postgres max_connections=200 (superuser reserves 3) → ~32% headroom.
      # Per-pod 10 also matches HikariCP guidance (cores×2; pod CPU limit is 1).
      # Enforced by k8s/scripts/check-connection-math.sh (CI k8s-validate job).
      maximum-pool-size: ${DB_POOL_SIZE:12}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000  # Stricter leak detection
      pool-name: JToyeHikariPool-PROD
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}  # REQUIRED in production
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20  # Higher for production load
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
        shutdown-timeout: 100ms

  jpa:
    hibernate:
      ddl-auto: none  # Never auto-modify schema in production
    properties:
      hibernate:
        generate_statistics: false  # Disable for performance
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false  # Never log SQL in production
    open-in-view: false

  flyway:
    enabled: true
    validate-on-migrate: true
    # Issue #96 tail: reserved-slot V44 must apply to DBs already stamped
    # V45/V46 (see V44__fts_leakproof_and_vector_backfill.sql header). Revert
    # to false once flyway_schema_history shows version 44 applied here.
    out-of-order: true
    baseline-on-migrate: false
    # Issue #517: url/user/password + init-sqls (the sentinel tenant GUC that
    # keeps a FRESH database from dying at V46 with 22P02, on a DataSource that
    # is Flyway's own so the sentinel can never reach the app's Hikari pool) are
    # declared ONCE in application.yml and inherited here. Do NOT restate them —
    # a second copy is a divergence waiting to happen. If you add a key to this
    # block, you are overriding the base, not replacing it.
    # Proven inherited by FreshChainMigrationIntegrationTest.

server:
  error:
    include-message: never  # Security: Don't expose error details
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
  http2:
    enabled: true

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

logging:
  level:
    uk.jtoye: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.data: WARN
  pattern:
    # JSON structured logging for production log aggregation (ELK, Splunk, etc.)
    # issue #98 [P2-7] item 1: nest the two %replace conversions so the log
    # message is escaped ONCE (inner escapes quotes, outer escapes newlines) and
    # emitted a single time — the previous concatenation printed it twice,
    # producing malformed JSON.
    console: >-
      {"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","logger":"%logger{36}","message":"%replace(%replace(%msg){'\"','\\\"'}){'\n','\\n'}","thread":"%thread","traceId":"%X{traceId:-}","spanId":"%X{spanId:-}"}%n
  file:
    name: ${LOG_PATH:/var/log/jtoye}/application.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

management:
  # issue #98 [P2-7] item 4: serve ALL actuator endpoints (incl. prometheus) on a
  # SEPARATE internal management port, NOT the public app port (server.port 9090).
  # A distinct management.server.port makes Spring Boot bind the actuator
  # endpoints to this port only; the public app port then serves NO actuator /
  # metrics surface at all, closing the known /actuator/prometheus cardinality /
  # label-leak exposure. Env-overridable (never hardcoded); 9091 is
  # cluster-internal and is deliberately NOT published via the k8s Service/Ingress
  # (see k8s/base/core-java-deployment.yaml) — the scrape + kubelet probes +
  # deploy health-check reach it in-cluster only.
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        # health + info + prometheus, all served on the internal management port
        # above (never on the public app port).
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized  # Only authorized users see details
      probes:
        enabled: true  # Enable Kubernetes probes
  # issue #98 [P2-7]: correct Spring Boot 3.x property (see application.yml note).
  # Without this the /actuator/prometheus endpoint on the management port would
  # 404 despite being exposed, defeating item 4.
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: production
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}  # Disabled by default
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

rate-limiting:
  enabled: true
  default-limit: 100
  burst-capacity: 20
  # issue #88 [P1-6]: public (tenant-less) IP-keyed limiter — prod-style literals.
  public:
    requests-per-minute: 30
    burst: 10
    window-seconds: 60
