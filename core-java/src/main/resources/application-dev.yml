# Development profile — the compose in-container profile.
#
# `dev` is the profile docker-compose sets via SPRING_PROFILES_ACTIVE=dev. Its
# live behaviour lives mainly in @Profile({"dev", ...}) annotations (e.g.
# TenantFilter, DevTenantController) rather than in property overrides: every
# effective dev configuration value comes from the env-var defaults declared in
# the base application.yml.
#
# This document exists so SPRING_PROFILES_ACTIVE=dev resolves to a REAL profile
# document rather than a phantom profile that silently loads nothing (the class
# of misconfiguration behind Issue #78 [P0-2]).
logging:
  level:
    uk.jtoye: ${LOG_LEVEL:INFO}

# Issue #99 do-now (probe parity): enable the Kubernetes liveness/readiness
# health groups in dev too. The base application.yml does NOT set
# endpoint.health.probes.enabled, so without this block /actuator/health/liveness
# and /actuator/health/readiness 404 on the dev stack and scripts/smoke-test.sh
# Tests 4/5 would fail against it. Staging/prod already enable probes. Config
# only — takes effect on the next container rebuild, zero runtime risk now.
management:
  endpoint:
    health:
      probes:
        enabled: true

# Issue #179 defect 1: the dev customers realm ships with email verification
# OFF (CUSTOMER_VERIFY_EMAIL=false in .env.example / compose), so dev tokens
# carry email_verified=false. Relax the CustomerJwtVerifier gate here ONLY —
# the base application.yml default stays true (staging/prod keep the
# anti-impersonation protection unless explicitly overridden).
jtoye:
  security:
    customer-jwt:
      require-verified-email: ${CUSTOMER_JWT_REQUIRE_VERIFIED_EMAIL:false}
