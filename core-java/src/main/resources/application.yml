spring:
  application:
    name: core-java
  servlet:
    multipart:
      # Phase 24 IMG-02 reject-early oversize guard (RESEARCH Pitfall 5). Keep
      # max-file-size in sync with jtoye.media.max-upload-bytes and the client
      # SERVER_MAX_BYTES; max-request-size carries a little headroom over it so a
      # single-file multipart body is rejected on the FILE limit (clear 413) not
      # a whole-request limit.
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jtoye}
    username: ${DB_USER:jtoye_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: JToyeHikariPool
  cache:
    type: redis
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        envers:
          audit_table_suffix: _aud
          revision_field_name: rev
          revision_type_field_name: revtype
          store_data_at_delete: true
          default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    # Issue #96 tail: V44 was a RESERVED slot filled AFTER V45/V46 shipped, so
    # deployed DBs are already stamped past it. out-of-order lets Flyway apply
    # the lower-versioned pending V44 instead of failing validation ("resolved
    # migration not applied"). Fresh DBs still migrate strictly in order. May
    # be reverted to false once every environment's flyway_schema_history
    # shows version 44 applied. See V44__fts_leakproof_and_vector_backfill.sql.
    out-of-order: true
    # --- Issue #517: first boot on a FRESH database ---------------------------
    # A fresh chain applies V44 BEFORE V46 (version order). V44 ends with
    # `PERFORM set_config('app.current_tenant_id', '', true)`, and a Postgres
    # placeholder GUC that has been touched resets to the EMPTY STRING, not to
    # unset — measured on postgres:15: virgin session -> NULL, same session
    # after a committed txn-local set_config -> ''. V46 then runs a bare
    # `UPDATE payment_event_outbox`, whose policy at that point in the chain is
    # still V33's RAW cast `current_setting('app.current_tenant_id', true)::uuid`
    # (V51 repoints it at the safe current_tenant_id() helper — five migrations
    # too late to protect V46). `''::uuid` raises 22P02 and boot dies. It is
    # intermittent because it only fires when V44 and V46 land on the SAME
    # physical connection, and invisible on long-lived databases because
    # out-of-order applied V46 before V44 there.
    #
    # Fix: give Flyway a valid sentinel tenant GUC for the whole migration run.
    # The all-zeros UUID is provably not a tenant id — every tenant id comes
    # from uuid_generate_v4()/UUID.randomUUID(), which always set version nibble
    # 4, and V13 seeds ...0001/...0002 — so this is semantically identical to
    # the NULL the policies see today (matches no row, widens nothing) while
    # being a legal uuid literal.
    #
    # url/user/password are set DELIBERATELY: Spring Boot only builds Flyway a
    # dedicated, non-pooling SimpleDriverDataSource when spring.flyway.url is
    # present (FlywayAutoConfiguration#getMigrationDataSource). Without it
    # Flyway borrows from the application's Hikari pool, Hikari does not reset
    # custom GUCs on return, and the session-scoped sentinel would leak into
    # application request connections — a far worse hazard on an RLS system
    # than the bug being fixed. So spring.flyway.url STAYS a plain placeholder
    # onto spring.datasource.url and must not be removed (#517).
    #
    # user/password, by contrast, are now INDIRECTED through
    # DB_MIGRATION_USER/DB_MIGRATION_PASSWORD (SEC-04 / #552, D-01). The runtime
    # role split points spring.datasource.username at the DML-only jtoye_runtime;
    # a shared credential would drag Flyway onto it too, and migrations would fail
    # immediately with no CREATE on the schema. The nested default
    # ${DB_MIGRATION_USER:${spring.datasource.username}} means an environment that
    # sets NEITHER new key resolves to the datasource values — i.e. behaves
    # EXACTLY as before — while an environment adopting the split sets the pair to
    # the owner/migrator role. Proven both directions from the RESOLVED config by
    # FlywayCredentialDecouplingTest (RESEARCH assumption A3, previously unverified).
    #
    # Inherited by every profile: application-staging.yml / application-prod.yml
    # deliberately do NOT restate these keys (see the note in each).
    url: ${spring.datasource.url}
    user: ${DB_MIGRATION_USER:${spring.datasource.username}}
    password: ${DB_MIGRATION_PASSWORD:${spring.datasource.password}}
    init-sqls:
      - "SET app.current_tenant_id = '00000000-0000-0000-0000-000000000000'"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:jtoye}
    password: ${RABBITMQ_PASSWORD:}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enabled: ${SMTP_STARTTLS:true}
    test-connection: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URI:http://localhost:8085/realms/jtoye-dev}

# issue #87 P1-5: expected 'aud' claim on inbound access tokens. Mirrors the
# issuer-uri env-override pattern above (NOT hardcoded); default "core-api"
# matches KEYCLOAK_CLIENT_ID and the aud emitted by the realm's core-api
# audience mapper (see infra/keycloak/realm-export.template.json, Task 3).
# NOTE: spring.security.oauth2.resourceserver.jwt.audiences is intentionally
# NOT used because this project supplies a custom JwtDecoder bean — that
# property only applies to Spring's auto-configured decoder.
jtoye:
  shop:
    # Slugs a vendor may NOT claim, because the storefront serves a STATIC route at
    # /shop/<segment> and Next.js resolves a static segment BEFORE the dynamic
    # [slug] one. A shop holding one of these is permanently unreachable at its own
    # URL, with nothing anywhere to say why.
    #
    # This is configuration rather than a constant because the list is a function of
    # the frontend route table (frontend/app/shop/*/), which changes as routes are
    # added. Keep it in step with that directory — 'auth' and 'orders' have been
    # static since Phase 18; 'signin' is the customer sign-in page.
    #
    # Only an EXPLICITLY supplied slug can collide: ShopService appends a random
    # 8-character suffix to any slug it generates itself.
    reserved-slugs: ${SHOP_RESERVED_SLUGS:auth,orders,signin}
  # Phase 23 vendor-scoped access (VSA-02). Config KEYS (not secrets); base
  # inherits to all profiles, env-overridable with safe defaults.
  access:
    # D-12 (revised, CR-07): strict-scoping switch. OFF (default) preserves day-one
    # behaviour exactly — an ungranted tenant user's first write request
    # JIT-auto-provisions a tenant-wide GROUP_ADMIN grant (D-04) and every grant is
    # honoured. ON does TWO things so the off-ramp is actually reachable for a tenant
    # with existing usage: (1) stops new JIT auto-provisioning, and (2) STOPS HONOURING
    # the JIT-sourced tenant-wide GROUP_ADMIN rows already written for day-one users —
    # those users genuinely become scoped (deny-by-default on shop-scoped calls).
    # Deliberate operator grants (grant_source = 'OPERATOR', via /api/v1/staff/grant)
    # and realm admins are honoured unchanged. Lockout safety: if de-honouring JIT rows
    # would leave a tenant with zero GROUP_ADMINs, the OLDEST JIT admin is retained as a
    # WARN-logged bootstrap admin — so flipping this flag can never lock a tenant out.
    # Global flag for now; per-tenant granularity is deferred.
    strict-scoping: ${ACCESS_STRICT_SCOPING:false}
    # D-09: throttle window for the login-populated user_directory upsert. A
    # returning user whose row is younger than this interval is a no-op (never a
    # write per request). ISO-8601 duration; default one hour.
    directory-upsert-interval: ${DIRECTORY_UPSERT_INTERVAL:PT1H}
    # CR-03 (D-04): explicit machine/service-client allowlist. A bearer token whose
    # 'sub' is NOT a UUID (a client-credentials / service account, not a vendor user)
    # may bypass shop-scoping ONLY when its azp/client_id claim is listed here — trust
    # is NEVER inferred from an unparseable subject. Config KEY, not a secret.
    # EMPTY default = fail-closed: every non-UUID-subject token is denied by default.
    # Comma-separated list, e.g. ACCESS_MACHINE_CLIENT_IDS=mcp-server,batch-worker.
    machine-client-ids: ${ACCESS_MACHINE_CLIENT_IDS:}
  # Phase 31 (LGL-01, D-16/D-17) — the consumer data-subject-request desk. Config KEYS, not
  # secrets. 31-05 owns the intake, 31-09 the verification gate and the background fan-out.
  gdpr:
    dsar:
      # How often the fan-out worker sweeps for verified requests. Deliberately unhurried: the
      # statutory window is 30 days, the queue is empty almost all of the time, and each sweep
      # walks every tenant. Every DsarFanoutWorker @Scheduled interval is a fixedDelayString with
      # an inline default (the webhook.delivery.retention-interval-ms shape) so the worker still
      # runs when this key is absent — a legal-floor job must not be switched off by omission.
      fanout-interval-ms: ${DSAR_FANOUT_INTERVAL_MS:300000}
      # Requests claimed per sweep. Bounds one sweep's work; the leftovers are simply claimed by
      # the next one, because the claim is ordered oldest-first and a backlog drains in the order
      # it was lodged.
      claim-batch-size: ${DSAR_CLAIM_BATCH_SIZE:25}
      # Attempts before a partially-failed request is parked as FAILED. Without a cap a
      # permanently broken tenant would re-claim the same request forever, and the failure would
      # stay invisible; with one it becomes a loud, countable state.
      max-process-attempts: ${DSAR_MAX_PROCESS_ATTEMPTS:5}
      # How long a subject has to confirm control of the address. Seven days: long enough to
      # survive a weekend and a spam folder, short enough that a live bearer token is not left
      # lying in a mailbox indefinitely. Read by DsarIntakeService when stamping the expiry, and
      # quoted verbatim to the subject by DsarVerificationMailer, so the promise and the column
      # cannot disagree.
      verification-ttl-hours: ${DSAR_VERIFICATION_TTL_HOURS:168}
      # Where the emailed confirmation link points. Config-injected and NEVER derived from the
      # request: a link built from an attacker-supplied Host header would redirect a live,
      # single-use bearer token to a collector of their choosing.
      verify-base-url: ${DSAR_VERIFY_BASE_URL:http://localhost:8080/api/v1/public/gdpr/dsar/verify}
  security:
    jwt:
      expected-audience: ${JWT_EXPECTED_AUDIENCE:core-api}
      # issue #87 follow-up (split-horizon issuer fix): the value required in the
      # token 'iss' claim. JWKS is fetched from the INTERNAL issuer-uri
      # (KC_ISSUER_URI, e.g. http://keycloak:8080/... — reachable from the
      # container), but Keycloak stamps tokens with its PUBLIC frontend issuer
      # (KC_HOSTNAME, e.g. http://localhost:8085/...). In a containerised
      # topology these differ, so the expected issuer MUST be configured
      # independently of the JWKS host — otherwise every token is rejected with
      # "The iss claim is not valid". Defaults to issuer-uri so single-host and
      # Testcontainers setups (where the two coincide) keep passing unchanged;
      # override via JWT_EXPECTED_ISSUER in split-host deployments.
      expected-issuer: ${JWT_EXPECTED_ISSUER:${spring.security.oauth2.resourceserver.jwt.issuer-uri}}
    # Issue #179 defect 1: B2C customer-session order history
    # (GET /public/orders/mine, X-Customer-Token header). Tokens are minted by
    # the jtoye-customers realm (Phase 18 realm split) and verified by
    # CustomerJwtVerifier — a decoder deliberately SEPARATE from the staff
    # resource-server decoder above. Same split-horizon pattern as issue #87:
    # issuer-uri locates the JWKS (INTERNAL host, e.g. http://keycloak:8080/...),
    # expected-issuer is the PUBLIC issuer Keycloak stamps into tokens
    # (e.g. http://localhost:8085/...); they default to the same value for
    # single-host/Testcontainers setups.
    customer-jwt:
      issuer-uri: ${CUSTOMER_KC_ISSUER_URI:http://localhost:8085/realms/jtoye-customers}
      expected-issuer: ${CUSTOMER_JWT_EXPECTED_ISSUER:${jtoye.security.customer-jwt.issuer-uri}}
      # Anti-impersonation gate: require email_verified=true in the token so a
      # self-registered account with a victim's (unverified) address cannot list
      # the victim's order history. Secure default ON; dev profile relaxes it to
      # match the dev realm's CUSTOMER_VERIFY_EMAIL=false (see application-dev.yml).
      require-verified-email: ${CUSTOMER_JWT_REQUIRE_VERIFIED_EMAIL:true}
  sse:
    # #92: interval for the SSE keep-alive comment sent to every open
    # /orders/stream emitter. Must stay comfortably below the smallest
    # intermediary idle timeout on the path (nginx ingress default
    # proxy-read-timeout is 60s), or idle streams get severed mid-flight.
    heartbeat-interval-ms: ${SSE_HEARTBEAT_INTERVAL_MS:25000}
  keycloak:
    # Issue #102 remainder: disable a tenant's Keycloak users when the tenant is
    # offboarded — the IDENTITY-LAYER complement to TenantStatusInterceptor's
    # request rejection (a stolen/cached token still validates at the IdP until
    # the user is disabled). FULLY INERT unless enabled=true AND base-url set:
    # the service logs one WARN and no-ops; the admin re-trigger endpoint returns
    # an RFC 7807 400 "not configured". Deprovisioning runs best-effort AFTER the
    # offboard transaction commits, so a Keycloak outage never rolls back or
    # fails the offboard.
    admin:
      enabled: ${KC_ADMIN_ENABLED:false}
      # In-cluster Keycloak base URL reachable from core (e.g.
      # http://keycloak:8080) — NOT the public localhost:8085 host.
      base-url: ${KC_ADMIN_BASE_URL:}
      # Comma-separated realms to sweep -> List<String>. Default is the vendor
      # realm only: jtoye-customers has no tenant_id user attributes, so it is
      # deliberately excluded.
      realms: ${KC_DEPROVISION_REALMS:jtoye-dev}
      username: ${KEYCLOAK_ADMIN:admin}
      password: ${KEYCLOAK_ADMIN_PASSWORD:}
  # Phase 22 COMMS-07: WhatsApp/SMS provider seam. FULLY INERT by default —
  # WhatsAppSmsChannel logs one WARN and no-ops unless enabled=true AND all
  # provider credentials are present. Live send is out of scope this phase
  # (#208 scaffold-only); every value is ${ENV:default}, secrets default empty
  # (house convention) so nothing is hardcoded (GLOBAL_RULE_6).
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    provider: ${WHATSAPP_PROVIDER:}
    account-sid: ${WHATSAPP_ACCOUNT_SID:}
    auth-token: ${WHATSAPP_AUTH_TOKEN:}
    from-number: ${WHATSAPP_FROM_NUMBER:}
  # Phase 24 IMG-02 image pipeline budget (decision D-02a). Every value is a
  # config KEY, not a code literal (GLOBAL_RULE_6): MediaNormalizer reads the
  # WebP derivative budget (max-dimension / quality / thumbnail), the
  # decompression-bomb megapixel cap and the reject-early upload byte cap from
  # this bean. Defaults are the D-02a starting budget; env-overridable per
  # environment. max-upload-bytes stays in sync with
  # spring.servlet.multipart.max-file-size above and the client SERVER_MAX_BYTES.
  media:
    max-dimension: ${MEDIA_MAX_DIMENSION:1600}
    quality: ${MEDIA_QUALITY:80}
    thumbnail: ${MEDIA_THUMBNAIL:400}
    max-megapixels: ${MEDIA_MAX_MEGAPIXELS:40}
    max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:5242880}
    # WR-04: whole-request budget for the reject-early Content-Length gate — in sync with
    # spring.servlet.multipart.max-request-size (6MB). Compared against the multipart envelope's
    # Content-Length (NOT the per-file max-upload-bytes cap, which would 413 a near-limit file).
    max-request-bytes: ${MEDIA_MAX_REQUEST_BYTES:6291456}
    reaper-interval-ms: ${MEDIA_REAPER_INTERVAL_MS:600000}
    # Phase 27 / 27-01 quarantine durability. This plan OWNS these five keys.
    #
    # reaper-grace-ms was bound by MediaProperties but had NO key in any application*.yml (F-1) —
    # the single most safety-critical number in the pipeline was not operator-tunable by the
    # documented env pattern. It is how long a PENDING asset may sit before MediaPendingReaper
    # classifies it as stalled; the reaper can no longer delete anything, so the blast radius of
    # getting it wrong is a premature vendor-visible FAILED with the bytes retained.
    #
    # quarantine-retention-ms is the plan's central trade: it converts unbounded loss at 15 min
    # (the old reaper destroyed the vendor's only copy during a broker outage) into bounded loss
    # at 72 h. Raising it widens the F-3 exposure window — the jtoye-images bucket is anonymously
    # readable by key — so it is a deliberate, declared horizon, not a default to drift.
    reaper-grace-ms: ${MEDIA_REAPER_GRACE_MS:900000}
    max-process-attempts: ${MEDIA_MAX_PROCESS_ATTEMPTS:3}
    quarantine-retention-ms: ${MEDIA_QUARANTINE_RETENTION_MS:259200000}
    retention-interval-ms: ${MEDIA_RETENTION_INTERVAL_MS:3600000}
    claim-lock-timeout-ms: ${MEDIA_CLAIM_LOCK_TIMEOUT_MS:10000}
    vision:
      # IMG-03 advisory content-relevance stage — OFF by default (Ollama
      # unreliable; the pipeline ships behind this flag). Below min-confidence
      # FLAGS an ACTIVE asset for the vendor review queue (never a hard reject).
      enabled: ${MEDIA_VISION_ENABLED:false}
      min-confidence: ${MEDIA_VISION_MIN_CONFIDENCE:0.35}

  # Phase 27 / 27-04 — RabbitMQ listener tunables. Bound by RabbitListenerProperties.
  #
  # These are NOT spring.rabbitmq.listener.simple.* because that family was INERT: this
  # project declares a bean named `rabbitListenerContainerFactory`, and Boot's own factory is
  # @ConditionalOnMissingBean(name = "rabbitListenerContainerFactory"), so Boot backed off and
  # SimpleRabbitListenerContainerFactoryConfigurer — the only consumer of those properties —
  # never ran. RabbitMQConfig now applies the configurer explicitly and layers these on top.
  #
  # default-* govern the eight non-media endpoints. Concurrency stays 1 deliberately: raising it
  # globally would lose per-order ordering on order.state-changes (its processed_order_events
  # dedup key prevents repeats, not reordering) and churn UI ordering on the SSE fan-out queue.
  # default-prefetch is today's EFFECTIVE value (the container default of 250), declared rather
  # than changed, so repairing the factory is provably behaviour-preserving for those eight.
  rabbit:
    default-prefetch: ${JTOYE_RABBIT_DEFAULT_PREFETCH:250}
    default-concurrency: ${JTOYE_RABBIT_DEFAULT_CONCURRENCY:1}
    # media.process only — the one CPU-bound consumer (two WebP encodes per message).
    # MEASURED, not guessed: infra/load-testing/baselines/2026-07-28-media-A-baseline.md.
    #   prefetch 2  — low by intent. At 250 the defect is unfair distribution ACROSS REPLICAS
    #                 (worse at the production 3), not head-of-line blocking within one. 2 hides
    #                 fetch latency at a measured 606 ms/message while leaving the rest of a
    #                 burst available to other replicas.
    #   concurrency 1 — Arm A measured peak container CPU 97.8% at concurrency 1 under a 1-CPU
    #                 pin, and the pod limit is 1000m: one consumer already saturates one core.
    #                 Peak queue depth was 0 across all 197 samples because
    #                 media.outbox.flush-interval-ms (5000) paces this pipeline in batches one
    #                 consumer drains inside the interval — there is no steady-state backlog.
    #   max 2       — a ceiling for bursts, and the most BOTH budget walls allow: 3 breaches the
    #                 intra-pod budget (check-consumer-thread-budget.sh), and raising DB_POOL_SIZE
    #                 to fit 3 breaches the cluster-wide one (check-connection-math.sh, 166 > 157).
    media-prefetch: ${JTOYE_RABBIT_MEDIA_PREFETCH:2}
    media-concurrency: ${JTOYE_RABBIT_MEDIA_CONCURRENCY:1}
    media-max-concurrency: ${JTOYE_RABBIT_MEDIA_MAX_CONCURRENCY:2}

  # ==========================================================================================
  # Locality (Phase 33 / CUST-01). Plan 33-02 is the SOLE owner of this block.
  # ==========================================================================================
  # 33-05 (coordinate backfill) and 33-06 (radius search) READ these keys and must not add to
  # them — they share a wave, and two plans editing this file is a merge conflict by design.
  geo:
    postcode-import:
      # DEFAULT TRUE, AND THAT IS THE LOAD-BEARING PART OF THIS PLAN.
      #
      # A `false` default here would make every downstream locality criterion in this phase
      # VACUOUS rather than failing: postcode_centroid stays empty, so 33-05's backfill writes
      # no coordinates, so every shop keeps latitude IS NULL, so 33-06's radius query correctly
      # returns nothing, so 33-07's located row renders its empty state — and every automated
      # verify in all four plans stays GREEN while the headline feature does nothing at all.
      # The only observable symptom is a customer seeing "no kitchens near you" forever.
      #
      # So the default is true, and PostcodeCentroidImportIntegrationTest asserts the RESOLVED
      # value rather than trusting this comment. A comment claiming a default is not a default.
      enabled: ${POSTCODE_IMPORT_ENABLED:true}
      # The committed OGL-licensed artefact and its generated provenance record. The importer
      # reads the expected row count OUT of the manifest rather than carrying a copy, so
      # regenerating the dataset updates the data and the assertion in one atomic step —
      # scripts/regen-postcode-centroids.sh rewrites both.
      resource: ${POSTCODE_IMPORT_RESOURCE:classpath:geo/postcode-centroids.csv.gz}
      manifest: ${POSTCODE_IMPORT_MANIFEST:classpath:geo/SOURCE.md}
    coordinate-backfill:
      # Read by 33-05. True in dev for the same reason as above: a shop row with NULL
      # coordinates is invisible to every distance query, and nothing reports that.
      enabled: ${COORDINATE_BACKFILL_ENABLED:true}
    # Read by 33-06. Q-2 settled radius as a QUERY PARAMETER, so these are the platform
    # default and the ceiling a caller may request — both operator-tunable without a code
    # edit, which is the whole point of surfacing them here.
    default-radius-km: ${GEO_DEFAULT_RADIUS_KM:5}
    max-radius-km: ${GEO_MAX_RADIUS_KM:50}

# Outbox flusher tunables (27-04 T4, finding E). PRE-EXISTING DEFECT fixed here, not introduced:
# these eight keys were bound by @Value/@Scheduled inline defaults and appeared in NO yml, env
# file, k8s manifest or script — so the only way to change a flush interval in production was to
# rebuild the image. Every value below is byte-identical to the inline default it surfaces, so
# this is purely a visibility change. check-env-contract.sh could never have caught them: it
# compares UPPERCASE ${} placeholders, and a lowercase Spring property with an inline default is
# invisible to both of its directions.
#
# media.outbox.flush-interval-ms is the pacing element of the whole media pipeline — Arm A showed
# the queue depth stays 0 because this interval, not consumer count, governs arrival.
payment:
  outbox:
    flush-interval-ms: ${PAYMENT_OUTBOX_FLUSH_INTERVAL_MS:5000}
    resurrect-interval-ms: ${PAYMENT_OUTBOX_RESURRECT_INTERVAL_MS:300000}
    backoff-base-ms: ${PAYMENT_OUTBOX_BACKOFF_BASE_MS:5000}
    backoff-cap-ms: ${PAYMENT_OUTBOX_BACKOFF_CAP_MS:300000}

media:
  outbox:
    flush-interval-ms: ${MEDIA_OUTBOX_FLUSH_INTERVAL_MS:5000}
    resurrect-interval-ms: ${MEDIA_OUTBOX_RESURRECT_INTERVAL_MS:300000}
    backoff-base-ms: ${MEDIA_OUTBOX_BACKOFF_BASE_MS:5000}
    backoff-cap-ms: ${MEDIA_OUTBOX_BACKOFF_CAP_MS:300000}

stomp:
  broker:
    mode: ${STOMP_BROKER_MODE:in-memory}
    relay-host: ${STOMP_RELAY_HOST:localhost}
    relay-port: ${STOMP_RELAY_PORT:61613}
    # D-05 (Phase 26 / DEF-4): three-level ADDITIVE fallback chain, dedicated
    # credential first. The single-level `${RABBITMQ_USER:guest}` form this
    # replaces was one half of DEF-4 — a two-sided env-name mismatch:
    # k8s/base/core-java-deployment.yaml injected the RabbitMQ user under an env
    # name matching the secret KEY (not the Spring placeholder) AND injected
    # STOMP_CLIENT_LOGIN / STOMP_CLIENT_PASSCODE from
    # rabbitmq-credentials/stomp-login/stomp-passcode — and NO application*.yml
    # read any of those three names. So the relay resolved to the terminal
    # default and RabbitMQ logged `Access refused for user 'guest'` at boot.
    # Compose never caught it: STOMP_BROKER_MODE defaults to in-memory, so a
    # normal compose run does not exercise the relay at all.
    #
    # Additive on purpose (Incremental Betterment): compose sets RABBITMQ_USER /
    # RABBITMQ_PASSWORD and no STOMP_CLIENT_*, so it resolves to exactly today's
    # values, while k8s now PREFERS the dedicated STOMP credential that
    # rabbitmq-credentials and k8s/QUICK_START.md already provision. Nested
    # defaults are a real Spring feature, already used by
    # jtoye.security.jwt.expected-issuer above.
    # Proven at all three precedence levels by StompCredentialResolutionTest.
    client-login: ${STOMP_CLIENT_LOGIN:${RABBITMQ_USER:guest}}
    client-passcode: ${STOMP_CLIENT_PASSCODE:${RABBITMQ_PASSWORD:guest}}
    system-login: ${STOMP_CLIENT_LOGIN:${RABBITMQ_USER:guest}}
    system-passcode: ${STOMP_CLIENT_PASSCODE:${RABBITMQ_PASSWORD:guest}}

server:
  port: ${SERVER_PORT:9090}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    # Phase 24 IMG-02 (RESEARCH Pitfall 5): cap how many bytes Tomcat will
    # swallow from a body it has already decided to reject, so an oversize
    # upload is NOT fully drained before the 413 — bounds the reject-early cost.
    max-swallow-size: 2MB

management:
  endpoints:
    web:
      exposure:
        # Base profile exposes only health and info. Metrics and the
        # Prometheus scrape endpoint are sensitive (cardinality leaks,
        # hostname/tenant label leaks) and are explicitly opted-in per
        # non-prod profile (application-local.yml, application-staging.yml).
        # Production (application-prod.yml) keeps them disabled — scrape
        # via sidecar or out-of-band tooling instead.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  # issue #98 [P2-7]: Spring Boot 3.x property. The old 2.x name
  # (management.metrics.export.prometheus.enabled) is a NO-OP in Boot 3.5 — it
  # left the PrometheusMeterRegistry uncreated and /actuator/prometheus
  # unregistered (404) wherever the endpoint was exposed. This is the actual
  # "observability demo-grade" gap issue #98 flags. Proven by
  # ManagementPortMetricsIntegrationTest.
  prometheus:
    metrics:
      export:
        enabled: true
  # issue #342: HighResponseTime could NEVER FIRE. It computes
  # histogram_quantile(0.95, ... http_server_requests_seconds_bucket ...), and
  # that bucket family did not exist: measured 2026-07-29, `_bucket` had 0 series
  # while `_count`, `_sum` and `_max` each had 78. Micrometer only emits `_bucket`
  # when a distribution histogram is switched on, and it was configured nowhere.
  #
  # PROPERTY NAME VERIFIED, NOT ASSUMED. This repo's recorded BOOT-3 trap is a
  # Boot-2 property that silently no-ops under Boot 3 (see the comment above about
  # management.metrics.export.prometheus.enabled leaving the registry uncreated).
  # `management.metrics.distribution.*` was read out of
  # spring-boot-actuator-autoconfigure-3.5.16.jar's own
  # META-INF/spring-configuration-metadata.json, which lists
  # percentiles-histogram, minimum-expected-value and maximum-expected-value under
  # exactly this prefix. Only the EXPORT properties moved in Boot 3, not these.
  #
  # THE RANGE IS BOUNDED ON PURPOSE — it is the difference between a ~29% and a
  # ~81% increase in total series. Measured budget before this change: 6699 series
  # total, 78 distinct uri/method/status combinations. Micrometer's DEFAULT
  # (unbounded) histogram emits ~70 buckets per combination, i.e. ~5460 new series.
  # Clamping to 10ms..2s emits roughly 25, i.e. ~1950 new series. 2s is chosen
  # because the alert threshold is 1s: the bucket boundaries only need to bracket
  # the threshold for histogram_quantile to interpolate a useful p95 around it.
  # Raising the ceiling buys precision the alert cannot use and costs series.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 2s
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.1}  # Sample 10% of requests (increase in staging/dev)
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    uk.jtoye: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:eu-west-2}
    bucket: ${S3_BUCKET:jtoye-images}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    public-url: ${S3_PUBLIC_URL:http://localhost:9000/jtoye-images}
  max-file-size-bytes: 5242880
  allowed-content-types: image/jpeg,image/png,image/webp,image/gif

ai:
  enabled: ${AI_ENABLED:true}
  provider: ${AI_PROVIDER:ollama}  # "ollama" (local, free) or "anthropic" (cloud, paid)
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma3:12b}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}

stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # issue #102 — PaymentIntent currency, formerly a hardcoded "gbp" literal.
  currency: ${STRIPE_CURRENCY:gbp}
  # issue #102 (ADR-0001 Decision 2) — platform application fee on MARKETPLACE
  # destination charges, in basis points (250 = 2.5%). 0 (default) = no fee set;
  # the fee is a business decision injected per environment, never a code literal.
  platform-fee-bps: ${STRIPE_PLATFORM_FEE_BPS:0}
  connect:
    # Country for new Express connected accounts (UK platform).
    country: ${STRIPE_CONNECT_COUNTRY:GB}
    # Where Stripe returns the vendor after Express onboarding / on link expiry.
    return-url: ${STRIPE_CONNECT_RETURN_URL:http://localhost:3000/dashboard/payments/connect/return}
    refresh-url: ${STRIPE_CONNECT_REFRESH_URL:http://localhost:3000/dashboard/payments/connect/refresh}

# issue #102 — tenant lifecycle enforcement (TenantStatusInterceptor).
# statusOf() lookups are served from an in-memory TTL cache; lifecycle
# mutations evict the local entry immediately, other instances converge
# within one TTL window.
tenant-lifecycle:
  status-cache-ttl-seconds: ${TENANT_STATUS_CACHE_TTL_SECONDS:30}

# Phase 18 vendor onboarding — every value ${ENV:default}; secrets default empty
# (house convention). FHRS is free/no-key but requires x-api-version:2; Companies
# House is free with an API key (HTTP Basic, key as username).
onboarding:
  # GLOBAL FORCE-ON override: when true, EVERY model auto-approves on green gates;
  # when false (default), per-model policy in auto-approve-models applies (#178, ADR-0001).
  auto-approve: ${ONBOARDING_AUTO_APPROVE:false}
  # Per-model auto-approve list — default WHITE_LABEL auto / MARKETPLACE manual (#178 item 1).
  auto-approve-models: ${ONBOARDING_AUTO_APPROVE_MODELS:WHITE_LABEL}
  menu-minimum: ${ONBOARDING_MENU_MINIMUM:1}
  fhrs:
    base-url: ${FHRS_BASE_URL:https://api.ratings.food.gov.uk}
    min-rating: ${FHRS_MIN_RATING:2}          # DECIDED: 2 (Deliveroo/Uber parity)
    api-version: ${FHRS_API_VERSION:2}
  companies-house:
    base-url: ${COMPANIES_HOUSE_BASE_URL:https://api.company-information.service.gov.uk}
    api-key: ${COMPANIES_HOUSE_API_KEY:}

notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
    from: ${NOTIFICATION_EMAIL_FROM:noreply@jtoye.uk}
    tracking-base-url: ${NOTIFICATION_EMAIL_TRACKING_BASE_URL:http://localhost:3000}
  # Phase 22 COMMS-03: stateless one-click unsubscribe (RFC 8058). The signing
  # secret keys the HMAC unsubscribe token; empty default keeps the feature
  # inert until an operator wires it (NotificationProperties.configured()).
  # No literals in code (GLOBAL_RULE_6).
  #
  # TWO ORIGINS, DELIBERATELY (issue #516). The app and the API are different
  # Services behind the ingress, so an origin only routes the paths its own
  # Service serves. base-url is the APP (frontend) origin and carries page-path,
  # the branded confirmation page a recipient CLICKS. one-click-base-url is the
  # API origin and carries one-click-path, the no-auth endpoint a mail provider
  # POSTs to under RFC 8058. Composing base-url with the API's path — what this
  # did until #516 — produced a link that answered the frontend's 404 in
  # staging, production and local: a broken opt-out, i.e. a PECR/GDPR defect.
  #
  # one-click-base-url is EMPTY BY DEFAULT and fail-safe: with no value the
  # List-Unsubscribe header advertises the (working) page URL as a plain RFC 2369
  # link and List-Unsubscribe-Post is NOT stamped, so a one-click POST is never
  # promised at a target that cannot honour it.
  #
  # An empty default is the ONLY safe one, and this is enforced, not merely
  # argued: a localhost fallback would reintroduce the D-19 defect class (a
  # loopback origin inside production mail), and k8s/scripts/check-env-contract.sh
  # direction (b) fails the build for exactly that shape — "placeholder whose
  # default is LOCAL-ONLY and that no manifest supplies". It did fail for this key
  # when the dev profile carried http://localhost:9090.
  #
  # To turn true one-click on, set NOTIFICATION_UNSUBSCRIBE_ONE_CLICK_BASE_URL to
  # that environment's API origin: `http://localhost:9090` in .env for the dev
  # stack, and each overlay's app-config `api.url` in k8s (which also needs the
  # env wired in k8s/base/core-java-deployment.yaml, next to the existing
  # NOTIFICATION_UNSUBSCRIBE_BASE_URL block).
  unsubscribe:
    signing-secret: ${NOTIFICATION_UNSUBSCRIBE_SECRET:}
    base-url: ${NOTIFICATION_UNSUBSCRIBE_BASE_URL:http://localhost:3000}
    page-path: ${NOTIFICATION_UNSUBSCRIBE_PAGE_PATH:/unsubscribe}
    one-click-base-url: ${NOTIFICATION_UNSUBSCRIBE_ONE_CLICK_BASE_URL:}
    one-click-path: ${NOTIFICATION_UNSUBSCRIBE_ONE_CLICK_PATH:/api/v1/public/unsubscribe}

# Phase 22 COMMS-05: outbound webhook delivery engine (WebhookDeliveryWorker +
# WebhookRetentionCleanup). Every tunable is ${ENV:default} (GLOBAL_RULE_6) —
# attempt count, backoff schedule, auto-pause threshold and the webhook_delivery
# retention window are config-injected, never literals. target.block-private-ranges
# (default ON, also read by WebhookUrlValidator) re-guards SSRF at delivery time
# against a subscription created before URL validation tightened / DNS rebinding.
webhook:
  delivery:
    interval-ms: ${WEBHOOK_DELIVERY_INTERVAL_MS:5000}
    batch-size: ${WEBHOOK_DELIVERY_BATCH_SIZE:50}
    max-attempts: ${WEBHOOK_DELIVERY_MAX_ATTEMPTS:8}
    backoff-base-ms: ${WEBHOOK_DELIVERY_BACKOFF_BASE_MS:1000}
    backoff-cap-ms: ${WEBHOOK_DELIVERY_BACKOFF_CAP_MS:3600000}
    auto-pause-threshold: ${WEBHOOK_DELIVERY_AUTO_PAUSE_THRESHOLD:10}
    retention-days: ${WEBHOOK_DELIVERY_RETENTION_DAYS:30}
    retention-interval-ms: ${WEBHOOK_DELIVERY_RETENTION_INTERVAL_MS:86400000}
    timeout-seconds: ${WEBHOOK_DELIVERY_TIMEOUT_SECONDS:10}
    signature-tolerance-seconds: ${WEBHOOK_DELIVERY_SIGNATURE_TOLERANCE_SECONDS:300}
  envelope:
    version: ${WEBHOOK_ENVELOPE_VERSION:1}
  target:
    block-private-ranges: ${WEBHOOK_TARGET_BLOCK_PRIVATE_RANGES:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # issue #412: a cross-origin response hands JS only the CORS-safelisted headers
  # unless they are named here. Omitting the four rate-limit headers made them
  # invisible to every browser client while curl still showed them on the wire.
  # 33-08 (#619) appends the search-interpretation header (last name below). The storefront
  # reads it cross-origin (:3000 -> :9090), so unlisted it would be on the wire and null to
  # every fetch. The name is written ONCE in this file, on the line beneath, on purpose.
  exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization,Content-Type,Retry-After,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset,X-Search-Interpretation}

rate-limiting:
  enabled: ${RATE_LIMIT_ENABLED:true}
  default-limit: ${RATE_LIMIT_PER_MINUTE:100}
  burst-capacity: ${RATE_LIMIT_BURST:20}
  # issue #88 [P1-6]: tenant-less public storefront paths (/public/**) are throttled by
  # client IP in a distinct Redis namespace (rl:public:{ip}), independent of tenant buckets.
  public:
    requests-per-minute: ${RATE_LIMIT_PUBLIC_PER_MINUTE:30}
    burst: ${RATE_LIMIT_PUBLIC_BURST:10}
    window-seconds: ${RATE_LIMIT_PUBLIC_WINDOW_SECONDS:60}

resilience4j:
  circuitbreaker:
    instances:
      stripe:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      # Phase 18: gate-client breakers (18-03 FHRS, 18-04 Companies House) —
      # defined here so the later gate slices need not touch application.yml.
      fhrs:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      companies-house:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      email:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
      ai:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 1
        register-health-indicator: true
      # Phase 22 COMMS-05: outbound webhook egress breaker. Per-subscription
      # isolation + auto-pause already bound a hostile endpoint; this breaker
      # trips the shared WebClient so a broadly-down egress path fails fast.
      webhook:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      email:
        max-attempts: 3
        wait-duration: 2s
      ai:
        max-attempts: 2
        wait-duration: 5s

cleanup:
  # Consumed by ScheduledCleanupService — a daily 03:00 UTC job that deletes DRAFT
  # orders past this cutoff. Published as R-1 in docs/retention-manifest.json and
  # gated by scripts/check-retention-enforcement.sh, which asserts BOTH that this
  # key holds the published value AND that a consumer actually reads it.
  #
  # A sibling key for orphaned product images was removed from this block on
  # 2026-08-16 (plan 31-06). It declared a 7-day deletion that nothing performed:
  # verified two-arm with an identically shaped live control — zero Java consumers
  # (rc=1, empty) against stale-draft-hours returning a hit under identical flags,
  # globs and directory (rc=0). A config key promising a deletion nobody performs is
  # exactly the drift the retention gate exists to catch, and leaving it here invited
  # someone to publish it as a retention period later. The removed key is recorded by
  # name under .deliberately_unpublished in docs/retention-manifest.json; it is NOT
  # named here, because a grep asserting it is gone from this file cannot distinguish
  # a real occurrence from a comment mentioning it.
  stale-draft-hours: ${CLEANUP_STALE_DRAFT_HOURS:24}
