# Local development profile with Docker stack
# This profile connects to the Dockerized PostgreSQL on port 5433
# To use: Set active profile to 'local' in IntelliJ run configuration
# OR: Set environment variable SPRING_PROFILES_ACTIVE=local

spring:
  datasource:
    # Config-injected, like every other profile (GLOBAL_RULE_6). These were the literals
    # `jtoye_app` / `secret` until QA run 20260902-134741 measured that they cannot
    # authenticate: `psql -h localhost -p 5433 -U jtoye_app` with that password fails
    # byte-identically to a garbage-password control, and even with a correct password
    # jtoye_app OWNS every public table, so DatabaseConfigurationValidator refuses to boot.
    # The profile's one genuine purpose is the 5433 port, which is preserved as a default.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:jtoye}
    username: ${DB_USER:jtoye_runtime}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}  # From docker-compose.full-stack.yml; rotated 2026-08-29 (SEC-5), no hardcoded literal

# Object storage (Phase 36, D-08). This profile is the IntelliJ path to the same hybrid runtime
# scripts/start-dev.sh drives: infra/docker-compose.yml runs Azurite on 127.0.0.1:10000, which
# application.yml's emulator connection string already targets. The fail-fast storage check
# stays ON here too, so a fresh Azurite volume needs core-java to create jtoye-images (access
# level blob) and jtoye-quarantine (private) itself. The profile's other purpose, the 5433
# database port above, is unchanged.
storage:
  blob:
    create-containers: true

# Local development re-enables the metrics and Prometheus scrape endpoints
# that the base profile (application.yml) deliberately omits. Safe here —
# this profile only runs against a localhost Docker stack, never in prod.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
