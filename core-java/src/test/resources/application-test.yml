# Test profile configuration
# Automatically activated during test execution

spring:
  cache:
    type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
  rabbitmq:
    listener:
      simple:
        auto-startup: false
    host: localhost
    port: 0
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TINYINT AS SMALLINT
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jtoye:
  geo:
    postcode-import:
      # DELIBERATELY the opposite of the dev default (true), and the divergence IS the point:
      # dev must be populated or every locality feature silently does nothing, while tests must
      # be fast and offline. The real artefact is 1,748,230 rows and COPY-ing it into every
      # Testcontainers Postgres would cost minutes per container for data no test needs.
      #
      # PostcodeCentroidImportIntegrationTest re-enables the importer explicitly and points it
      # at the 7-row fixture, so the import path is still exercised end-to-end — it is just not
      # exercised at 1.7 M rows on every unrelated test.
      enabled: false
  gdpr:
    dsar:
      # 31.1-07 (D-19): a PER-RUN RANDOM key, never a literal. Spring Boot's random.value yields
      # 32 hex characters per resolution, so two of them make the 64 hex characters DsarCipher
      # requires; DsarSubjectAddressIntegrationTest measures that rather than assuming it. Each
      # resolution draws fresh randomness, which is fine: DsarCipher reads the property once, at
      # construction, and one context holds one cipher. Deliberately NOT routed through the
      # DSAR_ENCRYPTION_KEY env var, so a developer's real key can never leak into a test run.
      encryption-key: ${random.value}${random.value}

storage:
  blob:
    # TEST-CONTEXT opt-out of the boot-time container probe (StorageStartupValidator), NOT a
    # runtime one: D-08 keeps the probe ON in every runtime, and main application.yml sets it as a
    # literal true that no env var maps. Test contexts stub storage or never touch it and have no
    # Azurite, so the probe would fail every one of them at startup. The probe itself is proven
    # against a real Azurite by StorageStartupValidatorIntegrationTest, both directions. The shape
    # rules still run in every test context (they need no network), and the application.yml
    # emulator default passes them.
    validate-on-startup: false

rate-limiting:
  enabled: false

notification:
  email:
    enabled: false

logging:
  level:
    uk.jtoye: DEBUG
