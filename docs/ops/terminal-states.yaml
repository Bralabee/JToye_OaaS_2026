# Terminal-failure-state register — J'Toye OaaS
#
# A terminal state is one where work has permanently stopped and will not resume on its own.
# Every such state must have: a locator that resolves to real code, a consequence written from the
# USER's point of view, an owner (or an honestly-recorded absence), a runnable operator action, and
# a detection signal — or a DATED deferral saying when the absence of detection becomes a failure.
#
# Enforced by scripts/check-terminal-states.sh (phase 27, plan 27-00). An expired `deferred.expires`
# is a FAIL, so a deferral cannot quietly become permanent.
#
# ON `owner`. This project has NO platform-operator identity and no ops rota — all admin is
# tenant-scoped, and there is no cross-tenant operator role (recorded architectural fact, not an
# oversight). The schema example in 27-00-PLAN.md shows `owner: vendor-integrations`; no such team
# exists here and writing it down would be fabrication. `maintainer` is used where the maintainer
# can actually act. TS-11 carries UNASSIGNED because its problem is precisely that the event it
# publishes has no recipient that exists.
#
# ON `runbook`. All rows point at docs/runbooks/terminal-states.md, which carries one section per
# row. Where an alert-specific section also exists in docs/runbooks/alerts.md it is named in
# operator_action instead, because 27-03 owns that file.
#
# Row count is >= 14 by contract. Rows TS-15 and TS-16 are ABOVE that contract: they were found
# while executing 27-00 Tasks 0-1, not during planning, and are folded in here rather than filed as
# follow-ups — see their `discovered` fields.

version: 1
states:

  - id: TS-01
    name: order.state-changes.dlq
    kind: amqp_dlq
    locator: "core-java/src/main/java/uk/jtoye/core/config/RabbitMQConfig.java:35"
    subject: "DLQ_QUEUE"
    what_stops: "Order state-change events that exhausted retries. The kitchen display and the vendor's order list stop reflecting reality for those orders, and no customer-facing status ever updates again."
    owner: maintainer
    detection:
      signal: 'rabbitmq_detailed_queue_messages_ready{queue="order.state-changes.dlq"}'
      alert: DeadLetterQueueNonEmpty
    runbook: "docs/runbooks/terminal-states.md#ts-01"
    operator_action: "Peek non-destructively: rabbitmqadmin get queue=order.state-changes.dlq ackmode=reject_requeue_true count=10. NEVER ack — ack destroys the message and the evidence. Read x-death for the original exchange and failure count, decide replay vs discard, and record the decision before acting."
    deferred:
      reason: "No alert rule references any DLQ depth. The aggregated rabbitmq scrape emits no queue label, so no per-queue selector can match until 27-03 adds the /metrics/detailed job. Evidence: baselines/B-2.txt."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-02
    name: payment.events.dlq
    kind: amqp_dlq
    locator: "core-java/src/main/java/uk/jtoye/core/config/RabbitMQConfig.java:40"
    subject: "PAYMENT_EVENTS_DLQ"
    what_stops: "Payment events that exhausted retries. Money moved at Stripe but the platform's ledger never learns, so the vendor's revenue figures and the customer's receipt disagree with the card statement."
    owner: maintainer
    detection:
      signal: 'rabbitmq_detailed_queue_messages_ready{queue="payment.events.dlq"}'
      alert: DeadLetterQueueNonEmpty
    runbook: "docs/runbooks/terminal-states.md#ts-02"
    operator_action: "Peek non-destructively: rabbitmqadmin get queue=payment.events.dlq ackmode=reject_requeue_true count=10. NEVER ack. Reconcile each event against Stripe before deciding replay vs discard — a discarded payment event is a permanent ledger gap, not a lost notification."
    deferred:
      reason: "Same as TS-01 — no per-queue series exists to alert on until 27-03 lands the detailed scrape."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-03
    name: webhook.deliveries.dlq
    kind: amqp_dlq
    locator: "core-java/src/main/java/uk/jtoye/core/config/RabbitMQConfig.java:70"
    subject: "WEBHOOK_DELIVERIES_DLQ"
    what_stops: "Vendor webhook deliveries that exhausted retries. The vendor's integration silently stops receiving events — no error reaches them, their automation simply goes quiet."
    owner: maintainer
    detection:
      signal: 'rabbitmq_detailed_queue_messages_ready{queue="webhook.deliveries.dlq"}'
      alert: DeadLetterQueueNonEmpty
    runbook: "docs/runbooks/terminal-states.md#ts-03"
    operator_action: "Peek non-destructively: rabbitmqadmin get queue=webhook.deliveries.dlq ackmode=reject_requeue_true count=10. NEVER ack. THIS QUEUE HOLDS NINE REAL VENDOR EVENTS as of 2026-07-27, dead since 2026-07-15, deliberately preserved byte-identical (payloads, x-death and __TypeId__ intact). 27-03 archives and characterises them; 27-02's human checkpoint decides replay vs discard before the broker volume is destroyed. Do not purge. Assert on the DELTA, never on depth == 9."
    related: ["#205", "27-05"]
    deferred:
      reason: "Same as TS-01. The producer defect that filled this queue is fixed (27-05, commit 2f8eeca — untrusted-package deserialization); the batch itself is still awaiting disposition."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-04
    name: media.process.dlq
    kind: amqp_dlq
    locator: "core-java/src/main/java/uk/jtoye/core/config/RabbitMQConfig.java:86"
    subject: "MEDIA_EVENTS_DLQ"
    what_stops: "Image-processing jobs that exhausted retries. The vendor's uploaded photo stays stuck showing 'processing' forever, and the product it belongs to goes to market without an image."
    owner: maintainer
    detection:
      signal: 'rabbitmq_detailed_queue_messages_ready{queue="media.process.dlq"}'
      alert: DeadLetterQueueNonEmpty
    runbook: "docs/runbooks/terminal-states.md#ts-04"
    operator_action: "Peek non-destructively: rabbitmqadmin get queue=media.process.dlq ackmode=reject_requeue_true count=10. NEVER ack. Cross-reference each job against media_asset rows in PENDING or FAILED — see TS-07, whose quarantined bytes may already have been deleted by the reaper."
    deferred:
      reason: "Same as TS-01."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-05
    name: payment_event_outbox poison
    kind: outbox_poison
    locator: "core-java/src/main/resources/db/migration/V46__outbox_reliability.sql:24"
    subject: "poison"
    covers:
      # The poison FLAG is defined in the migration (the locator); the terminal
      # FAILED status it pairs with lives on the entity. D-3 discovers the entity
      # constant, so the row must account for that file too or X-1 reports an
      # undetected terminal state that is in fact this one.
      - "core-java/src/main/java/uk/jtoye/core/payment/PaymentEventOutbox.java#FAILED"
    what_stops: "A payment event that failed to publish enough times to be marked poison. It will never be retried, so the same ledger divergence as TS-02 occurs — but silently inside Postgres, with no queue to inspect."
    owner: maintainer
    detection:
      signal: payment_outbox_dead_letter_total
      alert: OutboxPoisonRows
    runbook: "docs/runbooks/terminal-states.md#ts-05"
    operator_action: "SELECT id, aggregate_id, attempts, last_error FROM payment_event_outbox WHERE poison = true; — remember the table is RLS-scoped, so set the tenant GUC first or it returns zero rows and reads as clean. Fix the cause, then clear poison to allow the flusher to resurrect the row."
    deferred:
      reason: "The counter payment_outbox_dead_letter_total is registered and exported (verified live at 0.0) but referenced by NO alert rule. 27-03 owns all alerts.yml rule content."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-06
    name: media_event_outbox poison
    kind: outbox_poison
    locator: "core-java/src/main/resources/db/migration/V58__media_event_outbox.sql:29"
    subject: "poison"
    covers:
      - "core-java/src/main/java/uk/jtoye/core/media/MediaEventOutbox.java#FAILED"
    what_stops: "A media event that failed to publish enough times to be marked poison. The upload pipeline never starts for that asset, so the vendor's image is stuck exactly as in TS-04 — with no queue entry to find it by."
    owner: maintainer
    detection:
      signal: media_outbox_dead_letter_total
      alert: OutboxPoisonRows
    runbook: "docs/runbooks/terminal-states.md#ts-06"
    operator_action: "SELECT id, aggregate_id, attempts, last_error FROM media_event_outbox WHERE poison = true; — RLS-scoped, set the tenant GUC first. Same resurrect procedure as TS-05."
    deferred:
      reason: "Same as TS-05 — media_outbox_dead_letter_total is exported but referenced by no rule."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-07
    name: media_asset FAILED
    kind: entity_status
    locator: "core-java/src/main/java/uk/jtoye/core/media/MediaAsset.java:44"
    subject: "FAILED"
    covers:
      - "core-java/src/main/java/uk/jtoye/core/media/MediaAsset.java#FAILED"
    what_stops: "A vendor image upload that never reached ACTIVE. Since 27-01 (V60) there are TWO sub-cases and they are NOT equally bad — distinguish them by quarantine_reclaimed_at before telling a vendor anything. (a) DISPATCH STALL: the reaper flipped a stale PENDING row whose event WAS dispatched, or was poison. It performs NO object delete — the original bytes are RETAINED and the asset is re-drivable via POST /api/v1/media/{assetId}/reprocess until quarantine_expires_at (72 h default). (b) WORKER VETO or EXPIRED: MediaProcessingWorker rejected the bytes on validation, or MediaQuarantineRetentionSweep reclaimed them at the retention horizon; quarantine_reclaimed_at is stamped and only a fresh upload can recover it. BEFORE 27-01 every FAILED asset had its bytes deleted first, so this state was unrecoverable by retry in ALL cases — a broker outage longer than reaperGraceMs (900_000 ms) destroyed every upload in flight."
    owner: maintainer
    detection:
      signal: 'increase(media_reaper_stalled_failed_total[1h]) > 0'
      alert: MediaStallFailures
    runbook: "docs/runbooks/terminal-states.md#ts-07"
    operator_action: "Check TS-17 FIRST — a suspended stall sweep means nothing is being classified at all. Then, RLS-scoped: SELECT id, tenant_id, created_at, failure_reason, quarantine_reclaimed_at, quarantine_expires_at FROM media_asset WHERE status = 'FAILED'; — rows with quarantine_reclaimed_at IS NULL still hold their bytes and the vendor can Re-process them from the review queue; rows with it stamped, or past quarantine_expires_at, need a re-upload. Check broker availability across the window before concluding a file was invalid."
    related: ["27-01", "TS-17"]
    deferred:
      reason: "The signal above names a real exported counter (the reaper increments media.reaper.stalled_failed at the flip) but NO alert rule consumes it yet — 27-03 owns rule content. 27-01's code change has LANDED, so this row's prose and detection signal were rewritten in that PR: the previous text described the delete-then-FAIL ordering and cited a reaper line number that no longer performs a byte delete at all. Locators are deliberately written WITHOUT an inline line reference in prose here — a row that names the stale locator it is correcting re-trips the very check that catches it."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-08
    name: webhook_delivery FAILED
    kind: entity_status
    locator: "core-java/src/main/java/uk/jtoye/core/webhook/WebhookDelivery.java:47"
    subject: "FAILED"
    covers:
      - "core-java/src/main/java/uk/jtoye/core/webhook/WebhookDelivery.java#FAILED"
    what_stops: "One outbound webhook delivery, terminally. The vendor's system never learns that this specific order, refund or status change happened — and because delivery is per-event, their data diverges from the platform's by exactly the events that failed."
    owner: maintainer
    detection:
      signal: 'count of webhook_delivery rows in status FAILED'
      alert: WebhookDeliveriesFailed
    runbook: "docs/runbooks/terminal-states.md#ts-08"
    operator_action: "SELECT id, subscription_id, event_type, attempts, last_status_code FROM webhook_delivery WHERE status = 'FAILED'; — RLS-scoped. A 4xx last_status_code means the vendor's endpoint rejected it (their fix); 5xx or timeout means theirs was down (replay is appropriate). Contact the vendor before replaying anything financial."
    related: ["#205"]
    deferred:
      reason: "No metric or alert exists for FAILED delivery counts. 27-03 owns rule content."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-09
    name: webhook_subscription AUTO_PAUSED
    kind: entity_status
    locator: "core-java/src/main/java/uk/jtoye/core/webhook/WebhookSubscription.java:46"
    subject: "AUTO_PAUSED"
    covers:
      - "core-java/src/main/java/uk/jtoye/core/webhook/WebhookSubscription.java#AUTO_PAUSED"
    what_stops: "EVERY future event for one vendor subscription, not just the failed one. The worker flips the subscription to AUTO_PAUSED after sustained delivery failure (WebhookDeliveryWorker.java:229) and nothing tells the vendor. Their integration goes permanently quiet and they discover it from missing data, not from an error."
    owner: maintainer
    detection:
      signal: 'count of webhook_subscription rows in status AUTO_PAUSED'
      alert: WebhookSubscriptionsAutoPaused
    runbook: "docs/runbooks/terminal-states.md#ts-09"
    operator_action: "SELECT id, tenant_id, target_url, updated_at FROM webhook_subscription WHERE status = 'AUTO_PAUSED'; — RLS-scoped. Confirm the vendor's endpoint is healthy, THEN notify the vendor before re-enabling: silently resuming can flood a vendor with a backlog they did not expect."
    related: ["#205"]
    deferred:
      reason: "No metric, no alert, and no vendor-facing notification. This is the highest-consequence unowned state in the register — a paying vendor's integration stops with nobody informed. 27-03 owns rule content; the vendor-notification half has no owner yet."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-10
    name: tenants.keycloak_deprovisioned_at NULL on an OFFBOARDED tenant
    kind: entity_status
    locator: "core-java/src/main/java/uk/jtoye/core/tenant/Tenant.java:76"
    subject: "keycloak_deprovisioned_at"
    what_stops: "Identity-layer offboarding. The tenant is OFFBOARDED and TenantStatusInterceptor rejects their requests, but their Keycloak users were never disabled — so a stolen or cached token can still mint at the IdP. Deprovisioning runs best-effort after commit, so a Keycloak outage leaves this NULL with only an ERROR log."
    owner: maintainer
    detection:
      signal: 'count of tenants rows WHERE status = OFFBOARDED AND keycloak_deprovisioned_at IS NULL'
      alert: TenantDeprovisioningIncomplete
    runbook: "docs/runbooks/terminal-states.md#ts-10"
    operator_action: "SELECT id, name, offboarded_at FROM tenants WHERE status = 'OFFBOARDED' AND keycloak_deprovisioned_at IS NULL; — the tenants table is deliberately RLS-free. Re-trigger with POST /api/v1/admin/tenants/{id}/keycloak/deprovision (idempotent). Requires jtoye.keycloak.admin.enabled=true and a base-url, or it returns RFC 7807 400 'not configured'."
    deferred:
      reason: "Detected only by an ERROR log line, which nothing scrapes or alerts on. 27-03 owns rule content."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-11
    name: onboarding stalled
    kind: entity_status
    locator: "core-java/src/main/java/uk/jtoye/core/onboarding/OnboardingEventPublisher.java:41"
    subject: "ONBOARDING_STALLED"
    what_stops: "A vendor's application to join the platform. The ONBOARDING_STALLED event is published correctly and reaches the outbox — and then nobody receives it, because no cross-tenant operator identity exists in this system. A prospective vendor waits indefinitely and the business never learns it lost them."
    owner: UNASSIGNED
    detection:
      signal: ONBOARDING_STALLED
      alert: null
    runbook: "docs/runbooks/terminal-states.md#ts-11"
    operator_action: "SELECT id, tenant_id, status, updated_at FROM vendor_onboarding WHERE status IN ('VERIFYING','ACTION_REQUIRED') AND updated_at < now() - interval '7 days'; — RLS-scoped, so loop tenants or the result is empty and reads as clean. Then work the queue at GET /api/v1/onboarding/admin/reviews, which is tenant-scoped and therefore cannot show you every tenant at once."
    deferred:
      reason: "owner is UNASSIGNED because there is no platform-operator identity to assign it TO — all admin in this system is tenant-scoped by design, so no role exists that could receive a cross-tenant stalled-onboarding alert. Naming a plausible team here would be fabrication and would make the register read as covered when it is not. Closing this needs a product decision about operator identity, not a rule."
      expires: 2026-09-30
      tracked_by: "arch_no_platform_operator"

  - id: TS-12
    name: scrape target down
    kind: infra_target
    locator: "infra/monitoring/prometheus/prometheus.yml.tmpl:72"
    subject: "job_name"
    what_stops: "All observability for one service. Every alert whose selector depends on that target's metrics silently evaluates against zero series and stays inactive — the monitoring reports healthy precisely because it can see nothing."
    owner: maintainer
    detection:
      signal: 'up == 0'
      alert: ServiceDown
    runbook: "docs/runbooks/terminal-states.md#ts-12"
    operator_action: "curl -sG http://localhost:9091/api/v1/targets --data-urlencode 'state=any' and read health + lastError per job. NOTE the delivery gap: ServiceDown fires correctly and Alertmanager delivers it, but the destination is ops@jtoye.local via Mailhog — a dev sink with no human behind it. A firing ServiceDown reaches nobody. Verified: this alert fired for over 46 hours (activeAt 2026-07-25T13:01:41Z) before being found by hand."
    related: ["27-00 Task 4"]

  - id: TS-13
    name: exporter up but blind
    kind: infra_exporter
    locator: "infra/monitoring/docker-compose.monitoring.yml:175"
    subject: "postgres-exporter"
    what_stops: "Every PostgreSQL metric. DatabaseDown watches up{job=\"postgres\"}, which is 1 because the exporter's own HTTP endpoint answers, so the database reports healthy while nothing about it is being measured. TooManyDatabaseConnections matches zero series for the same reason."
    owner: maintainer
    resolved: "2026-07-29, alongside TS-15. The rule half landed with 27-03 (DatabaseDown became up{job=\"postgres\"} == 0 or pg_up == 0) but this row was left deferred, and its deferral reason — 'referenced by NO alert rule — verified: grep -c pg_up alerts.yml = 0' — has been FALSE since that merge: alerts.yml:85 reads pg_up. Nothing would have caught that until 2026-09-30, because a deferral is only ever re-examined on its expiry date. detection.alert was DatabaseExporterBlind, never built and no longer wanted, for the same reason given on TS-15."
    detection:
      signal: 'pg_up{job="postgres"}'
      alert: DatabaseDown
    runbook: "docs/runbooks/terminal-states.md#ts-13"
    operator_action: "Compare the two queries — they disagree, and that disagreement IS the state: pg_up{job=\"postgres\"} vs up{job=\"postgres\"}. Then read docker logs jtoye-postgres-exporter for the underlying error. Two causes were found stacked here: sslmode=require against a server with ssl=off, and a POSTGRES_EXPORTER_PASSWORD that never matched the database. TLS negotiation precedes authentication, so the first masked the second entirely. Fixing one and re-testing is not enough — assert pg_up == 1."
    related: ["baselines/B-6.txt", "baselines/B-6-CONTROL-DEFECT.md", "TS-15"]
    residual_risk: "A fresh clone still reproduces pg_up=0 behind a green up target, because .env.example ships POSTGRES_EXPORTER_PASSWORD=CHANGE_ME by design and cannot carry the fix. That is an environment-setup issue, not a detection gap: DatabaseDown now fires on it, which is the whole point."

  - id: TS-14
    name: alert bound to the wrong subject
    kind: detection_defect
    locator: "infra/monitoring/prometheus/alerts.yml:127"
    subject: "HighMemoryUsage"
    what_stops: "core-java heap exhaustion and GC storms are unobserved. HighMemoryUsage (:96) and FrequentGarbageCollection (:111) both carry service: core-java but their jvm_* selectors are unqualified, so while core-java's target was down they bound to the only JVM Prometheus could see — Keycloak's. They are worse than dataless: a naive 'selector matches >= 1 series' liveness check reports them GREEN."
    owner: maintainer
    detection:
      signal: 'count(jvm_memory_used_bytes{job="core-java"}) > 0'
      alert: null
    runbook: "docs/runbooks/terminal-states.md#ts-14"
    operator_action: "Run count(jvm_memory_used_bytes) by (job) and confirm a job=\"core-java\" row exists alongside job=\"keycloak\". Before 27-00 Task 1 only keycloak appeared (8 series); after the scrape-port fix both appear. Any rule carrying a service: label must have its selector qualified by the matching job, or it silently watches whatever else exports that metric name."
    related: ["baselines/B-7.txt"]
    deferred:
      reason: "The scrape-port fix (27-00 Task 1) restored the core-java series so the rules can now see their subject, but the SELECTORS are still unqualified — a second JVM appearing in the scrape set would re-bind them. 27-03 owns the rule fix; 27-00 Task 4's L-2b subject-correctness check is what detects it."
      expires: 2026-09-30
      tracked_by: "27-03"

  - id: TS-15
    name: RedisDown watches the scrape target, not the exporter's upstream gauge
    kind: detection_defect
    discovered: "2026-07-27, while verifying 27-00 Task 1. Not in the F-9 planning census."
    locator: "infra/monitoring/prometheus/alerts.yml:302"
    subject: "RedisDown"
    what_stops: "All Redis observability, in exactly the way TS-13 describes for Postgres. RedisDown evaluated up{job=\"redis\"} == 0, which only proves the exporter's HTTP endpoint answers. redis_up — the exporter's own upstream-health gauge, which reports whether it can actually reach Redis — was live and referenced by NO rule. Sessions and cache could be entirely unreachable while RedisDown stayed inactive."
    owner: maintainer
    resolved: "2026-07-29, issue #342 item 5. RedisDown now evaluates up{job=\"redis\"} == 0 or redis_up == 0 — the same shape 27-03 gave DatabaseDown. detection.alert was RedisExporterBlind, a separate alert that was never built and is no longer wanted: folding the gauge into the existing rule is strictly better than a second rule for the same outage, because it cannot be silenced independently of the thing it is about."
    detection:
      signal: 'redis_up{job="redis"}'
      alert: RedisDown
    runbook: "docs/runbooks/terminal-states.md#ts-15"
    operator_action: "Compare redis_up against up{job=\"redis\"} — the disagreement IS the state, exactly as TS-13 does for pg_up. up=1 with redis_up=0 means the exporter is healthy and Redis is not; that is the case the old rule could not see."
    related: ["TS-13", "baselines/B-6.txt"]
    verification: "Falsified before being trusted, because this was LATENT — it had never been observed failing, which is why it outlived the review that fixed its postgres twin. Induced 2026-07-29 by stopping jtoye-redis while leaving jtoye-redis-exporter running: up{job=\"redis\"}=1, redis_up=0, OLD expression 0 samples (would NOT have fired through a total cache outage), NEW expression 1 sample. On restore both return 0 samples, so it does not page in steady state."

  - id: TS-16
    name: running container config drifted from the compose file that defines it
    kind: detection_defect
    discovered: "2026-07-27, while auditing container health during 27-00 Task 1. Not in the F-9 planning census."
    locator: "scripts/check-container-config-drift.sh:2"
    subject: "check-container-config-drift"
    what_stops: "Nothing user-facing yet — but it is the detection gap that lets everything else in this register go stale unnoticed. check-runtime-freshness.sh compares BUILT services (core-java, frontend, edge-go, mcp-server) against the source they are built from. A service running a third-party image whose COMPOSE CONFIG changed is outside its scope entirely, so the running container can contradict the committed file indefinitely with both parity gates green."
    owner: maintainer
    detection:
      signal: "bash scripts/check-container-config-drift.sh — exit 1 on drift, 2 on VOID"
      alert: null
    runbook: "docs/runbooks/terminal-states.md#ts-16"
    operator_action: "For each monitoring service compare the running container against the declared config, e.g. healthcheck: docker inspect jtoye-<svc> --format '{{json .Config.Healthcheck}}' vs the service block in infra/monitoring/docker-compose.monitoring.yml. Recreate with docker compose --env-file <repo-root>/.env -f infra/monitoring/docker-compose.monitoring.yml up -d --force-recreate <svc>. NOTE: a plain `restart` does NOT re-read the config, and the compose project directory is infra/monitoring/ which has no .env, so --env-file is required or interpolation fails."
    related: ["baselines/B-6-CONTROL-DEFECT.md"]
    detector_built: "2026-07-30, issue #347 — scripts/check-container-config-drift.sh. Compares CONTENT (healthcheck.test, restart policy, and image for non-built services) between `docker compose config` and `docker inspect`, per file, across docker-compose.full-stack.yml and infra/monitoring/docker-compose.monitoring.yml. First clean run: 15 compared, 0 drift, 4 declared-but-not-running (one-shot init containers, reported not skipped). Four break arms all fail correctly, including a re-declaration of the historical wget healthcheck. NOT in CI — a runner has no containers, same enforcement model as check-runtime-freshness.sh and check-alert-liveness.sh: its exit code goes in the phase-close record."
    deferred:
      reason: "WHAT REMAINS DEFERRED IS THE ALERT, NOT THE DETECTOR — the detector shipped 2026-07-30 (see detector_built). detection.alert stays null because container config drift has no Prometheus series to alert on; it is caught by an executable gate run against a live stack, not by a rule. This block is retained solely because X-2 requires a named alert or a dated deferral, and inventing an alert name that will never exist would be the fabrication this register forbids. ORIGINAL FINDING, kept because it is the worked example: jtoye-redis-exporter ran a wget-based healthcheck that its scratch-based image cannot execute, reporting 'unhealthy' for 20 days while working perfectly (redis_up=1, metrics flowing). The compose file had ALREADY removed that healthcheck, with a comment explaining this exact failure, in commit 7dcaf93 at 2026-07-07 22:47:55 UTC — the container was created at 2026-07-07 22:23:46 UTC, 84 minutes earlier, and was never recreated. The image itself declares no healthcheck (verified null), so the container was the only source. Content-based sweep of all five monitoring services found redis-exporter to be the sole mismatch. Timestamp comparison alone is NOT a sufficient detector: it flagged jtoye-prometheus as stale when that container was recreated an hour before the commit that touched its block, so any gate for this must compare CONTENT, not creation time."
      expires: 2026-09-30
      tracked_by: "27-06"

  - id: TS-17
    name: media stall sweep suspended
    kind: detection_defect
    discovered: "2026-07-27, while executing 27-01 Task 6. The 27-01 plan specifies this row as 'TS-13'; that id was already taken by the PostgreSQL exporter row, so it is filed here as TS-17 — the number moved, the content did not."
    locator: "core-java/src/main/java/uk/jtoye/core/media/MediaPendingReaper.java:185"
    subject: "media.reaper.suspended"
    what_stops: "Classification of EVERY stalled upload, platform-wide. The reaper could not show the dispatch path healthy from this JVM (broker admin absent, queue info threw or was null, zero consumers broker-wide, or the local media.process listener container is missing/stopped/unsubscribed — see the Liveness enum), so the whole tick returns before touching a single tenant. Fails CLOSED by design (D-05): while suspended, no PENDING asset can be wrongly flipped to FAILED, but none is classified either, so a vendor sees the DELAYED affordance indefinitely rather than a terminal state with a Re-process button. Bounded-growth is NOT affected — MediaQuarantineRetentionSweep is deliberately not gated on this and still reclaims bytes at the 72 h horizon. NOT OBSERVABLE FROM HERE: a remote replica's dead consumer; the probe only sees this JVM's own listener registry."
    owner: maintainer
    detection:
      signal: 'increase(media_reaper_suspended_total[30m]) > 0'
      alert: MediaReaperSuspended
    runbook: "docs/runbooks/terminal-states.md#ts-17"
    operator_action: "Confirm the broker is reachable and that media.process has consumers: rabbitmq_queue_consumers{queue=\"media.process\"}, or rabbitmqctl list_queues name consumers. If the queue is fine, the local listener container is the suspect — restart core-java and re-check. The suspension reason is logged verbatim at WARN as event=media_reaper_suspended reason=<Liveness>, which names which of the eight probes failed; read that before changing anything. URGENCY: the retention sweep keeps running, so a suspension lasting longer than jtoye.media.quarantine-retention-ms (72 h default) converts recoverable stalled uploads into expired, unrecoverable ones — see TS-07 sub-case (b)."
    related: ["27-01", "TS-07", "TS-04"]
    deferred:
      reason: "media.reaper.suspended is incremented in code (MediaPendingReaper.java:185) but Micrometer only exports a counter after its first increment, so media_reaper_suspended_total is absent from /actuator/prometheus on a healthy stack — verified: the sibling media_reaper_undispatched_skipped_total reads 3.0 there because it HAS fired. No alert rule consumes it; 27-03 owns rule content and must also confirm the series exists before writing a rule against it."
      expires: 2026-09-30
      tracked_by: "27-03"
