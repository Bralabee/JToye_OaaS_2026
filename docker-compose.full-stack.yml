# Full-stack Docker Compose for local development and testing
# Includes: PostgreSQL, Keycloak, Redis, RabbitMQ, core-java, edge-go, frontend
#
# Requires a .env file — copy .env.example to .env and fill in values.
#
# USAGE:
#   docker-compose -f docker-compose.full-stack.yml up
#
# See docs/DOCKER_QUICK_START.md for detailed instructions

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jtoye-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' && psql -U ${POSTGRES_USER} -d keycloak -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jtoye-network

  # Keycloak Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: jtoye-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8085"
      KC_HOSTNAME_STRICT: "false"
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8085:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && timeout 2 cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    restart: on-failure:3
    networks:
      - jtoye-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jtoye-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - jtoye-network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: jtoye-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jtoye-network

  # Core Java API (Spring Boot)
  core-java:
    build:
      context: .
      dockerfile: core-java/Dockerfile
    container_name: jtoye-core-java
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KC_ISSUER_URI: http://keycloak:8080/realms/jtoye-dev
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      NOTIFICATION_EMAIL_ENABLED: "true"
      NOTIFICATION_EMAIL_TRACKING_BASE_URL: "http://localhost:3000"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: jtoye-images
      S3_PUBLIC_URL: http://localhost:9000/jtoye-images
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_ENABLED: "true"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llava:7b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    extra_hosts:
      - "keycloak-host:host-gateway"
    networks:
      - jtoye-network

  # Edge Go API Gateway
  edge-go:
    build:
      context: ./edge-go
      dockerfile: Dockerfile
    container_name: jtoye-edge-go
    environment:
      CORE_API_URL: http://core-java:9090
      KC_ISSUER_URI: http://keycloak:8080/realms/jtoye-dev
      PORT: 8080
    ports:
      - "8089:8080"
    depends_on:
      core-java:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/edge", "health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "keycloak-host:host-gateway"
    networks:
      - jtoye-network

  # Frontend (Next.js 14)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:9090
    container_name: jtoye-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:9090
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER: http://localhost:8085/realms/jtoye-dev
      KEYCLOAK_ISSUER_INTERNAL: http://keycloak:8080/realms/jtoye-dev
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8085/realms/jtoye-dev
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - core-java
      - keycloak
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - jtoye-network

  # MinIO — S3-compatible object storage for images
  minio:
    image: minio/minio:latest
    container_name: jtoye-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jtoye-network

  # MinIO init — creates bucket with public-read policy
  minio-init:
    image: minio/mc:latest
    container_name: jtoye-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/jtoye-images &&
      mc anonymous set download local/jtoye-images &&
      echo 'Bucket jtoye-images ready with public-read policy'
      "
    networks:
      - jtoye-network

  # Ollama — local AI for image recognition (GPU-accelerated, free)
  ollama:
    image: ollama/ollama:latest
    container_name: jtoye-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - jtoye-network

  # Ollama model pull — downloads the vision model on first run
  ollama-init:
    image: ollama/ollama:latest
    container_name: jtoye-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Pulling vision model (this may take a few minutes on first run)...' &&
      OLLAMA_HOST=http://ollama:11434 ollama pull llava:7b &&
      echo 'Vision model ready'
      "
    networks:
      - jtoye-network

  # Mailhog — local SMTP testing (view emails at http://localhost:8025)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: jtoye-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jtoye-network

networks:
  jtoye-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  keycloak_data:
  minio_data:
  ollama_data:
