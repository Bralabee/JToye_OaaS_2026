# Full-stack Docker Compose for local development and testing
# Includes: PostgreSQL, Keycloak, Redis, RabbitMQ, core-java, edge-go, frontend, MinIO (S3), Ollama (AI), Mailhog (SMTP)
#
# Requires a .env file — copy .env.example to .env and fill in values.
#
# USAGE:
#   docker-compose -f docker-compose.full-stack.yml up
#
# See docs/DOCKER_QUICK_START.md for detailed instructions
#
# PUBLISHED-PORT BIND ADDRESS (issues #438 / #441)
# ------------------------------------------------
# Every INFRASTRUCTURE port below is published on ${JTOYE_BIND_HOST}, which
# defaults to 127.0.0.1 — loopback only. Previously they carried no bind address
# at all, which Docker expands to 0.0.0.0, so the database, cache, broker
# management UI, object storage, identity provider and the captured-email archive
# were all reachable from any network the workstation happened to join.
#
# Loopback is transparent for the way this stack is actually used, and that was
# MEASURED rather than assumed before the change:
#   - the browser, Playwright and the host CLI all reach these services over
#     127.0.0.1, which is unaffected;
#   - container-to-container traffic uses compose service names on the
#     jtoye-network bridge and never touches a published port;
#   - the `extra_hosts: host-gateway` aliases do NOT provide a working path to a
#     published port from these containers — they sit on the jtoye-network
#     bridge, from which the default-bridge gateway is not routable. A probe from
#     the frontend container to the gateway address timed out, and to
#     `localhost` was refused, BEFORE this change. Nothing regressed because
#     nothing was using it.
#
# Set JTOYE_BIND_HOST=0.0.0.0 in .env for the deliberate cases (testing the
# storefront from a phone on the same LAN, for example). That is an explicit,
# auditable opt-in rather than the silent default it used to be.
#
# The APPLICATION tier (core-java, edge-go, frontend, mcp-server) is deliberately
# NOT rebound here — see scripts/check-infra-exposure.sh, which records each
# exemption with its reason and fails closed on any service not covered.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jtoye-postgres
    restart: unless-stopped
    # Issue #94 [P2-3]: max_connections is EXPLICIT (PG15 default is 100).
    # This instance is shared by core-java (Hikari, ≤2 replicas × 20),
    # Keycloak (Agroal, capped at 20 below — its default is 100!), the
    # postgres-exporter (monitoring stack), healthcheck psql sessions, and
    # 3 superuser-reserved slots. 200 is the platform-wide budget constant —
    # the SAME value the jtoye-infrastructure Postgres must run with in k8s
    # (k8s/DEPLOYMENT.md "Database Connection Budget"). CI asserts the math
    # via k8s/scripts/check-connection-math.sh.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by infra/db/init/00-create-db.sql via psql \getenv to create the
      # non-owner RLS role `jtoye_app` with the SAME password core-java presents.
      # That role used to be created with a hardcoded 'secret', so any stack
      # whose DB_PASSWORD was not that literal could not authenticate on a fresh
      # volume — the failure e2e-nightly.yml hit every night. Guarded with `:?`
      # so a missing value fails at compose-parse time rather than producing a
      # role whose password nothing knows.
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (used to create the jtoye_app role)}
      # #684: since the SEC-04 split, jtoye_app is the MIGRATOR and Flyway
      # authenticates with DB_MIGRATION_PASSWORD — so 00-create-db.sql creates
      # the role with THIS value, falling back to DB_PASSWORD when it is unset
      # or empty. Deliberately no `:?` guard: absence is the supported
      # single-credential case, not a misconfiguration.
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
    ports:
      # Loopback-only by default (#438). The account reachable on this port
      # holds role attributes that bypass row-level security, so an
      # all-interfaces bind removed the tenant-isolation backstop that every
      # other layer assumes is there. Rotate alongside this change; see the
      # issue for the rest.
      - "${JTOYE_BIND_HOST:-127.0.0.1}:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' && psql -U ${POSTGRES_USER} -d keycloak -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jtoye-network

  # Keycloak realm render (issue #80) — renders the gitignored realm-export.json
  # from the tracked realm-export.template.json using rotated secrets from .env,
  # so NO literal client secret / seed password is ever committed. Runs once,
  # exits 0; keycloak waits on service_completed_successfully.
  keycloak-realm-render:
    image: alpine:3.20
    container_name: jtoye-keycloak-realm-render
    environment:
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET must be set (renders realm core-api client + feeds frontend NextAuth)}
      EDGE_API_CLIENT_SECRET: ${EDGE_API_CLIENT_SECRET:?EDGE_API_CLIENT_SECRET must be set (renders realm edge-api client)}
      KC_SEED_USER_PASSWORD: ${KC_SEED_USER_PASSWORD:?KC_SEED_USER_PASSWORD must be set (renders realm seed-user password)}
      INTEGRATION_CATALOG_RO_SECRET: ${INTEGRATION_CATALOG_RO_SECRET:?INTEGRATION_CATALOG_RO_SECRET must be set (renders realm integration-catalog-ro client)}
      INTEGRATION_ORDERS_RW_SECRET: ${INTEGRATION_ORDERS_RW_SECRET:?INTEGRATION_ORDERS_RW_SECRET must be set (renders realm integration-orders-rw client)}
      # Customer realm (jtoye-customers, Phase 18) render inputs — non-secret local-dev config.
      CUSTOMER_STOREFRONT_REDIRECT_URIS: ${CUSTOMER_STOREFRONT_REDIRECT_URIS:?CUSTOMER_STOREFRONT_REDIRECT_URIS must be set (renders customer storefront redirect URIs)}
      CUSTOMER_STOREFRONT_WEB_ORIGINS: ${CUSTOMER_STOREFRONT_WEB_ORIGINS:?CUSTOMER_STOREFRONT_WEB_ORIGINS must be set (renders customer storefront web origins)}
      CUSTOMER_VERIFY_EMAIL: ${CUSTOMER_VERIFY_EMAIL:-false}
      # Google identity-provider credentials for the customer realm (#432 / CUST-03).
      # DELIBERATELY OPTIONAL and empty by default — the IdP ships `enabled: false`
      # per ADR-0005, so the stack must boot with neither of these set. Do NOT give
      # them a `:?` guard: that would make a recorded decision to stay disabled fail
      # the whole stack. The client secret is a SECRET and never enters git; it
      # travels this same env path into the gitignored rendered realm JSON.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./infra/keycloak:/keycloak
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache gettext >/dev/null
        envsubst '$$KEYCLOAK_CLIENT_SECRET $$EDGE_API_CLIENT_SECRET $$KC_SEED_USER_PASSWORD $$INTEGRATION_CATALOG_RO_SECRET $$INTEGRATION_ORDERS_RW_SECRET' \
          < /keycloak/realm-export.template.json > /keycloak/realm-export.json
        echo "Rendered infra/keycloak/realm-export.json from template"
        # Second realm (Phase 18): render jtoye-customers passing ONLY the explicit
        # customer var list so Keycloak i18n role placeholders survive (issue #80 pattern).
        # GOOGLE_CLIENT_ID / _SECRET added for #432 (ADR-0005). A placeholder that is NOT
        # named here survives into the rendered file as a literal dollar-brace token —
        # envsubst leaves unlisted names untouched — and Keycloak would then treat that
        # literal as the client id. Extend this list; never remove it, or the i18n role
        # placeholders get eaten too.
        # NB: do not write a dollar-brace token in these comment lines. Compose
        # interpolates this entrypoint string, so it would try to resolve them and fail
        # the whole file with "invalid interpolation format".
        envsubst '$$CUSTOMER_STOREFRONT_REDIRECT_URIS $$CUSTOMER_STOREFRONT_WEB_ORIGINS $$CUSTOMER_VERIFY_EMAIL $$GOOGLE_CLIENT_ID $$GOOGLE_CLIENT_SECRET' \
          < /keycloak/realm-export-customers.template.json > /keycloak/realm-export-customers.json
        echo "Rendered infra/keycloak/realm-export-customers.json from template"
    networks:
      - jtoye-network

  # Keycloak Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: jtoye-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD must be set}
      # Issue #94 [P2-3]: Keycloak's Agroal pool defaults to 100 — it could
      # single-handedly exhaust the shared Postgres. 20 is the budget line
      # item assumed by the platform connection math (check-connection-math.sh).
      KC_DB_POOL_MAX_SIZE: "20"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8085"
      KC_HOSTNAME_STRICT: "false"
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      # Loopback-only by default (#441). KC_HOSTNAME stays `localhost`, so the
      # public issuer string is unchanged and tokens keep validating; in-cluster
      # callers already use the internal http://keycloak:8080 host.
      - "${JTOYE_BIND_HOST:-127.0.0.1}:8085:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Phase 18: second realm import (jtoye-customers). --import-realm creates realms
      # that do not yet exist and leaves the existing jtoye-dev realm untouched.
      - ./infra/keycloak/realm-export-customers.json:/opt/keycloak/data/import/realm-export-customers.json:ro
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-realm-render:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && timeout 2 cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    restart: unless-stopped
    networks:
      - jtoye-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jtoye-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      # Loopback-only by default (#441) — session + cache store.
      - "${JTOYE_BIND_HOST:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - jtoye-network

  # RabbitMQ Message Queue
  rabbitmq:
    # 4.3 series — community support ends 2026-11-30. The horizon is tracked in
    # infra/dependency-horizons.yaml and 27-00's gate fails the build before it lapses.
    # There is no in-place 3.12 -> 4.x path (3.12 -> 3.13 -> 4.2 -> 4.3, and 4.3 has no
    # Mnesia reader at all), so this moved by fresh install; see
    # docs/runbooks/rabbitmq-broker-upgrade.md.
    image: rabbitmq:4.3.4-management-alpine
    container_name: jtoye-rabbitmq
    hostname: jtoye-rabbitmq   # RabbitMQ keys its data dir by rabbit@$(hostname). Without this,
                               # every --force-recreate gets a new container-id hostname, orphans
                               # the previous node directory and boots EMPTY but healthy. Before
                               # this line existed the volume had accumulated TEN node dirs —
                               # NINE orphaned plus the one live — from past recreates, and nobody
                               # noticed, because nothing ever asserted message survival.
                               # NOTE: a tarball restores under the hostname it was TAKEN under.
                               # Snapshots predating this line need an override (see
                               # docs/runbooks/rabbitmq-broker-upgrade.md); later ones do not.
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
    ports:
      # Loopback-only by default (#441). The management UI already refuses
      # product-default credentials — that control is working and this change
      # must not disturb it, so scripts/check-infra-exposure.sh assertion D
      # re-checks it as a regression guard.
      - "${JTOYE_BIND_HOST:-127.0.0.1}:5672:5672"   # AMQP
      - "${JTOYE_BIND_HOST:-127.0.0.1}:15672:15672" # Management UI
      - "${JTOYE_BIND_HOST:-127.0.0.1}:61613:61613" # STOMP
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jtoye-network

  # Core Java API (Spring Boot)
  core-java:
    build:
      context: .
      dockerfile: core-java/Dockerfile
    # container_name removed to support --scale core-java=N
    environment:
      TZ: Europe/London
      SPRING_PROFILES_ACTIVE: dev
      # Public rate limit, widened for the LOCAL E2E runtime only (#409).
      #
      # The default is 30 requests/minute with a burst of 10. One storefront page
      # load fires ~6 public calls (shop, config, promotions, announcements,
      # reviews, products), so roughly five page loads exhaust it — and the
      # Playwright suite does far more than that. Measured 2026-08-01: a single
      # sequential run produced 166 rate-limit rejections, one of them on the
      # order POST, which surfaced as a checkout that never confirmed (#409).
      #
      # The limiter stays ENABLED deliberately. Disabling it would make the local
      # stack stop exercising a control that production relies on, and would let
      # a genuine 429-handling regression pass unnoticed; the 429 path is still
      # reachable on demand by exceeding the widened budget.
      RATE_LIMIT_PUBLIC_PER_MINUTE: ${RATE_LIMIT_PUBLIC_PER_MINUTE:-600}
      RATE_LIMIT_PUBLIC_BURST: ${RATE_LIMIT_PUBLIC_BURST:-120}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      # Runtime/migrator split (SEC-04 / #552, D-01): the app connects as DB_USER
      # (the DML-only jtoye_runtime), Flyway migrates as DB_MIGRATION_USER (the
      # owner jtoye_app). Plain ${VAR} for the username to match DB_USER's own
      # treatment; ${VAR:?} for the password so a missing value fails loud and
      # names the key. verify-env.sh requires both before the stack ever comes up.
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?DB_MIGRATION_PASSWORD must be set}
      # JWKS is fetched from the INTERNAL Keycloak host (reachable in-network)…
      KC_ISSUER_URI: http://keycloak:8080/realms/jtoye-dev
      # …but tokens are stamped with the PUBLIC issuer (KC_HOSTNAME=localhost:8085),
      # so validate the 'iss' claim against that. Without this split the resource
      # server rejects every real token with "The iss claim is not valid" (issue #87 follow-up).
      JWT_EXPECTED_ISSUER: http://localhost:8085/realms/jtoye-dev
      # Issue #179 defect 1: customer-session order history (/public/orders/mine).
      # Same split-horizon pattern as above, for the jtoye-customers realm:
      # JWKS via the internal host, 'iss' validated against the public issuer.
      CUSTOMER_KC_ISSUER_URI: http://keycloak:8080/realms/jtoye-customers
      CUSTOMER_JWT_EXPECTED_ISSUER: http://localhost:8085/realms/jtoye-customers
      # VSA-02 (Phase 25 [AI-02], RESEARCH §3): allowlist the integration-orders-rw
      # write service-account so its first create_order skips ShopAccessService JIT
      # provisioning + directory upsert (application.yml ${ACCESS_MACHINE_CLIENT_IDS:}).
      # The SA still passes the VSA-02 gate via the strict-scoping-OFF implicit-GA
      # path, so NO permanent opaque-UUID GROUP_ADMIN row lands in shop_staff (WR-09).
      ACCESS_MACHINE_CLIENT_IDS: integration-orders-rw
      # Keycloak user deprovisioning on offboard (issue #102 remainder). OFF by
      # default; when enabled the core service disables an offboarded tenant's
      # Keycloak users. base-url is the INTERNAL host (like KC_ISSUER_URI above),
      # NOT the public localhost:8085. Admin creds reach core here (they were
      # previously only on the keycloak container).
      KC_ADMIN_ENABLED: ${KC_ADMIN_ENABLED:-false}
      KC_ADMIN_BASE_URL: ${KC_ADMIN_BASE_URL:-http://keycloak:8080}
      KC_DEPROVISION_REALMS: ${KC_DEPROVISION_REALMS:-jtoye-dev}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      # Local-stack opt-in for the Prometheus scrape endpoint (base profile
      # exposes only health,info — see application.yml management comment).
      # SecurityConfig permits /actuator/prometheus in non-prod profiles only.
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      STOMP_BROKER_MODE: ${STOMP_BROKER_MODE:-in-memory}
      STOMP_RELAY_HOST: rabbitmq
      STOMP_RELAY_PORT: "61613"
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      NOTIFICATION_EMAIL_ENABLED: "true"
      NOTIFICATION_EMAIL_TRACKING_BASE_URL: "http://localhost:3000"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      S3_BUCKET: jtoye-images
      S3_PUBLIC_URL: http://localhost:9000/jtoye-images
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_ENABLED: "true"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:12b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3100}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    # Port range allows --scale core-java=2 (each replica gets a unique host port)
    # Replica 1 → localhost:9090, Replica 2 → localhost:9091
    ports:
      - "9090-9091:9090"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    extra_hosts:
      - "keycloak-host:host-gateway"
    networks:
      - jtoye-network

  # Edge Go API Gateway
  edge-go:
    build:
      context: ./edge-go
      dockerfile: Dockerfile
    container_name: jtoye-edge-go
    restart: unless-stopped
    environment:
      CORE_API_URL: http://core-java:9090
      # JWKS fetched from INTERNAL host; 'iss' validated against the PUBLIC issuer
      # (same split-horizon fix as core-java — issue #87 follow-up).
      KC_ISSUER_URI: http://keycloak:8080/realms/jtoye-dev
      JWT_EXPECTED_ISSUER: http://localhost:8085/realms/jtoye-dev
      # issue #87 P1-5: explicit fail-closed audience. The code already defaults
      # to "core-api" when unset; set it here so the running edge documents and
      # pins the expected aud (override per-env via EDGE_JWT_AUDIENCE).
      EDGE_JWT_AUDIENCE: ${EDGE_JWT_AUDIENCE:-core-api}
      PORT: 8080
      # issue #550 [SEC-02 / C4]: move the Prometheus scrape endpoint OFF the
      # published application port. Set here (not defaulted in Go) because this
      # is the runtime where the exposure is real: 8089 below is a named app-tier
      # exemption bound on all interfaces, and an unauthenticated /metrics there
      # discloses the gateway's route templates. Measured on main @964ccc2f:
      # GET :8089/metrics -> 200, while POST :8089/api/v1/sync/batch -> 401, so
      # the 200 was a genuine ungated surface and not a probe artefact.
      #
      # edge-go serves /metrics on EITHER the app port or this one, never both
      # (edge-go/cmd/edge/main.go registerAppMetricsRoute). The scrape target
      # therefore has to move with it — it is rendered from the SAME .env key,
      # EDGE_GO_METRICS_PORT, in infra/monitoring/docker-compose.monitoring.yml,
      # so the two cannot drift apart. Change one, you have changed both.
      #
      # DELIBERATELY NOT PUBLISHED under `ports:` — Prometheus reaches it over
      # jtoye-network by container name. Publishing it would recreate exactly the
      # exposure this closes, one port to the left.
      EDGE_MANAGEMENT_PORT: ${EDGE_GO_METRICS_PORT:-9101}
    ports:
      - "8089:8080"
    depends_on:
      core-java:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/edge", "health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "keycloak-host:host-gateway"
    networks:
      - jtoye-network

  # Frontend (Next.js 14)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:9090
        # Phase 18: baked into the browser bundle so customer-auth.ts targets the
        # jtoye-customers realm (NEXT_PUBLIC_* must be present at BUILD time).
        # Required (`:?`) — a missing var would bake an empty string into the client
        # bundle; the runtime `environment:` default below cannot fix a build-time bake.
        NEXT_PUBLIC_CUSTOMER_KEYCLOAK_URL: ${NEXT_PUBLIC_CUSTOMER_KEYCLOAK_URL:?NEXT_PUBLIC_CUSTOMER_KEYCLOAK_URL must be set (baked into browser bundle)}
        # Phase 21 (QA ONB-1): onboarding support channel + review SLA — NEXT_PUBLIC_*,
        # so they must be baked at build time (the runtime `environment:` block below
        # cannot reach the client bundle). Dev defaults keep the REJECTED/SUSPENDED
        # support exit working out-of-the-box; override in `.env` per environment.
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@olajay.co.uk}
        NEXT_PUBLIC_SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL:-https://help.olajay.co.uk/onboarding}
        NEXT_PUBLIC_ONBOARDING_REVIEW_SLA_DAYS: ${NEXT_PUBLIC_ONBOARDING_REVIEW_SLA_DAYS:-2}
        # Phase 31 (LGL-01): controller contact detail for the published legal pages.
        # They belong HERE under build.args and not under the `environment:` block
        # further down — NEXT_PUBLIC_* is inlined into the browser bundle by
        # `next build`, so a runtime value arrives far too late and the page ships
        # with an empty string baked in.
        #
        # The two differ on purpose. The registered office has NO dev default: the
        # owner declined to publish an address for now, and a plausible-looking fake
        # on a legal page is worse than an absent one, because the omission is
        # visible and a fabrication is not. resolveControllerContact() drops the
        # block while it is empty, so the page stays honest either way.
        NEXT_PUBLIC_COMPANY_REGISTERED_OFFICE: ${NEXT_PUBLIC_COMPANY_REGISTERED_OFFICE:-}
        # The data-protection contact DOES get a default, matching the support pair
        # above: it is a dedicated address rather than the shared support queue,
        # because a data-subject request carries a one-month statutory clock.
        NEXT_PUBLIC_DATA_PROTECTION_EMAIL: ${NEXT_PUBLIC_DATA_PROTECTION_EMAIL:-privacy@olajay.co.uk}
    container_name: jtoye-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:9090
      # Issue #467: server-side core API base for route handlers running INSIDE
      # this container. NEXT_PUBLIC_API_URL above is the BROWSER's view and is
      # unusable here — the `extra_hosts: localhost:host-gateway` entry below
      # does NOT win, because the container's own /etc/hosts already maps
      # `127.0.0.1 localhost` first, so `http://localhost:9090` resolves to this
      # container's loopback and is refused. Measured in jtoye-frontend:
      #   wget http://localhost:9090/actuator/health -> connect: Connection refused
      #   wget http://core-java:9090/actuator/health -> {"status":"UP",...}
      # Without this, /api/customer-orders 502s on every request and My Orders
      # renders the failure as an empty state.
      CORE_API_INTERNAL_URL: http://core-java:9090
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET must be set}
      KEYCLOAK_ISSUER: http://localhost:8085/realms/jtoye-dev
      KEYCLOAK_ISSUER_INTERNAL: http://keycloak:8080/realms/jtoye-dev
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8085/realms/jtoye-dev
      # Phase 18: customer identity realm (jtoye-customers) — frontend customer-auth only.
      # Admin NextAuth (frontend/auth.ts) stays on jtoye-dev above; these are additive.
      CUSTOMER_KEYCLOAK_ISSUER: ${CUSTOMER_KEYCLOAK_ISSUER:-http://localhost:8085/realms/jtoye-customers}
      CUSTOMER_KEYCLOAK_ISSUER_INTERNAL: ${CUSTOMER_KEYCLOAK_ISSUER_INTERNAL:-http://keycloak:8080/realms/jtoye-customers}
      NEXT_PUBLIC_CUSTOMER_KEYCLOAK_URL: ${NEXT_PUBLIC_CUSTOMER_KEYCLOAK_URL:-http://localhost:8085/realms/jtoye-customers}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      core-java:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - jtoye-network

  # MCP Server (read-only Model Context Protocol, #203 / AI-1)
  # Thin, stateless read wrapper over the core REST API. Bearer pass-through:
  # the calling agent presents its OWN tenant-scoped Keycloak token per request
  # and the server forwards it verbatim to core-java — RLS in core is the sole
  # isolation boundary. The container holds NO client secret and NO DB creds
  # (T-20-07 secret-sprawl mitigation). CORE_BASE_URL is a FIXED internal service
  # name, never caller-controlled (T-20-04 SSRF guard). No issuer/JWKS env — the
  # server forwards an opaque token and never validates `iss` (split-horizon is
  # core-java's concern, not this tier's).
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: jtoye-mcp-server
    restart: unless-stopped
    environment:
      TZ: Europe/London
      CORE_BASE_URL: http://core-java:9090
    ports:
      - "9100:9100"
    depends_on:
      core-java:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # Honors MCP_PORT (index.ts binds it, default 9100) — a hardcoded 9100
      # would leave an MCP_PORT-overridden container permanently unhealthy.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.MCP_PORT || 9100) + '/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - jtoye-network

  # MinIO — S3-compatible object storage for images
  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    container_name: jtoye-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      # Loopback-only by default (#441). S3_PUBLIC_URL stays
      # http://localhost:9000/... — the BROWSER loads those images from the
      # host, and the image components render a plain <img>, so nothing
      # server-side inside a container ever fetches this port.
      - "${JTOYE_BIND_HOST:-127.0.0.1}:9000:9000"   # S3 API
      - "${JTOYE_BIND_HOST:-127.0.0.1}:9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jtoye-network

  # MinIO init — creates the bucket and applies its anonymous access policy.
  # Runs minio/mc holding the ROOT object-storage credentials, so the image is
  # DIGEST-PINNED via MINIO_MC_IMAGE_TAG (#270): a mutable tag would run whatever
  # `latest` resolves to next with full bucket authority. The pin lives as a
  # one-line, reviewable value in .env/.env.example (name:tag@sha256:...), and a
  # WRONG digest fails the pull loudly rather than silently falling back to latest.
  minio-init:
    image: minio/mc:${MINIO_MC_IMAGE_TAG:-latest}
    container_name: jtoye-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      # The exact reference this bootstrap was launched with, echoed at run time so
      # a future run STATES which minio/mc it ran instead of leaving it inferred.
      MINIO_MC_IMAGE_REF: minio/mc:${MINIO_MC_IMAGE_TAG:-latest}
      # Anonymous bucket policy (#626): s3:GetObject ONLY, on the OBJECT arn (/*).
      # Deliberately grants NO s3:ListBucket / GetBucketLocation on the bucket arn, so a
      # storefront image stays anonymously readable BY URL while the object inventory is
      # no longer anonymously ENUMERABLE. Applied via `mc anonymous set-json` because the
      # built-in `download` preset bundles ListBucket with GetObject and has no GetObject-only
      # form (verified against minio/mc RELEASE.2025-08-13 + MinIO docs).
      ANON_BUCKET_POLICY: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::jtoye-images/*"]}]}'
    # Exec-list form (not a folded string): a single /bin/sh, so the JSON policy above
    # expands from one env var with no nested-quote or glob hazard. `set -e` keeps it fail-loud.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "minio-init-image-ref=$$MINIO_MC_IMAGE_REF"
        mc --version
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/jtoye-images
        printf '%s' "$$ANON_BUCKET_POLICY" > /tmp/anon-getobject-policy.json
        mc anonymous set-json /tmp/anon-getobject-policy.json local/jtoye-images
        echo 'Bucket jtoye-images ready: anonymous s3:GetObject only, no s3:ListBucket (#626)'
    networks:
      - jtoye-network

  # Ollama — local AI for image recognition (GPU-accelerated, free)
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: jtoye-ollama
    restart: unless-stopped
    environment:
      # How long a model stays resident in VRAM after its last request.
      #
      # WHY THIS IS SET. ollama's default is 5m, and `ollama ps` was observed
      # counting down "UNTIL 47 seconds from now" on the 12B vision model. Once
      # evicted, the next request pays the full cold load again: MEASURED 2026-07-30,
      # a cold /api/generate took 71 996ms of which 71 891ms was load_duration
      # (8 GB disk -> VRAM) while the eval itself was 21ms. Warm, the same call is
      # ~400ms. So on a stack where image analysis arrives in bursts separated by
      # more than five minutes, essentially EVERY request paid ~72s.
      #
      # -1 keeps the model loaded indefinitely. The cost is honest and worth stating:
      # it pins ~10 GB of VRAM (of 11 264 MiB on this box) for as long as the
      # container runs, so a desktop sharing the GPU has little left. Set a duration
      # instead ("30m", "2h") to release it after a quiet period, or "0" to unload
      # immediately after each request.
      #
      # Server-side on purpose: it applies to every client. ImageAnalysisService
      # builds its request body without a keep_alive field, so a per-request value
      # would mean a Java change for something that is a deployment tunable.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    ports:
      # HOST-side port only. Nothing in the stack uses it: core-java reaches this
      # container as OLLAMA_URL=http://ollama:11434 over the bridge network, and
      # ollama-init uses OLLAMA_HOST=http://ollama:11434 — both service-name paths
      # that ignore the published port entirely. It is published purely so a
      # developer can curl the model API from the host.
      #
      # WHY IT IS INJECTED RATHER THAN 11434. A host-native `ollama serve`
      # (systemd, /usr/local/bin/ollama) also binds 11434, and on a machine
      # running one this container could NEVER start: measured 2026-07-30,
      # `failed to bind host port 0.0.0.0:11434/tcp: address already in use`, so
      # Docker aborted networking setup and left the container with
      # NetworkMode set but attachments=0 — running-looking yet on no network.
      # That is why its volume held no model for weeks (24K, empty manifests)
      # while `ollama list` reported healthy: the healthcheck runs INSIDE the
      # container and never touches the network, so nothing detected it.
      #
      # Loopback-only by default (#441), which costs nothing here: the comment
      # above already records that NOTHING in the stack uses this published
      # port — it exists so a developer can curl the model API from the host.
      - "${JTOYE_BIND_HOST:-127.0.0.1}:${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - jtoye-network

  # Ollama model pull — downloads the vision model on first run
  ollama-init:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: jtoye-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Pulling vision model (this may take a few minutes on first run)...' &&
      OLLAMA_HOST=http://ollama:11434 ollama pull gemma3:12b &&
      echo 'Vision model ready'
      "
    networks:
      - jtoye-network

  # Mailhog — local SMTP testing (view emails at http://localhost:8025)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: jtoye-mailhog
    restart: unless-stopped
    ports:
      # Loopback-only by default (#441). This is the sharpest of the infra
      # ports: the API is unauthenticated by design and the archive holds real
      # captured order-confirmation and notification email from the dev tenants,
      # so an all-interfaces bind published customer names and addresses to the
      # local network with no credential at all. Same data that #84 went to some
      # trouble to make erasable, reachable by another route.
      - "${JTOYE_BIND_HOST:-127.0.0.1}:1025:1025"   # SMTP
      - "${JTOYE_BIND_HOST:-127.0.0.1}:8025:8025"   # Web UI
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jtoye-network

networks:
  jtoye-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  keycloak_data:
  minio_data:
  ollama_data:
