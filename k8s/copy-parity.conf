# Committed copies of canonical files, byte-checked by scripts/check-k8s-copy-parity.sh
# on every pull request (ci-cd.yaml ops-contracts).
#
# WHY COPIES EXIST AT ALL. kustomize's configMapGenerator may only read files INSIDE
# its own kustomization root: `../../infra/...` is refused ("security; file is not in
# or below the current directory") and a symlink is resolved the same way. So any
# file both runtimes must serve — compose by bind mount, k8s by ConfigMap — exists
# twice in the repo, and this list is where each such pair is declared.
#
# FORMAT: one pair per line, `<copy-path> <canonical-path>`, both repo-relative, no
# spaces in either path. `#` starts a comment (whole line, or after whitespace).
#   - the RIGHT-HAND path is CANONICAL: edit it, then copy it over the left-hand one;
#   - a path may not be absolute, contain a `..` segment or be a symlink;
#   - a copy may appear only once.
# An empty list is a VOID (exit 2), never a pass: parity over nothing is not parity.
#
# A second pair kind, `jobs <k8s-config> <compose-config>` (plan 29-23): the two Prometheus
# scrape configs are NOT byte-equal (their targets differ by runtime), so the gate compares their
# job_name sets and, per job, the labels, metrics_path, params and metric_relabel_configs; the
# RIGHT-HAND (compose) side is canonical there too. The dashboards are plan 29-24's pairs.

# The jtoye Keycloak login theme (plan 29-10): compose mounts infra/keycloak/themes,
# k8s/components/keycloak mounts these through the keycloak-theme ConfigMap.
k8s/components/keycloak/theme/theme.properties      infra/keycloak/themes/jtoye/login/theme.properties
k8s/components/keycloak/theme/jtoye.css             infra/keycloak/themes/jtoye/login/resources/css/jtoye.css
k8s/components/keycloak/theme/work-sans-latin.woff2 infra/keycloak/themes/jtoye/login/resources/fonts/work-sans-latin.woff2

# The alert-rule corpus and the scrape-job contract (plan 29-23, D-16): compose bind-mounts
# infra/monitoring/prometheus, k8s/components/monitoring serves these through the
# prometheus-alerts and prometheus-config ConfigMaps. ONE rule corpus, byte-equal.
k8s/components/monitoring/prometheus/alerts.yml    infra/monitoring/prometheus/alerts.yml
jobs k8s/components/monitoring/prometheus/prometheus.yml infra/monitoring/prometheus/prometheus.yml.tmpl

# Alert ROUTING and the dashboards (plan 29-24, D-16 extended to routing): compose bind-mounts
# infra/monitoring/alertmanager and infra/monitoring/grafana; k8s/components/monitoring serves
# these through the alertmanager-src and grafana-* ConfigMaps. ONE Alertmanager template and
# entrypoint for both runtimes; scripts/check-alertmanager-render.sh proves what each renders.
k8s/components/monitoring/alertmanager/alertmanager.yml.tmpl  infra/monitoring/alertmanager/alertmanager.yml.tmpl
k8s/components/monitoring/alertmanager/entrypoint.sh          infra/monitoring/alertmanager/entrypoint.sh
k8s/components/monitoring/grafana/datasource-prometheus.yml   infra/monitoring/grafana/provisioning/datasources/prometheus.yml
k8s/components/monitoring/grafana/dashboards-provider.yml     infra/monitoring/grafana/provisioning/dashboards/dashboard.yml
k8s/components/monitoring/grafana/stomp-dashboard.json        infra/monitoring/grafana/dashboards/stomp-dashboard.json
