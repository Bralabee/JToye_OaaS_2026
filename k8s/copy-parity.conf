# Committed copies of canonical files, byte-checked by scripts/check-k8s-copy-parity.sh
# on every pull request (ci-cd.yaml ops-contracts).
#
# WHY COPIES EXIST AT ALL. kustomize's configMapGenerator may only read files INSIDE
# its own kustomization root: `../../infra/...` is refused ("security; file is not in
# or below the current directory") and a symlink is resolved the same way. So any
# file both runtimes must serve — compose by bind mount, k8s by ConfigMap — exists
# twice in the repo, and this list is where each such pair is declared.
#
# FORMAT: one pair per line, `<copy-path> <canonical-path>`, both repo-relative, no
# spaces in either path. `#` starts a comment (whole line, or after whitespace).
#   - the RIGHT-HAND path is CANONICAL: edit it, then copy it over the left-hand one;
#   - a path may not be absolute, contain a `..` segment or be a symlink;
#   - a copy may appear only once.
# An empty list is a VOID (exit 2), never a pass: parity over nothing is not parity.
#
# Plan 29-23 adds the alert-rule corpus and dashboard pairs here.

# The jtoye Keycloak login theme (plan 29-10): compose mounts infra/keycloak/themes,
# k8s/components/keycloak mounts these through the keycloak-theme ConfigMap.
k8s/components/keycloak/theme/theme.properties      infra/keycloak/themes/jtoye/login/theme.properties
k8s/components/keycloak/theme/jtoye.css             infra/keycloak/themes/jtoye/login/resources/css/jtoye.css
k8s/components/keycloak/theme/work-sans-latin.woff2 infra/keycloak/themes/jtoye/login/resources/fonts/work-sans-latin.woff2
