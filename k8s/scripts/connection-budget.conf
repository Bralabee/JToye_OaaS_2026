# connection-budget.conf — the per-target Postgres budget read by
# k8s/scripts/check-connection-math.sh (issue #94; Phase 29 decision D-25).
#
# FORMAT (one row per target, whitespace-separated, # starts a comment line):
#
#   <target>  <max_connections|compose>  <reserved>  <provenance ...>
#
#   target           one of: compose, k8s-staging, k8s-production. Every one of
#                    them MUST have exactly one row; an absent, duplicated or
#                    unknown target is a PARSE ERROR (exit 2), so a new overlay
#                    can never be evaluated against an implied default.
#   max_connections  a count, or the word `compose` = the value parsed from
#                    docker-compose.full-stack.yml (`max_connections=NNN`). The
#                    compose row must say `compose`: that file is the only place
#                    the local value is set, and a second copy could disagree.
#   reserved         connections the server keeps for itself, not usable by
#                    any application pool. A count; a missing or non-numeric
#                    value is a PARSE ERROR, never a default.
#   provenance       where the two numbers come from. Required.
#
# WHY PER TARGET (D-25): the reserve used to be one script literal
# (`RESERVED=3`, PostgreSQL's superuser_reserved_connections default). That is
# right for a self-hosted Postgres and WRONG for Azure Database for PostgreSQL
# Flexible Server, which reserves 15 connections for the service itself
# (physical replication and monitoring), so user connections are
# max_connections - 15 (Microsoft Learn, "Limits in Azure Database for
# PostgreSQL flexible server", section "Maximum connections":
# https://learn.microsoft.com/azure/postgresql/flexible-server/concepts-limits).
# At max_connections 200 the 80% budget line drops from 157 (reserve 3) to 148
# (reserve 15), and the k8s demand at the HPA ceiling is 155: inside the old
# line, outside the new one. `check-connection-math.sh --selftest` (arm d25)
# proves the gate fails on exactly that case.
#
# k8s-staging: Flexible Server Burstable B2s. max_connections 429 was MEASURED on
# the August 2026 B2s staging server (29-RESEARCH.md, "Standard Stack",
# Azure resources table; Blocker C). Plan 29-14 re-measured it live on the new
# server jtoye-stg-pg (PostgreSQL 18.6) with `SHOW max_connections;` on
# 2026-10-19 through scripts/staging-db-bootstrap.sh --stage readback: 429,
# equal to this row (evidence/29-14-tracer.txt).
#
# k8s-production: UNCHANGED (max_connections from compose, reserve 3) until
# Phase 32 provisions the production Flexible Server. The gate prints, on every
# run, the counterfactual of this row at Azure's reserve, so the finding that
# production does not fit at max_connections 200 cannot be lost.
#
# target          max_connections  reserved  provenance
compose           compose          3         self-hosted postgres:18-alpine in docker-compose.full-stack.yml; reserve = superuser_reserved_connections default 3
k8s-staging       429              15        Azure Flexible Server B2s; max_connections 429 measured on the August 2026 B2s server and re-measured 2026-10-19 on jtoye-stg-pg (29-14); Azure reserves 15
k8s-production    compose          3         UNCHANGED until Phase 32 provisions the production Flexible Server
