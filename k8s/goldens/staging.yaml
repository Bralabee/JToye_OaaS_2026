apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
    documentation: https://github.com/jtoye/oaas-platform
    maintainer: jtoye-devops-team
  labels:
    app: frontend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: jtoye-platform
    component: ui
    environment: staging
  name: frontend
  namespace: jtoye-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: jtoye-platform
      environment: staging
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
        documentation: https://github.com/jtoye/oaas-platform
        maintainer: jtoye-devops-team
      labels:
        app: frontend
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: jtoye-platform
        component: ui
        environment: staging
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - frontend
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: CORE_API_INTERNAL_URL
          valueFrom:
            configMapKeyRef:
              key: api.internal.url
              name: app-config
        - name: NEXTAUTH_URL
          valueFrom:
            configMapKeyRef:
              key: frontend.url
              name: app-config
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              key: secret
              name: nextauth-secret
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              key: keycloak.client-id
              name: app-config
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: frontend-client-secret
              name: keycloak-credentials
        - name: KEYCLOAK_ISSUER
          valueFrom:
            configMapKeyRef:
              key: keycloak.public.issuer.uri
              name: app-config
        - name: KEYCLOAK_ISSUER_INTERNAL
          valueFrom:
            configMapKeyRef:
              key: keycloak.issuer.uri
              name: app-config
        - name: NEXT_PUBLIC_KEYCLOAK_URL
          valueFrom:
            configMapKeyRef:
              key: keycloak.public.issuer.uri
              name: app-config
        image: ghcr.io/bralabee/jtoye-frontend:2.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: frontend
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
