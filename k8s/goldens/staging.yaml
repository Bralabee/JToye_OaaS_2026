          set -eu
          cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts
          jdk=$(keytool -list -keystore /truststore/cacerts -storetype PKCS12 </dev/null 2>/dev/null | grep -c trustedCertEntry || true)
          keytool -importcert -noprompt -alias jtoye-staging-ca -file /cluster-ca/ca.crt -keystore /truststore/cacerts -storetype PKCS12 -storepass changeit
          entries=$(keytool -list -keystore /truststore/cacerts -storetype PKCS12 </dev/null 2>/dev/null | grep -c trustedCertEntry || true)
          echo "truststore-builder: jdk-entries=$jdk entries=$entries (read with no store password, as the JVM reads it)"
          if [ "$jdk" -lt 1 ] || [ "$entries" -ne $((jdk + 1)) ]; then
            echo "truststore-builder: FAIL: expected jdk-entries + 1 readable entries; refusing to start core-java on this store" >&2
            exit 1
          fi
        image: ghcr.io/bralabee/jtoye-core-java:2.1.0
        imagePullPolicy: IfNotPresent
