apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
    documentation: https://github.com/jtoye/oaas-platform
    maintainer: jtoye-devops-team
  labels:
    app: alertmanager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: jtoye-platform
    component: monitoring
    environment: staging
  name: alertmanager
  namespace: jtoye-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: jtoye-platform
      environment: staging
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
        documentation: https://github.com/jtoye/oaas-platform
        maintainer: jtoye-devops-team
        prometheus.io/path: /metrics
        prometheus.io/port: "9093"
        prometheus.io/scrape: "true"
      labels:
        app: alertmanager
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: jtoye-platform
        component: monitoring
        environment: staging
        version: v1
    spec:
      containers:
      - args:
        - --config.file=/etc/alertmanager/rendered/alertmanager.yml
        - --storage.path=/alertmanager
        image: prom/alertmanager:v0.27.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
        name: alertmanager
        ports:
        - containerPort: 9093
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/alertmanager/rendered
          name: rendered
          readOnly: true
        - mountPath: /alertmanager
          name: storage
      initContainers:
      - command:
        - /bin/sh
        - /etc/alertmanager/render/render.sh
        env:
        - name: ALERTMANAGER_SMTP_SMARTHOST
          valueFrom:
            configMapKeyRef:
              key: alerting.smtp.smarthost
              name: app-config
        - name: ALERTMANAGER_SMTP_REQUIRE_TLS
          value: "true"
        - name: ALERTMANAGER_SMTP_FROM
          valueFrom:
            secretKeyRef:
              key: from
              name: alertmanager-smtp
        - name: ALERTMANAGER_SMTP_TO
          valueFrom:
            secretKeyRef:
              key: to
              name: alertmanager-smtp
        - name: ALERTMANAGER_SMTP_AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: alertmanager-smtp
        - name: ALERTMANAGER_SECONDARY_SMTP_SMARTHOST
          valueFrom:
            configMapKeyRef:
              key: alerting.secondary.smtp.smarthost
              name: app-config
        - name: ALERTMANAGER_SECONDARY_SMTP_TO
          valueFrom:
            configMapKeyRef:
              key: alerting.secondary.smtp.to
              name: app-config
        image: prom/alertmanager:v0.27.0
        imagePullPolicy: IfNotPresent
        name: render-config
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/alertmanager/tmpl
          name: tmpl
          readOnly: true
        - mountPath: /etc/alertmanager/render
          name: render
          readOnly: true
        - mountPath: /etc/alertmanager/smtp
          name: smtp
          readOnly: true
        - mountPath: /etc/alertmanager/rendered
          name: rendered
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
      - configMap:
          items:
          - key: alertmanager.yml.tmpl
            path: alertmanager.yml.tmpl
          name: alertmanager-config
        name: tmpl
      - configMap:
          items:
          - key: render.sh
            path: render.sh
          name: alertmanager-config
        name: render
      - name: smtp
        secret:
          defaultMode: 256
          items:
          - key: password
            path: password
          secretName: alertmanager-smtp
      - emptyDir: {}
        name: rendered
      - emptyDir: {}
        name: storage
