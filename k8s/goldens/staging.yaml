apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
  labels:
    app: mailpit
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: jtoye-platform
    component: mail
    environment: staging
  name: mailpit
  namespace: jtoye-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: jtoye-platform
      environment: staging
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
      labels:
        app: mailpit
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: jtoye-platform
        component: mail
        environment: staging
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - sh
        - -c
        - |
          fp() { sha256sum "$MP_SMTP_TLS_CERT" "$MP_SMTP_TLS_KEY" 2>/dev/null; }
          start=$(fp) || { echo "mailpit-cert-reload: cannot read $MP_SMTP_TLS_CERT / $MP_SMTP_TLS_KEY" >&2; exit 1; }
          /mailpit &
          pid=$!
          trap 'kill -TERM "$pid" 2>/dev/null; wait "$pid"; exit 0' TERM INT
          while kill -0 "$pid" 2>/dev/null; do
            sleep 15 &
            wait $!
            now=$(fp) || continue
            if [ "$now" != "$start" ]; then
              echo "mailpit-cert-reload: certificate or key changed on disk; stopping Mailpit so the container restarts with the new one"
              kill -TERM "$pid" 2>/dev/null
              wait "$pid"
              exit 0
            fi
          done
          wait "$pid"
        env:
        - name: MP_SMTP_TLS_CERT
          value: /tls/tls.crt
        - name: MP_SMTP_TLS_KEY
          value: /tls/tls.key
        - name: MP_SMTP_REQUIRE_STARTTLS
          value: "true"
        - name: MP_SMTP_DISABLE_RDNS
          value: "true"
        - name: MP_DISABLE_VERSION_CHECK
          value: "true"
        - name: MP_MAX_MESSAGES
          value: "500"
        - name: MP_DATABASE
          value: /data/mailpit.db
        - name: MP_SEND_API_AUTH_FILE
          value: /send-api-lock/passwords
        image: axllent/mailpit:v1.31.6
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
        name: mailpit
        ports:
        - containerPort: 1025
          name: smtp
          protocol: TCP
        - containerPort: 8025
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /tls
          name: tls
          readOnly: true
        - mountPath: /data
          name: data
        - mountPath: /send-api-lock
          name: send-api-lock
          readOnly: true
      initContainers:
      - command:
        - sh
        - -c
        - |
          set -eu
          umask 077
          printf 'locked:%s\n' "$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" > /send-api-lock/passwords
          echo "send-api-lock: wrote $(wc -c < /send-api-lock/passwords) bytes (a random credential nobody holds)"
        image: axllent/mailpit:v1.31.6
        imagePullPolicy: IfNotPresent
        name: send-api-lock
        resources:
          limits:
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /send-api-lock
          name: send-api-lock
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: mailpit
      volumes:
      - name: tls
        secret:
          defaultMode: 288
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          secretName: mailpit-tls
      - emptyDir:
          sizeLimit: 256Mi
        name: data
      - emptyDir:
          medium: Memory
          sizeLimit: 1Mi
        name: send-api-lock
