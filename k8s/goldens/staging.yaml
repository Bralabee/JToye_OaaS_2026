spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: jtoye-platform
      environment: staging
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
      labels:
        app: alertmanager
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: jtoye-platform
        azure.workload.identity/use: "true"
        component: monitoring
        environment: staging
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/sh
        - /etc/alertmanager-src/entrypoint.sh
        env:
        - name: ALERTMANAGER_TEMPLATE
