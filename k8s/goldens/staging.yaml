data:
  jtoye.css: |
    /* =============================================================================
       J'Toye login theme
       =============================================================================

       Loaded AFTER the parent theme's css/login.css and after the PatternFly
       stylesheets, so these rules win on equal specificity. Where a stock rule is
       more specific (PatternFly ships plenty of them) the selector here is matched
       to it deliberately rather than reached for with !important; the few
       !important uses left are marked with why.

       Every colour below is copied from a shipped brand surface, not invented:

         oxblood        #3A0B0D   frontend/tailwind.config.ts  colors.oxblood.DEFAULT
         oxblood-700    #571417   frontend/tailwind.config.ts  colors.oxblood.700
         oxblood-600    #6E1D21   frontend/tailwind.config.ts  colors.oxblood.600
         oxblood-deep   #1F0F28   frontend/tailwind.config.ts  colors.oxblood.deep
         cream          #FBF6F0   frontend/tailwind.config.ts  colors.cream.DEFAULT
         cream-100      #F4EBE1   frontend/tailwind.config.ts  colors.cream.100
         gold           #E8B04B   frontend/tailwind.config.ts  colors.gold
         primary        #C2410C   frontend/app/globals.css     --primary 17.5 88.3% 40.4%
                                  (orange-700; the approved dashboard primary, decision #451)
         primary-fg     #FAFAF9   frontend/app/globals.css     --primary-foreground
         radius         0.5rem    frontend/app/globals.css     --radius

       The apostrophe in "J'Toye" is why the header's stock uppercase transform is
       removed: the wordmark is cased, not shouted.
       ========================================================================== */

    @font-face {
      font-family: "Work Sans";
      /* Self-hosted rather than pulled from fonts.googleapis.com: a login page is
         exactly the surface that should not make a third-party request, and this
         keeps the theme working with no outbound network and no CSP/CORS surface. */
      src: url("../fonts/work-sans-latin.woff2") format("woff2");
      font-weight: 100 900; /* variable */
      font-style: normal;
      font-display: swap;
    }

    :root {
      --jtoye-oxblood: #3a0b0d;
      --jtoye-oxblood-700: #571417;
      --jtoye-oxblood-600: #6e1d21;
      --jtoye-oxblood-deep: #1f0f28;
      --jtoye-cream: #fbf6f0;
      --jtoye-cream-100: #f4ebe1;
      --jtoye-gold: #e8b04b;
      --jtoye-primary: #c2410c;
      --jtoye-primary-hover: #9a3412; /* orange-800, the shipped hover step */
      --jtoye-primary-fg: #fafaf9;
      --jtoye-ink: #1c1917;
      --jtoye-muted: #57534e;
      --jtoye-radius: 0.5rem;
      --jtoye-font: "Work Sans", ui-sans-serif, system-ui, -apple-system,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }

    /* ---------------------------------------------------------------- page shell */

    /* The stock theme paints a dark grey low-poly PNG here. Replaced with a warm
       cream field carrying two soft brand-tinted washes — no image request at all. */
    .login-pf body {
      background: var(--jtoye-cream) !important; /* stock rule is equally specific and would otherwise win the cascade race by source order */
      background-image: radial-gradient(
          ellipse 80% 60% at 50% -10%,
          rgba(232, 176, 75, 0.22),
          transparent 60%
        ),
        radial-gradient(
          ellipse 70% 50% at 50% 108%,
          rgba(58, 11, 13, 0.1),
          transparent 62%
        ) !important;
      background-repeat: no-repeat !important;
      background-attachment: fixed !important;
      background-size: cover !important;
      font-family: var(--jtoye-font);
      color: var(--jtoye-ink);
    }

    .login-pf {
      background: none;
    }

    body,
    input,
    button,
    select,
    textarea,
    .pf-c-form-control,
    .pf-c-button {
      font-family: var(--jtoye-font);
    }

    /* ------------------------------------------------------------------- header */

    #kc-header {
      color: var(--jtoye-oxblood);
    }

    /* The stock header is 29px, uppercase, 3px tracking — designed for a word, not a
       wordmark. "J'Toye" is a cased name and reads as shouting in the stock form. */
    #kc-header-wrapper {
      font-family: var(--jtoye-font);
      font-size: 2rem;
      font-weight: 800;
      text-transform: none;
      letter-spacing: -0.01em;
      color: var(--jtoye-oxblood);
      padding: 3.25rem 1rem 1.25rem;
    }

    #kc-header-wrapper span {
      /* the realm's displayNameHtml already carries the brand colour; keep it from
         fighting the heading treatment above */
      letter-spacing: inherit !important;
    }

    /* --------------------------------------------------------------------- card */

    .login-pf-page .card-pf {
      background: #ffffff;
      border: 1px solid var(--jtoye-cream-100);
      border-radius: calc(var(--jtoye-radius) * 2);
      box-shadow: 0 1px 2px rgba(31, 15, 40, 0.04),
        0 12px 32px -8px rgba(31, 15, 40, 0.14);
      padding: 2rem 2rem 1.5rem;
      margin-bottom: 2rem;
      /* the stock card has a hard blue 4px top rule; the brand uses a warm hairline */
      border-top: 3px solid var(--jtoye-oxblood);
    }

    #kc-page-title {
      font-family: var(--jtoye-font);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--jtoye-ink);
      margin-bottom: 0.25rem;
    }

    /* ------------------------------------------------------------------- labels */

    .pf-c-form__label,
    .pf-c-form__label-text,
    #kc-form-options span,
    label {
      font-family: var(--jtoye-font);
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--jtoye-ink);
    }

    /* ------------------------------------------------------------------- inputs */

    .pf-c-form-control {
      font-family: var(--jtoye-font);
      font-size: 1rem;
      min-height: 2.75rem; /* 44px touch target */
      border: 1px solid #d6cec6;
      border-bottom-color: #d6cec6; /* PatternFly styles the bottom edge separately */
      border-radius: var(--jtoye-radius);
      background: #fff;
      color: var(--jtoye-ink);
      padding: 0.5rem 0.75rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .pf-c-form-control:hover {
      border-color: #bdb2a8;
      border-bottom-color: #bdb2a8;
    }

    /* The outline is TRANSPARENT rather than `none` on purpose. Under
       `forced-colors: active` (Windows High Contrast) the user agent discards author
       box-shadows and overrides border-color, so a shadow-only ring leaves the username,
       password and submit controls with no focus indicator at all — the form becomes
       unusable by keyboard. A transparent outline gives forced-colors something to
       repaint. The ring opacity is also raised from 0.18 (~1.13:1 over white, barely
       visible) to 0.45. */
    .pf-c-form-control:focus,
    .pf-c-form-control:focus-visible {
      outline: 2px solid transparent;
      outline-offset: 2px;
      border-color: var(--jtoye-primary);
      border-bottom-color: var(--jtoye-primary);
      box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.45);
    }

    /* the show/hide password affordance sits in an input group beside the field */
    .pf-c-input-group .pf-c-button.pf-m-control {
      border: 1px solid #d6cec6;
      border-left: 0;
      border-radius: 0 var(--jtoye-radius) var(--jtoye-radius) 0;
      background: #fff;
      color: var(--jtoye-muted);
      min-height: 2.75rem;
    }

    .pf-c-input-group .pf-c-form-control {
      border-radius: var(--jtoye-radius) 0 0 var(--jtoye-radius);
    }

    .pf-c-input-group .pf-c-button.pf-m-control:hover {
      color: var(--jtoye-oxblood);
      background: var(--jtoye-cream);
    }

    /* ------------------------------------------------------------------ buttons */

    /* Stock PatternFly primary is a saturated blue — the single most off-brand
       element on the page. */
    .pf-c-button.pf-m-primary,
    input[type="submit"].pf-m-primary {
      background: var(--jtoye-primary);
      color: var(--jtoye-primary-fg);
      border: 1px solid transparent;
      border-radius: 9999px; /* the storefront's pill CTA */
      font-family: var(--jtoye-font);
      font-weight: 600;
      font-size: 1rem;
      min-height: 3rem;
      letter-spacing: 0.01em;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .pf-c-button.pf-m-primary:hover,
    .pf-c-button.pf-m-primary:focus,
    input[type="submit"].pf-m-primary:hover {
      background: var(--jtoye-primary-hover);
      color: var(--jtoye-primary-fg);
    }

    /* transparent-not-none, for the forced-colors reason above */
    .pf-c-button.pf-m-primary:focus-visible {
      outline: 2px solid transparent;
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.45);
    }

    .pf-c-button.pf-m-primary:disabled,
    .pf-c-button.pf-m-primary.pf-m-disabled {
      background: #e7ddd4;
      color: #8a8078;
    }

    /* secondary / control buttons (e.g. "Back to Login" on some flows) */
    .pf-c-button.pf-m-secondary {
      border-radius: 9999px;
      border: 1px solid var(--jtoye-oxblood);
      color: var(--jtoye-oxblood);
      background: transparent;
      font-weight: 600;
      min-height: 3rem;
    }

    .pf-c-button.pf-m-secondary:hover {
      background: var(--jtoye-cream);
      color: var(--jtoye-oxblood-700);
    }

    /* -------------------------------------------------------------------- links */

    /* The underline is REQUIRED, not decoration — do not remove it for a cleaner look.
       These are inline links inside sentences ("New user? Register", the #kc-info-wrapper
       copy), where colour is the only other cue. Oxblood #3A0B0D against the body ink
       #1C1917 is 1.03:1 and against the muted #57534E is 2.21:1, both far below the 3:1
       that WCAG 2.1 SC 1.4.1 requires when colour alone distinguishes a link from its
       surrounding text. Contrast against the BACKGROUND is fine (14.4:1); it is the
       link-vs-text delta that fails, so an underline is the distinction.
       This surface sits outside the frontend axe gate, so this rule is the only guard. */
    .login-pf a,
    #kc-info-wrapper a,
    #kc-registration a,
    #kc-form-options a,
    a {
      color: var(--jtoye-oxblood);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    .login-pf a:hover,
    #kc-registration a:hover,
    a:hover {
      color: var(--jtoye-primary);
    }

    /* Elements the theme styles AS BUTTONS are exempt: their shape, fill and size are the
       non-colour distinction, so an underline there would be noise, not information. */
    .pf-c-button,
    .pf-c-button:hover,
    a.pf-c-button,
    a.pf-c-button:hover {
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--jtoye-primary);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ---------------------------------------------------------- checkbox / misc */

    /* The native checkbox otherwise renders in the browser's default blue — the last
       stock-coloured control on the update-password and sign-in pages. */
    .pf-c-check__input,
    input[type="checkbox"],
    input[type="radio"] {
      accent-color: var(--jtoye-primary);
    }

    .pf-c-check__input:focus-visible,
    input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--jtoye-primary);
      outline-offset: 2px;
    }

    .pf-c-check__label,
    #kc-form-options .checkbox label {
      font-weight: 500;
      color: var(--jtoye-muted);
    }

    /* --------------------------------------------------------- footer / sign-up */

    /* The "New user? Register" strip that sits INSIDE the card, full-bleed to its edges.
       Stock, read out of org.keycloak.keycloak-themes-24.0.5.jar, is:
           login.css:167   #kc-info { margin: 20px -40px -30px; }
           login.css:514   .card-pf { padding: 0 20px; max-width: 500px; }
       Note the stock pair does NOT cancel: -40px against 20px of padding. So there is no
       stock invariant to inherit here. This theme ADOPTS the stricter rule that the strip's
       negative horizontal margin equals its own card padding at each breakpoint, which is a
       choice, not a restatement of upstream.
       The SHORTHAND is load-bearing. Stock is a three-value shorthand whose -30px BOTTOM
       survives any top/left/right longhand override: written as longhands this rule left
       `margin-bottom: -30px` live at every width, pulling the strip 13px (<=480px) / 5px
       (>=481px) below the card's border box, where the two rounded bottoms cannot coincide
       and the strip overhangs as a cream lip. Keep this as a shorthand so top and bottom
       are explicitly zeroed. */
    #kc-info {
      /* Each negative margin cancels the corresponding .card-pf padding, so the strip is
         flush to the card's border box on three sides and its bottom corners ARE the
         card's bottom corners. Card padding here is `2rem 2rem 1.5rem`. Simply zeroing the
         bottom instead leaves the strip floating 25px above the card's bottom edge with a
         band of white beneath it. */
      margin: 0 -2rem -1.5rem;
    }

    #kc-info-wrapper {
      background: var(--jtoye-cream-100);
      border-top: 1px solid #e6dbd0;
      border-radius: 0 0 calc(var(--jtoye-radius) * 2) calc(var(--jtoye-radius) * 2);
      color: var(--jtoye-muted);
      font-size: 0.9375rem;
      padding: 1rem 2rem;
    }

    /* ------------------------------------------------------------------- alerts */

    /* Feedback blocks appear on reset-credentials ("check your email"), on
       update-password validation, and on the error page. */
    .pf-c-alert.pf-m-inline {
      border-radius: var(--jtoye-radius);
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      border: 1px solid transparent;
    }

    .pf-c-alert__title,
    .kc-feedback-text {
      font-family: var(--jtoye-font);
      font-size: 0.9375rem;
      line-height: 1.45;
    }

    .alert-success,
    .pf-m-success {
      background: #f0f7ef;
      border-color: #cfe6cb;
      color: #2c5a28;
    }

    .alert-success .pf-c-alert__title,
    .pf-m-success .pf-c-alert__title {
      color: #2c5a28;
    }

    .alert-error,
    .pf-m-danger {
      background: #fdf2f2;
      border-color: #f3d0d0;
    }

    .alert-error .pf-c-alert__title,
    .pf-m-danger .pf-c-alert__title {
      color: var(--jtoye-oxblood);
    }

    .alert-warning,
    .pf-m-warning {
      background: #fdf7ea;
      border-color: #f0dcb4;
    }

    /* validation text under a field */
    .pf-c-form__helper-text.pf-m-error,
    .kc-feedback-text.pf-m-error,
    #input-error,
    #input-error-password,
    #input-error-password-confirm {
      color: var(--jtoye-oxblood);
      font-weight: 600;
    }

    /* ------------------------------------------- error / info pages (We are sorry) */

    #kc-error-message .instruction,
    p.instruction {
      font-family: var(--jtoye-font);
      color: var(--jtoye-muted);
      font-size: 1rem;
      line-height: 1.55;
    }

    /* ------------------------------------------------------------- mobile first */

    /* THIS BREAKPOINT MUST MATCH THE STOCK THEME'S PHONE BLOCK, which is 767px, not 480px:
           login.css:524   @media (max-width: 767px) {
           login.css:525     .login-pf-page .card-pf {
           login.css:526       max-width: none; margin-left: 0; margin-right: 0;
           login.css:529       padding-top: 0; border-top: 0; box-shadow: 0 0;
       The overlay's base rule re-asserts padding-top, border-top and box-shadow (same
       specificity, later source order), but `max-width: none` and the zeroed side margins
       are only undone here. Scoping the gutter to 480px left 481-767px rendering the card
       edge-to-edge with a 16px radius and a drop shadow clipped flush at both viewport
       edges — measured full-bleed at 481, 600 and 767. A 390px capture cannot see that band. */
    @media (max-width: 767px) {
      .login-pf-page .card-pf {
        /* a gutter so the rounded corners and shadow are not clipped flush against the
           viewport edge */
        margin-left: 0.75rem;
        margin-right: 0.75rem;
        border-radius: var(--jtoye-radius);
      }

      /* the footer strip's bottom corners track the card's, or they disagree in this band */
      #kc-info-wrapper {
        border-radius: 0 0 var(--jtoye-radius) var(--jtoye-radius);
      }
    }

    /* Phone-only type and padding steps. Kept as a separate, narrower block so the
       geometry fix above covers the whole phone/small-tablet band while these do not.
       Source order matters: this must follow the 767px block to win at <=480px. */
    @media (max-width: 480px) {
      #kc-header-wrapper {
        font-size: 1.625rem;
        padding: 2rem 1rem 1rem;
      }

      .login-pf-page .card-pf {
        padding: 1.25rem 1.125rem 1rem;
      }

      /* tracks THIS breakpoint's card padding (`1.25rem 1.125rem 1rem`) — shorthand, so the
         stock -30px bottom cannot survive here either; see the #kc-info note above */
      #kc-info {
        margin: 0 -1.125rem -1rem;
      }

      #kc-info-wrapper {
        padding: 0.875rem 1.125rem;
        border-radius: 0 0 var(--jtoye-radius) var(--jtoye-radius);
      }

      #kc-page-title {
        font-size: 1.25rem;
      }

      .login-pf-page .container,
      .login-pf .container {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }

    /* honour a reduced-motion preference for the few transitions above */
    @media (prefers-reduced-motion: reduce) {
      .pf-c-form-control,
      .pf-c-button.pf-m-primary {
        transition: none;
      }
    }
  theme.properties: |
    # J'Toye login theme — CSS-only overlay on Keycloak's built-in `keycloak` login theme.
    #
    # There are NO FTL template overrides here, deliberately: every page (sign-in, register,
    # reset-credentials, update-password, error, info) keeps the parent's markup, so a Keycloak
    # upgrade cannot leave us rendering a stale copy of a template we forked. All branding is
    # reached through the parent's existing class and id hooks.
    #
    # `styles` REPLACES the parent's value rather than appending to it, so the parent's own
    # css/login.css MUST be repeated here — dropping it renders the page unstyled, which is worse
    # than the stock theme. The parent's list was read out of the shipped
    # org.keycloak.keycloak-themes-24.0.5.jar (theme/keycloak/login/theme.properties), not guessed:
    # it is exactly `styles=css/login.css`.
    #
    # `stylesCommon` is deliberately NOT redefined: it is inherited from the parent and still
    # supplies the PatternFly stylesheets that the whole page depends on. Restating it here would
    # be one more list to keep in sync with an upgrade.
    #
    # Resource lookup falls back through the parent chain, so `css/login.css` resolves from the
    # built-in theme inside the jar while `css/jtoye.css` resolves from this directory.

    parent=keycloak
    import=common/keycloak

    styles=css/login.css css/jtoye.css
kind: ConfigMap
metadata:
  annotations:
    deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: jtoye-platform
    environment: staging
  name: keycloak-theme-m5dt5btc4f
  namespace: jtoye-staging
---
apiVersion: v1
data:
  alerts.yml: |
    # Alerting rules for JToye OaaS
    groups:
      - name: api_alerts
        interval: 30s
        rules:
          # High error rate alert
          - alert: HighErrorRate
            expr: |
              (
                sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service)
                /
                sum(rate(http_server_requests_seconds_count[5m])) by (service)
              ) * 100 > 3
            for: 5m
            labels:
              severity: critical
              component: api
              service: core-java
            annotations:
              summary: "High error rate detected on {{ $labels.service }}"
              description: "Service {{ $labels.service }} has {{ $value | humanizePercentage }} error rate (threshold: 3%)"

          # Service down alert
          - alert: ServiceDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
              component: platform
              service: platform
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "{{ $labels.job }} instance {{ $labels.instance }} has been down for more than 2 minutes"

          # High response time
          - alert: HighResponseTime
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_server_requests_seconds_bucket[5m])) by (service, le)
              ) > 1
            for: 5m
            labels:
              severity: warning
              component: performance
              service: core-java
            annotations:
              summary: "High response time on {{ $labels.service }}"
              description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 1s)"

      - name: database_alerts
        interval: 30s
        rules:
          # Database connection pool exhaustion
          - alert: DatabaseConnectionPoolExhausted
            expr: |
              (
                hikaricp_connections_active / hikaricp_connections_max
              ) * 100 > 90
            for: 5m
            labels:
              severity: critical
              component: database
              service: core-java
            annotations:
              summary: "Database connection pool near exhaustion"
              description: "Connection pool is {{ $value | humanizePercentage }} full (threshold: 90%)"

          # Database down.
          #
          # D-11 (phase 27, plan 27-03). `up{job="postgres"}` is the health of the EXPORTER,
          # not of the database. Measured 2026-07-26 on this very stack:
          #     up{job="postgres"} = 1     <- Prometheus scrapes the exporter fine
          #     pg_up              = 0     <- the exporter cannot talk to the DATABASE
          # so this rule reported healthy through a total loss of database visibility. The
          # correct signal, `pg_up`, was present, was 0, and was referenced by NO rule
          # (`grep -c pg_up alerts.yml` -> 0). Same contract failure as StompBrokerLag,
          # different metric: an alert that is structurally incapable of firing.
          #
          # From Prometheus's seat an exporter that cannot reach the database is
          # indistinguishable from a database that is down — and that is the point. The
          # runbook's first-response step distinguishes them with
          # `docker exec jtoye-postgres pg_isready` (the database) against
          # `docker logs jtoye-postgres-exporter` (the exporter).
          - alert: DatabaseDown
            expr: up{job="postgres"} == 0 or pg_up == 0
            for: 1m
            labels:
              severity: critical
              component: database
              service: postgresql
            annotations:
              summary: "PostgreSQL database is down"
              description: "PostgreSQL has been unreachable for more than 1 minute"

          # Too many database connections
          - alert: TooManyDatabaseConnections
            expr: pg_stat_database_numbackends > 100
            for: 5m
            labels:
              severity: warning
              component: database
              service: postgresql
            annotations:
              summary: "High number of database connections"
              description: "Database has {{ $value }} connections (threshold: 100)"

      - name: resource_alerts
        interval: 30s
        rules:
          # High memory usage.
          #
          # D-11 (phase 27, plan 27-03) — the static `service: core-java` label is DELETED
          # here, deliberately, and must not be re-added. A static rule label OVERRIDES the
          # series' own label of the same name, so hard-coding it made this alert name the
          # wrong JVM: the annotation interpolates {{ $labels.service }}, and until 27-00
          # fixed the core-java scrape port the only JVM being scraped was Keycloak. The
          # email would have read "High JVM heap memory usage on core-java" while describing
          # Keycloak's heap. Measured 2026-07-29, with BOTH JVMs now scraped:
          #     jvm_memory_used_bytes{area="heap"} -> service = "keycloak" and "core-api"
          # so with the static label the alert is not merely wrong, it is ambiguous across
          # two instances. The scrape jobs already set `service`; the expression is correct
          # and is untouched. The LABEL was the defect.
          #
          # This rule is a deliberate `service`-label exemption in
          # scripts/check-alert-rules.sh (LABEL_EXEMPT). Adding the label back turns that
          # gate RED as a stale exemption.
          - alert: HighMemoryUsage
            expr: |
              (
                jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}
              ) * 100 > 85
            for: 5m
            labels:
              severity: warning
              component: jvm
            annotations:
              summary: "High JVM heap memory usage on {{ $labels.service }}"
              description: "Heap memory is {{ $value | humanizePercentage }} full (threshold: 85%)"

          # Frequent garbage collection.
          #
          # D-11 (phase 27, plan 27-03) — same defect and same fix as HighMemoryUsage above:
          # the static `service: core-java` label is DELETED so the series' own `service`
          # survives into {{ $labels.service }} and the alert names the JVM it measured.
          # Expression untouched. Also a LABEL_EXEMPT entry in check-alert-rules.sh.
          - alert: FrequentGarbageCollection
            expr: rate(jvm_gc_pause_seconds_count[5m]) > 50
            for: 5m
            labels:
              severity: warning
              component: jvm
            annotations:
              summary: "Frequent garbage collection on {{ $labels.service }}"
              description: "GC rate is {{ $value | humanize }} per second (threshold: 50/s)"

      - name: business_alerts
        interval: 30s
        rules:
          # No orders placed recently (potential issue)
          #
          # THE SERIES THIS RULE READS EXISTS FROM STARTUP (issue #973).
          # `jtoye_orders_total` is the Micrometer counter `jtoye.orders.created`, registered
          # in the BusinessMetricsService CONSTRUCTOR, so core-java exposes it at 0.0 from its
          # first scrape and every restart re-creates it. This rule previously read
          # `http_server_requests_seconds_count{uri=~".../orders",method="POST",status="201"}`,
          # a series Micrometer creates lazily on the FIRST matching request: after every
          # core-java restart the rule had no series at all, `check-alert-metrics.sh` M-1 went
          # red, and only a real order row (scripts/seed-order-metric.sh) turned it green.
          #
          # NAMING QUIRK, DO NOT "CORRECT" IT: the name is `jtoye_orders_total`, NOT
          # `jtoye_orders_created_total`. The Prometheus exporter strips the reserved `_created`
          # suffix from a counter's name (it is the OpenMetrics sample suffix), so the meter
          # `jtoye.orders.created` is exposed as `jtoye_orders_total` (HELP "Total orders
          # created"). Measured on the live staging pod (#999/#1019 fixed the profile tag):
          # `jtoye_orders_total{application="core-java",environment="staging"} 0.0`; there is
          # no `jtoye_orders_created_total`. Renaming the selector would make the rule blind
          # again, and check-alert-metrics.sh M-1 would say so.
          #
          # SEMANTICS CHANGED, DELIBERATELY. The rule used to count HTTP 201 responses on the
          # two create endpoints. It now counts orders PLACED: OrderStateChangeListener.
          # sendEmailForState increments the counter on a deduplicated ORDER_STATE_CHANGED
          # event whose new status is PENDING, which is a cash storefront order at creation, a
          # card order once the payment confirms (not at the 201), and a vendor/API/MCP order
          # on DRAFT -> PENDING. That is closer to what the alert says ("no orders") than a 201
          # was, because an unpaid card checkout is not an order. The counter is driven by the
          # outbox and the AMQP consumer, so the rule also goes quiet when no order EVENT
          # reaches the consumer (a broker or outbox stall). It does NOT detect a consumer that
          # fails AFTER counting: the increment runs inside the listener's transaction and is
          # not undone on rollback, so a poison-message redelivery loop keeps the counter
          # rising. That failure is the job of DeadLetterQueueNonEmpty, OutboxDeadLetterRising,
          # DomainQueueBacklog and MessagingConsumerMissing.
          #
          # AGGREGATED ACROSS PODS ON PURPOSE. The counter is per pod and the listener is a
          # competing consumer: at N replicas each event is handled by exactly ONE pod (k8s
          # production runs three), so an un-summed `increase(...) < 1` fires for every pod
          # that did not happen to consume an order, and for a dead pod's series that stays in
          # the 30m window after a restart. `sum()` asks the business question: did ANY pod
          # count an order. It drops all series labels, which is safe because the labels and
          # annotations below are static (no `$labels` templating). Proven by
          # infra/monitoring/prometheus/tests/alerts.test.yml, run by check-alert-rules.sh.
          #
          # The rule still fires on `< 1`, i.e. on the ABSENCE of an increase, so it needs a
          # series to evaluate; a series that exists at 0 from startup is what provides it. The
          # old selector's history (issue #342: the URI alternatives had to name BOTH create
          # paths, anchored `=~`, `[^/]+` for the slug template) is moot, the rule no longer
          # reads a URI. A counter that exists at 0 also fixes a second blind spot: `increase()`
          # over a series first created BY the event it should count never sees the 0 -> 1
          # step, so the first order after a restart used to be invisible to the rule.
          #
          # Staging mutes this alert at Alertmanager (k8s/components/monitoring/alertmanager.yaml,
          # scripts/check-alert-mute.sh) because a quiet staging has no orders; the series
          # existing from startup does not change that, it only makes the rule evaluable.
          - alert: NoOrdersCreated
            expr: |
              (
                sum(increase(jtoye_orders_total[30m])) < 1
              )
            for: 30m
            labels:
              severity: info
              component: business
              service: core-java
            annotations:
              summary: "No orders created in last 30 minutes"
              description: "No successful order creation detected. This may indicate a business issue."

          # High tenant isolation check failures (security concern).
          # Backed by the real Micrometer counter tenant.context.missing
          # (-> tenant_context_missing_total), emitted by JwtTenantFilter when an
          # authenticated JWT principal reaches the tenant filter with no resolvable
          # tenant claim (issue #98 [P2-7] item 2).
          - alert: TenantIsolationFailure
            expr: rate(tenant_context_missing_total[5m]) > 0.1
            for: 2m
            labels:
              severity: critical
              component: security
              service: core-java
            annotations:
              summary: "Tenant context missing in requests"
              description: "{{ $value }} requests per second lack tenant context (potential security issue)"

          # Payment failure spike. Backed by the real Micrometer counter
          # jtoye.payment.failed (-> jtoye_payment_failed_total), emitted by
          # PaymentService.handlePaymentIntentFailed on every Stripe
          # payment_intent.payment_failed webhook (issue #98 [P2-7] item 2).
          - alert: PaymentFailureSpike
            expr: rate(jtoye_payment_failed_total[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
              component: payment
              service: core-java
            annotations:
              summary: "Elevated Stripe payment-failure rate"
              description: "{{ $value }} payment failures per second over the last 5m (threshold: 0.1/s) — investigate card declines, Stripe outages, or checkout regressions."

      - name: infrastructure_alerts
        interval: 30s
        rules:
          # DISABLED — PENDING node-exporter deploy (issue #98 [P2-7] — cluster-blocked).
          # The DiskSpaceLow / DiskSpaceCritical rules reference node_filesystem_*
          # series that ONLY node-exporter emits, and node-exporter is not yet
          # deployed (out of scope for the local-repo do-now slice). Leaving them
          # LIVE would reference never-emitted metrics (a phantom-alert gap). They
          # are kept here (commented) to document intended coverage — re-enable both
          # the moment node-exporter is scraping.
          #
          # - alert: DiskSpaceLow
          #   expr: |
          #     (
          #       node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
          #       / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}
          #     ) * 100 < 15
          #   for: 10m
          #   labels:
          #     severity: warning
          #     component: infrastructure
          #     service: node
          #   annotations:
          #     summary: "Disk space low on {{ $labels.instance }}"
          #     description: "Only {{ $value | humanize }}% disk space remaining on {{ $labels.mountpoint }} (threshold: 15%)"
          #
          # - alert: DiskSpaceCritical
          #   expr: |
          #     (
          #       node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
          #       / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}
          #     ) * 100 < 5
          #   for: 5m
          #   labels:
          #     severity: critical
          #     component: infrastructure
          #     service: node
          #   annotations:
          #     summary: "Disk space critical on {{ $labels.instance }}"
          #     description: "Only {{ $value | humanize }}% disk space remaining — immediate action required"

          # Keycloak down
          - alert: KeycloakDown
            expr: up{job="keycloak"} == 0
            for: 2m
            labels:
              severity: critical
              component: auth
              service: keycloak
            annotations:
              summary: "Keycloak identity provider is down"
              description: "Keycloak has been unreachable for more than 2 minutes — all authentication will fail"

          # Redis down.
          #
          # TS-15 (docs/ops/terminal-states.yaml), issue #342 item 5. Identical defect to
          # DatabaseDown/D-11 above, in a second metric: `up{job="redis"}` is the health of
          # the EXPORTER, and `redis_up` — the exporter's own report of whether it can reach
          # Redis — was live and referenced by NO rule (`grep -c redis_up alerts.yml` -> 0).
          #
          # Unlike the postgres case this was LATENT, never observed failing, which is why it
          # survived a review that fixed its twin. So it was induced rather than argued.
          # Measured 2026-07-29 with jtoye-redis stopped and jtoye-redis-exporter left running:
          #     up{job="redis"} = 1     <- the exporter still answers, so the OLD rule is blind
          #     redis_up        = 0     <- Redis is actually unreachable
          #     up{job="redis"} == 0                    -> 0 samples  (would NOT have fired)
          #     up{job="redis"} == 0 or redis_up == 0   -> 1 sample   (fires)
          # and on restore both return 0 samples, so this does not page in steady state.
          #
          # A total loss of the cache would have alerted nobody.
          - alert: RedisDown
            expr: up{job="redis"} == 0 or redis_up == 0
            for: 1m
            labels:
              severity: critical
              component: cache
              service: redis
            annotations:
              summary: "Redis cache is down"
              description: "Redis has been unreachable for more than 1 minute — cache operations will fail"

      # =====================================================================================
      # messaging_alerts — rewritten by phase 27, plan 27-03.
      #
      # Until this rewrite this group held exactly ONE rule, StompBrokerLag, and that rule
      # was incapable of firing from the day it was written (see its dormant block at the
      # bottom). Meanwhile four dead-letter queues existed with zero consumers and NINE real
      # tenant-bearing messages sat dead on webhook.deliveries.dlq — the oldest since
      # 2026-07-15 — with no signal that would have said so.
      #
      # EVERY LIVE RULE BELOW IS ON A SERIES PROVEN TO EXIST, LABELS INCLUDED. That is
      # enforced, not promised: scripts/check-alert-metrics.sh queries each rule's bare
      # series SELECTOR (not the whole expression) against the live Prometheus and fails
      # when it matches zero series. Checking the label set and not just the metric name is
      # what catches the actual defect — `rabbitmq_queue_messages_ready` exists;
      # `rabbitmq_queue_messages_ready{queue=~...}` does not.
      #
      # The rabbitmq_detailed_* series come from the `rabbitmq-queues` scrape job added in
      # prometheus.yml.tmpl by the same plan. Without that job every rule here matches
      # nothing.
      #
      # REGEX STYLE. Every regex uses the `[.]` character class for a literal dot. That is
      # HOUSE STYLE, not a correctness fix: measured on this Prometheus, PromQL unescapes
      # `\\` to `\` before RE2 sees it, so `\\.` is a literal dot too and matches
      # identically. `[.]` is preferred only because it is byte-identical under block, plain
      # and double-quoted YAML scalars and so cannot be broken by a later reformat.
      # DO NOT "correct" `\\.` regexes elsewhere in this repo — they are right.
      # The real hazard is a SINGLE backslash: `\.` is rejected at query time with
      # `bad_data: unknown escape sequence`, i.e. it fails loudly rather than silently.
      # =====================================================================================
      - name: messaging_alerts
        interval: 30s
        rules:
          # ---------------------------------------------------------------------------
          # 1. The broker itself.
          #
          # Mirrors RedisDown. Deliberately scoped to job="rabbitmq" and NOT
          # job=~"rabbitmq|rabbitmq-queues": the second scrape job hits the SAME broker on
          # the same port, so its outage is the same outage, and ServiceDown (up == 0,
          # unscoped) already covers it. "Completing" this regex to include both jobs would
          # buy nothing and double-page. Leave it.
          # ---------------------------------------------------------------------------
          - alert: RabbitMQDown
            expr: up{job="rabbitmq"} == 0
            for: 1m
            labels:
              severity: critical
              component: messaging
              service: rabbitmq
            annotations:
              summary: "RabbitMQ broker is down"
              description: >-
                RabbitMQ has been unreachable for more than 1 minute. Verified blast radius:
                the transactional outbox flushers stop draining (rows accumulate PENDING,
                exponential backoff engages, and payment_outbox_dead_letter_total /
                media_outbox_dead_letter_total start rising once attempts reach 10);
                kitchen-display broadcasts stop; outbound webhook fan-out stops; media
                processing stops. core-java's compose healthcheck will flip to unhealthy and
                NOTHING restarts it — `restart: unless-stopped` does not act on health.

          # ---------------------------------------------------------------------------
          # 2. Payment dead letters get their own critical rule, because a lost payment
          #    event is money. Excluded from the generic rule below so the two can never
          #    double-page for one incident.
          # ---------------------------------------------------------------------------
          - alert: PaymentDeadLetterQueueNonEmpty
            expr: rabbitmq_detailed_queue_messages{queue="payment.events.dlq"} > 0
            for: 1m
            labels:
              severity: critical
              component: messaging
              service: rabbitmq
            annotations:
              summary: "Payment events are dead-lettered ({{ $value }} on payment.events.dlq)"
              description: >-
                {{ $value }} message(s) are parked on payment.events.dlq, which has no
                consumer by design. Each one is a payment event the platform failed to
                process three times. Do NOT purge before archiving — the payload is the only
                remaining copy of the event. See docs/runbooks/alerts.md
                (## PaymentDeadLetterQueueNonEmpty) and `scripts/dlq-inspect.sh --peek`.

          # ---------------------------------------------------------------------------
          # 3. Every other dead-letter queue, PER QUEUE so the email names it.
          #
          # WHY THIS IS A SIGNAL AND NOT A PERMANENT PAGE (plan 27-03, M1). This rule fires
          # at depth >= 1 on queues that have NO consumer, so it fires and does not resolve
          # until a human acts. That is only acceptable because plan 27-05 removed the
          # PRODUCING fault — a Jackson2JsonMessageConverter built with no trusted packages,
          # which dead-lettered 100% of outbound webhooks from the day Phase 22 shipped.
          # THE POST-27-05 STEADY-STATE BASELINE FOR webhook.deliveries.dlq IS 0, NOT 9.
          #
          # Consequently: a DeadLetterQueueNonEmpty{queue="webhook.deliveries.dlq"} still
          # firing after 27-05 has landed AND 27-02 has disposed of the historic batch is a
          # REAL REGRESSION, not the known state — it means the converter fix did not take,
          # or a second producer exists. Do not learn to ignore it.
          #
          # Shipping this rule into a tree where the producer was still live would have
          # manufactured exactly the alert fatigue this work exists to remove.
          # ---------------------------------------------------------------------------
          - alert: DeadLetterQueueNonEmpty
            expr: rabbitmq_detailed_queue_messages{queue=~".*[.]dlq", queue!="payment.events.dlq"} > 0
            for: 5m
            labels:
              severity: warning
              component: messaging
              service: rabbitmq
            annotations:
              summary: "Dead letters parked on {{ $labels.queue }} ({{ $value }})"
              description: >-
                {{ $value }} message(s) are parked on {{ $labels.queue }}. Dead-letter queues
                have no consumer by design, so this will not clear itself. Peek
                non-destructively with `scripts/dlq-inspect.sh --peek {{ $labels.queue }}`,
                read x-death[0] for the reason and the original exchange, then decide
                fix-then-redrive vs discard. Archive before any purge — the payload is the
                only remaining copy of the event, and it carries tenant data.

          # ---------------------------------------------------------------------------
          # 4. Live-queue backlog.
          #
          # Negative selector, not an allowlist of today's queues: a queue added in a later
          # phase is covered the day it exists. An allowlist would rot silently, which is the
          # same defect class this group was rewritten to remove.
          #
          # The SSE arm of the regex is REDUNDANT BY DESIGN — prometheus.yml.tmpl's
          # metric_relabel_configs already drops those series before they are stored, so
          # there is nothing here for it to exclude. It is kept as defence in depth, and it
          # is provable rather than decorative: comment out the drop rule, restart
          # Prometheus, and the raw series family gains the SSE queue while THIS selector
          # still excludes it (27-03 T2.6). An unprovable defence-in-depth guard is a trap
          # this project has already been bitten by.
          # ---------------------------------------------------------------------------
          - alert: DomainQueueBacklog
            expr: rabbitmq_detailed_queue_messages_ready{queue!~".*[.]dlq|order[.]state-changes[.]sse[.].*"} > 100
            for: 10m
            labels:
              severity: warning
              component: messaging
              service: rabbitmq
            annotations:
              summary: "Queue backlog on {{ $labels.queue }} ({{ $value }} ready)"
              description: >-
                {{ $labels.queue }} has {{ $value }} messages ready for more than 10 minutes.
                The consumer is alive but not keeping up. Check MessagingConsumerMissing
                first (a dead consumer is a different fault), then core-java thread and
                database saturation — DatabaseConnectionPoolExhausted is the usual upstream.

          # ---------------------------------------------------------------------------
          # 5. The "everything is UP and nothing is working" alert.
          #
          # No depth alert can catch this: core-java UP, broker UP, but a listener container
          # died or lost its channel, so events land in a queue nobody reads. for: 5m absorbs
          # a normal restart.
          #
          # DLQs are excluded because zero consumers is their CORRECT AND PERMANENT state.
          # All four sit at 0 consumers right now. Widening this selector to `.*` pages four
          # times forever — do not "fix" it that way (27-03 T2.7 falsifies exactly that).
          # ---------------------------------------------------------------------------
          - alert: MessagingConsumerMissing
            expr: rabbitmq_detailed_queue_consumers{queue!~".*[.]dlq"} == 0
            for: 5m
            labels:
              severity: critical
              component: messaging
              service: rabbitmq
            annotations:
              summary: "No consumer on {{ $labels.queue }}"
              description: >-
                {{ $labels.queue }} has had no consumer for 5 minutes while the broker is up.
                Messages are accumulating with nothing to process them. Check core-java's log
                for AMQP connection loss, then `rabbitmq-diagnostics list_connections`.

          # ---------------------------------------------------------------------------
          # 6. Outbox poison / exhaustion. Names verified in the live scrape.
          #
          # Two increment paths with COMPLETELY different operator responses, so the
          # description must distinguish them:
          #   - poison payload (JsonProcessingException) -> permanent, NEVER resurrected
          #     (the resurrection queries carry `AND poison = FALSE`)
          #   - attempts >= 10 -> the resurrection pass will re-lease it
          # A poison row is visible ONLY in the database — no metric, no endpoint, no log
          # line after the initial log.error. The runbook carries the query, including the
          # RLS caveat that makes the naive form return zero rows and look reassuring.
          # ---------------------------------------------------------------------------
          - alert: OutboxDeadLetterRising
            expr: increase(payment_outbox_dead_letter_total[15m]) > 0 or increase(media_outbox_dead_letter_total[15m]) > 0
            for: 0m
            labels:
              severity: warning
              component: messaging
              service: core-java
            annotations:
              summary: "Transactional outbox is dead-lettering ({{ $value }} in 15m)"
              description: >-
                An outbox row was abandoned in the last 15 minutes. TWO causes, different
                responses: a poison payload (JsonProcessingException) is permanent and is
                NEVER resurrected; attempts >= 10 will be re-leased by the resurrection pass.
                poison=true rows are visible ONLY in the database — see
                docs/runbooks/alerts.md (## OutboxDeadLetterRising) for the query and its
                RLS caveat.

          # ---------------------------------------------------------------------------
          # 7. StompBrokerLag — DORMANT. Follows the DiskSpaceLow precedent above.
          #
          # THE CORRECTED EXPRESSION, ready to uncomment verbatim:
          #
          #     sum(rabbitmq_detailed_queue_messages_ready{queue=~"stomp-subscription.*|amq[.]gen-.*"}) > 0
          #
          # WHY IT WAS BROKEN. As shipped this rule selected on
          # `rabbitmq_queue_messages_ready`, which comes from the AGGREGATED /metrics
          # endpoint and carries NO queue label at all. Measured 2026-07-29:
          #     query=sum(rabbitmq_queue_messages_ready{queue=~"stomp-subscription.*|amq[.]gen-.*"}) > 0
          #       -> {"resultType":"vector","result":[]}
          #     control query=rabbitmq_queue_messages_ready
          #       -> one series, value 9, metric keys [__name__ component instance job service]
          # The value was there; the label was not. This rule was VACUOUS FROM INTRODUCTION,
          # and the nine dead messages it arguably would have caught are the proof.
          #
          # WHY IT SHIPS DORMANT RATHER THAN LIVE. The corrected expression still matches
          # nothing here, and cannot be made to match by any user action:
          #   - the canonical local runtime is STOMP_BROKER_MODE=in-memory, so nothing is
          #     relayed to RabbitMQ and a subscribing client creates no broker queue at all;
          #   - measured: zero STOMP connections to the broker (GET /api/connections shows
          #     one AMQP 0-9-1 connection and nothing else);
          #   - relay mode is a k8s-base setting, and k8s/ ships no Prometheus.
          # The rule is inapplicable in BOTH runtimes today. A live rule that cannot fire is
          # precisely the defect this group was rewritten to remove, so it is not shipped
          # live merely to look complete.
          #
          # PROVEN CAPABLE OF FIRING. The corrected expression was observed evaluating > 0
          # against a throwaway queue named stomp-subscription-probe27 (created via the
          # management API, published to, then deleted). An alert never observed firing is
          # not an alert; this observes the EXPRESSION firing without pretending the RULE is
          # live.
          #
          # RE-ENABLE TRIGGER AND OWNER: issue #304 (rework frontend/e2e/stomp-relay.spec.ts
          # to be ingress-capable). Whoever makes that spec establish a real SUBSCRIBE in
          # relay mode is the person who should uncomment this rule.
          #
          # THIS DORMANCY CANNOT ROT. scripts/check-alert-metrics.sh carries a DORMANT_RULES
          # entry for StompBrokerLag and FAILS when its selector STARTS returning series —
          # "this rule now has data, re-enable it". The red is the instruction. Only a
          # deliberate STOMP_BROKER_MODE=relay can produce it; no ordinary user action can.
          #
          # - alert: StompBrokerLag
          #   expr: |
          #     sum(rabbitmq_detailed_queue_messages_ready{queue=~"stomp-subscription.*|amq[.]gen-.*"}) > 0
          #   for: 30s
          #   labels:
          #     severity: warning
          #     component: messaging
          #     service: rabbitmq
          #   annotations:
          #     summary: "STOMP broker message lag detected"
          #     description: "Undelivered messages in STOMP subscription queues: {{ $value }}. Kitchen display clients may experience delayed order updates."

      # ---------------------------------------------------------------------------
      # Certificates (issue #972). K8S-ONLY SERIES: certmanager_* comes from cert-manager's own
      # /metrics, which only the k8s Prometheus scrapes (job cert-manager, a k8s-only job declared in
      # k8s/copy-parity.conf). Compose has no cert-manager, so there the rule is silent;
      # scripts/alert-k8s-only.txt tells the live gates so. The rule stays in this ONE corpus (D-16).
      # ---------------------------------------------------------------------------
      - name: certificate_alerts
        interval: 1m
        rules:
          # A certificate cert-manager has not renewed. cert-manager renews 15 to 30 days before expiry
          # (renewBefore), so fewer than 7 days left means issuance has been failing for a week or
          # more, long enough to act on and still before anything serves an expired certificate.
          # Covers every Certificate cert-manager manages in the cluster: the Let's Encrypt edge
          # certificates, the internal CA and mailpit-tls.
          #
          # `> 0` EXCLUDES A CERTIFICATE THAT WAS NEVER ISSUED: cert-manager emits expiration 0 when the
          # Certificate's Status.NotAfter is nil (a first issuance still pending, a stuck HTTP-01
          # challenge, a missing CA Secret), and without the filter that reads as "expired in 1970" and
          # blames a renewal that never existed. Never-issued is a different fault (the Certificate is
          # not Ready) with a different response; this rule is only about renewal.
          #
          # WHAT IT DOES NOT COVER. It reads the Certificate's EXPIRY as cert-manager sees it, i.e.
          # the Secret. It cannot tell that a workload is still serving an OLD certificate from before
          # a renewal; for Mailpit, which reads its certificate only at start, that is closed by the
          # supervisor in k8s/components/mailpit/mailpit.yaml (INV-23), and in kubectl terms by a
          # container restart count that rises at each renewal.
          - alert: CertificateExpiringSoon
            expr: (certmanager_certificate_expiration_timestamp_seconds > 0) - time() < 7 * 86400
            for: 10m
            labels:
              severity: warning
              component: platform
              service: platform
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 7 days"
              description: "cert-manager has not renewed certificate {{ $labels.namespace }}/{{ $labels.name }} and it expires in {{ $value | humanizeDuration }} (a negative value means it has already expired). cert-manager renews at least 15 days early, so a certificate this close to expiry means renewal is failing. See docs/runbooks/alerts.md (## CertificateExpiringSoon)."
kind: ConfigMap
metadata:
  annotations:
    deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: jtoye-platform
    environment: staging
  name: prometheus-alerts-hh4kb7fg45
  namespace: jtoye-staging
---
apiVersion: v1
data:
  prometheus.yml: |
    # Prometheus scrape configuration for jtoye-staging (Phase 29 plan 29-23, DPLY-03, D-16).
    #
    # The Kubernetes sibling of infra/monitoring/prometheus/prometheus.yml.tmpl. It is NOT a byte
    # copy of that file: only the TARGETS differ, and scripts/check-k8s-copy-parity.sh holds the rest
    # equal through the `jobs` pair in k8s/copy-parity.conf (the job_name set, each job's labels,
    # metrics_path, params and metric_relabel_configs). The alert corpus beside this file IS a byte
    # copy (the `alerts.yml` pair in the same list).
    #
    # THE EIGHT SHARED JOB NAMES ARE A CONTRACT (plus one k8s-only job, cert-manager, declared as such
    # in k8s/copy-parity.conf: compose has no cert-manager). scripts/check-alert-liveness.sh maps rules to jobs through
    # EXPORTER_GAUGES, DIRECT_JOBS and SERVICE_JOB_MAP and VOIDs on a job it does not know, so a
    # renamed or added job here stops that gate. Keep the names; change only where a job points.
    #
    # This whole file is ConfigMap DATA, so it lands in the render, where INV-4 refuses the loopback
    # host name and address anywhere in a non-local target. No line here may spell either, comments
    # included.
    #
    # No /-/reload (same as compose): the ConfigMap is generated with a content hash, so an edit here
    # renames it and rolls the Deployment.
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'jtoye-stg-aks'
        environment: 'staging'

    # Alertmanager arrives with plan 29-24 (Service alertmanager:9093). Until then Prometheus logs a
    # DNS failure for it on each evaluation and delivers nothing; the rules still evaluate.
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    # Relative to this file's directory, as in compose: the projected volume puts alerts.yml next to
    # prometheus.yml in /etc/prometheus, the path check-alert-liveness.sh's L-0 reads by default.
    rule_files:
      - 'alerts.yml'

    scrape_configs:
      # Prometheus itself, through its own ClusterIP Service (the compose target is the loopback
      # name, which INV-4 forbids in this render).
      - job_name: 'prometheus'
        static_configs:
          - targets: ['prometheus:9090']
            labels:
              service: 'prometheus'

      # core-java: actuator on the management port 9091 (application-prod.yml), reached PER POD.
      # The headless Service core-java-metrics (clusterIP None) publishes one A record per Ready pod,
      # so each replica is its own target with its own `instance` and rate() is sound (DEF-29-8).
      # The compose job pins `instance` to a constant because compose runs one container; through a
      # ClusterIP that constant would stitch unrelated pods' counters into one series. dns_sd_configs
      # takes no `labels:` block, so the compose labels are set by source-less relabel rules, which
      # the jobs pair in k8s/copy-parity.conf reads as this job's labels.
      - job_name: 'core-java'
        metrics_path: '/actuator/prometheus'
        dns_sd_configs:
          - names: ['core-java-metrics.jtoye-staging.svc.cluster.local']
            type: 'A'
            port: 9091
        relabel_configs:
          - target_label: service
            replacement: 'core-api'
          - target_label: component
            replacement: 'backend'

      # edge-go: /metrics on the app port 8080 (EDGE_MANAGEMENT_PORT is unset in k8s), per pod
      # through the headless edge-go-metrics Service, for the same reason as core-java.
      - job_name: 'edge-go'
        metrics_path: '/metrics'
        dns_sd_configs:
          - names: ['edge-go-metrics.jtoye-staging.svc.cluster.local']
            type: 'A'
            port: 8080
        relabel_configs:
          - target_label: service
            replacement: 'edge-api'
          - target_label: component
            replacement: 'gateway'

      # The managed PostgreSQL, through postgres-exporter (role jtoye_monitor, pg_monitor only).
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']
            labels:
              service: 'postgresql'
              component: 'database'

      # Keycloak 26 serves /metrics on its management port 9000 (KC_METRICS_ENABLED); the Service
      # keycloak exposes 9000 for this job. Compose keeps the legacy interface on 8080 instead.
      - job_name: 'keycloak'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['keycloak:9000']
            labels:
              service: 'keycloak'
              component: 'auth'

      # The in-cluster Redis, through redis-exporter.
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
            labels:
              service: 'redis'
              component: 'cache'

      # The RabbitMQ cluster operator's client Service is `rabbitmq` (rabbitmq_prometheus on 15692).
      # One broker replica, so the ClusterIP is one pod. LEAVE THIS JOB ALONE: it supplies the
      # node-level series and the `up` series RabbitMQDown reads.
      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq:15692']
            labels:
              service: 'rabbitmq'
              component: 'messaging'

      # Per-queue series (plan 27-03, D-01): the aggregated endpoint above carries no `queue` label.
      # params and metric_relabel_configs are the compose job's, verbatim, and the jobs pair holds
      # them equal. The drop rule is load-bearing: the SSE fan-out queue name changes on every
      # core-java restart, so keeping it would leak one label value per restart.
      - job_name: 'rabbitmq-queues'
        metrics_path: '/metrics/detailed'
        params:
          family: ['queue_coarse_metrics', 'queue_consumer_count']
        static_configs:
          - targets: ['rabbitmq:15692']
            labels:
              service: 'rabbitmq'
              component: 'messaging'
        metric_relabel_configs:
          - source_labels: [queue]
            regex: 'order[.]state-changes[.]sse[.].*'
            action: drop

      # cert-manager's own metrics (issue #972): certmanager_certificate_expiration_timestamp_seconds
      # and friends, read by the CertificateExpiringSoon rule. K8S-ONLY: compose has no cert-manager,
      # so this job is declared in k8s/copy-parity.conf (`k8s-only-job`) and absent from
      # infra/monitoring/prometheus/prometheus.yml.tmpl. The Service lives in the cert-manager
      # namespace (ClusterIP, port 9402, the controller's http-metrics); prometheus-allow admits that
      # one egress (an escalated NetworkPolicy row, INV-7) and cert-manager's namespace has no policy
      # of its own. No `service` label on purpose: the rule sets service: platform, and a series
      # label of the same name would be silently overwritten.
      - job_name: 'cert-manager'
        static_configs:
          - targets: ['cert-manager.cert-manager.svc.cluster.local:9402']
            labels:
              component: 'platform'
