apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
    documentation: https://github.com/jtoye/oaas-platform
    maintainer: jtoye-devops-team
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: pg-backup
    app.kubernetes.io/part-of: jtoye-platform
    environment: staging
  name: pg-backup
  namespace: jtoye-staging
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      annotations:
        deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
        documentation: https://github.com/jtoye/oaas-platform
        maintainer: jtoye-devops-team
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: jtoye-platform
        environment: staging
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          annotations:
            deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
            documentation: https://github.com/jtoye/oaas-platform
            maintainer: jtoye-devops-team
          labels:
            app.kubernetes.io/managed-by: kustomize
            app.kubernetes.io/name: pg-backup
            app.kubernetes.io/part-of: jtoye-platform
            environment: staging
        spec:
          containers:
          - env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-credentials
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-credentials
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  key: database
                  name: postgres-credentials
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: backup-username
                  name: postgres-credentials
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: backup-password
                  name: postgres-credentials
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  key: s3.backup.bucket
                  name: app-config
            - name: S3_PREFIX
              valueFrom:
                configMapKeyRef:
                  key: s3.backup.prefix
                  name: app-config
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  key: s3.backup.endpoint
                  name: app-config
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  key: s3.backup.region
                  name: app-config
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: access-key
                  name: s3-backup-credentials
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: secret-key
                  name: s3-backup-credentials
            - name: RETENTION_DAYS
              value: "30"
            image: ghcr.io/bralabee/jtoye-pg-backup:15
            imagePullPolicy: IfNotPresent
            name: pg-backup
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 250m
                memory: 256Mi
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 3
