apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
    documentation: https://github.com/jtoye/oaas-platform
    maintainer: jtoye-devops-team
  labels:
    app: core-java
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: jtoye-platform
    component: backend
    environment: staging
  name: core-java
  namespace: jtoye-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-java
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: jtoye-platform
      environment: staging
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
        documentation: https://github.com/jtoye/oaas-platform
        maintainer: jtoye-devops-team
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "9091"
        prometheus.io/scrape: "true"
      labels:
        app: core-java
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: jtoye-platform
        component: backend
        environment: staging
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - core-java
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: postgres-credentials
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              key: port
              name: postgres-credentials
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              key: database
              name: postgres-credentials
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgres-credentials
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-credentials
        - name: DB_POOL_SIZE
          value: "12"
        - name: JTOYE_RABBIT_DEFAULT_PREFETCH
          valueFrom:
            configMapKeyRef:
              key: rabbit.default.prefetch
              name: app-config
        - name: JTOYE_RABBIT_DEFAULT_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              key: rabbit.default.concurrency
              name: app-config
        - name: JTOYE_RABBIT_MEDIA_PREFETCH
          valueFrom:
            configMapKeyRef:
              key: rabbit.media.prefetch
              name: app-config
        - name: JTOYE_RABBIT_MEDIA_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              key: rabbit.media.concurrency
              name: app-config
        - name: JTOYE_RABBIT_MEDIA_MAX_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              key: rabbit.media.max.concurrency
              name: app-config
        - name: PAYMENT_OUTBOX_FLUSH_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              key: payment.outbox.flush.interval.ms
              name: app-config
        - name: PAYMENT_OUTBOX_RESURRECT_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              key: payment.outbox.resurrect.interval.ms
              name: app-config
        - name: PAYMENT_OUTBOX_BACKOFF_BASE_MS
          valueFrom:
            configMapKeyRef:
              key: payment.outbox.backoff.base.ms
              name: app-config
        - name: PAYMENT_OUTBOX_BACKOFF_CAP_MS
          valueFrom:
            configMapKeyRef:
              key: payment.outbox.backoff.cap.ms
              name: app-config
        - name: MEDIA_OUTBOX_FLUSH_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              key: media.outbox.flush.interval.ms
              name: app-config
        - name: MEDIA_OUTBOX_RESURRECT_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              key: media.outbox.resurrect.interval.ms
              name: app-config
        - name: MEDIA_OUTBOX_BACKOFF_BASE_MS
          valueFrom:
            configMapKeyRef:
              key: media.outbox.backoff.base.ms
              name: app-config
        - name: MEDIA_OUTBOX_BACKOFF_CAP_MS
          valueFrom:
            configMapKeyRef:
              key: media.outbox.backoff.cap.ms
              name: app-config
        - name: KC_ISSUER_URI
          valueFrom:
            configMapKeyRef:
              key: keycloak.issuer.uri
              name: app-config
        - name: KC_ADMIN_ENABLED
          valueFrom:
            configMapKeyRef:
              key: keycloak.admin.enabled
              name: app-config
        - name: KC_ADMIN_BASE_URL
          valueFrom:
            configMapKeyRef:
              key: keycloak.admin.base-url
              name: app-config
        - name: KC_DEPROVISION_REALMS
          valueFrom:
            configMapKeyRef:
              key: keycloak.admin.realms
              name: app-config
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              key: admin-username
              name: keycloak-credentials
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: keycloak-credentials
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              key: redis.host
              name: app-config
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              key: rabbitmq.host
              name: app-config
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: rabbitmq-credentials
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: rabbitmq-credentials
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: redis-credentials
        - name: STOMP_BROKER_MODE
          valueFrom:
            configMapKeyRef:
              key: stomp.broker.mode
              name: app-config
        - name: STOMP_RELAY_HOST
          valueFrom:
            configMapKeyRef:
              key: stomp.broker.relay-host
              name: app-config
        - name: STOMP_RELAY_PORT
          valueFrom:
            configMapKeyRef:
              key: stomp.broker.relay-port
              name: app-config
        - name: STOMP_CLIENT_LOGIN
          valueFrom:
            secretKeyRef:
              key: stomp-login
              name: rabbitmq-credentials
        - name: STOMP_CLIENT_PASSCODE
          valueFrom:
            secretKeyRef:
              key: stomp-passcode
              name: rabbitmq-credentials
        - name: JWT_EXPECTED_ISSUER
          valueFrom:
            configMapKeyRef:
              key: keycloak.public.issuer.uri
              name: app-config
        - name: JWT_EXPECTED_AUDIENCE
          valueFrom:
            configMapKeyRef:
              key: jwt.expected-audience
              name: app-config
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              key: cors.allowed-origins
              name: app-config
        - name: LOG_PATH
          valueFrom:
            configMapKeyRef:
              key: log.path
              name: app-config
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              key: s3.endpoint
              name: app-config
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              key: s3.region
              name: app-config
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              key: s3.bucket
              name: app-config
        - name: S3_PUBLIC_URL
          valueFrom:
            configMapKeyRef:
              key: s3.public-url
              name: app-config
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: access-key
              name: s3-media-credentials
              optional: true
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: secret-key
              name: s3-media-credentials
              optional: true
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              key: smtp.host
              name: app-config
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              key: smtp.port
              name: app-config
        - name: SMTP_AUTH
          valueFrom:
            configMapKeyRef:
              key: smtp.auth
              name: app-config
        - name: SMTP_STARTTLS
          valueFrom:
            configMapKeyRef:
              key: smtp.starttls
              name: app-config
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: smtp-credentials
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: smtp-credentials
              optional: true
        - name: NOTIFICATION_EMAIL_TRACKING_BASE_URL
          valueFrom:
            configMapKeyRef:
              key: notification.email.tracking-base-url
              name: app-config
        - name: NOTIFICATION_UNSUBSCRIBE_BASE_URL
          valueFrom:
            configMapKeyRef:
              key: notification.unsubscribe.base-url
              name: app-config
        - name: DSAR_VERIFY_BASE_URL
          valueFrom:
            configMapKeyRef:
              key: gdpr.dsar.verify-base-url
              name: app-config
        - name: NOTIFICATION_UNSUBSCRIBE_SECRET
          valueFrom:
            secretKeyRef:
              key: unsubscribe-signing-secret
              name: notification-credentials
              optional: true
        - name: STRIPE_CONNECT_RETURN_URL
          valueFrom:
            configMapKeyRef:
              key: stripe.connect.return-url
              name: app-config
        - name: STRIPE_CONNECT_REFRESH_URL
          valueFrom:
            configMapKeyRef:
              key: stripe.connect.refresh-url
              name: app-config
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: stripe-credentials
              optional: true
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: webhook-secret
              name: stripe-credentials
              optional: true
        - name: WEBHOOK_DELIVERY_MAX_ATTEMPTS
          valueFrom:
            configMapKeyRef:
              key: webhook.delivery.max-attempts
              name: app-config
        - name: WEBHOOK_DELIVERY_RETENTION_DAYS
          valueFrom:
            configMapKeyRef:
              key: webhook.delivery.retention-days
              name: app-config
        - name: WEBHOOK_TARGET_BLOCK_PRIVATE_RANGES
          valueFrom:
            configMapKeyRef:
              key: webhook.target.block-private-ranges
              name: app-config
        - name: ACCESS_STRICT_SCOPING
          valueFrom:
            configMapKeyRef:
              key: access.strict-scoping
              name: app-config
        image: ghcr.io/bralabee/jtoye-core-java:2.1.0
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 10
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: 9091
          periodSeconds: 10
          timeoutSeconds: 3
        name: core-java
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        - containerPort: 9091
          name: management
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: 9091
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /actuator/health/liveness
            port: 9091
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /var/log/jtoye
          name: app-logs
      securityContext:
        fsGroup: 1000
      volumes:
      - emptyDir:
          sizeLimit: 2Gi
        name: app-logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
    documentation: https://github.com/jtoye/oaas-platform
    maintainer: jtoye-devops-team
  labels:
    app: edge-go
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: jtoye-platform
    component: gateway
    environment: staging
  name: edge-go
  namespace: jtoye-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-go
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: jtoye-platform
      environment: staging
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        deployment.timestamp: REPLACE_WITH_DEPLOYMENT_TIMESTAMP
        documentation: https://github.com/jtoye/oaas-platform
        maintainer: jtoye-devops-team
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app: edge-go
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: jtoye-platform
        component: gateway
        environment: staging
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - edge-go
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - env:
        - name: CORE_API_URL
          value: http://core-java:9090
        - name: KC_ISSUER_URI
          valueFrom:
            configMapKeyRef:
              key: keycloak.issuer.uri
              name: app-config
        - name: JWT_EXPECTED_ISSUER
          valueFrom:
            configMapKeyRef:
              key: keycloak.public.issuer.uri
              name: app-config
        - name: PORT
          value: "8080"
        image: ghcr.io/bralabee/jtoye-edge-go:2.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        name: edge-go
