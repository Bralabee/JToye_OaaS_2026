apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Staging-specific overrides
  log.level: "DEBUG"
  sql.log.level: "DEBUG"

  # Staging URLs
  #
  # keycloak.issuer.uri is the POD-REACHABLE half of the D-13 split-horizon
  # issuer (core KC_ISSUER_URI, frontend KEYCLOAK_ISSUER_INTERNAL): JWKS,
  # discovery, token and userinfo calls. Plan 29-08 / Pattern 5: it is the
  # in-cluster Keycloak Service, not the public host. Reaching
  # auth-staging.olajay.co.uk from a pod would hairpin through the ingress
  # LoadBalancer IP; Cilium may translate that before policy evaluation, and
  # then the public-443 ipBlock rule would not admit it (29-RESEARCH A5,
  # assumed, not measured; the in-cluster path is safe either way). The issuer
  # Keycloak STAMPS into every token stays public (keycloak.public.issuer.uri
  # below; plan 29-10 sets Keycloak's KC_HOSTNAME to the public origin), so
  # `iss` validation is unchanged. This is the compose shape
  # (docker-compose.full-stack.yml).
  keycloak.issuer.uri: "http://keycloak.jtoye-staging.svc.cluster.local:8080/realms/jtoye-staging"
  api.url: "https://api-staging.olajay.co.uk"
  frontend.url: "https://app-staging.olajay.co.uk"

  # Keycloak admin seam (issue #102 remainder, 31.1-11, 37-08): ON in staging.
  # Staff-invite acceptance creates the invited person in the vendor realm, and
  # offboard deprovisioning and DSAR account deletion call the same admin API;
  # with the seam off all three stay NOT_CONFIGURED. base-url is the in-cluster
  # Keycloak Service (same namespace, DEF-29-5: the jtoye-infrastructure
  # namespace the base names does not exist in staging). The admin credential
  # comes from keycloak-credentials, which Key Vault supplies (plan 29-12).
  keycloak.admin.enabled: "true"
  keycloak.admin.base-url: "http://keycloak.jtoye-staging.svc.cluster.local:8080"
  # The in-cluster Keycloak itself (plan 29-10, k8s/components/keycloak).
  # keycloak.hostname is its KC_HOSTNAME: the FULL public origin, so the issuer it
  # stamps into every token is keycloak.public.issuer.uri below, while
  # KC_HOSTNAME_BACKCHANNEL_DYNAMIC lets pods use keycloak.issuer.uri above.
  # keycloak.db.url is its own `keycloak` database on the managed server (D-02),
  # verify-full against the JVM truststore like core-java (plan 29-08). The host is
  # the server name scripts/azure-staging-datastores.sh creates (jtoye-stg-pg);
  # plan 29-09 records the FQDN it reads back in k8s/staging/azure-identity.yaml,
  # and this value must equal it. The :5432 must equal db.port (the NetworkPolicy
  # follows db.port by replacement; this URL is a separate string).
  keycloak.hostname: "https://auth-staging.olajay.co.uk"
  keycloak.db.url: "jdbc:postgresql://jtoye-stg-pg.postgres.database.azure.com:5432/keycloak?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory"
  # Keycloak's KC_PROXY_TRUSTED_ADDRESSES (#976): the peers whose X-Forwarded-* it
  # believes, the same ingress-path range as security.trusted-proxies below (read
  # there for why the whole /16) but a SEPARATE key on purpose: "" means trust none
  # to core-java and is a boot failure for Keycloak 26.8.1, so the two cannot share
  # one line. Comma-separated, NO whitespace around entries (26.8.1 refuses it:
  # "list value ' 10.0.0.0/8' should not have leading nor trailing whitespace").
  # INV-20 refuses empty, spaced, /0, public and shorter-than-/8 values.
  keycloak.proxy-trusted-addresses: "10.244.0.0/16"
  # Keycloak deprovisioning realm (issue #102 remainder) — staging realm.
  keycloak.admin.realms: "jtoye-staging"
  # 37-08: the vendor realm staff-invite accepts create users in (same realm as above).
  keycloak.admin.vendor-realm: "jtoye-staging"

  # DEF-29-5: in-namespace hosts. Base points all four at
  # *.jtoye-infrastructure.svc.cluster.local, a namespace staging never has.
  # Redis, RabbitMQ (the operator's RabbitmqCluster Service, AMQP and the STOMP
  # relay alike) and Keycloak live in jtoye-staging itself; the NetworkPolicies
  # admit them as same-namespace podSelectors (plan 29-02).
  redis.host: "redis.jtoye-staging.svc.cluster.local"
  rabbitmq.host: "rabbitmq.jtoye-staging.svc.cluster.local"
  stomp.broker.relay-host: "rabbitmq.jtoye-staging.svc.cluster.local"

  # DEF-6 / D-13 / D-19 (Phase 26 / INFRA-02): the env-VARYING subset of the new
  # base app-config keys. Each value is derived from this overlay's OWN
  # keycloak.issuer.uri / frontend.url above — never from the production values
  # the base carries — so a staging email link, a staging CORS origin and a
  # staging Stripe Connect return all resolve to the staging platform.

  # --- SMTP: captured in-cluster, never delivered (D-13 as amended by D-20) ---
  # Staging app mail goes to the in-cluster Mailpit, never to a real relay: the
  # base SES endpoint is production's, and SES itself defers to Phase 32. Mailpit
  # takes no SMTP auth (smtp.auth "false", so the optional smtp-credentials
  # Secret is not needed) and listens on 1025.
  #
  # THE MAIL ORDERING, because this host exists before its server does:
  #   - smtp.starttls "true" sets JavaMail's OPPORTUNISTIC mail.smtp.starttls.enable
  #     only. The D-20 ruling (STARTTLS REQUIRED) is written by plan 29-16 (wave 7)
  #     as the LITERAL `.required: true` in application-prod.yml, the profile k8s
  #     runs; it is deliberately not a configmap key, so a missing entry here can
  #     never fall back to opportunistic TLS (#952's class).
  #   - Mailpit is first created by plan 29-22 (wave 8), serving TLS from its first
  #     start, with the cluster-CA truststore beside it (D-21/D-30). So no TLS-less
  #     Mailpit ever exists in staging.
  #   - From the tracer deploy (plan 29-14) until 29-22, every send fails on DNS for
  #     mailpit.jtoye-staging.svc.cluster.local. That is harmless ONLY because sending
  #     is asynchronous and the readiness group is readinessState alone (no
  #     management.endpoint.health.group.readiness.include in any profile), so a dead
  #     mail host cannot take core-java out of the Service. Plan 29-14 reads both back
  #     and shows the readiness claim can fail. Do NOT add a readiness include for mail.
  smtp.host: "mailpit.jtoye-staging.svc.cluster.local"
  smtp.port: "1025"
  smtp.auth: "false"
  smtp.starttls: "true"

  # Media + backup storage (Phase 36, D-01/D-06/D-11): staging has its OWN two
  # storage accounts, never production's. Media is jtoyestgmedia (uksouth, with
  # the AKS cluster); the logical dump goes to jtoyestgbackup (ukwest), a
  # different account in a different region. Both are raw Blob endpoints (D-06),
  # and public-url is the media endpoint + /jtoye-images — the origin every
  # persisted staging image URL carries. auth-mode (workload-identity), the
  # container names and create-containers ("false") are inherited from base;
  # INV-8 in k8s/scripts/check-render-invariants.sh asserts the whole set on the
  # render. No connection string exists anywhere in this overlay (D-02).
  storage.blob.endpoint: "https://jtoyestgmedia.blob.core.windows.net"
  storage.blob.public-url: "https://jtoyestgmedia.blob.core.windows.net/jtoye-images"
  backup.blob.endpoint: "https://jtoyestgbackup.blob.core.windows.net"

  # D-13 split-horizon: the PUBLIC half — the issuer Keycloak stamps into `iss`
  # (core JWT_EXPECTED_ISSUER, edge JWT_EXPECTED_ISSUER, frontend KEYCLOAK_ISSUER)
  # and the host the browser is redirected to. Since plan 29-08 it DIFFERS from
  # keycloak.issuer.uri above (the in-cluster Service), exactly as compose does.
  keycloak.public.issuer.uri: "https://auth-staging.olajay.co.uk/realms/jtoye-staging"

  # #299: the customer-storefront realm (jtoye-customers, imported by plans
  # 29-04/29-14), split exactly like the vendor realm above: pods reach the
  # in-cluster Service, tokens carry the public host. The client id is inherited
  # from base (storefront-client, the realm's public storefront client).
  keycloak.customer.issuer.uri: "http://keycloak.jtoye-staging.svc.cluster.local:8080/realms/jtoye-customers"
  keycloak.customer.public.issuer.uri: "https://auth-staging.olajay.co.uk/realms/jtoye-customers"

  # keycloak.client-id is inherited from base, which now names `core-api`
  # (Blocker A, plan 29-08): the vendor client the staging realm actually has
  # (infra/keycloak/staging-realm.jq keeps the template's clients). The earlier
  # base value `frontend` named no client in ANY environment's realm, so a staging
  # login could only have ended in invalid_client. INV-14 in
  # k8s/scripts/check-render-invariants.sh fails a deployed render whose client id
  # is not a clientId in infra/keycloak/realm-export.template.json.

  # Single staging platform origin. NOT a wildcard. Read by CorsConfig AND
  # WebSocketConfig (the KDS STOMP handshake).
  cors.allowed-origins: "https://app-staging.olajay.co.uk"

  # D-19: unsubscribe + email open/click tracking links in staging notifications.
  notification.email.tracking-base-url: "https://app-staging.olajay.co.uk"
  notification.unsubscribe.base-url: "https://app-staging.olajay.co.uk"
  # #592 / RFC 8058: the one-click POST target's origin = this overlay's api.url.
  notification.unsubscribe.one-click-base-url: "https://api-staging.olajay.co.uk"
  gdpr.dsar.verify-base-url: "https://app-staging.olajay.co.uk/data-request/confirm"
  gdpr.dsar.export-download-base-url: "https://app-staging.olajay.co.uk/data-request/download"
  staff.invite.accept-base-url: "https://app-staging.olajay.co.uk/invite"

  # D-19: where Stripe returns a vendor after Connect onboarding. Paths match the
  # application.yml defaults; only the origin is staging-specific.
  stripe.connect.return-url: "https://app-staging.olajay.co.uk/dashboard/payments/connect/return"
  stripe.connect.refresh-url: "https://app-staging.olajay.co.uk/dashboard/payments/connect/refresh"
  # PAY-03 (plan 30-13): this runtime's Stripe environment name, declared here and never in
  # base (k8s/base/configmap.yaml says why). Stripe objects this runtime creates carry it as
  # metadata.environment, and events carrying another environment's name are acknowledged
  # without being processed.
  stripe.environment-tag: "staging"

  # FE-1 / E-5 (QA council 20260902-134741): stated EXPLICITLY here, never
  # inherited — the vendor sign-out return leg stays on today's /auth/signin
  # until scripts/check-keycloak-logout-uri.sh (run in deploy-staging, enforced
  # once this is "true") is green against the staging realm's vendor client for
  # https://app-staging.olajay.co.uk/api/vendor-auth/logout-complete. See
  # k8s/base/configmap.yaml for the mechanism and the failure it guards.
  vendor.logout-complete.enabled: "false"

  # --- Trusted proxies (37-24, D-19 / RWO-006; set by plan 29-15 after measuring) --
  # The ingress controller is Traefik (D-29) in namespace `traefik`. Its pods are
  # the socket peer core-java sees, so their address range is the ONLY range whose
  # X-Forwarded-For core-java may believe (ClientIpResolver walks the header from
  # the right and skips only hops inside this list). Measured 2026-10-19, plan 29-15
  # (evidence/29-15-edge.txt, TASK 2):
  #   - az aks show networkProfile.podCidr (subscription-pinned az_read):
  #     10.244.0.0/16 — Azure CNI overlay, Cilium dataplane; equals POD_CIDR in
  #     29-ESTATE-DECISIONS.md.
  #   - Traefik pods at 10.244.2.154 and 10.244.1.134, on two different nodes.
  #   - Traefik Service `traefik`: type LoadBalancer, externalTrafficPolicy Local,
  #     so the LoadBalancer does not SNAT and the client's own address reaches
  #     Traefik, which appends it as the right-most X-Forwarded-For hop.
  #   - Before this value: a request carrying X-Forwarded-For 203.0.113.9 was keyed
  #     on 10.244.1.134 / 10.244.2.154 — every client shared the bucket of the
  #     Traefik pod it landed on.
  # Why the whole /16 and not the two pod IPs or a /24: a Traefik pod gets a new
  # address on every reschedule, on any node, and the overlay hands each node its
  # own block of this range (node .spec.podCIDR is not populated under overlay), so
  # no narrower value stays true. A /16 is private and no wider than /8, which
  # INV-12 accepts. Accepted residual: every pod in the cluster is inside this
  # range, so a pod that can reach core-java directly (the frontend's server-side
  # calls, admitted by the NetworkPolicies) could also supply X-Forwarded-For.
  # The internet cannot: Traefik is the only path in, it appends the real peer as
  # the right-most hop, and the walk stops at the first hop outside this range, so
  # anything a client writes to the left of it is never read.
  # Empty ("") restores trust-none.
  security.trusted-proxies: "10.244.0.0/16"
