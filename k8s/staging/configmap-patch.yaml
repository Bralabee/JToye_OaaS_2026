apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Staging-specific overrides
  log.level: "DEBUG"
  sql.log.level: "DEBUG"

  # Staging URLs
  keycloak.issuer.uri: "https://auth-staging.olajay.co.uk/realms/jtoye-staging"
  api.url: "https://api-staging.olajay.co.uk"
  frontend.url: "https://app-staging.olajay.co.uk"

  # Keycloak deprovisioning realm (issue #102 remainder) — staging realm.
  keycloak.admin.realms: "jtoye-staging"

  # DEF-6 / D-13 / D-19 (Phase 26 / INFRA-02): the env-VARYING subset of the new
  # base app-config keys. Each value is derived from this overlay's OWN
  # keycloak.issuer.uri / frontend.url above — never from the production values
  # the base carries — so a staging email link, a staging CORS origin and a
  # staging Stripe Connect return all resolve to the staging platform.
  #
  # Media storage (s3.*) and SMTP are deliberately NOT overridden here: those
  # base values are the correct AWS eu-west-2 regional endpoints for staging and
  # production alike, and smtp.auth stays "false" in both.

  # D-13 split-horizon: in staging one host serves both roles today, so this is
  # byte-identical to keycloak.issuer.uri above — the key exists so the two can
  # diverge without a manifest edit.
  keycloak.public.issuer.uri: "https://auth-staging.olajay.co.uk/realms/jtoye-staging"

  # --- The realm's ACTUAL OIDC client (plan 29-02 / Blocker A) ---------------
  #
  # WHAT STOOD HERE BEFORE, AND WHY IT IS GONE (not silently deleted).
  #   Until plan 29-02 this block said keycloak.client-id was "DELIBERATELY NOT
  #   OVERRIDDEN here (plan 26-08)", on the reasoning that the base value
  #   `frontend` was byte-identical to the literal once hardcoded in
  #   frontend-deployment.yaml, so staging "keeps authenticating as exactly the
  #   same OIDC client it always has", and that a redundant restatement of the
  #   base value "would be noise, not documentation".
  #
  #   That reasoning was sound about CONTINUITY and wrong about CORRECTNESS. It
  #   preserved a value that never worked: staging had never completed an
  #   ingress login, so "the same client it always has" was the same client that
  #   had never authenticated anyone. 26-08 was scoped to the local overlay and
  #   fixed `frontend` only there; staging inherited the broken value untouched.
  #
  # THE MEASUREMENT, RE-RUN NOW RATHER THAN QUOTED FROM RESEARCH (2026-08-10):
  #     rg -uu --count-matches --include-zero '"clientId" : "frontend"' \
  #        infra/keycloak/realm-export.template.json   ->  0
  #   POSITIVE CONTROL, because an already-0 grep is a statement about the
  #   PATTERN until something proves the pattern can match at all:
  #     rg -uu --count-matches --include-zero '"clientId" : "core-api"' \
  #        infra/keycloak/realm-export.template.json   ->  1
  #   The complete client list in that template is: account, account-console,
  #   admin-cli, broker, core-api, edge-api, integration-catalog-ro,
  #   integration-orders-rw, realm-management, security-admin-console. There is
  #   no `frontend` client in any realm this repository ships.
  #
  # WHY NO GATE CAUGHT IT. The render is valid, the key exists, and the value is
  # a non-empty string — every static assertion staging has is satisfied by a
  # client id that does not exist. The failure is only observable at the
  # authorize request, which is DPLY-01's first step, which is why this is a
  # blocker rather than a tidy-up.
  #
  # `core-api` is the realm's confidential browser-flow client — the same value
  # .env's KEYCLOAK_CLIENT_ID names and the same one k8s/local patches. Adding a
  # `frontend` client to the realm template instead is NOT this plan's fix: the
  # realm parameterisation (staging realm name, redirect URIs, web origins)
  # belongs to plan 29-08, and is named there so it is not lost.
  keycloak.client-id: "core-api"

  # Single staging platform origin. NOT a wildcard. Read by CorsConfig AND
  # WebSocketConfig (the KDS STOMP handshake).
  cors.allowed-origins: "https://app-staging.olajay.co.uk"

  # D-19: unsubscribe + email open/click tracking links in staging notifications.
  notification.email.tracking-base-url: "https://app-staging.olajay.co.uk"
  notification.unsubscribe.base-url: "https://app-staging.olajay.co.uk"

  # Issue #592 — the RFC 8058 one-click target. DERIVED FROM THIS OVERLAY'S OWN
  # api.url above, never from the base's production value, and that is not a
  # style point: inheriting base here would make a STAGING rehearsal email
  # advertise a one-click POST at the PRODUCTION API, so a recipient
  # unsubscribing from a test email would mutate real production consent.
  # UnsubscribeLinkRoutingTest asserts this equality per overlay.
  notification.unsubscribe.one-click-base-url: "https://api-staging.olajay.co.uk"

  # --- Pitfall 7 (Phase 29 / plan 29-02): managed-datastore transport --------
  # The managed cache is TLS-only, so `redis.ssl` and `redis.port` always move
  # together — TLS against a plaintext port finds nothing listening, and
  # plaintext against a TLS port fails the handshake. Enabling a plaintext port
  # on the cache instead would be the wrong fix: it puts session and cache
  # traffic on the public internet in clear (T-29-02-02).
  #
  # PORT 10000, NOT 6380 — CHANGED 2026-08-10 (plan 29-10, owner-approved).
  # The original value was 6380 because ADR-0002 / D-09 chose Azure Cache for
  # Redis Basic C0. That service CANNOT BE CREATED ANY MORE: `az redis create`
  # returns
  #     BadRequest: Azure Cache for Redis is retiring, create Azure Managed
  #                 Redis instance instead
  # measured live on 2026-08-10 while provisioning this very estate. Plan 29-01
  # had recorded that retirement as obligation O-5 dated 2028-09-30, "long
  # horizon, no action this phase" — the horizon binds TODAY, roughly two years
  # early, and a dated row could not have caught it because the row's own date
  # said there was nothing to do.
  #
  # The replacement is Azure Managed Redis (Balanced B0, GBP 9.93/mo — cheaper
  # than the blocked Basic C0's GBP 15.48), and it serves TLS on **10000**.
  #
  # THIS VALUE IS LOAD-BEARING BEYOND THE APP. `k8s/staging/kustomization.yaml`
  # feeds it via `replacements:` into the `core-java-allow` NetworkPolicy egress
  # rule. The staging cluster runs an ENFORCING Cilium dataplane, so a wrong
  # port here is not a warning — every cache call is silently dropped.
  redis.ssl: "true"
  redis.port: "10000"

  # Assumption A6: staging asks for `require`, so a plaintext connection is
  # REFUSED rather than silently downgraded. Azure Database for PostgreSQL
  # Flexible Server ships require_secure_transport=on, so this is the mode that
  # matches the server; base keeps "prefer" so compose is byte-identical.
  db.ssl-mode: "require"

  # The managed server's connection ceiling — a render-time declaration, no env.
  # SOURCE: 429 is the documented default max_connections for a B2s Burstable
  # Flexible Server (414 usable after the 15 reserved), recorded in
  # 29-RESEARCH.md:187 citing learn.microsoft.com/azure/postgresql/
  # configure-maintain/concepts-limits. It is NOT yet confirmed against a
  # provisioned server: plan 29-01 owns provisioning and 29-04 owns teaching
  # check-connection-math.sh to read this key. Re-measure with
  # `SHOW max_connections;` on the real server before either lands.
  db.max-connections: "429"

  # D-19: where Stripe returns a vendor after Connect onboarding. Paths match the
  # application.yml defaults; only the origin is staging-specific.
  stripe.connect.return-url: "https://app-staging.olajay.co.uk/dashboard/payments/connect/return"
  stripe.connect.refresh-url: "https://app-staging.olajay.co.uk/dashboard/payments/connect/refresh"

  # --- D-13 / D-17: the SECOND alert sink, and why it is a STAGING key ---------
  #
  # WHAT THIS BUYS. `check-alert-liveness.sh` L-3 proves the paging path by
  # SEARCHING the destination for a probe it posted. D-17 makes that destination
  # Gmail, which has no HTTP API, so on its own L-3 could only ever VOID. The fix
  # is not a side-channel: these two keys add a second `email_configs` entry to
  # the SAME receiver, so the message the gate can read is the message the owner
  # got — same route, same grouping, same template. Assumption A1 (Alertmanager
  # delivers to EVERY entry in one receiver) was measured with a control arm in
  # plan 29-03: 2 delivered / 1 per address, against a one-entry control at 1 / 0.
  #
  # WHY NOT IN THE BASE. Production must not have a capture sink: a second copy of
  # every real alert sitting in an unauthenticated in-cluster mailbox is an
  # information-disclosure surface with no operational value there. Base therefore
  # leaves both keys EMPTY, and render.sh omits the entry entirely rather than
  # blanking it.
  #
  # THE RELAY IS A FORWARD REFERENCE, DELIBERATELY. `mailhog:1025` is the Service
  # plan 29-09 adds at k8s/staging/mailhog.yaml (D-13, staging-only, ClusterIP on
  # 1025 and 8025). Naming a Service before its manifest lands is this file's
  # existing house style — redis.host, rabbitmq.host and keycloak.admin.base-url
  # all do it — and it is checked at deploy time, not render time. Until 29-09
  # lands, staging's Alertmanager renders a second sink whose relay does not
  # resolve: alerts still reach Gmail (the entries are independent), the capture
  # leg logs a send failure, and NOTHING is deployed before plan 29-11 anyway.
  #
  # THE SINK ADDRESS IS ALSO `L3_SINK_TO`. It is a config key rather than a
  # literal in a workflow so the render and the gate read ONE declaration. Its
  # partner `L3_HUMAN_TO` is read out of the alertmanager-smtp Secret at gate-run
  # time — the owner's inbox is not a value this repository holds. A
  # two-destination receiver with either undeclared is VOID by design (L-3b), so
  # this cannot be forgotten silently.
  alerting.secondary.smtp.smarthost: "mailhog:1025"
  alerting.secondary.smtp.to: "alerts-sink@jtoye-staging.local"

  # --- D-19: Grafana's own origin in staging ----------------------------------
  # DERIVED FROM THIS OVERLAY, never inherited from the base's production value,
  # for the same reason the notification and Stripe origins above are: Grafana
  # builds every absolute link from GF_SERVER_ROOT_URL, so an inherited base value
  # would make a staging dashboard hand out production links. The Ingress, the TLS
  # SAN and the DNS record for this host arrive in plan 29-08 — in that order, and
  # INV-6 fails the build if a rule ever names a Service that is not in the same
  # render.
  grafana.root-url: "https://grafana-staging.olajay.co.uk"
