# Staging hostname for the SSE Ingress. Companion to ingress-hosts-patch.yaml —
# see that file for the full defect writeup and for why these are JSON6902 ops
# rather than a strategic merge patch (IngressSpec.rules has no patchMergeKey, so a
# merge would replace the list and drop the backends).
#
# The SSE Ingress publishes only the API host. It REFERENCES the staging api
# certificate Secret, which jtoye-ingress owns (plan 29-08): base carries no
# cert-manager annotation on this Ingress, so one Secret has one Certificate.
#
# noindex (plan 29-08, T-29-29): base gives this Ingress NO configuration-snippet,
# so staging ADDS one: base jtoye-ingress's six security headers plus
# X-Robots-Tag, the same text as ingress-hosts-patch.yaml. INV-15 requires every
# staging Ingress to carry both.
- op: replace
  path: /metadata/annotations/nginx.ingress.kubernetes.io~1cors-allow-origin
  value: "https://app-staging.olajay.co.uk"
- op: add
  path: /metadata/annotations/nginx.ingress.kubernetes.io~1configuration-snippet
  value: |
    more_set_headers "X-Frame-Options: DENY";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "X-XSS-Protection: 1; mode=block";
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
    more_set_headers "X-Robots-Tag: noindex, nofollow";
- op: replace
  path: /spec/tls/0/hosts/0
  value: api-staging.olajay.co.uk
- op: replace
  path: /spec/tls/0/secretName
  value: jtoye-staging-api-tls
- op: replace
  path: /spec/rules/0/host
  value: api-staging.olajay.co.uk
