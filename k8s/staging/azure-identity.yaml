# k8s/staging/azure-identity.yaml: the Azure identifiers of the staging estate (plan 29-09).
#
# IDENTIFIERS ONLY, NEVER SECRETS. Every value below was READ BACK from Azure (az show/list through
# scripts/lib/azure-guard.sh's az_read, pinned to subscription c483d353-5f61-4587-a790-addb9ab5fb94)
# after the resources were created; none was typed. The raw read-backs are in
# .planning/phases/29-deployable-staging-with-its-own-monitoring/evidence/29-09-provisioning.txt.
# Committing them is threat T-29-32 (accepted): a client id or an IP is not a credential, and a
# Workload Identity token still needs the federated subject, which an outsider cannot present.
#
# The config.kubernetes.io/local-config annotation makes kustomize consume this ConfigMap (as a
# replacements source, plan 29-12) and filter it out of the build, so it is never applied to the
# cluster. scripts/staging-bootstrap.sh, staging-seed.sh, staging-realm-import.sh and
# scripts/lib/staging-kube-guard.sh read it directly. The API server key holds a bare host (no
# scheme, no port), the IP keys hold IPv4 addresses, and the CI key holds the object id of jtoye-ci.
