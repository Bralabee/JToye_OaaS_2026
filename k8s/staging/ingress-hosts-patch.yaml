# Staging hostnames for the main Ingress — the patch that was MISSING.
#
# THE DEFECT (found 2026-07-27 while migrating jtoye.co.uk -> olajay.co.uk).
# k8s/staging/kustomization.yaml patched the ConfigMap and image names but NOT the
# Ingresses, so the rendered staging manifest published the PRODUCTION hostnames
# inside namespace `jtoye-staging`:
#
#     k8s/goldens/staging.yaml   - host: api.jtoye.co.uk    <- production host
#                                - host: app.jtoye.co.uk    <- production host
#                                  secretName: jtoye-tls    <- production cert
#
# while configmap-patch.yaml simultaneously told the app it lived at
# app-staging./api-staging. — hosts nothing served. Silent consequences:
#   1. CORS/CSP/OAuth redirects computed from a host the ingress never published.
#   2. Staging and production Ingresses claimed the SAME hostnames; in one cluster
#      that is an nginx conflict and two cert-manager Certificates racing for one
#      SAN list — the class already recorded in check-render-invariants.sh's header.
#   3. CI smoke-tested a THIRD name (staging-api.), matching neither.
# The goldens faithfully recorded the wrong output, so nothing caught it.
#
# WHY JSON6902 AND NOT A STRATEGIC MERGE PATCH. IngressSpec.rules carries no
# patchMergeKey, so a strategic merge REPLACES the whole list — which would silently
# drop every `http.paths` backend and render an Ingress that routes nothing. These
# ops touch only the host strings, leaving the backends untouched.
#
# Index-coupled by necessity (rules[0]=api, rules[1]=app in k8s/base/ingress.yaml).
# If the base reorders or adds a rule, `kustomize build` FAILS LOUDLY on a missing
# path rather than silently mis-patching — which is the behaviour we want.
#
# The secret NAMES keep their `jtoye-` prefix: that is the product identifier
# (J'TOYE DIGITAL LTD), not the domain. Only hostnames moved.
#
# PER-HOST TLS (plan 29-08, Pitfall 4, D-06/D-07). /spec/tls is REPLACED whole:
# one entry and one Secret per staging host, so each host is its own ACME order
# and DNS can be added host by host. Base has the same shape with the production
# hosts; replacing the list (instead of indexing into it) means a base reorder
# cannot silently pair a staging host with the wrong Secret. INV-15 asserts one
# host per entry and no shared cert-manager Secret on the render.
#
# STAGING IS NOT FOR CRAWLERS (D-08 applied to search engines; T-29-29). The
# configuration-snippet is REPLACED with base's six security headers plus
# X-Robots-Tag noindex, nofollow: staging holds a real-looking storefront that
# must never be indexed as if it were the live product. The six base lines are
# copied, not inherited (a JSON6902 replace cannot append to a block scalar), so
# INV-15 also fails a staging snippet that has drifted from base's header lines.
# Production keeps base's snippet with no X-Robots-Tag: it is indexable once live.
- op: replace
  path: /metadata/annotations/nginx.ingress.kubernetes.io~1cors-allow-origin
  value: "https://app-staging.olajay.co.uk"
- op: replace
  path: /metadata/annotations/nginx.ingress.kubernetes.io~1configuration-snippet
  value: |
    more_set_headers "X-Frame-Options: DENY";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "X-XSS-Protection: 1; mode=block";
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
    more_set_headers "X-Robots-Tag: noindex, nofollow";
- op: replace
  path: /spec/tls
  value:
    - hosts:
        - api-staging.olajay.co.uk
      secretName: jtoye-staging-api-tls
    - hosts:
        - app-staging.olajay.co.uk
      secretName: jtoye-staging-app-tls
- op: replace
  path: /spec/rules/0/host
  value: api-staging.olajay.co.uk
- op: replace
  path: /spec/rules/1/host
  value: app-staging.olajay.co.uk
