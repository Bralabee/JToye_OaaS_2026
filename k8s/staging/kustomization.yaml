apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay configuration
namespace: jtoye-staging

# Reference base configuration + this environment's namespace
# (`resources` replaces the deprecated `bases`)
resources:
  - ../base
  - namespace.yaml

# Staging-specific labels (labels+includeSelectors replaces deprecated commonLabels)
labels:
  - pairs:
      environment: staging
    includeSelectors: true

# Staging-specific annotations
commonAnnotations:
  deployment.timestamp: "REPLACE_WITH_DEPLOYMENT_TIMESTAMP"

# Image tags for staging (typically using 'staging' or 'latest' tags)
images:
  - name: ghcr.io/jtoye/core-java
    newTag: staging
  - name: ghcr.io/jtoye/edge-go
    newTag: staging
  - name: ghcr.io/jtoye/frontend
    newTag: staging

# ConfigMap patches for staging environment
# `patches` with a bare `path` auto-detects strategic-merge, the
# behaviour-preserving replacement for the deprecated `patchesStrategicMerge`.
patches:
  - path: configmap-patch.yaml

# Staging replicas (reduced for cost savings)
replicas:
  - name: core-java
    count: 2
  - name: edge-go
    count: 2
  - name: frontend
    count: 2
