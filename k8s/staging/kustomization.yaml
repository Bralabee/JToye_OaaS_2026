apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay configuration
namespace: jtoye-staging

# Reference base configuration + this environment's namespace
# (`resources` replaces the deprecated `bases`)
resources:
  - ../base
  - namespace.yaml

# In-cluster platform services the login path needs (plan 29-10). Components, not
# base: k8s/local reaches these on the host compose stack, and production opts in
# on purpose in Phase 32. Each lives at k8s/components/<name>/ (depth 3, so the
# render gates' depth-2 target discovery never treats one as a target of its own).
# kustomize applies a component's resources and transformers BEFORE this overlay's
# own namespace, labels, patches and replacements, so everything below reaches them.
components:
  - ../components/keycloak
  - ../components/redis
  - ../components/rabbitmq

# Staging-specific labels.
# D-17 (Phase 26): the explicit `fields:` list mirrors k8s/base/kustomization.yaml —
# see the rationale there. The base entry alone is NOT sufficient: this overlay's
# own `includeSelectors: true` re-injected `environment: staging` (and re-triggered
# the same transformer pass) into the kube-dns DNS-egress podSelector, so all three
# kustomizations must carry the same shape.
labels:
  - pairs:
      environment: staging
    includeSelectors: false
    includeTemplates: true
    fields:
      - path: spec/selector/matchLabels
        create: true
        group: apps
        kind: Deployment
      - path: spec/selector
        create: true
        version: v1
        kind: Service
      - path: spec/selector/matchLabels
        create: true
        group: policy
        kind: PodDisruptionBudget

# Staging-specific annotations
commonAnnotations:
  deployment.timestamp: "REPLACE_WITH_DEPLOYMENT_TIMESTAMP"

# Image tags for staging. Names match what CI actually pushes
# (ghcr.io/bralabee/jtoye-<service>). newTag is the IMMUTABLE default 2.1.0 —
# CI pins the exact full-sha tag at deploy time via `kustomize edit set image`
# (see .github/workflows/ci-cd.yaml deploy-staging). The old mutable `staging`
# tag was the audit finding: two deploys of different code could resolve to the
# same floating tag.
images:
  - name: ghcr.io/bralabee/jtoye-core-java
    newTag: "2.1.0"
  - name: ghcr.io/bralabee/jtoye-edge-go
    newTag: "2.1.0"
  - name: ghcr.io/bralabee/jtoye-frontend
    newTag: "2.1.0"

# ConfigMap patches for staging environment
# `patches` with a bare `path` auto-detects strategic-merge, the
# behaviour-preserving replacement for the deprecated `patchesStrategicMerge`.
patches:
  - path: configmap-patch.yaml
  # AKS Workload Identity pod-template label on core-java and pg-backup
  # (Phase 36 D-02). Two documents in one file, matched by GVK + name.
  - path: workload-identity-patch.yaml
  # Ingress hostnames. WITHOUT these two, staging rendered the PRODUCTION hosts
  # (api./app.) inside namespace jtoye-staging while configmap-patch.yaml told the
  # app it lived at api-staging./app-staging. — so the app was configured for hosts
  # nothing served, and staging contended with production for the same names and
  # TLS SAN list. See ingress-hosts-patch.yaml for the full writeup.
  - path: ingress-hosts-patch.yaml
    target:
      kind: Ingress
      name: jtoye-ingress
  - path: sse-ingress-hosts-patch.yaml
    target:
      kind: Ingress
      name: jtoye-sse-ingress
  # HPA floors 1 and drain-safe PDBs (Pitfall 1, plan 29-08). The HPA owns the
  # replica count; see scale-patch.yaml for why each value is what it is.
  - path: scale-patch.yaml

# Deployment spec.replicas, set EQUAL to the HPA floor above (plan 29-08).
# The old count 2 was misleading: the base HPA floor (3/5/3) won at runtime, so
# the list described a scale staging never ran at. It is not deleted outright,
# because the render would then carry the base spec.replicas 3/5/3, and every
# `kubectl apply` resets a Deployment to its manifest replicas before the HPA
# scales it back down (after the HPA's scale-down stabilisation window) — 11
# pods requested at each deploy on a pool sized for the floors. At 1 the
# manifest and the HPA floor agree, the same two-mechanism shape k8s/local uses.
replicas:
  - name: core-java
    count: 1
  - name: edge-go
    count: 1
  - name: frontend
    count: 1

# Issue #271 — the Postgres egress port follows app-config `db.port`.
#
# REPEATED FROM k8s/base/kustomization.yaml because kustomize does not re-run a
# base replacement against an overlay's patched ConfigMap (measured — see the
# writeup there). Staging does NOT patch db.port today, so this pass is a no-op
# and the staging render is byte-identical with or without it. It is here so that
# the day someone repoints staging at a managed Postgres on a non-default port,
# adding the key to configmap-patch.yaml is the whole change — rather than a
# one-line ConfigMap edit that leaves the NetworkPolicy behind and CrashLoops
# every replica under an enforcing CNI, which is the exact shape of #271.
replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.db\.port
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
      - select:
          kind: NetworkPolicy
          name: pg-backup-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
      # Keycloak's own database is on the same managed server (D-02), so its
      # Postgres rule follows db.port too. Staging-only: the policy comes from
      # ../components/keycloak, which base never sees.
      - select:
          kind: NetworkPolicy
          name: keycloak-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
