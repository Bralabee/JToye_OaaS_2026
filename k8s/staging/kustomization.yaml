apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay configuration
namespace: jtoye-staging

# Reference base configuration + this environment's namespace
# (`resources` replaces the deprecated `bases`)
resources:
  - ../base
  - namespace.yaml

# Staging-specific labels.
# D-17 (Phase 26): the explicit `fields:` list mirrors k8s/base/kustomization.yaml —
# see the rationale there. The base entry alone is NOT sufficient: this overlay's
# own `includeSelectors: true` re-injected `environment: staging` (and re-triggered
# the same transformer pass) into the kube-dns DNS-egress podSelector, so all three
# kustomizations must carry the same shape.
labels:
  - pairs:
      environment: staging
    includeSelectors: false
    includeTemplates: true
    fields:
      - path: spec/selector/matchLabels
        create: true
        group: apps
        kind: Deployment
      - path: spec/selector
        create: true
        version: v1
        kind: Service
      - path: spec/selector/matchLabels
        create: true
        group: policy
        kind: PodDisruptionBudget

# Staging-specific annotations
commonAnnotations:
  deployment.timestamp: "REPLACE_WITH_DEPLOYMENT_TIMESTAMP"

# Image tags for staging. Names match what CI actually pushes
# (ghcr.io/bralabee/jtoye-<service>). newTag is the IMMUTABLE default 2.1.0 —
# CI pins the exact full-sha tag at deploy time via `kustomize edit set image`
# (see .github/workflows/ci-cd.yaml deploy-staging). The old mutable `staging`
# tag was the audit finding: two deploys of different code could resolve to the
# same floating tag.
images:
  - name: ghcr.io/bralabee/jtoye-core-java
    newTag: "2.1.0"
  - name: ghcr.io/bralabee/jtoye-edge-go
    newTag: "2.1.0"
  - name: ghcr.io/bralabee/jtoye-frontend
    newTag: "2.1.0"

# ConfigMap patches for staging environment
# `patches` with a bare `path` auto-detects strategic-merge, the
# behaviour-preserving replacement for the deprecated `patchesStrategicMerge`.
patches:
  - path: configmap-patch.yaml
  # HPA minReplicas + PDB minAvailable. The `replicas:` list below reaches ONLY
  # Deployments, so WITHOUT this patch the base HPA floors (3/5/3) win and
  # staging schedules 11 app pods rather than the 6 that list implies — and the
  # edge-go PDB (minAvailable 3 over 2 replicas) makes every voluntary eviction
  # permanently impossible. See scale-patch.yaml for the measured render.
  - path: scale-patch.yaml
  # Ingress hostnames. WITHOUT these two, staging rendered the PRODUCTION hosts
  # (api./app.) inside namespace jtoye-staging while configmap-patch.yaml told the
  # app it lived at api-staging./app-staging. — so the app was configured for hosts
  # nothing served, and staging contended with production for the same names and
  # TLS SAN list. See ingress-hosts-patch.yaml for the full writeup.
  - path: ingress-hosts-patch.yaml
    target:
      kind: Ingress
      name: jtoye-ingress
  - path: sse-ingress-hosts-patch.yaml
    target:
      kind: Ingress
      name: jtoye-sse-ingress

# Staging replicas (reduced for cost savings)
replicas:
  - name: core-java
    count: 2
  - name: edge-go
    count: 2
  - name: frontend
    count: 2

# Issue #271 / Blocker D — the datastore egress ports and addresses follow
# app-config `db.port`, `db.egress-cidr`, `redis.port` and `redis.egress-cidr`.
#
# REPEATED FROM k8s/base/kustomization.yaml because kustomize does not re-run a
# base replacement against an overlay's patched ConfigMap (measured — see the
# writeup there). Staging does NOT patch db.port today, so that pass is still a
# no-op — but `redis.port` IS patched here (configmap-patch.yaml sets 6380 for
# Azure Cache for Redis Basic, which disables plaintext 6379), so this block has
# stopped being belt-and-braces and is now the only thing that makes staging's
# cache port real. Plan 29-04 measured the fail direction: with this block
# removed from THIS file only, the staging render emitted the BASE 6379 while
# every staging pod dialled 6380 — the #271 trap, reproduced on demand.
#
# The db.port half stays for the reason it was written: the day someone repoints
# staging at a managed Postgres on a non-default port, adding the key to
# configmap-patch.yaml is the whole change, rather than a one-line ConfigMap edit
# that leaves the NetworkPolicy behind and CrashLoops every replica under an
# enforcing CNI.
replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.db\.port
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
          - spec.egress.4.ports.0.port
      - select:
          kind: NetworkPolicy
          name: pg-backup-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
          - spec.egress.4.ports.0.port
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.db\.egress-cidr
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.4.to.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: pg-backup-allow
        fieldPaths:
          - spec.egress.4.to.0.ipBlock.cidr
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.redis\.port
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.5.ports.0.port
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.redis\.egress-cidr
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.5.to.0.ipBlock.cidr
