# SecretProviderClasses: Azure Key Vault -> Secrets Store CSI driver -> the Kubernetes
# Secrets the manifests already name (Phase 29 plan 29-12, D-23, closes the deployed
# half of #100 once the live evidence exists).
#
# ONE SPC PER WORKLOAD, ONE PRODUCER PER SECRET
#   Each workload mounts its own SPC and authenticates as its own ServiceAccount, so
#   each identity can be granted only its own Key Vault objects (plan 29-13). A synced
#   Secret has exactly ONE producing SPC: two SPCs syncing one Secret name would
#   overwrite each other's keys. A value two workloads need is therefore read by the
#   second consumer from a Secret of its own name (pg-backup-credentials,
#   frontend-oidc-credentials, keycloak-server-credentials, redis-server-credentials,
#   rabbitmq-default-user), mapped to the SAME Key Vault object, so the two copies
#   cannot disagree.
#
# KEY VAULT OBJECT NAMES: `<secret-name>--<key>`, with `_` and `.` mapped to `-`
#   (29-RESEARCH A6: Key Vault object names allow alphanumerics and dashes only). The
#   object name is also the file name in the mount and the `objectName` a
#   `secretObjects` entry syncs from (MS Learn, csi-secrets-store-configuration-options,
#   read 2026-10-19: "Make sure the objectName in the secretObjects field matches the
#   file name of the mounted content").
#
# SYNC LIFETIME (29-RESEARCH Pitfall 11; the same MS Learn page): "Your secrets sync
#   after you start a pod to mount them. When you delete the pods that consume the
#   secrets, your Kubernetes secret is also deleted." So every consumer mounts the SPC
#   that produces the Secret it reads. The RabbitMQ operator reads rabbitmq-default-user
#   before any broker pod exists, so the always-on secret-sync Deployment
#   (secret-sync.yaml) mounts rabbitmq-kv for it.
#
# IDENTIFIERS ONLY. clientID, tenantId and keyvaultName are the placeholder below in
#   this component and are written by k8s/staging's `replacements:` from the committed
#   identifiers in k8s/staging/azure-identity.yaml (plan 29-09, read back from Azure).
#   An unreplaced placeholder fails k8s/scripts/check-keyvault-chain.sh's GUID check,
#   so a target that forgets the wiring fails closed. Nothing here is a secret value
#   (T-29-46): no `kind: Secret` is rendered, the CSI driver creates them at run time.
#
# usePodIdentity "false" + clientID = the Workload Identity variant (MS Learn,
#   csi-secrets-store-identity-access, read 2026-10-19). Rotation stays off (the add-on
#   default): env-var consumers only see a new value on a pod restart anyway, and
#   rotation goes through docs/runbooks/credential-rotation.md.
#
# The object list the write-once writer and the deploy preflight use is DERIVED from
# the render by `python3 k8s/scripts/keyvault-chain.py objects`, never hand-written.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: core-java-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACED-BY-OVERLAY"
    tenantId: "REPLACED-BY-OVERLAY"
    keyvaultName: "REPLACED-BY-OVERLAY"
    objects: |
      array:
        - |
          objectName: postgres-credentials--host
          objectType: secret
        - |
          objectName: postgres-credentials--port
          objectType: secret
        - |
          objectName: postgres-credentials--database
          objectType: secret
        - |
          objectName: postgres-credentials--username
          objectType: secret
        - |
          objectName: postgres-credentials--password
          objectType: secret
        - |
          objectName: postgres-credentials--migration-username
          objectType: secret
        - |
          objectName: postgres-credentials--migration-password
          objectType: secret
        - |
          objectName: redis-credentials--password
          objectType: secret
        - |
          objectName: rabbitmq-credentials--username
          objectType: secret
        - |
          objectName: rabbitmq-credentials--password
          objectType: secret
        - |
          objectName: rabbitmq-credentials--stomp-login
          objectType: secret
        - |
          objectName: rabbitmq-credentials--stomp-passcode
          objectType: secret
        - |
          objectName: keycloak-credentials--admin-username
          objectType: secret
        - |
          objectName: keycloak-credentials--admin-password
          objectType: secret
        - |
          objectName: smtp-credentials--username
          objectType: secret
        - |
          objectName: smtp-credentials--password
          objectType: secret
        - |
          objectName: notification-credentials--unsubscribe-signing-secret
          objectType: secret
        - |
          objectName: dsar-credentials--encryption-key
          objectType: secret
        - |
          objectName: client-ip-credentials--hmac-key
          objectType: secret
        - |
          objectName: stripe-credentials--api-key
          objectType: secret
        - |
          objectName: stripe-credentials--webhook-secret
          objectType: secret
  secretObjects:
  - secretName: postgres-credentials
    type: Opaque
    data:
    - key: host
      objectName: postgres-credentials--host
    - key: port
      objectName: postgres-credentials--port
    - key: database
      objectName: postgres-credentials--database
    - key: username
      objectName: postgres-credentials--username
    - key: password
      objectName: postgres-credentials--password
    - key: migration-username
      objectName: postgres-credentials--migration-username
    - key: migration-password
      objectName: postgres-credentials--migration-password
  - secretName: redis-credentials
    type: Opaque
    data:
    - key: password
      objectName: redis-credentials--password
  - secretName: rabbitmq-credentials
    type: Opaque
    data:
    - key: username
      objectName: rabbitmq-credentials--username
    - key: password
      objectName: rabbitmq-credentials--password
    - key: stomp-login
      objectName: rabbitmq-credentials--stomp-login
    - key: stomp-passcode
      objectName: rabbitmq-credentials--stomp-passcode
  - secretName: keycloak-credentials
    type: Opaque
    data:
    - key: admin-username
      objectName: keycloak-credentials--admin-username
    - key: admin-password
      objectName: keycloak-credentials--admin-password
  # smtp, notification and stripe are `optional: true` refs on core-java, but they
  # are produced here like every other key (T-29-45): an optional ref without a
  # producer starts the pod silently unconfigured (mail unauthenticated, payments
  # off). Plan 29-13's preflight requires every object to exist in the vault.
  - secretName: smtp-credentials
    type: Opaque
    data:
    - key: username
      objectName: smtp-credentials--username
    - key: password
      objectName: smtp-credentials--password
  - secretName: notification-credentials
    type: Opaque
    data:
    - key: unsubscribe-signing-secret
      objectName: notification-credentials--unsubscribe-signing-secret
  - secretName: dsar-credentials
    type: Opaque
    data:
    - key: encryption-key
      objectName: dsar-credentials--encryption-key
  - secretName: client-ip-credentials
    type: Opaque
    data:
    - key: hmac-key
      objectName: client-ip-credentials--hmac-key
  - secretName: stripe-credentials
    type: Opaque
    data:
    - key: api-key
      objectName: stripe-credentials--api-key
    - key: webhook-secret
      objectName: stripe-credentials--webhook-secret
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: frontend-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACED-BY-OVERLAY"
    tenantId: "REPLACED-BY-OVERLAY"
    keyvaultName: "REPLACED-BY-OVERLAY"
    objects: |
      array:
        - |
          objectName: nextauth-secret--secret
          objectType: secret
        - |
          objectName: keycloak-credentials--frontend-client-secret
          objectType: secret
  secretObjects:
  - secretName: nextauth-secret
    type: Opaque
    data:
    - key: secret
      objectName: nextauth-secret--secret
  # The frontend's own name for the core-api client secret (base renamed it in plan
  # 29-12); the vault object keeps the canonical keycloak-credentials name, which is
  # what scripts/staging-realm-import.sh and staging-seed.sh already read.
  - secretName: frontend-oidc-credentials
    type: Opaque
    data:
    - key: client-secret
      objectName: keycloak-credentials--frontend-client-secret
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pg-backup-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACED-BY-OVERLAY"
    tenantId: "REPLACED-BY-OVERLAY"
    keyvaultName: "REPLACED-BY-OVERLAY"
    objects: |
      array:
        - |
          objectName: postgres-credentials--host
          objectType: secret
        - |
          objectName: postgres-credentials--port
          objectType: secret
        - |
          objectName: postgres-credentials--database
          objectType: secret
        - |
          objectName: postgres-credentials--backup-username
          objectType: secret
        - |
          objectName: postgres-credentials--backup-password
          objectType: secret
  # The CronJob's pod is the only consumer, so this Secret exists only while a backup
  # Job runs: the pod mounts the SPC, the driver syncs the Secret, and the kubelet
  # resolves the env refs (a container whose Secret is not synced yet is retried, not
  # failed). That ordering is [ASSUMED] here; plan 29-14 proves it on the live
  # cluster with a manual Job from this CronJob.
  secretObjects:
  - secretName: pg-backup-credentials
    type: Opaque
    data:
    - key: host
      objectName: postgres-credentials--host
    - key: port
      objectName: postgres-credentials--port
    - key: database
      objectName: postgres-credentials--database
    - key: backup-username
      objectName: postgres-credentials--backup-username
    - key: backup-password
      objectName: postgres-credentials--backup-password
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keycloak-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACED-BY-OVERLAY"
    tenantId: "REPLACED-BY-OVERLAY"
    keyvaultName: "REPLACED-BY-OVERLAY"
    objects: |
      array:
        - |
          objectName: keycloak-server-credentials--db-password
          objectType: secret
        - |
          objectName: keycloak-credentials--admin-username
          objectType: secret
        - |
          objectName: keycloak-credentials--admin-password
          objectType: secret
  # The master-realm bootstrap admin is the SAME pair core-java uses for the admin API
  # (keycloak-credentials--admin-*), so the server and its one admin client agree.
  secretObjects:
  - secretName: keycloak-server-credentials
    type: Opaque
    data:
    - key: db-password
      objectName: keycloak-server-credentials--db-password
    - key: bootstrap-admin-username
      objectName: keycloak-credentials--admin-username
    - key: bootstrap-admin-password
      objectName: keycloak-credentials--admin-password
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: redis-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACED-BY-OVERLAY"
    tenantId: "REPLACED-BY-OVERLAY"
    keyvaultName: "REPLACED-BY-OVERLAY"
    objects: |
      array:
        - |
          objectName: redis-credentials--password
          objectType: secret
  # The server's requirepass and core-java's redis-credentials/password are one vault
  # object, so the client and the server cannot disagree.
  secretObjects:
  - secretName: redis-server-credentials
    type: Opaque
    data:
    - key: password
      objectName: redis-credentials--password
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rabbitmq-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACED-BY-OVERLAY"
    tenantId: "REPLACED-BY-OVERLAY"
    keyvaultName: "REPLACED-BY-OVERLAY"
    objects: |
      array:
        - |
          objectName: rabbitmq-credentials--username
          objectType: secret
        - |
          objectName: rabbitmq-credentials--password
          objectType: secret
        - |
          objectName: rabbitmq-default-user--default-user-conf
          objectType: secret
  # Mounted by the secret-sync Deployment, read by the RabbitMQ cluster operator
  # (RabbitmqCluster spec.secretBackend.externalSecret). The keys are the ones the
  # operator's own default-user Secret has (v2.23.1 internal/resource/
  # default_user_secret.go, read in plan 29-10). username/password are core-java's
  # rabbitmq-credentials objects, so the app and the broker agree; default_user.conf
  # (`default_user = …` / `default_pass = …`) is written by plan 29-13's write-once
  # writer from those same two values.
  secretObjects:
  - secretName: rabbitmq-default-user
    type: Opaque
    data:
    - key: username
      objectName: rabbitmq-credentials--username
    - key: password
      objectName: rabbitmq-credentials--password
    - key: default_user.conf
      objectName: rabbitmq-default-user--default-user-conf
---
# mailpit-ui-kv (plan 29-22 Task 4, D-33): the testers' mail UI credential, as the
# apr1 htpasswd line Traefik's basic auth reads (Ingress mailpit-ui annotation
# auth-secret: mailpit-ui-credentials, auth-secret-type auth-file, key `auth`).
# Mounted by the always-on secret-sync Deployment: Traefik reads the synced Secret
# itself and has no pod here that could mount it. ONLY the hash object is named: the
# plaintext mailpit-ui-credentials--password is in NO SecretProviderClass, so no
# workload identity is ever granted it (scripts/staging-mail-ui.sh --list-kv-objects
# names it for the writer instead). Both objects are generated by
# scripts/staging-secrets.sh (random alnum32, then composite htpasswd-apr1).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mailpit-ui-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACED-BY-OVERLAY"
    tenantId: "REPLACED-BY-OVERLAY"
    keyvaultName: "REPLACED-BY-OVERLAY"
    objects: |
      array:
        - |
          objectName: mailpit-ui-credentials--auth
          objectType: secret
  secretObjects:
  - secretName: mailpit-ui-credentials
    type: Opaque
    data:
    - key: auth
      objectName: mailpit-ui-credentials--auth
---
# postgres-exporter-kv (plan 29-23, D-23): the monitoring role the exporter connects to the
# managed Postgres as. username is an estate fact (jtoye_monitor), password is generated once by
# scripts/staging-secrets.sh; scripts/staging-db-bootstrap.sh --stage monitor sets the role's
# password from the same object, so the role and the exporter cannot disagree. Mounted by
# postgres-exporter only, fetched as its own identity (client_id_postgres_exporter).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-exporter-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACED-BY-OVERLAY"
    tenantId: "REPLACED-BY-OVERLAY"
    keyvaultName: "REPLACED-BY-OVERLAY"
    objects: |
      array:
        - |
          objectName: postgres-exporter-credentials--username
          objectType: secret
        - |
          objectName: postgres-exporter-credentials--password
          objectType: secret
  secretObjects:
  - secretName: postgres-exporter-credentials
    type: Opaque
    data:
    - key: username
      objectName: postgres-exporter-credentials--username
    - key: password
      objectName: postgres-exporter-credentials--password
---
# redis-exporter-kv (plan 29-23, D-23): the in-cluster Redis's requirepass, the SAME vault object
# redis-kv and core-java-kv read (redis-credentials--password), synced under the exporter's own
# Secret name so each Secret keeps one producer. Mounted by redis-exporter only, fetched as its own
# identity (client_id_redis_exporter).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: redis-exporter-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACED-BY-OVERLAY"
    tenantId: "REPLACED-BY-OVERLAY"
    keyvaultName: "REPLACED-BY-OVERLAY"
    objects: |
      array:
        - |
          objectName: redis-credentials--password
          objectType: secret
  secretObjects:
  - secretName: redis-exporter-credentials
    type: Opaque
    data:
    - key: password
      objectName: redis-credentials--password
---
# alertmanager-kv (plan 29-24, D-17 as corrected, D-23): the Zoho alert-mail values, all four
# EXTERNAL (owner-supplied through scripts/staging-secrets.sh --set-external, never generated).
# from, username and to sync into Secret alertmanager-smtp-credentials for the env. The PASSWORD is
# deliberately NOT in secretObjects: it is read only as the mounted FILE
# /mnt/secrets-store/alertmanager-smtp-credentials--password (auth_password_file), so it exists in
# no Kubernetes Secret and in no environment variable (T-29-87). Mounted by alertmanager only,
# fetched as its own identity (client_id_alertmanager).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: alertmanager-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACED-BY-OVERLAY"
    tenantId: "REPLACED-BY-OVERLAY"
    keyvaultName: "REPLACED-BY-OVERLAY"
    objects: |
      array:
        - |
          objectName: alertmanager-smtp-credentials--from
          objectType: secret
        - |
          objectName: alertmanager-smtp-credentials--username
          objectType: secret
        - |
          objectName: alertmanager-smtp-credentials--to
          objectType: secret
        - |
          objectName: alertmanager-smtp-credentials--password
          objectType: secret
  secretObjects:
  - secretName: alertmanager-smtp-credentials
    type: Opaque
    data:
    - key: from
      objectName: alertmanager-smtp-credentials--from
    - key: username
      objectName: alertmanager-smtp-credentials--username
    - key: to
      objectName: alertmanager-smtp-credentials--to
---
