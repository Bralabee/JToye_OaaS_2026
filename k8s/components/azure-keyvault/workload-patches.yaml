      volumes:
      - name: kv
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: frontend-kv
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
        spec:
          containers:
          - name: pg-backup
            volumeMounts:
            - name: kv
              mountPath: /mnt/secrets-store
              readOnly: true
          volumes:
          - name: kv
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: pg-backup-kv
---
