# secret-sync: keeps the CSI-synced Secrets alive for a consumer that has no pod of
# its own to mount them (Phase 29 plan 29-12, 29-RESEARCH Pattern 4 / Pitfall 11).
#
# WHY IT EXISTS
#   The Secrets Store CSI driver creates a synced Kubernetes Secret only while some
#   pod mounts the SecretProviderClass that produces it, and deletes it when the last
#   such pod goes (MS Learn csi-secrets-store-configuration-options, read 2026-10-19:
#   "When you delete the pods that consume the secrets, your Kubernetes secret is also
#   deleted"). The RabbitMQ cluster operator reads Secret rabbitmq-default-user
#   (RabbitmqCluster spec.secretBackend.externalSecret) BEFORE any broker pod exists,
#   and re-reads it on every reconcile. No broker pod mounts an SPC, so without this
#   Deployment the Secret would never exist: the StatefulSet would wait for it for
#   ever, and a broker restart would find it gone. One always-on pod mounting
#   rabbitmq-kv keeps it synced. (Assumption A7: plan 29-14 measures it live by
#   deleting the consumer and checking the Secret survives.)
#
#   TWO consumers have no pod of their own to mount a SecretProviderClass:
#     - the RabbitMQ cluster operator (Secret rabbitmq-default-user, SPC rabbitmq-kv);
#     - Traefik's auth-secret read for the testers' mail UI (plan 29-22, D-33: Ingress
#       mailpit-ui reads Secret mailpit-ui-credentials, SPC mailpit-ui-kv). With that
#       Secret unresolvable Traefik skips the route (fail closed), so the UI exists only
#       while this pod keeps the Secret synced.
#   This pod mounts both SPCs. k8s/scripts/keyvault-chain.py attributes both reads to
#   Deployment/secret-sync and requires it to mount their producers.
#
# WHAT IT RUNS
#   The pause image: a process that sleeps and handles signals, nothing else. It
#   needs no Kubernetes API token (automount false), no port, no network: the CSI
#   provider fetches from Key Vault on the NODE with this pod's Workload Identity
#   token, not from inside the pod. So its NetworkPolicy admits nothing in either
#   direction. requests 1m / 8Mi keep it out of the B2s capacity budget
#   (29-RESEARCH Pitfall 2).
#
# Its own ServiceAccount and identity (client_id_secret_sync in
# k8s/staging/azure-identity.yaml), granted only the objects its two SPCs name: the
# three rabbitmq-kv objects (plan 29-13) and mailpit-ui-credentials--auth (plan 29-22),
# never the plaintext mailpit-ui-credentials--password. The client-id annotation is
# written by k8s/staging's replacements.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-sync
  labels:
    app.kubernetes.io/name: secret-sync
    app.kubernetes.io/component: secret-sync
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-sync
  labels:
    app: secret-sync
    component: secret-sync
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The new pod mounts (and so keeps syncing) before the old one goes, so a
      # rollout never leaves a window with no consumer of rabbitmq-kv.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: secret-sync
  template:
    metadata:
      labels:
        app: secret-sync
        component: secret-sync
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: secret-sync
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # 65535 is the pause image's own user (nobody); stated numerically so the
        # kubelet can verify runAsNonRoot.
        runAsUser: 65535
        runAsGroup: 65535
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pause
        # Tag AND digest (the manifest-list digest, sha256 of the index read back
        # from registry.k8s.io on 2026-10-19). Horizon row registry-k8s-pause.
        image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "1m"
            memory: "8Mi"
          limits:
            memory: "16Mi"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: kv
          mountPath: /mnt/secrets-store
          readOnly: true
        - name: kv-mailpit-ui
          mountPath: /mnt/secrets-store-mailpit-ui
          readOnly: true
      volumes:
      - name: kv
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: rabbitmq-kv
      - name: kv-mailpit-ui
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: mailpit-ui-kv
---
# secret-sync-allow. INV-7 row secret-sync-allow@k8s/staging;
# k8s/base/networkpolicies/README.md carries the same row. No ingress and no egress:
# the pod serves nothing and calls nothing (the Key Vault fetch is the node's).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secret-sync-allow
  labels:
    app.kubernetes.io/name: secret-sync-allow
    app.kubernetes.io/component: networkpolicy
    app.kubernetes.io/part-of: jtoye-platform
spec:
  podSelector:
    matchLabels:
      app: secret-sync
  policyTypes:
    - Ingress
    - Egress
