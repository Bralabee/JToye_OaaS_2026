# In-cluster monitoring for jtoye-staging (Phase 29 plan 29-23, DPLY-03 part A, D-16).
#
# Plain kustomize, hand-written Deployments, the SAME rule corpus as infra/monitoring: no Helm, no
# operator, no PrometheusRule CRD. A kustomize COMPONENT, listed only by k8s/staging: production
# opts in on purpose in Phase 32, and k8s/local reaches the compose monitoring stack. At
# k8s/components/<name>/ it sits at depth 3, so the render gates' depth-2 target discovery never
# treats it as a target of its own.
#
#   prometheus.yaml              Prometheus, its PVC and Service, the headless metrics Services
#                                core-java-metrics and edge-go-metrics, and prometheus-allow
#   exporters.yaml               postgres-exporter (managed Postgres, role jtoye_monitor) and
#                                redis-exporter (the in-cluster Redis), each its own Workload
#                                Identity; their Key Vault SPCs and mounts are ../azure-keyvault's
#   prometheus/prometheus.yml    the k8s scrape config: the eight compose job names and labels,
#                                held equal by the `jobs` pair in k8s/copy-parity.conf
#   prometheus/alerts.yml        a BYTE COPY of infra/monitoring/prometheus/alerts.yml, held equal
#                                by the byte pair in k8s/copy-parity.conf. Edit the canonical file,
#                                then copy it here; the copy carries no header of its own, or the
#                                two could never be byte-equal. Nothing in this directory is a
#                                second rule corpus.
#   alertmanager.yaml            Alertmanager (plan 29-24): one receiver, the Zoho inbox and the
#                                Mailpit sink, the staging NoOrdersCreated mute; its own Workload
#                                Identity (alertmanager-kv); cluster-internal
#   grafana.yaml                 Grafana (plan 29-24): admin from Key Vault (grafana-kv), the ONLY
#                                public monitoring host (Ingress grafana-public, D-19)
#   alertmanager/*, grafana/*    BYTE COPIES of infra/monitoring/alertmanager/{alertmanager.yml.tmpl,
#                                entrypoint.sh} and infra/monitoring/grafana's datasource, dashboard
#                                provider and STOMP dashboard (k8s/copy-parity.conf), same rule as
#                                alerts.yml: edit the canonical file, then copy it here
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - prometheus.yaml
  - exporters.yaml
  - alertmanager.yaml
  - grafana.yaml

# Content-hashed names: an edit to either file renames its ConfigMap, which rewrites the
# Deployment's projected volume and so rolls the pod (Prometheus runs without /-/reload).
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/prometheus.yml
  - name: prometheus-alerts
    files:
      - alerts.yml=prometheus/alerts.yml
  # Alertmanager reads its template and runs its entrypoint from here (no /-/reload either: an
  # edit renames the ConfigMap and rolls the pod).
  - name: alertmanager-src
    files:
      - alertmanager.yml.tmpl=alertmanager/alertmanager.yml.tmpl
      - entrypoint.sh=alertmanager/entrypoint.sh
  # Grafana provisioning under compose's own file names.
  - name: grafana-datasources
    files:
      - prometheus.yml=grafana/datasource-prometheus.yml
  - name: grafana-dashboard-provider
    files:
      - dashboard.yml=grafana/dashboards-provider.yml
  - name: grafana-dashboards
    files:
      - stomp-dashboard.json=grafana/stomp-dashboard.json

# The same label shape as k8s/base/kustomization.yaml (D-17).
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: jtoye-platform
    includeSelectors: false
    includeTemplates: true
    fields:
      - path: spec/selector/matchLabels
        create: true
        group: apps
        kind: Deployment
      - path: spec/selector
        create: true
        version: v1
        kind: Service
