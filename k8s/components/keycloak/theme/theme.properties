# J'Toye login theme — a CSS overlay on Keycloak's built-in `keycloak` login theme, plus THREE small
# FTL overrides (template.ftl, login.ftl, register.ftl) added for accessibility (#848, UXT-079,
# SW-MRC-12, SW-SAM-10). Until then there were none, deliberately: every page kept the parent's markup
# so an upgrade could not leave us rendering a stale copy of a forked template. That reason still
# stands for every OTHER page (reset-credentials, update-password, info, error, verify-email, ...),
# which are still the parent's; the three overrides exist because CSS cannot add a <main> landmark,
# name the page in <title>, remove a positive tabindex, or put the password rules and a privacy
# link on the register page.
#
# The cost of those three forks is contained, not ignored: each file opens with a
# `JTOYE-BASE-KEYCLOAK: <version>` marker, marks every edited block `JTOYE`, and
# scripts/check-keycloak-theme-ftl.sh (CI) fails when the marker differs from the pinned Keycloak
# image, so an upgrade cannot ship a stale fork unnoticed. Re-derivation recipe:
# infra/keycloak/README.md, "FTL overrides". Anything that CAN be done in CSS or messages stays there.
#
# `styles` REPLACES the parent's value rather than appending to it, so the parent's own
# css/login.css MUST be repeated here — dropping it renders the page unstyled, which is worse
# than the stock theme. The parent's list was read out of the shipped
# org.keycloak.keycloak-themes-26.8.1.jar (theme/keycloak/login/theme.properties), not guessed:
# it is exactly `styles=css/login.css`.
#
# `stylesCommon` is deliberately NOT redefined: it is inherited from the parent and still
# supplies the PatternFly stylesheets that the whole page depends on. Restating it here would
# be one more list to keep in sync with an upgrade.
#
# Resource lookup falls back through the parent chain, so `css/login.css` resolves from the
# built-in theme inside the jar while `css/jtoye.css` resolves from this directory.

parent=keycloak
import=common/keycloak

styles=css/login.css css/jtoye.css
