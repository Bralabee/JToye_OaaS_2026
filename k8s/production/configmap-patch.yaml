apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Production-specific overrides
  log.level: "INFO"
  sql.log.level: "WARN"

  # Production URLs
  keycloak.issuer.uri: "https://auth.olajay.co.uk/realms/jtoye-prod"
  api.url: "https://api.olajay.co.uk"
  frontend.url: "https://app.olajay.co.uk"

  # Keycloak deprovisioning realm (issue #102 remainder) — production realm.
  keycloak.admin.realms: "jtoye-prod"

  # DEF-6 / D-13 / D-19 (Phase 26 / INFRA-02): the env-VARYING subset of the new
  # base app-config keys, stated EXPLICITLY here rather than inherited, so this
  # overlay is self-describing and a future base default change cannot silently
  # move a production email link or a vendor payout redirect. Every value is
  # derived from this overlay's OWN keycloak.issuer.uri / frontend.url above, and
  # every one is byte-identical to the base value — so this addition changes
  # nothing about the production render's effective behaviour.
  #
  # Media storage (s3.*) and SMTP are deliberately NOT overridden here: the base
  # values are already the correct AWS eu-west-2 regional endpoints, and
  # smtp.auth stays "false".

  # D-13 split-horizon: production serves both roles from one public host, so the
  # stamped issuer equals the JWKS host. The key exists so that stays a stated
  # fact rather than an assumption.
  keycloak.public.issuer.uri: "https://auth.olajay.co.uk/realms/jtoye-prod"

  # keycloak.client-id is still DELIBERATELY NOT OVERRIDDEN here, but the REASON
  # changed in plan 29-08 and the old one is recorded rather than quietly
  # replaced.
  #
  #   THE OLD REASON (plan 26-08): "The base value is the byte-identical string
  #   `frontend` that used to be hardcoded in frontend-deployment.yaml, so
  #   production continues to authenticate as exactly the same OIDC client
  #   identity it always has."
  #
  #   THAT SENTENCE IS NOW FALSE IN ITS PREMISE. Plan 29-02 measured that no
  #   `frontend` client exists in any realm this repository ships, and plan 29-08
  #   changed the BASE value to `core-api` — the sole client in the cluster realm
  #   at k8s/base/keycloak/realm-import-configmap.yaml. So production no longer
  #   inherits a phantom: it inherits the corrected value, which is what the
  #   29-02 summary assigned to 29-08/Phase 32 and what this note now records as
  #   done rather than owed.
  #
  # NOT RESTATED HERE, for the reason the old note gave and which still holds:
  # the value is not environment-varying (every environment authenticates as
  # `core-api`), so a duplicate line would be a second place to keep in sync for
  # no gain. Production's own cutover — DNS, a realm on a resolvable host, and a
  # client secret — is Phase 32's (D-08); this key is correct in advance of it.

  # Single production platform origin. NOT a wildcard. Read by CorsConfig AND
  # WebSocketConfig (the KDS STOMP handshake).
  cors.allowed-origins: "https://app.olajay.co.uk"

  # D-19: these two defaulted to a loopback dev origin, so every production
  # notification email shipped an unsubscribe link and a tracking URL pointing at
  # the recipient's own machine.
  notification.email.tracking-base-url: "https://app.olajay.co.uk"
  notification.unsubscribe.base-url: "https://app.olajay.co.uk"

  # D-19: a vendor finishing Stripe Connect onboarding was being returned to a
  # loopback dev origin, stranding MARKETPLACE payout setup at the last step.
  stripe.connect.return-url: "https://app.olajay.co.uk/dashboard/payments/connect/return"
  stripe.connect.refresh-url: "https://app.olajay.co.uk/dashboard/payments/connect/refresh"
