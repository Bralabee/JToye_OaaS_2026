apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay configuration
namespace: jtoye-production

# Reference base configuration + this environment's namespace
# (`resources` replaces the deprecated `bases`)
resources:
  - ../base
  - namespace.yaml

# Production-specific labels.
# D-17 (Phase 26): the explicit `fields:` list mirrors k8s/base/kustomization.yaml —
# see the rationale there. The base entry alone is NOT sufficient: this overlay's
# own `includeSelectors: true` re-injected `environment: production` (and
# re-triggered the same transformer pass) into the kube-dns DNS-egress podSelector,
# so all three kustomizations must carry the same shape.
labels:
  - pairs:
      environment: production
    includeSelectors: false
    includeTemplates: true
    fields:
      - path: spec/selector/matchLabels
        create: true
        group: apps
        kind: Deployment
      - path: spec/selector
        create: true
        version: v1
        kind: Service
      - path: spec/selector/matchLabels
        create: true
        group: policy
        kind: PodDisruptionBudget

# Production-specific annotations
commonAnnotations:
  deployment.timestamp: "REPLACE_WITH_DEPLOYMENT_TIMESTAMP"

# Image tags for production. Names match what CI actually pushes
# (ghcr.io/bralabee/jtoye-<service>). newTag stays the immutable 2.1.0 default;
# CI pins the exact full-sha tag at deploy time via `kustomize edit set image`.
images:
  - name: ghcr.io/bralabee/jtoye-core-java
    newTag: "2.1.0"
  - name: ghcr.io/bralabee/jtoye-edge-go
    newTag: "2.1.0"
  - name: ghcr.io/bralabee/jtoye-frontend
    newTag: "2.1.0"

# ConfigMap patches for production environment
# `patches` with a bare `path` auto-detects strategic-merge, the
# behaviour-preserving replacement for the deprecated `patchesStrategicMerge`.
patches:
  - path: configmap-patch.yaml

# Production replicas scaling (optional - HPA handles this)
replicas:
  - name: core-java
    count: 3
  - name: edge-go
    count: 5
  - name: frontend
    count: 3

# Issue #271 / Blocker D — the datastore egress ports and addresses follow
# app-config `db.port`, `db.egress-cidr`, `redis.port` and `redis.egress-cidr`.
#
# REPEATED FROM k8s/base/kustomization.yaml because kustomize does not re-run a
# base replacement against an overlay's patched ConfigMap (measured — see the
# writeup there). Production patches NONE of these four keys today, so every
# pass here is a no-op and the production render is byte-identical with or
# without the block. It is here so that a future move to managed datastores
# (Phase 32) is a ConfigMap change in configmap-patch.yaml and nothing else,
# instead of a change that silently leaves the NetworkPolicy behind — which under
# an enforcing CNI CrashLoops every core-java replica and fails the nightly
# backup, with a network denial that reads like an application fault.
#
# Production being a no-op is exactly why it is NOT evidence that the block
# works. Staging is the target that exercises it (redis.port 10000 — it was 6380
# until plan 29-10 moved staging to Azure Managed Redis on 2026-08-10), and that
# is where plans 29-04 and 29-10 ran the fail-direction arm.
replacements:
  # T-29-08-04 (plan 29-08) — the cert-manager ClusterIssuer. Production does NOT
  # patch this key, so this pass is a no-op today and the production render is
  # byte-identical with or without it. It is written anyway, for the reason the
  # whole block below is: the day production's cutover (Phase 32) needs to prove
  # the issuance path before spending production ACME quota, moving the issuer is
  # one key in configmap-patch.yaml — instead of a base manifest edit that also
  # changes staging.
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.cert-manager\.cluster-issuer
    targets:
      - select:
          kind: Ingress
          name: jtoye-ingress
        fieldPaths:
          - metadata.annotations.cert-manager\.io/cluster-issuer
      - select:
          kind: Ingress
          name: jtoye-sse-ingress
        fieldPaths:
          - metadata.annotations.cert-manager\.io/cluster-issuer
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.db\.port
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
          - spec.egress.4.ports.0.port
      - select:
          kind: NetworkPolicy
          name: pg-backup-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
          - spec.egress.4.ports.0.port
      # The monitoring exporters (plan 29-07), repeated here for the same measured
      # reason as everything above it. Production patches neither port TODAY, so
      # this pass is currently a no-op — and it is written anyway for exactly the
      # reason the db.port half above was: the day production moves to a managed
      # server on a non-default port, adding the key to configmap-patch.yaml is
      # the whole change, instead of a one-line ConfigMap edit that leaves four
      # NetworkPolicies behind.
      - select:
          kind: NetworkPolicy
          name: postgres-exporter-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
      # Keycloak (plan 29-08) joins on the same terms: its own database on the
      # SAME managed server, one out-of-cluster rule at spec.egress.1.
      - select:
          kind: NetworkPolicy
          name: keycloak-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.db\.egress-cidr
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.4.to.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: pg-backup-allow
        fieldPaths:
          - spec.egress.4.to.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: postgres-exporter-allow
        fieldPaths:
          - spec.egress.1.to.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: keycloak-allow
        fieldPaths:
          - spec.egress.1.to.0.ipBlock.cidr
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.redis\.port
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.5.ports.0.port
      - select:
          kind: NetworkPolicy
          name: redis-exporter-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.redis\.egress-cidr
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.5.to.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: redis-exporter-allow
        fieldPaths:
          - spec.egress.1.to.0.ipBlock.cidr
