#       app: postgresql-primary
#   policyTypes: [Ingress]
#   ingress:
#     - from:
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: jtoye-production
#           podSelector:
#             matchExpressions:
#               - key: app
#                 operator: In
#                 values: [core-java, pg-backup]
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: jtoye-staging
#           podSelector:
#             matchExpressions:
#               - key: app
#                 operator: In
#                 values: [core-java, pg-backup]
#       ports:
#         - protocol: TCP
#           port: 5432
#
# Mirror for redis (6379), rabbitmq (5672, 61613), minio (9000),
# alertmanager (9093). All accept ONLY from app=core-java and, where
# relevant, pg-backup.
# -----------------------------------------------------------------------------
