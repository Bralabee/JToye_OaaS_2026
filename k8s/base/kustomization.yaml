apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base Kubernetes resources
# NOTE: the target Namespace is owned by each overlay (k8s/<env>/namespace.yaml),
# not the base. A base that shipped all env namespaces made every overlay's
# `namespace:` transformer collapse them to one name -> "namespace transformation
# produces ID conflict". Keep environment namespaces out of the shared base.
# SECURITY (#100 / P2-9): no Secret manifests are kustomize resources. The
# former secrets-template.yaml shipped placeholder plaintext Secrets to the
# cluster on every `kubectl apply -k`. It now lives on disk as
# secrets-template.yaml.example (reference shape only, never applied).
# All secrets it describes MUST exist out-of-band BEFORE apply — via
# SealedSecrets (docs/runbooks/sealed-secrets.md) or `kubectl create secret`
# (k8s/QUICK_START.md Step 1). CI guard:
# k8s/scripts/check-no-plaintext-secrets.sh fails the build if any overlay
# ever emits a `kind: Secret` again.
resources:
  - configmap.yaml
  - core-java-deployment.yaml
  - edge-go-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml
  # SSE stream path gets its own Ingress (#92): long-lived event streams need
  # streaming timeouts + buffering off, which are per-Ingress nginx annotations.
  - sse-ingress.yaml
  - pg-backup-cronjob.yaml
  # NetworkPolicies (Phase 15 / INF-01) — default-deny baseline + tier allow-lists.
  # See k8s/base/networkpolicies/README.md for the flow matrix and rollback steps.
  - networkpolicies/00-default-deny.yaml
  - networkpolicies/10-frontend.yaml
  - networkpolicies/20-core-java.yaml
  - networkpolicies/30-edge-go.yaml
  - networkpolicies/40-datastores.yaml
  - networkpolicies/50-observability.yaml

# Common labels applied to all resources.
#
# D-17 (Phase 26, verified PRODUCTION defect): selector labels are applied to an
# EXPLICIT kind list instead of via the blanket `includeSelectors: true`, so the
# transformer can no longer inject the common labels into a
# `NetworkPolicy.spec.podSelector` or a nested `egress[].to[].podSelector`.
# `includeSelectors: true` did exactly that to the DNS-egress rule in
# networkpolicies/20-core-java.yaml: the rendered selector came out as
# {k8s-app: kube-dns, app.kubernetes.io/managed-by: kustomize,
#  app.kubernetes.io/part-of: jtoye-platform, environment: <env>}. Real kube-dns
# pods carry NONE of those extra labels, so the selector matched NOTHING and
# core-java had ZERO DNS egress under an enforcing CNI — a total outage. Inert on
# minikube (default CNI does not enforce NetworkPolicies), which is why it
# survived the live rehearsal, and invisible to
# k8s/scripts/validate-networkpolicies.py, which parses the RAW files rather than
# the kustomize render.
#
# `includeTemplates: true` keeps the labels on pod templates, and the `fields:`
# list below keeps them on exactly the three selectors that carried them before
# (Deployment, Service, PodDisruptionBudget) — verified byte-identical in the
# render, which matters because Deployment/Service selectors are IMMUTABLE and a
# changed one fails the apply. NetworkPolicy `spec` is mutable, so dropping the
# labels there is safe to apply to an existing cluster.
# The k8s/goldens/ render baseline (k8s/scripts/render-golden.sh) is the
# render-level assertion that stops this class returning with the next
# transformer edit.
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: jtoye-platform
    includeSelectors: false
    includeTemplates: true
    fields:
      - path: spec/selector/matchLabels
        create: true
        group: apps
        kind: Deployment
      - path: spec/selector
        create: true
        version: v1
        kind: Service
      - path: spec/selector/matchLabels
        create: true
        group: policy
        kind: PodDisruptionBudget

# Common annotations
commonAnnotations:
  maintainer: "jtoye-devops-team"
  documentation: "https://github.com/jtoye/oaas-platform"

# =============================================================================
# Issue #271 — the Postgres egress port is DERIVED, never authored twice.
#
# THE DEFECT. Phase 26 made DB_PORT Secret-driven (DEF-1) so a non-default
# Postgres port needs no manifest edit, but the NetworkPolicy egress rules that
# PERMIT that connection kept their own `5432` literal. Using the flexibility the
# fix introduced therefore produced a NetworkPolicy denial under an enforcing
# CNI: every core-java replica CrashLooping, and the nightly pg-backup dump
# failing, with the logs pointing at the wrong layer. Fixing one half of a
# coupling is what created the trap.
#
# WHAT THIS DOES. app-config `db.port` is the single RENDER-TIME declaration of
# the Postgres port; this copies it into the dedicated single-port Postgres
# egress rule of both NetworkPolicies. Change the port in ONE place.
#
# THE fieldPath INDICES ARE LOAD-BEARING. `spec.egress.1` is the Postgres rule in
# both policies — deliberately its own rule carrying exactly ONE port, so
# `ports.0.port` means "the Postgres port" and not "whichever port sorts first".
# kustomize renders MAP keys alphabetically but preserves LIST order, so these
# indices address the authored order in the networkpolicies/*.yaml files.
# Inserting an egress rule ahead of index 1 silently retargets the replacement;
# INV-7 in k8s/scripts/check-render-invariants.sh asserts the rendered
# infrastructure-egress port SET exactly, in every target, which is what catches
# that (and a plain forgotten replacement) before it ships.
#
# THIS BLOCK MUST BE REPEATED IN EVERY OVERLAY THAT PATCHES db.port — verified,
# not assumed: with the block present here ONLY and k8s/local patching db.port to
# 5433, the local render still emitted `port: 5432`. kustomize builds the base
# (running this replacement against the BASE ConfigMap) before the overlay's
# patches touch that ConfigMap, so the overlay must run its own pass. It is the
# same repetition the `labels: fields:` list already carries for D-17, and for
# the same structural reason.
#
# -----------------------------------------------------------------------------
# BLOCKER D (plan 29-04) EXTENDS THE SAME MECHANISM TO THE MANAGED DATASTORES.
#
# D-09 moves Postgres and Redis OUT of the cluster. The two in-cluster rules
# address their peer by `namespaceSelector: jtoye-infrastructure`, which a
# managed server is not in, so under an enforcing CNI they do not apply to it and
# the 443-only public rule denies both 5432 and 6380. Two new rules, appended at
# stable indices so no existing index moved, carry one port and one peer each:
#
#   NetworkPolicy       index  what                     port <-        cidr <-
#   core-java-allow     4      managed Postgres         db.port        db.egress-cidr
#   core-java-allow     5      managed Redis            redis.port     redis.egress-cidr
#   pg-backup-allow     4      managed Postgres         db.port        db.egress-cidr
#
# `redis.port` being routed here is the "clean follow-up" the comment in
# networkpolicies/20-core-java.yaml named by hand — taken up now because Azure
# Cache Basic serves TLS on 6380 and disables plaintext 6379, so the value
# genuinely varies per environment for the first time.
#
# EVERY ONE OF THESE ALSO HAS TO BE REPEATED IN EVERY OVERLAY, for the same
# measured reason as db.port. Staging patches redis.port to 6380 in its own
# configmap-patch.yaml; without staging's own pass the staging render would emit
# the BASE 6379 and the cache would be unreachable — the #271 trap exactly, and
# the fail-direction arm plan 29-04 ran to prove this repetition is load-bearing.
# =============================================================================
replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.db\.port
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
          - spec.egress.4.ports.0.port
      - select:
          kind: NetworkPolicy
          name: pg-backup-allow
        fieldPaths:
          - spec.egress.1.ports.0.port
          - spec.egress.4.ports.0.port
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.db\.egress-cidr
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.4.to.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          name: pg-backup-allow
        fieldPaths:
          - spec.egress.4.to.0.ipBlock.cidr
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.redis\.port
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.5.ports.0.port
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.redis\.egress-cidr
    targets:
      - select:
          kind: NetworkPolicy
          name: core-java-allow
        fieldPaths:
          - spec.egress.5.to.0.ipBlock.cidr
