apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base Kubernetes resources
# NOTE: the target Namespace is owned by each overlay (k8s/<env>/namespace.yaml),
# not the base. A base that shipped all env namespaces made every overlay's
# `namespace:` transformer collapse them to one name -> "namespace transformation
# produces ID conflict". Keep environment namespaces out of the shared base.
# SECURITY (#100 / P2-9): no Secret manifests are kustomize resources. The
# former secrets-template.yaml shipped placeholder plaintext Secrets to the
# cluster on every `kubectl apply -k`. It now lives on disk as
# secrets-template.yaml.example (reference shape only, never applied).
# All secrets it describes MUST exist out-of-band BEFORE apply — via
# SealedSecrets (docs/runbooks/sealed-secrets.md) or `kubectl create secret`
# (k8s/QUICK_START.md Step 1). CI guard:
# k8s/scripts/check-no-plaintext-secrets.sh fails the build if any overlay
# ever emits a `kind: Secret` again.
resources:
  - configmap.yaml
  - core-java-deployment.yaml
  - edge-go-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml
  # SSE stream path gets its own Ingress (#92): long-lived event streams need
  # streaming timeouts + buffering off, which are per-Ingress nginx annotations.
  - sse-ingress.yaml
  - pg-backup-cronjob.yaml
  # NetworkPolicies (Phase 15 / INF-01) — default-deny baseline + tier allow-lists.
  # See k8s/base/networkpolicies/README.md for the flow matrix and rollback steps.
  - networkpolicies/00-default-deny.yaml
  - networkpolicies/10-frontend.yaml
  - networkpolicies/20-core-java.yaml
  - networkpolicies/30-edge-go.yaml
  - networkpolicies/40-datastores.yaml
  - networkpolicies/50-observability.yaml

# Common labels applied to all resources.
#
# D-17 (Phase 26, verified PRODUCTION defect): selector labels are applied to an
# EXPLICIT kind list instead of via the blanket `includeSelectors: true`, so the
# transformer can no longer inject the common labels into a
# `NetworkPolicy.spec.podSelector` or a nested `egress[].to[].podSelector`.
# `includeSelectors: true` did exactly that to the DNS-egress rule in
# networkpolicies/20-core-java.yaml: the rendered selector came out as
# {k8s-app: kube-dns, app.kubernetes.io/managed-by: kustomize,
#  app.kubernetes.io/part-of: jtoye-platform, environment: <env>}. Real kube-dns
# pods carry NONE of those extra labels, so the selector matched NOTHING and
# core-java had ZERO DNS egress under an enforcing CNI — a total outage. Inert on
# minikube (default CNI does not enforce NetworkPolicies), which is why it
# survived the live rehearsal, and invisible to
# k8s/scripts/validate-networkpolicies.py, which parses the RAW files rather than
# the kustomize render.
#
# `includeTemplates: true` keeps the labels on pod templates, and the `fields:`
# list below keeps them on exactly the three selectors that carried them before
# (Deployment, Service, PodDisruptionBudget) — verified byte-identical in the
# render, which matters because Deployment/Service selectors are IMMUTABLE and a
# changed one fails the apply. NetworkPolicy `spec` is mutable, so dropping the
# labels there is safe to apply to an existing cluster.
# The k8s/goldens/ render baseline (k8s/scripts/render-golden.sh) is the
# render-level assertion that stops this class returning with the next
# transformer edit.
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: jtoye-platform
    includeSelectors: false
    includeTemplates: true
    fields:
      - path: spec/selector/matchLabels
        create: true
        group: apps
        kind: Deployment
      - path: spec/selector
        create: true
        version: v1
        kind: Service
      - path: spec/selector/matchLabels
        create: true
        group: policy
        kind: PodDisruptionBudget

# Common annotations
commonAnnotations:
  maintainer: "jtoye-devops-team"
  documentation: "https://github.com/jtoye/oaas-platform"
