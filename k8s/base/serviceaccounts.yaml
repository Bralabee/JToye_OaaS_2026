# serviceaccounts.yaml — dedicated identities for the two workloads that talk to
# Azure Blob Storage (Phase 36, D-02).
#
# WHY DEDICATED, NOT `default`
#   AKS Workload Identity federates a Kubernetes ServiceAccount to an Entra
#   managed identity through a federated identity credential whose subject is
#   exactly `system:serviceaccount:<namespace>:<name>`. core-java needs the MEDIA
#   account (read/write on jtoye-images + jtoye-quarantine) and pg-backup needs the
#   BACKUP account (write-only on jtoye-db-backups). They are different
#   identities with different roles on different accounts, so they must be two
#   ServiceAccounts; sharing one — or using `default`, which every other pod in
#   the namespace also runs as — would hand each workload the other's grant.
#
# automountServiceAccountToken: false
#   Neither workload calls the Kubernetes API, so neither gets a Kubernetes API
#   token mounted. The workload-identity webhook projects its OWN audience-scoped
#   token volume (audience api://AzureADTokenExchange) for the Entra exchange,
#   independently of this flag (assumption A6 in 36-RESEARCH.md, verified against
#   the live webhook in Phase 29 per docs/runbooks/azure-blob-provisioning.md).
#   INV-10 in k8s/scripts/check-render-invariants.sh asserts this flag.
#
# THE CLIENT-ID ANNOTATION IS PHASE 29'S
#   `azure.workload.identity/client-id: <managed identity client id>` is added to
#   each ServiceAccount (per overlay) by Phase 29 once the identities exist. Until
#   then the webhook injects no AZURE_CLIENT_ID and core-java fails FAST at boot
#   on the missing variable (storage shape validation) rather than at first
#   upload. The pod-template label `azure.workload.identity/use: "true"` is added
#   by the staging/production workload-identity-patch.yaml, never in base or local.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-java
  labels:
    app.kubernetes.io/name: core-java
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-backup
  labels:
    app.kubernetes.io/name: pg-backup
    app.kubernetes.io/component: database
automountServiceAccountToken: false
