---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jtoye-ingress
  annotations:
    # TLS Configuration
    #
    # THIS VALUE IS NOT AUTHORED ANY MORE (plan 29-08 / T-29-08-04). It is
    # overwritten at render time from app-config `cert-manager.cluster-issuer` by
    # the `replacements:` block in k8s/base/kustomization.yaml AND in the staging
    # and production kustomizations — a base replacement does not re-run against
    # an overlay's patched ConfigMap, a fact plans 29-04 and 29-10 each measured.
    # The literal below is the base default you get if a replacement is ever
    # removed, and it is byte-identical to what this line has always said, so the
    # production render is unchanged. Change app-config, never this line.
    #
    # WHY IT HAD TO STOP BEING A LITERAL: all the SANs on this Ingress share ONE
    # certificate Secret and are issued as a SINGLE ACME order, so one failed
    # HTTP-01 challenge fails the whole order (see the `tls:` note below). Let's
    # Encrypt's PRODUCTION endpoint charges each failure against a weekly
    # duplicate-certificate quota that then blocks the retry — so a rehearsal
    # environment whose DNS does not resolve yet must issue against the STAGING
    # ACME endpoint first. With the issuer hardcoded here, that was a base
    # manifest edit; it is now one key in an overlay's configmap-patch.yaml.
    #
    # k8s/local removes this annotation entirely (LOC-4: no cert-manager runs
    # locally), which is why the local overlay deliberately carries NO
    # replacement pass for it — kustomize applies an overlay's patches BEFORE its
    # replacements, so a local pass would look for a field its own patch had just
    # deleted.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate Limiting (per IP)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "50"

    # Request Size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # CORS Configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.olajay.co.uk"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"

    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # Buffer sizes for large requests
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  # TLS: exactly the two hosts this controller actually serves.
  #
  # A THIRD host used to sit in this SAN list — the Keycloak hostname — alongside
  # a rule routing it to a Service named `keycloak`. See the note above `rules:`
  # for why both were removed. The SAN entry mattered on its own: all three names
  # share ONE `secretName: jtoye-tls`, and cert-manager issues that certificate as
  # a single order covering every SAN. An HTTP-01 challenge for a hostname whose
  # DNS points at the managed identity provider rather than at this controller
  # cannot be answered here, and a failed challenge fails the WHOLE order — so a
  # dangling SAN could block or stall renewal for api and app too, taking the
  # platform's real certificate down with it.
  #
  # Keep this list in lockstep with `rules:` below: a host belongs here only if a
  # rule routes it to a Service that exists in the render. CI asserts the
  # backend half of that (INV-6 in k8s/scripts/check-render-invariants.sh).
  #
  # 2026-08-11 (plan 29-08) — THE CONDITION ABOVE BECAME TRUE, AND THE SAN CAME
  # BACK IN THE STAGING OVERLAY, NOT HERE. D-02 puts Keycloak in the cluster, so
  # a Service named `keycloak` now exists in every render and the removal note
  # under `rules:` has been executed. It was executed in k8s/staging, because the
  # constraint that removed it in the first place is about DNS, and only staging
  # has any: D-08 keeps every PRODUCTION hostname deliberately unresolvable until
  # Phase 32 decides cutover. Adding `auth.olajay.co.uk` to THIS list today would
  # re-create exactly the defect the note describes — a SAN whose HTTP-01
  # challenge cannot be answered, inside a shared order, stalling issuance for
  # api and app as well. Production's host rule and SAN arrive with production's
  # DNS records, in that order, in Phase 32.
  tls:
  - hosts:
    - api.olajay.co.uk
    - app.olajay.co.uk
    secretName: jtoye-tls
  # Host rules.
  #
  # REMOVED (Phase 26 / plan 26-04, 26-REVIEWS.md Adjudication B — a CONFIRMED
  # production defect, not a cleanup): a third rule published the Keycloak
  # hostname and routed it to `service: keycloak` on port 8080. No Service by
  # that name exists ANYWHERE in k8s/ — verified across every render, whose
  # complete Service set is core-java, edge-go and frontend, and neither
  # k8s/staging nor k8s/production adds one. So staging and production were both
  # publishing a hostname with no backend, for which nginx answers 503.
  #
  # It is not an oversight to fill in: Keycloak is an EXTERNAL MANAGED identity
  # provider in staging and production (see app-config `keycloak.issuer.uri`),
  # and public DNS for that hostname resolves to the managed IdP, not to this
  # ingress controller. This controller must therefore not claim the name at all
  # — claiming it is what turns "someone else serves this" into "we serve this,
  # badly".
  #
  # IF AN IN-CLUSTER KEYCLOAK IS EVER DEPLOYED: the host rule and the TLS SAN
  # come back TOGETHER WITH its Service and Deployment, in that order — never
  # before them. Recorded as a dated deferred item in
  # .planning/phases/26-local-k8s-overlay-verified-breakage-fixes/deferred-items.md
  # so the displaced intent is not lost.
  #
  # ### EXECUTED 2026-08-11 — plan 29-08 (DPLY-01 / D-02 / #296) ###
  #
  # The condition became true and the instruction was followed in the order it
  # specifies. `k8s/base/keycloak/` now ships the Deployment, the ClusterIP
  # Service on 8080 and its NetworkPolicy; the host rule and the TLS SAN were
  # added AFTER them, in the SAME change, in `k8s/staging/ingress-hosts-patch.yaml`.
  # INV-6 is the mechanism that made the ordering enforceable rather than
  # advisory: it fails the build the moment a rule names a Service the render
  # does not contain.
  #
  # THE PARAGRAPH ABOVE IS NOW HISTORICAL IN ONE RESPECT AND STILL LIVE IN
  # ANOTHER, and the difference matters. Its premise — "Keycloak is an EXTERNAL
  # MANAGED identity provider in staging and production" — is FALSE as of D-02
  # for staging; there is no external Keycloak anywhere, which is what
  # .planning/ISSUE-DISPOSITION.md's superseded note assumed there was. But its
  # RULE is untouched and is why the rule was added to the overlay and not here:
  # a controller must not claim a hostname whose DNS does not point at it, and
  # production's four names are deliberately unresolvable until Phase 32 (D-08).
  #
  # The staging rules for auth-staging and grafana-staging are `op: add` in that
  # overlay, appended after the existing indices, precisely so the `op: replace`
  # paths that address rules[0] (api) and rules[1] (app) BY POSITION keep
  # addressing them.
  rules:
  - host: api.olajay.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: core-java
            port:
              number: 9090
  - host: app.olajay.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
