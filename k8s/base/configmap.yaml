---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Keycloak configuration
  keycloak.issuer.uri: "https://auth.olajay.co.uk/realms/jtoye-prod"

  # Keycloak user deprovisioning on tenant offboard (issue #102 remainder).
  # OFF by default. base-url is the IN-CLUSTER admin host (NOT the public
  # issuer above). The admin PASSWORD is NOT here — it comes from the
  # keycloak-credentials Secret (admin-password) via the deployment. realms is
  # per-env (overlays patch it): base tracks the prod realm.
  keycloak.admin.enabled: "false"
  keycloak.admin.base-url: "http://keycloak.jtoye-infrastructure.svc.cluster.local:8080"
  keycloak.admin.realms: "jtoye-prod"
  # 31.1-11 (D-03): the realm holding CUSTOMER sign-in accounts, the only realm a
  # verified DSAR erasure deletes from. Separate from keycloak.admin.realms (the
  # vendor offboarding sweep, T-kc-04). With keycloak.admin.enabled "false" (above)
  # an erasure here stays NOT_CONFIGURED and is parked FAILED after
  # max-process-attempts: enabling the admin seam (plus the keycloak-credentials
  # Secret) in staging/production is a deployment step, not done here.
  keycloak.admin.customer-realm: "jtoye-customers"

  # API URLs
  api.url: "https://api.olajay.co.uk"
  frontend.url: "https://app.olajay.co.uk"

  # ---------------------------------------------------------------------------
  # FE-1 / E-5 (QA council 20260902-134741) — the vendor sign-out return leg.
  #
  # "true" makes <frontend.url>/api/vendor-auth/logout-complete the
  # post_logout_redirect_uri Keycloak returns a signing-out vendor to; that route
  # ends the Auth.js session SERVER-SIDE in the last response the browser
  # processes (the client-side clear lost a race to ~24 in-flight session GETs
  # 9/12 times, re-opening /dashboard as the departed vendor with no prompt).
  #
  # OFF here and restated as OFF in EVERY overlay, deliberately: the URI must be
  # registered on the vendor client of the DEPLOYED realm, which is external and
  # not verifiable from this repository, and an unregistered URI makes Keycloak
  # answer 400 WITHOUT terminating the SSO session (#504) — strictly worse than
  # the defect the flag closes. With the flag off the frontend keeps today's
  # /auth/signin landing. Flip an overlay to "true" only after
  # scripts/check-keycloak-logout-uri.sh (run in that overlay's deploy job,
  # ENFORCED once the flag is on) is green against its realm. Compose runs ON.
  # Consumed by frontend-deployment.yaml -> VENDOR_LOGOUT_COMPLETE_ENABLED.
  # ---------------------------------------------------------------------------
  vendor.logout-complete.enabled: "false"

  # ---------------------------------------------------------------------------
  # Postgres port — the RENDER-TIME declaration (issue #271)
  #
  # WHAT CONSUMES THIS: nothing injects it as an env var. It exists so the
  # NetworkPolicy egress rules that PERMIT the Postgres connection can be derived
  # from one declared value instead of carrying their own literal. The derivation
  # is the `replacements:` block in k8s/base/kustomization.yaml, which writes this
  # value into the Postgres egress rule of BOTH networkpolicies/20-core-java.yaml
  # and networkpolicies/40-datastores.yaml.
  #
  # WHY THIS IS NOT ALSO DB_PORT's SOURCE, and the residual contract.
  #   DB_PORT stays on the `postgres-credentials` Secret (`port` key) in both
  #   core-java-deployment.yaml and pg-backup-cronjob.yaml. That is DEF-1's fix
  #   and it is deliberately NOT undone here: the Secret is created OUT-OF-BAND
  #   (SealedSecrets in staging/production; scripts/k8s-local-secrets.sh from the
  #   gitignored .env locally), so an environment can change its Postgres port
  #   WITHOUT editing a committed manifest. Moving DB_PORT here would make the
  #   port a manifest edit again — the exact complaint DEF-1 was filed about.
  #
  #   A Secret VALUE can never appear in a kustomize render (by design, and
  #   k8s/scripts/check-no-plaintext-secrets.sh enforces it), so a NetworkPolicy
  #   literal can never be derived from the Secret. One render-time declaration is
  #   therefore the closest single source that exists. The contract is:
  #
  #       postgres-credentials/port  ==  app-config db.port
  #
  #   ENFORCED, not merely documented, in the one place both are observable:
  #   scripts/k8s-local-secrets.sh (STEP 1c) refuses to create the Secret when the
  #   two disagree. For staging/production the Secret is sealed and unreadable
  #   from this repository, so it is an operator step, in the same shape as the
  #   RABBITMQ_USER pre-rollout check in k8s/base/core-java-deployment.yaml.
  #   Written up in k8s/LOCAL.md § 6.
  #
  # SOURCE of this value: the Postgres default, matching what the base render has
  # always permitted. Overlays patch it (k8s/local uses 5433, the compose-published
  # host port). An overlay that patches it MUST also carry the `replacements:`
  # block — kustomize does not re-run a base replacement against an overlay's
  # patched source. INV-7 in k8s/scripts/check-render-invariants.sh fails the build
  # when an overlay forgets, which is what stops the two halves diverging again.
  # ---------------------------------------------------------------------------
  db.port: "5432"

  # --- Issue #506: the SERVER-SIDE core API base for the frontend -------------
  #
  # api.url above is the BROWSER's view of core. It is baked into the frontend
  # image at Docker BUILD time as NEXT_PUBLIC_API_URL and is correct for every
  # client-side caller. It is NOT usable by Next.js code running INSIDE a
  # frontend pod, and that is the whole reason this key exists.
  #
  # frontend/lib/customer-orders-server.ts resolves the core base as
  #   CORE_API_INTERNAL_URL || NEXT_PUBLIC_API_URL || "http://localhost:9090"
  # and the middle term is FROZEN at build time — Next inlines every literal
  # `process.env.NEXT_PUBLIC_*` reference into the SERVER bundle as well as the
  # client one. Measured in the built artifact (jtoye-frontend, .next/server):
  #   process.env.CORE_API_INTERNAL_URL||"http://localhost:9090"
  # i.e. NEXT_PUBLIC_API_URL had already been substituted by its baked literal,
  # and only CORE_API_INTERNAL_URL survives as a runtime lookup. That is why
  # this must be a non-NEXT_PUBLIC_ name: nothing else can be set per
  # environment after the image is built. Re-adding NEXT_PUBLIC_API_URL as a
  # runtime env would reach NOTHING (D-18) — do not.
  #
  # WHY THE SHORT SERVICE NAME AND NOT AN FQDN
  # core-java is a ClusterIP Service in the SAME namespace as the frontend in
  # every overlay, but the namespace itself differs (jtoye-staging /
  # jtoye-production / jtoye-local). `core-java` resolves through the pod's own
  # `search <ns>.svc.cluster.local …` list, so ONE base value is correct in all
  # three — an FQDN would be an environment-varying literal needing three
  # patches (GLOBAL_RULE_6). Port 9090 is the Service's declared port
  # (k8s/base/core-java-deployment.yaml).
  #
  # ALREADY ALLOWED BY POLICY: k8s/base/networkpolicies/10-frontend.yaml has
  # always carried an egress rule "core-java on port 9090 (server-side API calls
  # from Next.js)" selecting `app: core-java` on TCP 9090. Until now nothing
  # used it — the policy anticipated a call the Deployment could not make.
  #
  # PATH-EQUIVALENT to the public route: k8s/base/ingress.yaml routes
  # host api.url `/` (Prefix) straight to Service core-java:9090 with NO
  # rewrite, so `<internal>/public/orders/mine` and `<public>/public/orders/mine`
  # reach the identical upstream path. Going direct also skips the ingress
  # per-IP rate limit, which server-to-server traffic should never consume.
  api.internal.url: "http://core-java:9090"
  
  # Redis configuration
  redis.host: "redis-cluster.jtoye-infrastructure.svc.cluster.local"
  redis.port: "6379"
  
  # RabbitMQ configuration
  rabbitmq.host: "rabbitmq.jtoye-infrastructure.svc.cluster.local"
  rabbitmq.port: "5672"

  # RabbitMQ listener tuning (Phase 27 / 27-04). Bound by RabbitListenerProperties under
  # jtoye.rabbit.*; the numbers come from a recorded measurement, not from folklore —
  # infra/load-testing/baselines/2026-07-28-media-A-baseline.md. See docs/runbooks/messaging.md.
  # Deliberately NOT spring.rabbitmq.listener.simple.*: that family is inert here, because a bean
  # named rabbitListenerContainerFactory makes Boot's own factory (and its configurer) back off.
  rabbit.default.prefetch: "250"
  rabbit.default.concurrency: "1"
  rabbit.media.prefetch: "2"
  rabbit.media.concurrency: "1"
  # Ceiling, not headroom: 3 breaks check-consumer-thread-budget.sh against a pool of 12, and
  # raising the pool to fit 3 breaks check-connection-math.sh at 166 > 157.
  rabbit.media.max.concurrency: "2"

  # Outbox flusher tuning (Phase 27 / 27-04). These eight keys previously existed ONLY as inline
  # @Value defaults in Java, so a flush interval could not be changed without rebuilding the
  # image. Values are identical to those defaults — a visibility fix, not a behaviour change.
  payment.outbox.flush.interval.ms: "5000"
  payment.outbox.resurrect.interval.ms: "300000"
  payment.outbox.backoff.base.ms: "5000"
  payment.outbox.backoff.cap.ms: "300000"
  # This one paces the entire media pipeline: arrival at media.process is batched on it, which is
  # why Arm A measured a peak queue depth of 0 at concurrency 1.
  media.outbox.flush.interval.ms: "5000"
  media.outbox.resurrect.interval.ms: "300000"
  media.outbox.backoff.base.ms: "5000"
  media.outbox.backoff.cap.ms: "300000"
  
  # Application settings
  log.level: "INFO"
  sql.log.level: "WARN"

  # STOMP broker relay configuration
  stomp.broker.mode: "relay"
  stomp.broker.relay-host: "rabbitmq.jtoye-infrastructure.svc.cluster.local"
  stomp.broker.relay-port: "61613"

  # --- pg-backup CronJob Blob target (#90; Phase 36 D-01, D-02, D-07, D-11) --
  # The logical dump goes to a DEDICATED backup storage account, separate from
  # the media account and in a different Azure region (ukwest, paired with the
  # uksouth media account), whose jtoye-db-backups container carries a WORM
  # time-based retention, blob soft delete and a lifecycle delete rule
  # (docs/runbooks/azure-blob-provisioning.md). The job authenticates with AKS
  # Workload Identity (D-02): NO account key, connection string or SAS is held in
  # any Secret, sealed or not. Its identity is write-only, so there is no prune
  # here and none in the image — retention belongs to the container.
  # The endpoint is the account's raw Blob endpoint, no port and no path.
  # Base carries the PRODUCTION account (jtoyeprodbackup, D-11); staging patches
  # its own. Consumed by k8s/base/pg-backup-cronjob.yaml as STORAGE_AUTH_MODE /
  # STORAGE_ENDPOINT / BACKUP_CONTAINER / BACKUP_PREFIX (infra/backups/k8s-backup.sh).
  backup.blob.auth-mode: "workload-identity"
  backup.blob.endpoint: "https://jtoyeprodbackup.blob.core.windows.net"
  backup.blob.container: "jtoye-db-backups"
  backup.blob.prefix: "backups"

  # ===========================================================================
  # DEF-6 / D-15 / D-19 (Phase 26 / INFRA-02): base-manifest config drift versus
  # the shipped v2.2/v2.3 feature set.
  #
  # Before this block, k8s/base injected 23 env vars into core-java (DB,
  # Keycloak, Redis, RabbitMQ, STOMP) and NOTHING for media storage, email,
  # CORS, token audience, notification origins, Stripe Connect origins, the log
  # path or the webhook-delivery knobs. Every one of those placeholders in
  # core-java/src/main/resources/application.yml therefore resolved to its
  # Spring default — and several of those defaults are loopback/dev-only
  # literals. That is the DEF-4 defect class: an ABSENT env resolving to a
  # working-looking default, in staging and production as much as locally.
  #
  # PROVENANCE RULE for every value below: it is either byte-identical to the
  # application.yml default (so behaviour is unchanged and the value simply
  # becomes explicit and overridable per environment) or derived from a value
  # ALREADY COMMITTED in this repo. No production hostname is invented. Each
  # comment names its source so a reviewer can check that claim.
  # ===========================================================================

  # --- D-13 split-horizon issuer ---------------------------------------------
  # keycloak.issuer.uri (above) is the POD-REACHABLE issuer: it is what locates
  # the JWKS endpoint. keycloak.public.issuer.uri is the issuer Keycloak STAMPS
  # into the token's `iss` claim, which is what must be validated against.
  # In a single-host deployment the two are the same URL, which is why the gap
  # stayed invisible; in a split-host topology they differ, and validating `iss`
  # against the JWKS host rejects every real token (issue #87 — a total
  # live-auth outage, see the jwt_issuer_jwks_split_horizon record).
  # SOURCE: byte-identical to keycloak.issuer.uri above, so the rendered
  # production behaviour is unchanged; the local overlay patches it to the
  # browser-reachable half. Consumed as core JWT_EXPECTED_ISSUER, edge
  # JWT_EXPECTED_ISSUER and frontend KEYCLOAK_ISSUER.
  keycloak.public.issuer.uri: "https://auth.olajay.co.uk/realms/jtoye-prod"

  # --- Frontend OIDC client id (Phase 26 / plan 26-08) -----------------------
  # This key exists because k8s/base/frontend-deployment.yaml hardcoded the
  # literal `value: "frontend"` for KEYCLOAK_CLIENT_ID. That is the same
  # config-injection violation as DEF-1's DB_PORT hardcode (GLOBAL_RULE_6 /
  # ARCHITECTURE_RULE_8): an environment-VARYING value baked into the shared
  # base, so no overlay could change it without patching the Deployment itself.
  #
  # It was not merely a style point — it made the local ingress login
  # IMPOSSIBLE. The dev realm (infra/keycloak/realm-export.template.json) has
  # NO client named `frontend`; the client the frontend actually authenticates
  # as is `core-api` (.env / .env.example both set KEYCLOAK_CLIENT_ID=core-api).
  # A hardcoded `frontend` therefore started an OIDC flow against a client that
  # does not exist in that realm, which DEF-5's D-16 ingress login has to pass
  # through. Only the local overlay patches this key; see
  # k8s/local/configmap-patch.yaml.
  #
  # SOURCE: byte-identical to the literal it replaces, so the staging and
  # production renders resolve to the SAME string they did before — the render
  # gains a ConfigMap key and an env SOURCE, never a changed value. Asserted on
  # the production render (T-26-48: a silently changed OIDC client identity is
  # an elevation-of-privilege surface, so the value equality is a criterion,
  # not an assumption).
  keycloak.client-id: "frontend"

  # --- CORS + token audience -------------------------------------------------
  # cors.allowed-origins pins the single platform origin. NOT a wildcard.
  # It is ALSO read by WebSocketConfig (setAllowedOrigins) — the same property
  # backs both the REST CorsConfig and the KDS STOMP handshake, so an absent
  # value silently allowed only the dev-default origin for both.
  # SOURCE: the existing frontend.url key above (each overlay patches it to its
  # own frontend.url).
  cors.allowed-origins: "https://app.olajay.co.uk"
  # SOURCE: application.yml `${JWT_EXPECTED_AUDIENCE:core-api}` — identical, so
  # validation neither loosens nor tightens. AudienceValidator throws at
  # construction on a blank value, so this key can never silently no-op.
  jwt.expected-audience: "core-api"

  # --- Logging path ----------------------------------------------------------
  # SOURCE: application-prod.yml `${LOG_PATH:/var/log/jtoye}` — identical.
  log.path: "/var/log/jtoye"

  # --- Media storage (Azure Blob) — IMG-01..04 / Phase 24, Phase 36 ---------
  # Unsupplied, storage.blob.* resolves to the Azurite emulator
  # (application.yml), so every vendor image upload in staging/production would
  # aim at a target that does not exist there — the DEF-6 class. Every value is
  # therefore stated here and asserted on the render by INV-8/INV-9/INV-10 in
  # k8s/scripts/check-render-invariants.sh.
  #
  # CREDENTIALS (D-02): AKS Workload Identity. NO account key, connection string
  # or SAS is held in any Secret, sealed or not, and no connection-string key
  # exists in this ConfigMap outside the local overlay. The AZURE_CLIENT_ID /
  # AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE the SDK needs are injected at
  # admission by the workload-identity webhook — never by a manifest — and
  # core-java's startup shape check fails fast when they are missing.
  #
  # ENDPOINT (D-06): the account's RAW Blob endpoint, no CDN and no custom
  # domain. public-url is that endpoint + /jtoye-images, and it is embedded in
  # every persisted image URL, so moving it later is a tenant-looped rewrite.
  # Base carries the PRODUCTION media account (jtoyeprodmedia, uksouth, D-11);
  # staging patches its own. The backup dump uses a DIFFERENT account in another
  # region (backup.blob.* above, D-01).
  #
  # CONTAINERS (D-07): jtoye-images is public at access level `blob` (derivatives
  # only, never listable, #626); jtoye-quarantine is private (raw uploads).
  # create-containers is "false": Set Container ACL cannot be authorized with an
  # Entra token, so both containers are provisioned out of band (the provisioning
  # runbook) and only asserted at boot.
  storage.blob.auth-mode: "workload-identity"
  storage.blob.endpoint: "https://jtoyeprodmedia.blob.core.windows.net"
  storage.blob.public-container: "jtoye-images"
  storage.blob.quarantine-container: "jtoye-quarantine"
  storage.blob.public-url: "https://jtoyeprodmedia.blob.core.windows.net/jtoye-images"
  storage.blob.create-containers: "false"

  # --- Email (SMTP) — Phase 22 shipped SES-over-SMTP -------------------------
  # SOURCE: smtp.host is the AWS SES SMTP endpoint for eu-west-2, the region the
  # retired object-store keys used to commit here; smtp.port/auth/starttls are byte-identical to
  # application.yml's `${SMTP_PORT:587}` / `${SMTP_AUTH:false}` /
  # `${SMTP_STARTTLS:true}`.
  #
  # smtp.auth STAYS "false" DELIBERATELY. It is identical to today's default, so
  # no credential is offered to any relay and base behaviour is unchanged. An
  # operator enabling a real relay must do BOTH of: flip smtp.auth (and
  # smtp.starttls if needed) in that environment's configmap-patch.yaml, AND
  # create the OPTIONAL smtp-credentials Secret. Until both happen the email
  # channel stays inert rather than becoming a loud SMTP auth failure.
  smtp.host: "email-smtp.eu-west-2.amazonaws.com"
  smtp.port: "587"
  smtp.auth: "false"
  smtp.starttls: "true"

  # --- D-19 notification origins (production-affecting) ----------------------
  # These two default to a loopback dev origin in application.yml, so EVERY
  # production notification email carried an unsubscribe link and an open/click
  # tracking URL pointing at the recipient's own machine — a dead link for the
  # customer and, for unsubscribe, a GDPR/PECR-relevant broken opt-out.
  # SOURCE: the existing frontend.url key above (overlays patch per env).
  notification.email.tracking-base-url: "https://app.olajay.co.uk"
  notification.unsubscribe.base-url: "https://app.olajay.co.uk"
  # 31.1-20 (#839): the page the emailed DSAR verification link opens, on the
  # WEB origin. It used to be the API, which answers a person who clicks it
  # with raw JSON. The page spends the token (carried in the #fragment) only
  # when the person presses "Confirm my request". Pinned to the same origin as
  # the unsubscribe link by DsarLinkConfigContractTest.
  gdpr.dsar.verify-base-url: "https://app.olajay.co.uk/data-request/confirm"
  # 31.1-16 (D-01, #778): the frontend page the emailed Article 15 download link
  # opens. Its application.yml default is http://localhost:3000/... — outside a
  # laptop every link would be dead and the statutory reply silently undelivered.
  gdpr.dsar.export-download-base-url: "https://app.olajay.co.uk/data-request/download"
  # 37-07 (D-07): the frontend /invite page a staff invitation link opens
  # ({base}/{tenantId}.{token}). Its application.yml default is
  # http://localhost:3000/invite — outside a laptop every invitation would be a
  # dead link. SOURCE: frontend.url above; overlays patch per env.
  staff.invite.accept-base-url: "https://app.olajay.co.uk/invite"
  # Byte-identical to the application.yml default (${STAFF_INVITE_TTL_HOURS:72}),
  # declared so every render states how long an invitation link lives.
  staff.invite.ttl-hours: "72"

  # --- D-14 platform registered office (phase 31.1 plan 27, #794) -------------
  # The registered office on the public Companies House record for company
  # 16471464 (J'TOYE DIGITAL LTD, ACTIVE), confirmed by the owner 2026-10-07.
  # core-java prints it in the footer of every order email (31.1-25) via
  # COMPANY_REGISTERED_OFFICE. The frontend (the legal pages) inlines the same
  # string at BUILD time: scripts/k8s-local-up.sh from .env / the compose default,
  # CI from the repository variable FRONTEND_PUBLIC_COMPANY_REGISTERED_OFFICE. One legal
  # entity, so one value for every overlay. Pinned by RegisteredOfficeParityTest.
  platform.registered-office: "Crispins Manor Farm Lane, Michelmersh, Romsey, England, SO51 0NT"

  # --- D-19 Stripe Connect return origins (production-affecting) -------------
  # Same defect class: a vendor completing Stripe Connect onboarding was
  # redirected to a loopback dev origin instead of the platform, stranding the
  # MARKETPLACE payout setup at the last step.
  # SOURCE: frontend.url above + the exact paths in application.yml's
  # `${STRIPE_CONNECT_RETURN_URL:...}` / `${STRIPE_CONNECT_REFRESH_URL:...}`
  # defaults. The Stripe API key and webhook secret are NOT here — they come
  # from the OPTIONAL stripe-credentials Secret.
  stripe.connect.return-url: "https://app.olajay.co.uk/dashboard/payments/connect/return"
  stripe.connect.refresh-url: "https://app.olajay.co.uk/dashboard/payments/connect/refresh"

  # --- Webhook delivery knobs — Phase 22 COMMS-* -----------------------------
  # SOURCE: all three byte-identical to their application.yml defaults
  # (`${WEBHOOK_DELIVERY_MAX_ATTEMPTS:8}`,
  # `${WEBHOOK_DELIVERY_RETENTION_DAYS:30}`,
  # `${WEBHOOK_TARGET_BLOCK_PRIVATE_RANGES:true}`). Made explicit so the
  # retry/retention budget and the SSRF private-range block are reviewable and
  # per-environment tunable instead of being invisible code defaults.
  # block-private-ranges is a SECURITY control: keep it "true".
  webhook.delivery.max-attempts: "8"
  webhook.delivery.retention-days: "30"
  webhook.target.block-private-ranges: "true"

  # --- Vendor shop-scoping posture (D-06, Phase 37 owner ruling) ---------------
  # Consumed as core ACCESS_STRICT_SCOPING -> application.yml
  # jtoye.access.strict-scoping. "true": ungranted means no access. Byte-identical
  # to the application.yml default, declared here so every render states the
  # posture (OFF-by-choice and OFF-by-omission were once indistinguishable, the
  # DEF-4/DEF-6 shape). A user's access is exactly what their shop_staff rows say:
  # no JIT auto-provisioning, JIT tenant-wide GROUP_ADMIN rows are not honoured,
  # OPERATOR grants and realm admins are, and a tenant with no OPERATOR admin keeps
  # its oldest JIT admin as a WARN-logged bootstrap (V57), so no tenant locks itself
  # out. Integration service accounts get explicit shop_staff grants (D-23).
  #
  # No overlay may override this back to "false": that makes every ungranted user
  # an implicit tenant-wide GROUP_ADMIN again and needs an owner ruling, never a
  # config edit. scripts/check-strict-scoping-default.sh (CI) fails on a "false"
  # here, in any overlay or golden, in compose, .env.example or application*.yml.
  access.strict-scoping: "true"
