---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-java
  labels:
    app: core-java
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployments
  selector:
    matchLabels:
      app: core-java
  template:
    metadata:
      labels:
        app: core-java
        component: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Pod anti-affinity: Don't schedule multiple pods on same node
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - core-java
              topologyKey: kubernetes.io/hostname
      containers:
      - name: core-java
        image: ghcr.io/bralabee/jtoye-core-java:2.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: host
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        # Issue #94 [P2-3]: Hikari pool sized against the HPA replica CEILING.
        # (maxReplicas 10 + surge 1) × 10 + Keycloak 20 + pg-backup 1 +
        # exporter 2 = 133 ≤ 0.8 × (max_connections 200 − 3 reserved).
        # Must match the application-prod.yml default — CI enforces both via
        # k8s/scripts/check-connection-math.sh. The shared Postgres in
        # jtoye-infrastructure MUST run with max_connections=200 (see
        # k8s/DEPLOYMENT.md "Database Connection Budget").
        - name: DB_POOL_SIZE
          value: "10"
        - name: KC_ISSUER_URI
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: keycloak.issuer.uri
        # Issue #102 remainder: Keycloak user deprovisioning on offboard. OFF by
        # default (keycloak.admin.enabled=false). Non-secret config from the
        # ConfigMap; admin credentials from the keycloak-credentials Secret.
        - name: KC_ADMIN_ENABLED
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: keycloak.admin.enabled
        - name: KC_ADMIN_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: keycloak.admin.base-url
        - name: KC_DEPROVISION_REALMS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: keycloak.admin.realms
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: admin-username
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: admin-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: redis.host
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: rabbitmq.host
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        - name: STOMP_BROKER_MODE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: stomp.broker.mode
        - name: STOMP_RELAY_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: stomp.broker.relay-host
        - name: STOMP_RELAY_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: stomp.broker.relay-port
        - name: STOMP_CLIENT_LOGIN
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: stomp-login
        - name: STOMP_CLIENT_PASSCODE
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: stomp-passcode
        resources:
          requests:
            # Issue #94 [P2-3]: memory request == limit (Guaranteed-memory QoS).
            # The JVM commits ~75% of the 1Gi LIMIT as heap (MaxRAMPercentage=75
            # in core-java/Dockerfile), so steady-state RSS sits at 700-800Mi
            # regardless of load. A 512Mi request meant >100% "utilization"
            # forever — which pinned the old memory-based HPA at maxReplicas
            # and overcommitted nodes by 512Mi per pod.
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9090
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30  # 5 minutes max startup time
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9090
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9090
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]  # Graceful shutdown
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false  # Spring Boot needs write access
---
apiVersion: v1
kind: Service
metadata:
  name: core-java
  labels:
    app: core-java
spec:
  type: ClusterIP
  selector:
    app: core-java
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-java-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-java
  # Issue #94 [P2-3]: maxReplicas is the input to the DB connection budget —
  # maxReplicas × DB_POOL_SIZE must fit Postgres max_connections. Do not raise
  # it without re-running k8s/scripts/check-connection-math.sh.
  minReplicas: 3
  maxReplicas: 10
  # Issue #94 [P2-3]: scale on CPU ONLY. The JVM commits ~75% of the memory
  # limit as heap at startup and G1 rarely uncommits, so container memory is
  # a constant, not a load signal. The old memory target (80% of a 512Mi
  # request vs ~768Mi of committed heap) evaluated to >100% utilization at
  # idle and pinned the HPA at maxReplicas permanently.
  # check-connection-math.sh fails CI if a memory metric is reintroduced.
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5min before scaling down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core-java-pdb
spec:
  minAvailable: 2  # Always keep 2 pods running during disruptions
  selector:
    matchLabels:
      app: core-java
