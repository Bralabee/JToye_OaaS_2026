---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-java
  labels:
    app: core-java
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployments
  selector:
    matchLabels:
      app: core-java
  template:
    metadata:
      labels:
        app: core-java
        component: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        # issue #98 [P2-7] item 4: scrape the INTERNAL management port (9091),
        # which is where prod serves /actuator/prometheus. The public app port
        # (9090) serves no actuator/metrics. 9091 is NOT published via the
        # Service/Ingress below — it is reachable only in-cluster (scrape +
        # kubelet probes + deploy health-check).
        prometheus.io/port: "9091"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Pod anti-affinity: Don't schedule multiple pods on same node
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - core-java
              topologyKey: kubernetes.io/hostname
      containers:
      - name: core-java
        image: ghcr.io/bralabee/jtoye-core-java:2.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        # issue #98 [P2-7] item 4: internal management port. Serves the actuator
        # endpoints (health probes + /actuator/prometheus) in the prod profile.
        # Deliberately NOT added to the Service/Ingress below, so metrics + probe
        # surface stay off the public network.
        - containerPort: 9091
          name: management
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: host
        # DEF-1 (Phase 26 / INFRA-02a): the port is CONFIG, not a constant.
        # GLOBAL_RULE_6 / ARCHITECTURE_RULE_8 (config injection, no
        # environment-varying literals): a hardcoded "5432" made every
        # environment's Postgres port a manifest edit. The host dev Postgres
        # publishes 5433 (docker-compose.full-stack.yml, to dodge the cohabiting
        # OlaJay stack), so local could not work at all and staging/prod were one
        # port change away from breaking. postgres-credentials already carries a
        # `port` key that k8s/base/pg-backup-cronjob.yaml consumes exactly like
        # this — the two consumers of the same secret key now look identical.
        #
        # The literal `value:` had to be DELETED, not merely supplemented by an
        # overlay patch: a kustomize strategic-merge patch that adds `valueFrom`
        # to an env item that still has `value:` renders an EnvVar with BOTH
        # fields. `kubectl kustomize` accepts it, but the API server rejects the
        # apply with `env[i].valueFrom: Invalid value: "": may not be specified
        # when 'value' is not empty` (reproduced with kubectl v1.33.3 /
        # kustomize v5.6.0, the CI-pinned version). There is no overlay shortcut.
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        # Issue #94 [P2-3]: Hikari pool sized against the HPA replica CEILING.
        # (maxReplicas 10 + surge 1) × 12 + Keycloak 20 + pg-backup 1 +
        # exporter 2 = 155 ≤ 0.8 × (max_connections 200 − 3 reserved) = 157.
        # Must match the application-prod.yml default — CI enforces both via
        # k8s/scripts/check-connection-math.sh. The shared Postgres in
        # jtoye-infrastructure MUST run with max_connections=200 (see
        # k8s/DEPLOYMENT.md "Database Connection Budget").
        #
        # RAISED 10 -> 12 by Phase 27 / 27-04, and 12 is a CEILING, not headroom.
        # Two gates bound it from opposite sides and both are tight:
        #   - below 12, k8s/scripts/check-consumer-thread-budget.sh FAILS. Nine
        #     @RabbitListener endpoints + 2 reserved for HTTP = 11 > a pool of 10,
        #     which left ~1 connection for request handling at saturation. That
        #     was a PRE-EXISTING defect, not one 27-04 introduced.
        #   - above 12, the equation above breaks: 11 × 13 + 23 = 166 > 157.
        # So do NOT raise this to buy more consumer concurrency. Raising media
        # concurrency past 2 requires lowering maxReplicas or raising
        # max_connections everywhere it is set — a deliberate, separate change.
        - name: DB_POOL_SIZE
          value: "12"
        # Phase 27 / 27-04 — RabbitMQ listener tunables (jtoye.rabbit.*). Non-secret,
        # so they live in app-config rather than a Secret. Injected under the exact
        # uppercase names application.yml reads, which is what lets
        # k8s/scripts/check-env-contract.sh direction (a) match them.
        - name: JTOYE_RABBIT_DEFAULT_PREFETCH
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: rabbit.default.prefetch
        - name: JTOYE_RABBIT_DEFAULT_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: rabbit.default.concurrency
        - name: JTOYE_RABBIT_MEDIA_PREFETCH
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: rabbit.media.prefetch
        - name: JTOYE_RABBIT_MEDIA_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: rabbit.media.concurrency
        - name: JTOYE_RABBIT_MEDIA_MAX_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: rabbit.media.max.concurrency
        # Outbox flusher tunables — previously unreachable without an image rebuild.
        - name: PAYMENT_OUTBOX_FLUSH_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: payment.outbox.flush.interval.ms
        - name: PAYMENT_OUTBOX_RESURRECT_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: payment.outbox.resurrect.interval.ms
        - name: PAYMENT_OUTBOX_BACKOFF_BASE_MS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: payment.outbox.backoff.base.ms
        - name: PAYMENT_OUTBOX_BACKOFF_CAP_MS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: payment.outbox.backoff.cap.ms
        - name: MEDIA_OUTBOX_FLUSH_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: media.outbox.flush.interval.ms
        - name: MEDIA_OUTBOX_RESURRECT_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: media.outbox.resurrect.interval.ms
        - name: MEDIA_OUTBOX_BACKOFF_BASE_MS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: media.outbox.backoff.base.ms
        - name: MEDIA_OUTBOX_BACKOFF_CAP_MS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: media.outbox.backoff.cap.ms
        - name: KC_ISSUER_URI
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: keycloak.issuer.uri
        # Issue #102 remainder: Keycloak user deprovisioning on offboard. OFF by
        # default (keycloak.admin.enabled=false). Non-secret config from the
        # ConfigMap; admin credentials from the keycloak-credentials Secret.
        - name: KC_ADMIN_ENABLED
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: keycloak.admin.enabled
        - name: KC_ADMIN_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: keycloak.admin.base-url
        - name: KC_DEPROVISION_REALMS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: keycloak.admin.realms
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: admin-username
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: admin-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: redis.host
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: rabbitmq.host
        # DEF-4 (Phase 26 / INFRA-02d): the env NAME is renamed, the secret KEY is not.
        # application.yml reads `username: ${RABBITMQ_USER:jtoye}` for
        # spring.rabbitmq.username. Before Phase 26 this manifest injected the
        # secret under an env name suffixed `..._USERNAME` — mirroring the secret
        # KEY instead of the Spring placeholder — which NO application*.yml has
        # ever read. The injected value therefore reached nothing and the primary
        # AMQP pool silently fell back to the literal Spring default `jtoye`
        # while using the secret's real password.
        # RABBITMQ_PASSWORD *is* correctly named and *is* read, which is exactly
        # why the defect survived: the pool connected, so nothing looked broken.
        # Compose already sets RABBITMQ_USER (docker-compose.full-stack.yml), so
        # compose behaviour is unchanged by this rename.
        #
        # ### PRE-ROLLOUT OPERATOR CHECK — REQUIRED, blocking, out-of-band ###
        # This rename is the FIRST time the deployed rabbitmq-credentials/username
        # VALUE takes effect in staging and production. Before the next staging or
        # production rollout, confirm in BOTH namespaces:
        #
        #   kubectl -n jtoye-staging    get secret rabbitmq-credentials \
        #     -o jsonpath='{.data.username}' | base64 -d
        #   kubectl -n jtoye-production get secret rabbitmq-credentials \
        #     -o jsonpath='{.data.username}' | base64 -d
        #
        # Expected value: `jtoye` (what the pool has actually been authenticating
        # as all along, via the Spring default).
        #
        # If it DIFFERS: change the SECRET so it holds the broker user its stored
        # password authenticates. Do NOT revert this rename — reverting restores
        # the silent-default defect and re-hides the mismatch.
        #
        # Why NO automated gate covers this: secret VALUES never appear in a
        # kustomize render (only secretKeyRef NAMES do), and
        # k8s/scripts/check-no-plaintext-secrets.sh exists precisely to guarantee
        # they never will. The golden-render diff cannot see it either. The check
        # is therefore carried here as an operator step, deliberately, and is
        # unverifiable from this repository.
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        - name: STOMP_BROKER_MODE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: stomp.broker.mode
        - name: STOMP_RELAY_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: stomp.broker.relay-host
        - name: STOMP_RELAY_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: stomp.broker.relay-port
        - name: STOMP_CLIENT_LOGIN
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: stomp-login
        - name: STOMP_CLIENT_PASSCODE
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: stomp-passcode
        # =====================================================================
        # DEF-6 / D-13 / D-15 / D-19 (Phase 26 / INFRA-02): the config the
        # v2.2/v2.3 feature set needs but k8s/base never supplied.
        #
        # Appended AFTER the pre-existing 23 entries on purpose: the block order
        # above is untouched, and in particular the DB_POOL_SIZE
        # `- name:` / `value:` adjacency that k8s/scripts/check-connection-math.sh
        # parses with awk is left exactly as it was.
        #
        # Every base VALUE is byte-identical to the application.yml default or
        # derived from a value already committed in this repo — see the sourcing
        # comments in k8s/base/configmap.yaml. Nothing here invents a hostname.
        #
        # DELIBERATE OMISSIONS (reviewed, not forgotten — plan 26-03 allowlists
        # them with reasons in the env-contract gate): OLLAMA_URL (no in-cluster
        # Ollama; the AI image-analysis path is advisory and gated off),
        # ZIPKIN_ENDPOINT (no in-cluster collector), and the CUSTOMER_* customer
        # -realm issuer envs (the customer storefront realm is explicitly
        # deferred in 26-CONTEXT.md § Deferred Ideas).
        # =====================================================================

        # --- D-13 split-horizon: the STAMPED (public) issuer to validate `iss`
        # against, independent of the JWKS host in KC_ISSUER_URI above. Base
        # value is byte-identical to keycloak.issuer.uri, so no environment's
        # validation is loosened by this addition (issue #87 class).
        - name: JWT_EXPECTED_ISSUER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: keycloak.public.issuer.uri
        - name: JWT_EXPECTED_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: jwt.expected-audience
        # --- CORS: read by BOTH CorsConfig and WebSocketConfig, so this is also
        # the prerequisite for the KDS WebSocket handshake proof (plan 26-07).
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: cors.allowed-origins
        - name: LOG_PATH
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: log.path
        # --- Media storage (Phase 24 IMG-01..04) ---
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: s3.endpoint
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: s3.region
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: s3.bucket
        - name: S3_PUBLIC_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: s3.public-url
        # OPTIONAL Secret (s3-media-credentials). The secretKeyRef `optional`
        # flag below is load-bearing: a namespace that has not created it keeps
        # exactly today's behaviour — the env stays UNSET, application.yml's own
        # default applies and the media path stays inert — instead of putting
        # every core-java pod into CreateContainerConfigError. Supplying the
        # Secret is the deliberate act that activates real S3 writes.
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-media-credentials
              key: access-key
              optional: true
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: s3-media-credentials
              key: secret-key
              optional: true
        # --- Email (Phase 22 COMMS-*) ---
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: smtp.host
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: smtp.port
        - name: SMTP_AUTH
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: smtp.auth
        - name: SMTP_STARTTLS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: smtp.starttls
        # OPTIONAL Secret (smtp-credentials). Absent → env unset → the
        # application.yml empty default applies. Combined with smtp.auth
        # staying "false" in the base ConfigMap, no credential is offered to
        # any relay until an operator deliberately supplies both.
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: username
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: password
              optional: true
        # --- D-19 notification origins: unsubscribe + email tracking links ---
        - name: NOTIFICATION_EMAIL_TRACKING_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: notification.email.tracking-base-url
        - name: NOTIFICATION_UNSUBSCRIBE_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: notification.unsubscribe.base-url
        # OPTIONAL Secret (notification-credentials). The application.yml
        # default for this signing secret is the EMPTY STRING — i.e. an HMAC
        # over an empty key, which is forgeable. Wiring it here makes the real
        # key supplyable; the `optional` flag keeps it inert-by-default rather than
        # silently weak-by-default, and the recipe in k8s/QUICK_START.md tells
        # an operator to create it. Do NOT allowlist this away as "accepted".
        - name: NOTIFICATION_UNSUBSCRIBE_SECRET
          valueFrom:
            secretKeyRef:
              name: notification-credentials
              key: unsubscribe-signing-secret
              optional: true
        # --- D-19 Stripe Connect return origins ---
        - name: STRIPE_CONNECT_RETURN_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: stripe.connect.return-url
        - name: STRIPE_CONNECT_REFRESH_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: stripe.connect.refresh-url
        # OPTIONAL Secret (stripe-credentials). Absent → env unset → the
        # application.yml empty defaults apply and the payment path behaves
        # exactly as it does today.
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-credentials
              key: api-key
              optional: true
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: stripe-credentials
              key: webhook-secret
              optional: true
        # --- Webhook delivery knobs (Phase 22) ---
        - name: WEBHOOK_DELIVERY_MAX_ATTEMPTS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: webhook.delivery.max-attempts
        - name: WEBHOOK_DELIVERY_RETENTION_DAYS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: webhook.delivery.retention-days
        - name: WEBHOOK_TARGET_BLOCK_PRIVATE_RANGES
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: webhook.target.block-private-ranges
        resources:
          requests:
            # Issue #94 [P2-3]: memory request == limit (Guaranteed-memory QoS).
            # The JVM commits ~75% of the 1Gi LIMIT as heap (MaxRAMPercentage=75
            # in core-java/Dockerfile), so steady-state RSS sits at 700-800Mi
            # regardless of load. A 512Mi request meant >100% "utilization"
            # forever — which pinned the old memory-based HPA at maxReplicas
            # and overcommitted nodes by 512Mi per pod.
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # issue #98 [P2-7] item 4: health lives on the internal management port
        # (9091) in the prod profile, so all three probes target 9091.
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9091
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30  # 5 minutes max startup time
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9091
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9091
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]  # Graceful shutdown
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false  # Spring Boot needs write access
---
apiVersion: v1
kind: Service
metadata:
  name: core-java
  labels:
    app: core-java
spec:
  type: ClusterIP
  selector:
    app: core-java
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-java-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-java
  # Issue #94 [P2-3]: maxReplicas is the input to the DB connection budget —
  # maxReplicas × DB_POOL_SIZE must fit Postgres max_connections. Do not raise
  # it without re-running k8s/scripts/check-connection-math.sh.
  minReplicas: 3
  maxReplicas: 10
  # Issue #94 [P2-3]: scale on CPU ONLY. The JVM commits ~75% of the memory
  # limit as heap at startup and G1 rarely uncommits, so container memory is
  # a constant, not a load signal. The old memory target (80% of a 512Mi
  # request vs ~768Mi of committed heap) evaluated to >100% utilization at
  # idle and pinned the HPA at maxReplicas permanently.
  # check-connection-math.sh fails CI if a memory metric is reintroduced.
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5min before scaling down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core-java-pdb
spec:
  minAvailable: 2  # Always keep 2 pods running during disruptions
  selector:
    matchLabels:
      app: core-java
