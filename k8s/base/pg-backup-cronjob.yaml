apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  # NO hardcoded namespace here (Phase 26 / 26-CONTEXT.md § Claude's Discretion).
  # It used to pin the PRODUCTION namespace by name, which was already dead config:
  # every overlay's own `namespace:` transformer overrides it, and the rendered
  # CronJob comes out in that overlay's namespace regardless (verified —
  # 26-RESEARCH.md P-5, and the staging/production render is byte-identical
  # before and after this removal). Two reasons it is better gone than left:
  #   - the base is the SHARED layer; naming one environment there is exactly the
  #     "environment namespaces never live in the base" rule this repo already
  #     states in k8s/base/kustomization.yaml:5-8.
  #   - it stopped being harmless the moment someone bypassed kustomize. A raw
  #     `kubectl apply -f k8s/base/pg-backup-cronjob.yaml -n <ns>` silently
  #     disagrees with the file, and scripts/deploy.sh's phantom `dev` target did
  #     exactly that kind of raw per-file apply.
  labels:
    app.kubernetes.io/name: pg-backup
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: jtoye-oaas
spec:
  schedule: "0 2 * * *"  # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800  # 30 minute timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-backup
        spec:
          # Dedicated ServiceAccount (k8s/base/serviceaccounts.yaml): Workload
          # Identity federates system:serviceaccount:<ns>:pg-backup to the
          # backup-writer managed identity, so it must not be `default` and must
          # not be shared with core-java (least privilege: media vs backup).
          serviceAccountName: pg-backup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: pg-backup
              # Purpose-built image (infra/backups/Dockerfile): pg_dump/pg_restore
              # + blobctl (the static Go Blob uploader: never overwrites, never
              # lists, never deletes) + GNU coreutils baked in, and the hardened
              # k8s-backup.sh as its ENTRYPOINT. No AWS CLI. No runtime package
              # install (blocked by default-deny NetworkPolicy), no busybox
              # GNU-isms. Tag must track the built image.
              image: ghcr.io/bralabee/jtoye-pg-backup:15-blob
              imagePullPolicy: IfNotPresent
              env:
                # --- database (dumps as the BYPASSRLS backup role, see
                #     infra/backups/create-backup-role.sql — the app role would
                #     capture 0 rows from FORCE-RLS tenant tables) ---
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: host
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: port
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: database
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: backup-username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: backup-password
                # --- Blob target (Phase 36 D-01/D-02, BLOB-06) ---
                # All four from app-config backup.blob.*: a DEDICATED backup
                # account, not the media one. There is deliberately NO credential
                # here: staging/production use AKS Workload Identity through this
                # pod's `pg-backup` ServiceAccount (write-only role on the backup
                # container), and the webhook injects the AZURE_* env at admission.
                # STORAGE_CONNECTION_STRING (the Azurite emulator string) is added
                # ONLY by k8s/local/storage-env-patch.yaml.
                - name: STORAGE_AUTH_MODE
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: backup.blob.auth-mode
                - name: STORAGE_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: backup.blob.endpoint
                - name: BACKUP_CONTAINER
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: backup.blob.container
                - name: BACKUP_PREFIX
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: backup.blob.prefix
                # --- retention ---
                - name: RETENTION_DAYS
                  value: "30"
              resources:
                requests:
                  memory: 256Mi
                  cpu: 250m
                limits:
                  memory: 512Mi
                  cpu: 500m
