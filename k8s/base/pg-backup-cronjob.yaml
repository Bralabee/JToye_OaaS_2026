apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: jtoye-production
  labels:
    app.kubernetes.io/name: pg-backup
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: jtoye-oaas
spec:
  schedule: "0 2 * * *"  # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800  # 30 minute timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: pg-backup
              # Purpose-built image (infra/backups/Dockerfile): pg_dump/pg_restore
              # + aws-cli + GNU coreutils baked in, and the hardened k8s-backup.sh
              # as its ENTRYPOINT. No runtime `apk add` (blocked by default-deny
              # NetworkPolicy), no busybox GNU-isms. Tag must track the built image.
              image: ghcr.io/bralabee/jtoye-pg-backup:15
              imagePullPolicy: IfNotPresent
              env:
                # --- database (dumps as the BYPASSRLS backup role, see
                #     infra/backups/create-backup-role.sql — the app role would
                #     capture 0 rows from FORCE-RLS tenant tables) ---
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: host
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: port
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: database
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: backup-username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: backup-password
                # --- S3 target ---
                - name: S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: s3.backup.bucket
                - name: S3_PREFIX
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: s3.backup.prefix
                - name: S3_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: s3.backup.endpoint
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: s3.backup.region
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-credentials
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-credentials
                      key: secret-key
                # --- retention ---
                - name: RETENTION_DAYS
                  value: "30"
              resources:
                requests:
                  memory: 256Mi
                  cpu: 250m
                limits:
                  memory: 512Mi
                  cpu: 500m
