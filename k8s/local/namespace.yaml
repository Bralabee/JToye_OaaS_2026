---
# The local rehearsal namespace.
#
# Every overlay owns its own namespace object (k8s/base/kustomization.yaml:5-8
# states why: a base that shipped all environment namespaces made every
# overlay's `namespace:` transformer collapse them to one name -> "namespace
# transformation produces ID conflict"). This file is that object for local.
#
# It must also exist BEFORE a server-side dry-run of this overlay: a dry-run does
# not create the Namespace it is validating, so every namespaced object fails
# with "namespaces \"jtoye-local\" not found" until it does (26-RESEARCH.md
# PIT-8, and the 2026-07-14 rehearsal's documented chicken-and-egg). Hence
# `kubectl apply -f k8s/local/namespace.yaml` precedes
# `kubectl apply -k k8s/local --dry-run=server` — sequenced in plan 26-07.
apiVersion: v1
kind: Namespace
metadata:
  name: jtoye-local
  labels:
    name: jtoye-local
    environment: local
