---
# =============================================================================
# LOCAL app-config overrides (Phase 26 / INFRA-01)
#
# HOW THIS PATCH BEHAVES
#   A strategic-merge patch on a ConfigMap MERGES the keys listed here into the
#   base's `data` map — it does NOT replace `data` (verified, 26-RESEARCH.md
#   P-3). So this file lists only what CHANGES for local; every other base key
#   (redis.port, rabbitmq.port, stomp.broker.mode, storage.blob.public-container,
#   backup.blob.container, jwt.expected-audience, the webhook-delivery knobs, …)
#   is inherited unchanged.
#
#   COROLLARY, and it is load-bearing: every key below must ALREADY EXIST in
#   k8s/base/configmap.yaml. A merge patch happily introduces a brand-new key,
#   but nothing would consume it — no deployment has a configMapKeyRef for it —
#   so a typo'd key name produces a silently ignored value rather than an error.
#   That is the DEF-6 defect class this phase exists to close, so do not add a
#   key here without adding its base key and its env wiring in the same change.
#
#   THE ONE DELIBERATE EXCEPTION (Phase 36, D-02): storage.blob.connection-string
#   and backup.blob.connection-string exist ONLY here. Putting a connection-string
#   key in base would put one in staging and production, which D-02 forbids and
#   INV-9 in k8s/scripts/check-render-invariants.sh fails on. So their env wiring
#   lives in this overlay too — k8s/local/storage-env-patch.yaml adds the
#   STORAGE_CONNECTION_STRING env that consumes each of them — and LOC-7 asserts
#   that wiring is present, so neither key can become a silently ignored value.
#
# WHY host.minikube.internal AND NOT AN IP
#   The local cluster consumes the docker-compose backing services running on the
#   HOST. minikube maintains the host-gateway mapping under the name
#   `host.minikube.internal`; the underlying IP "varies by driver and potentially
#   by cluster", so hardcoding 192.168.49.1 would be an environment-varying
#   literal (the exact class of defect DEF-1 was). Host services must also listen
#   on 0.0.0.0 — every compose port publishes that way today (verified).
#
# PORT PROVENANCE — nothing here is invented
#   All host ports are the published compose values in
#   docker-compose.full-stack.yml: Postgres 5433 (line 31 — shifted off 5432 to
#   dodge the cohabiting OlaJay stack), Keycloak 8085 (line 102), Redis 6379
#   (line 131), RabbitMQ 5672 AMQP + 61613 STOMP (lines 151-153), Azurite Blob
#   10000 (the `azurite` service), Mailhog SMTP 1025 (line 480). The realm is
#   `jtoye-dev`, the realm compose imports.
#
# NOT HERE ON PURPOSE: DB_HOST, and the DB_PORT env var
#   Neither is an app-config key. Both come from the `postgres-credentials`
#   Secret, whose `host`/`port` keys the deployment reads via secretKeyRef
#   (DEF-1, plan 26-01). scripts/k8s-local-secrets.sh (plan 26-05) creates that
#   Secret with host=host.minikube.internal and port=$K8S_LOCAL_DB_PORT (5433).
#
#   `db.port` BELOW IS NOT A REVERSAL OF THAT (issue #271). It does not feed any
#   env var and no container reads it; it is the RENDER-TIME declaration the
#   NetworkPolicy egress rules are derived from, because a Secret VALUE can never
#   appear in a kustomize render. The Secret stays authoritative for what the
#   pods dial. The two must agree, and scripts/k8s-local-secrets.sh REFUSES to
#   create the Secret when they do not.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # --- Keycloak: the split-horizon pair (D-13 / DEF-5) -----------------------
  #
  # These two keys MUST hold DIFFERENT values locally, and collapsing them to one
  # value would make the whole local auth rehearsal prove nothing. This is the
  # #87 class that once caused a total live-auth outage.
  #
  #   keycloak.issuer.uri        — where the POD fetches JWKS and talks OIDC.
  #                                A pod cannot reach `localhost:8085`; that is
  #                                the pod's own loopback. It must go out to the
  #                                host gateway.
  #   keycloak.public.issuer.uri — the issuer Keycloak actually STAMPS into the
  #                                token's `iss` claim, which is the value `iss`
  #                                validation must compare against. Compose runs
  #                                Keycloak with KC_HOSTNAME=localhost and
  #                                KC_HOSTNAME_PORT=8085, so every token it mints
  #                                says `http://localhost:8085/realms/jtoye-dev`
  #                                — regardless of which host address fetched it.
  #
  # Set both to the pod-reachable URL and every real token is rejected
  # (`iss` mismatch). Set both to localhost and the pod cannot fetch JWKS at all.
  keycloak.issuer.uri: "http://host.minikube.internal:8085/realms/jtoye-dev"
  keycloak.public.issuer.uri: "http://localhost:8085/realms/jtoye-dev"

  # --- The realm's ACTUAL OIDC client (plan 26-08) ---------------------------
  # Base holds `frontend`, which is byte-identical to the literal that used to be
  # hardcoded in frontend-deployment.yaml. That client does NOT exist in the
  # jtoye-dev realm:
  #   grep -c '"clientId" : "frontend"' infra/keycloak/realm-export.template.json
  # returns 0. The realm's confidential browser-flow client is `core-api`, which
  # is also what .env's KEYCLOAK_CLIENT_ID names and whose secret feeds the
  # keycloak-credentials Secret's `frontend-client-secret` key (see
  # scripts/k8s-local-secrets.sh). Without this override the ingress login — the
  # only step that actually proves DEF-5 — fails at the authorize request.
  #
  # The matching redirect URI `http://app.jtoye.local/*` was added ADDITIVELY to
  # that client in infra/keycloak/realm-export.template.json by plan 26-08; every
  # existing localhost URI is retained, so the compose dev flow on :3000 / :3100
  # is untouched.
  keycloak.client-id: "core-api"

  # Admin API host is an IN-CLUSTER (pod-side) call, so it is the shimmed host.
  # NOTE: keycloak.admin.enabled stays "false" (inherited from base) — tenant
  # deprovisioning is not part of the local rehearsal, and an enabled admin
  # client with no credential Secret would only add noise.
  keycloak.admin.base-url: "http://host.minikube.internal:8085"
  keycloak.admin.realms: "jtoye-dev"
  keycloak.admin.vendor-realm: "jtoye-dev"

  # --- Ingress hosts (D-12) --------------------------------------------------
  # The two `.local` hosts served by the minikube ingress addon, resolved via
  # /etc/hosts entries pointing at `minikube -p jtoye ip`. This is the one deploy
  # surface no other local runtime exercises, and it gives NextAuth a stable
  # callback origin. No `keycloak.jtoye.local`: Keycloak is a compose service the
  # browser reaches directly on localhost:8085, not an in-cluster workload, so
  # publishing a cluster host for it would route to nothing.
  api.url: "http://api.jtoye.local"
  frontend.url: "http://app.jtoye.local"

  # FE-1 / E-5 (QA council 20260902-134741): stated EXPLICITLY per overlay, never
  # inherited — the vendor sign-out return leg stays on today's /auth/signin
  # until scripts/check-keycloak-logout-uri.sh is green against THIS overlay's
  # realm. Local happens to share the compose realm, whose core-api client
  # registers http://app.jtoye.local/*, so the gate is expected to pass here
  # first; the flip is still a deliberate, measured act, not a default. See
  # k8s/base/configmap.yaml for the mechanism and the failure it guards.
  vendor.logout-complete.enabled: "false"

  # --- Shared backing-service endpoint shims --------------------------------
  # Ports come from the base keys (redis.port 6379, rabbitmq.port 5672,
  # stomp.broker.relay-port 61613), which already match the compose values, so
  # only the host changes. stomp.broker.mode stays "relay" (base) — that is D-06:
  # dev compose defaults to in-memory, so the relay path is ONLY ever exercised
  # on this cluster.
  redis.host: "host.minikube.internal"
  rabbitmq.host: "host.minikube.internal"
  stomp.broker.relay-host: "host.minikube.internal"

  # --- Postgres port for the NetworkPolicy derivation (issue #271) -----------
  # 5433 is the compose-published host Postgres port (docker-compose.full-stack.yml
  # line 31, shifted off 5432 to dodge the cohabiting OlaJay stack) and the .env
  # K8S_LOCAL_DB_PORT default. It is the ONLY key in this file that no container
  # reads: its consumer is the `replacements:` block in kustomization.yaml, which
  # writes it into the Postgres egress rule of both NetworkPolicies.
  #
  # It must equal K8S_LOCAL_DB_PORT, which is what scripts/k8s-local-secrets.sh
  # puts in the postgres-credentials Secret and therefore what the pods actually
  # dial. That script asserts the equality and refuses on a mismatch — a divergence
  # here is exactly the two-places-one-fact shape #271 was filed about, so it is
  # enforced rather than described.
  db.port: "5433"

  # --- Media storage: the Azurite emulator path (Phase 36) ------------------
  #
  # Local runs the connection-string auth mode against the HOST Azurite (the
  # compose `azurite` service, Blob port 10000). Staging/production run
  # workload-identity; local has no AKS webhook, so it never carries the
  # azure.workload.identity/use label (INV-10 is staging/production only).
  #
  # storage.blob.connection-string is where the POD writes -> shimmed. It is the
  # emulator shorthand: UseDevelopmentStorage=true makes the SDK use the
  # PUBLISHED, well-known devstoreaccount1 key itself, so this string holds NO
  # key and needs no Secret. DevelopmentStorageProxyUri must be a BARE http host
  # (no port, no path): the SDK appends :10000/devstoreaccount1 and silently
  # drops anything else, and core-java's shape validation refuses a port or path.
  # Path-style addressing on a non-IP host works because compose runs Azurite
  # with --disableProductStyleUrl.
  #
  # storage.blob.endpoint is EMPTY: it is not consulted in connection-string
  # mode (the connection string names the endpoint). It is stated so the
  # base's production account can never be dialled from a laptop.
  #
  # storage.blob.public-url is DELIBERATELY NOT SHIMMED, and this is the single
  # least obvious value in this file. It is the origin baked into the image URLs
  # that go out in API responses and are then fetched by the BROWSER on the
  # developer's machine. `host.minikube.internal` does not resolve outside the
  # cluster, so shimming it would render every product image broken while every
  # server-side upload still succeeded — a silent, browser-only failure.
  # localhost:10000/devstoreaccount1 is exactly what compose serves.
  #
  # create-containers is "true": Azurite starts empty, and against the emulator
  # core-java may create jtoye-images (level blob) and jtoye-quarantine (private)
  # at boot. Workload identity cannot (Set Container ACL needs a key), which is
  # why base and the two real overlays say "false".
  storage.blob.auth-mode: "connection-string"
  storage.blob.connection-string: "UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://host.minikube.internal"
  storage.blob.endpoint: ""
  storage.blob.public-url: "http://localhost:10000/devstoreaccount1/jtoye-images"
  storage.blob.create-containers: "true"

  # --- Backup CronJob target (INFRA-01 / INFRA-02c, Phase 36) ----------------
  # Base names the PRODUCTION backup account (jtoyeprodbackup) under workload
  # identity. Locally that would aim a database dump at a real Azure account with
  # no identity at all. Repointed at the host Azurite through the same emulator
  # string, which is also what makes the restore rehearsal runnable locally. The
  # container/prefix keys (jtoye-db-backups, backups) are inherited from base;
  # blobctl, like core-java, ignores the endpoint in connection-string mode.
  backup.blob.auth-mode: "connection-string"
  backup.blob.connection-string: "UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://host.minikube.internal"
  backup.blob.endpoint: ""

  # --- Email: Mailhog -------------------------------------------------------
  # Mailhog accepts anything and offers no auth and no TLS, so auth/starttls are
  # both false here (base ships auth "false" + starttls "true" for SES).
  # Sent mail is viewable at http://localhost:8025.
  smtp.host: "host.minikube.internal"
  smtp.port: "1025"
  smtp.auth: "false"
  smtp.starttls: "false"

  # --- CORS / WebSocket origin ----------------------------------------------
  # A single origin, not a wildcard. This same property is read by BOTH
  # CorsConfig and WebSocketConfig (setAllowedOrigins), so it is a hard
  # prerequisite for the KDS STOMP/WebSocket proof: a wrong value here fails the
  # handshake, not just an XHR.
  cors.allowed-origins: "http://app.jtoye.local"

  # --- Local origins for outbound links (D-19 keys, local values) ------------
  # Unsubscribe + open/click tracking links in locally-sent mail, and the Stripe
  # Connect return/refresh redirects. Paths are inherited from the base values
  # verbatim; only the origin changes. (Those two dashboard routes do not exist
  # in the frontend yet — a recorded NOT-PROVISIONED item from plan 26-02; the
  # origin still has to be right or the redirect leaves the platform entirely.)
  notification.email.tracking-base-url: "http://app.jtoye.local"
  notification.unsubscribe.base-url: "http://app.jtoye.local"
  gdpr.dsar.verify-base-url: "http://app.jtoye.local/data-request/confirm"
  gdpr.dsar.export-download-base-url: "http://app.jtoye.local/data-request/download"
  staff.invite.accept-base-url: "http://app.jtoye.local/invite"
  stripe.connect.return-url: "http://app.jtoye.local/dashboard/payments/connect/return"
  stripe.connect.refresh-url: "http://app.jtoye.local/dashboard/payments/connect/refresh"

  # --- Log path (26-RESEARCH.md PIT-5) --------------------------------------
  # Under the prod profile (D-10 keeps it) application-prod.yml:91 logs to
  # ${LOG_PATH:/var/log/jtoye}/application.log. The container runs as
  # runAsUser: 1000 and /var/log is root-owned, and the image never creates that
  # directory — so logback's FileAppender fails to start on every boot with a
  # Permission denied. Non-fatal (the app continues; 2026-07-14 booted 11/11
  # READY) but it is noise that looks like a real fault, and file logging is
  # silently absent. /tmp is writable by the pod user.
  #
  # Issue #302: the DURABLE fix now lives in the base — core-java-deployment.yaml
  # mounts an `app-logs` emptyDir at /var/log/jtoye with a pod-level
  # securityContext.fsGroup: 1000, so the declared prod path is writable in every
  # environment. This /tmp override is KEPT deliberately rather than reverted:
  # /tmp is already writable, local behaviour is documented in k8s/LOCAL.md §7,
  # and reverting would change a working local default to no benefit. The base
  # mount is simply unused in this overlay.
  log.path: "/tmp"
