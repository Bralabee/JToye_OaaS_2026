# graph.conf — the one configuration layer for scripts/graph.sh.
#
# Sourced by graph.sh. Every key is a DEFAULT: a value already set in the environment wins,
# so a one-off run can say `GRAPH_CACHE_ROOT=/tmp/g scripts/graph.sh status` without editing
# this file.

# Where graphs are built and kept. Local disk, never the repository (the graph is ~50 MB and
# rewritten on every rebuild) and never an Insync-synced path. One subdirectory per checkout,
# keyed by the checkout's absolute path, so every worktree gets its own graph.
: "${GRAPH_CACHE_ROOT:=${XDG_CACHE_HOME:-$HOME/.cache}/graphify}"

# What goes into the graph: git pathspec, whitespace-separated, applied to `git archive HEAD`.
# .planning and docs are prose; in the 2026-09-03 graph they were 37% of all nodes and answer
# no code-structure question.
: "${GRAPH_PATHSPEC:=. :(exclude).planning :(exclude)docs}"

# The graphify release the acceptance arms were last run against. Another version still
# works (the graph is rebuilt, never reused across versions) but prints a warning until the
# arms are re-run on it and this value is bumped.
: "${GRAPH_VALIDATED_VERSION:=0.9.65}"

# The graphify executable. A name is looked up on PATH.
: "${GRAPHIFY_BIN:=graphify}"
