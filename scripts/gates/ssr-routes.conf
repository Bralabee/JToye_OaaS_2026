# ssr-routes.conf — the MANIFEST of every route in the Next.js app, and what each one
# is: server-rendered with a raw-HTML assertion, a static server component, or a client
# component with a stated reason for staying one.
#
# WHY THIS FILE EXISTS
#
#   A conversion that silently keeps only a browser stub for its coverage is invisible.
#   `context.route` answers a browser navigation and cannot answer `request.get`, so a
#   spec that stubs the API and asserts the DOM passes identically against a server that
#   rendered the content and a server that rendered nothing — measured on the pre-#507
#   tree at 34,419 bytes, 1 spinner, 0 <h1>, 0 occurrences of the shop's own name, with
#   every DOM assertion green (#542, #507).
#
#   Nothing failed at the moment of conversion. So every route is declared here by name,
#   and scripts/check-ssr-coverage-contract.sh fails on a route nobody declared, on a
#   declaration whose page no longer exists, on a class that disagrees with the file, and
#   on an SSR route whose raw-HTML assertion has been deleted.
#
#   This file is also #507's last acceptance criterion: every route left as a client
#   component is listed WITH A REASON, so the decision can be argued with instead of
#   inferred from a count.
#
# SYNTAX — one directive per line. Blank lines and lines whose first non-space character
# is '#' are ignored. An unknown directive is a VOID, not a shrug. Page paths are
# relative to frontend/app/; spec paths are relative to the repository root.
#
#   SSR <page> <spec> <literal>
#       This route serves its content in the raw HTML. <spec> must contain <literal>
#       inside a `servedHtml(` or `request.get(` call ON THE SAME LINE. The literal is
#       written exactly as the spec writes it — quotes included — so that "/" cannot be
#       satisfied by "/shop" and a route named only in a test TITLE does not count.
#
#   STATIC <page> <reason...>
#       A server component that renders no server-fetched data. The gate asserts that
#       claim: a STATIC page that imports the storefront loader or calls fetch( in code
#       (comments stripped) fails.
#
#   CLIENT <page> <reason...>
#       A client component. The reason must be a FACT ABOUT THE ROUTE — what it needs
#       that a server cannot do — not a schedule and not "later". A reason under ten
#       characters, or a placeholder, fails.
#
# RETIRING AN ENTRY
#   Converting a route means changing its CLIENT line to SSR and naming the spec IN THE
#   SAME CHANGE. There is no intermediate state that passes: an SSR entry with no
#   raw-HTML assertion fails R-2b, and leaving the CLIENT line while converting the page
#   fails R-2a. That is the point — the gate fires at the moment of conversion, which is
#   the moment the coverage would otherwise be silently dropped.
#
# MEASURED, 2026-08-28 — how the classification below was arrived at
#
#   Discovery: `/usr/bin/find frontend/app/ -type f -name page.tsx` (trailing slash on
#   the start point, or a symlinked path truncates the walk to nothing) — 38 files.
#
#   Classification: the strict directive-position parser in the gate, which skips blank
#   lines, // comments and a leading /* */ block and requires the FIRST statement to be
#   the client directive — 21 CLIENT, 17 not. Of the 17, four load data server-side.
#   The counts printed below are the gate's own, not added up here.
#
#   NOT `git grep -l`, and this is measured rather than asserted. That search returns 25
#   page.tsx files, four of which carry the string only in PROSE about their own
#   completed conversion:
#       shop/page.tsx, shop/[slug]/page.tsx, shop/orders/page.tsx, unsubscribe/page.tsx
#   So the "remaining conversions" counter RISES when a conversion is well documented.
#
#   The same search has a SECOND defect, found while checking the first: the pathspec
#   'frontend/app/**/page.tsx' never matches frontend/app/page.tsx at all — git does not
#   apply zero-directory `**` semantics to a pathspec without :(glob). Positive control:
#   `git grep -l loadShopList -- 'frontend/app/**/page.tsx'` returns only shop/page.tsx,
#   while `-- frontend/app` also returns page.tsx, which imports the same loader at :17.
#   The 25 above is unaffected only because the landing page deliberately avoids spelling
#   the directive out in its own docblock. One file's wording away from being wrong twice.
#
# ---------------------------------------------------------------------------------

# --- SSR: the served bytes carry the content, and a spec reads them ------------------
#
# Four routes. Each names the spec and the literal that asserts it; deleting that
# assertion is exactly the #542 defect and fails R-2b in the same change.

# The public landing page. Server component (no client directive) so the root layout's
# force-dynamic CSP nonce cascades (#89); loads the shop list at :17/:154 and emits
# shopListStructuredData JSON-LD naming the real shops.
SSR page.tsx frontend/e2e/storefront-ssr-seo.spec.ts "/"

# The shop directory. loadShopList at :3/:70 with the results in the served HTML —
# measured 54,184 bytes and 5 occurrences of a shop name against a live stack, versus
# 39,438 bytes and 0 with no backend, which is why the stack-free CI job cannot assert it.
SSR shop/page.tsx frontend/e2e/storefront-ssr-seo.spec.ts "/shop"

# A storefront. loadShopDetail at :4/:51/:135, three-valued so a non-answer is never
# served as authoritative. The literal is the template expression the spec uses, because
# the route is parameterised and no fixed path appears in the file.
SSR shop/[slug]/page.tsx frontend/e2e/storefront-ssr-seo.spec.ts /shop/${SHOP_SLUGS[0]}

# Customer order history. Reads the session cookie at :41 and loadCustomerOrders at :68,
# so the sign-in wall itself is in the first paint rather than appearing after hydration.
SSR shop/orders/page.tsx frontend/e2e/ssr-coverage.spec.ts "/shop/orders"

# --- STATIC: server components that render no server-fetched data ---------------------
#
# These need no raw-HTML coverage assertion because there is no fetched content to be
# missing from the served bytes; their content is in the bundle. The gate asserts the
# claim rather than trusting it — a STATIC page that imports the storefront loader or
# calls fetch( in code fails R-2c.

# Marketing prose rendered from a component; PublicShell + metadata only, no data load.
STATIC business-model-guide/page.tsx marketing prose rendered from a static component, no data source to serve
STATIC competitive/page.tsx the feature matrix is a hardcoded dataset in the component, not a fetched one
STATIC for-operators/page.tsx the operator pitch is static copy, nothing is fetched to render it

# Policy pages. Content comes from lib/company and the policy components at import time.
STATIC legal/page.tsx company details resolved from lib/company at build time, not from an API
STATIC legal/accessibility/page.tsx the accessibility statement is a module constant, not fetched content
STATIC legal/cookies/page.tsx the cookie policy is static prose in PolicySection children
STATIC legal/privacy/page.tsx the privacy notice is static prose plus lib/company constants
STATIC legal/retention/page.tsx the retention table renders docs/retention-manifest data compiled into the bundle

# Authenticated dashboard shells whose data is fetched by a client island below them.
STATIC dashboard/media/review/page.tsx a two-line shell that renders the ReviewQueue island; the queue itself is fetched in the browser
STATIC dashboard/payments/connect/return/page.tsx Stripe passes no state and no query parameters on return, so there is nothing to load
STATIC dashboard/payments/connect/refresh/page.tsx the expired-AccountLink page reports its own fixed outcome and starts a new link on click

# Public but transactional: a metadata-owning server component wrapping a client island.
STATIC shop/signin/page.tsx a server component only so it can export metadata; the PKCE sign-in card is the client island
STATIC unsubscribe/page.tsx robots-noindex transactional page; the token exchange happens in the co-located client island

# --- CLIENT: routes that stay client components, and why -----------------------------
#
# A CLIENT entry is a DECISION to have no server-render coverage, recorded so it can be
# argued with. Each reason is a fact about the route, verified against the file.

# Storefront customer routes. Each depends on something the server does not have.
CLIENT shop/[slug]/cart/page.tsx the basket lives in localStorage (cart-provider.tsx:77), which a server cannot read
CLIENT shop/[slug]/checkout/page.tsx Stripe Elements mounts in the browser (:7-8) and the card fields never touch our servers
CLIENT shop/[slug]/orders/[orderNumber]/page.tsx proves ownership with a checkout email read from localStorage at :70
CLIENT shop/auth/callback/page.tsx exchanges a single-use ?code= from the URL (:35) that arrives only in the browser
CLIENT track/page.tsx pre-fills from sessionStorage at :109 and polls order status after load
CLIENT auth/signin/page.tsx calls next-auth signIn in the browser at :104 to start the operator OIDC flow

# Vendor dashboard. Authenticated, robots-noindex, and every one of these fetches through
# lib/api-client, whose bearer token comes from a BROWSER getSession() at api-client.ts:31-33.
# Converting any of them must forward the CALLER's token to core so RLS still applies
# (ASVS V3/V4) — a service identity would read across tenants. That is a constraint on how
# to convert, not a reason any of them is broken now.
CLIENT dashboard/page.tsx authenticated KPI dashboard fetching six tenant-scoped endpoints with the caller token
CLIENT dashboard/orders/page.tsx authenticated order list with live filters and status actions against the caller token
CLIENT dashboard/orders/[id]/page.tsx authenticated order detail with state-machine actions issued from the browser
CLIENT dashboard/kitchen/page.tsx kitchen display driven by a STOMP subscription that only a browser can hold open
CLIENT dashboard/products/page.tsx authenticated product CRUD with optimistic updates after each mutation
CLIENT dashboard/products/import/page.tsx reads a chosen CSV file from the browser File API before any upload
CLIENT dashboard/customers/page.tsx authenticated customer directory, tenant-scoped by the caller token
CLIENT dashboard/finance/page.tsx authenticated VAT and transaction ledger, tenant-scoped by the caller token
CLIENT dashboard/marketing/page.tsx authenticated campaign surface with client-side status filtering
CLIENT dashboard/shops/page.tsx authenticated shop management with inline publish and edit actions
CLIENT dashboard/staff/page.tsx authenticated shop-scoped grant editor calling the staff API on each change
CLIENT dashboard/onboarding/page.tsx authenticated onboarding tracker polling gate state after each submission
CLIENT dashboard/onboarding/approvals/page.tsx authenticated approvals queue with per-item decisions posted from the browser
CLIENT dashboard/webhooks/page.tsx authenticated subscription editor holding a secret shown once after creation
CLIENT dashboard/webhooks/[id]/page.tsx authenticated delivery log with replay actions issued from the browser
