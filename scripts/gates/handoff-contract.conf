# handoff-contract.conf — declared inputs for scripts/check-handoff-contract.sh
#
# Syntax: one directive per line. Blank lines and lines whose first non-space character
# is '#' are ignored. An unknown directive is a VOID, not a shrug.
#
# ---------------------------------------------------------------------------
# WHY THIS GATE EXISTS, AND WHAT IT DELIBERATELY DOES NOT DO
#
#   HANDOFF.md went stale TWICE in the session of 2026-07-31, both times under the
#   very work it was describing:
#     - it listed PR #383 as open and pointed at a worktree, minutes after #383
#       merged and that worktree was removed (fixed in #391);
#     - its §5.5 said the changelog was "the one thing left undone" after #392 had
#       backfilled it and #393 had gated it (fixed in #394).
#   Nothing read the file, so both survived until a human reread it.
#
#   The hard part is that HANDOFF.md is HALF LIVE STATE AND HALF HISTORY. "§1 What
#   landed: #381 — environment-scoped mute" is a permanent record and must never be
#   flagged. Gating every "#NNN" in the file would fire on correct sentences, and a
#   gate that cries wolf gets `|| true` appended to it.
#
#   So this gate checks only claims the document OPTS IN, plus two things that are
#   unambiguous. It CANNOT catch semantic rot — a paragraph that says the wrong thing
#   in prose is not mechanically detectable, and §5.5's case would only have been
#   caught here by H-3's staleness budget, indirectly. That limit is real; do not read
#   a green run as "the handoff is accurate".
#
# ---------------------------------------------------------------------------
# MAX_PRS_BEHIND <n>
#
#   H-3. How many first-parent commits may land on the base branch after the last
#   commit that touched HANDOFF.md before the document is presumed stale.
#
#   This is the only check that catches SEMANTIC rot, and it catches it indirectly:
#   it does not know what the prose says, only that the world moved and the document
#   did not. Both 2026-07-31 rots had that shape.
#
#   0 would demand a handoff edit in every PR — noise, and the surest route to the
#   gate being ignored. 3 leaves room for a short run of merges while still failing
#   inside a single working session; this session merged six.
MAX_PRS_BEHIND 3

# ---------------------------------------------------------------------------
# HOW TO OPT A CLAIM INTO H-2 (no directive needed — it is a writing convention)
#
#   Write the state word in CAPITALS and the gate will check it against the forge:
#
#       **#384 is now CLOSED** by #389        -> asserted: #384 must be closed
#       #385 still OPEN                       -> asserted: #385 must be open
#
#   Lower-case prose is NOT checked, deliberately, so narrative stays free:
#
#       "#384 is closed."                     -> not a claim, not checked
#
#   Both issues and pull requests are resolved through the same API path, so a
#   merged PR correctly reads CLOSED. A claim naming a number that does not exist
#   is a VOID, not a pass.
