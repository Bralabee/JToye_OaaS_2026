# e2e-skip-budget.conf — the skips the Playwright suite is ALLOWED to report.
#
# WHY THIS FILE EXISTS
#
#   The suite printed "114 passed, 0 failed" while 14 tests SKIPPED, and nothing in that
#   summary distinguished the two. A skip means NOBODY CHECKED THIS. Read as a pass, it
#   is the same failure this milestone keeps re-learning: a green signal over surface no
#   one is looking at (#404 -> #420).
#
#   A bare count is not enough. If one skip is fixed and a new one appears, the count is
#   unchanged and the regression is invisible. So this gate matches skips by TITLE
#   against the declarations below: an undeclared skip fails the build even when the
#   total does not move.
#
# SYNTAX — one directive per line. Blank lines and lines whose first non-space character
# is '#' are ignored. An unknown directive is a VOID, not a shrug.
#
#   MAX_SKIPS <n>
#       Hard ceiling on total skipped tests across all projects.
#
#   ALLOW <substring>
#       A skipped test whose full title contains <substring> is expected. Every ALLOW
#       must be justified in a comment directly above it, naming what would remove it.
#
# RETIRING AN ENTRY
#   When a fixture or capability lands, DELETE its ALLOW and lower MAX_SKIPS. The gate
#   fails on an ALLOW that no longer matches anything (a stale exemption is a lie about
#   coverage), mirroring check-changelog-contract's C-2 and check-alert-metrics'
#   KNOWN_DATALESS — both of which have retired entries exactly that way.
#
# ---------------------------------------------------------------------------------

# 2 tests x 2 projects. Multi-replica STOMP broadcast: needs the stack scaled to two
# core-java replicas (RELAY_E2E=1 + `--scale core-java=2`, which compose supports via the
# 9090-9091 port range). REMOVE WHEN: a scaled-stack job exists, or the spec is rewritten
# to drive both replicas itself.
ALLOW stomp-relay.spec.ts

# 1 test x 2 projects. Issues a REAL partial refund, and RefundService calls
# Stripe.Refund.create. STRIPE_API_KEY is empty on the dev stack. Deliberately NOT faked:
# seeding paymentStatus=CAPTURED with an invented payment_reference would push this past
# its skip and then fail at the Stripe call — worse than skipping.
# REMOVE WHEN: Stripe test-mode keys are provisioned for the dev/CI stack.
ALLOW vendor-refund-flow.spec.ts › vendor logs in, opens an order, issues a partial refund

# Total = 6 (4 + 2), MEASURED and not hand-computed.
#
# HOW IT WAS MEASURED. Nightly run 33142364550 (.github/workflows/e2e-nightly.yml,
# started 2026-08-28T04:43:48Z, 266 results), reading that report's OWN per-test skip
# annotations with jq rather than adding up what this file expects to be true:
#
#   stomp-relay.spec.ts         4  = 2 tests x 2 projects   (#304, the ALLOW above)
#   vendor-refund-flow.spec.ts  2  = 1 test  x 2 projects   (#61,  the ALLOW above)
#                               -
#                               6
#
# WHAT THIS SUPERSEDES, AND WHY THE OLD FIGURE WAS WRONG. The previous comment claimed
# "Total = 8 (4 distinct tests x 2 projects)". The multiplication was the error: its fourth
# test — the Phase 21 blocked-onboarding journey under frontend/e2e/ — skipped on the
# MOBILE project ONLY, so it contributed 1 and not 2, and the real total was 7, never 8.
# That skip is now gone entirely: it was a runtime project pin, which is a "not applicable
# here" and not a "nobody checked this", and it is an @desktop-only tag as of phase 34.
#
# Its ALLOW and the justification that went with it are DELETED rather than carried
# forward, because that justification blamed an absent seeded shop — a cause the same
# nightly measures FALSE: the desktop arm PASSES in 6746ms, which drives the create form
# and is only possible when that fixture IS present. Neither the refuted text nor the spec
# path is reproduced in this file, so no reader and no grep can take this file as still
# exempting that journey. The full refutation, with both arms' measured annotations, is the
# docblock above the tagged block in that spec, next to the tag it justifies.
#
# WHY THE CEILING HAS TO MOVE. At MAX_SKIPS 8 this gate passed on 7 and would equally
# have passed on 6 — it could not tell the three apart, so S-1 could not fail for any
# real change in the skip set and the headroom would silently absorb the next new skip.
# Lowering the ceiling to the measured total is what makes this criterion falsifiable at
# all; it is not bookkeeping. Any new skip is now over budget immediately.
#
# RE-EARNED, NOT MAINTAINED BY HAND. Every spec edit changes the report's specDigest and
# VOIDs this gate until the suite runs again. Plan 34-10 owns the full-suite run that
# re-earns this figure after the phase's spec edits have landed. If this number ever
# needs changing, change it from a fresh report's annotations — never by arithmetic on
# this comment.
MAX_SKIPS 6
