# e2e-skip-budget.conf — the skips the Playwright suite is ALLOWED to report.
#
# WHY THIS FILE EXISTS
#
#   The suite printed "114 passed, 0 failed" while 14 tests SKIPPED, and nothing in that
#   summary distinguished the two. A skip means NOBODY CHECKED THIS. Read as a pass, it
#   is the same failure this milestone keeps re-learning: a green signal over surface no
#   one is looking at (#404 -> #420).
#
#   A bare count is not enough. If one skip is fixed and a new one appears, the count is
#   unchanged and the regression is invisible. So this gate matches skips by TITLE
#   against the declarations below: an undeclared skip fails the build even when the
#   total does not move.
#
# SYNTAX — one directive per line. Blank lines and lines whose first non-space character
# is '#' are ignored. An unknown directive is a VOID, not a shrug.
#
#   MAX_SKIPS <n>
#       Hard ceiling on total skipped tests across all projects.
#
#   ALLOW <substring>
#       A skipped test whose full title contains <substring> is expected. Every ALLOW
#       must be justified in a comment directly above it, naming what would remove it.
#
# RETIRING AN ENTRY
#   When a fixture or capability lands, DELETE its ALLOW and lower MAX_SKIPS. The gate
#   fails on an ALLOW that no longer matches anything (a stale exemption is a lie about
#   coverage), mirroring check-changelog-contract's C-2 and check-alert-metrics'
#   KNOWN_DATALESS — both of which have retired entries exactly that way.
#
# ---------------------------------------------------------------------------------

# 2 tests x 2 projects. Multi-replica STOMP broadcast: needs the stack scaled to two
# core-java replicas (RELAY_E2E=1 + `--scale core-java=2`, which compose supports via the
# 9090-9091 port range). REMOVE WHEN: a scaled-stack job exists, or the spec is rewritten
# to drive both replicas itself.
ALLOW stomp-relay.spec.ts

# Total = 4, MEASURED and not hand-computed. Re-measured 2026-11-01 (PR #1065, plan 30-22).
#
# HOW IT WAS MEASURED. Nightly run 41158370941 (.github/workflows/e2e-nightly.yml on main
# ec73ddee, report startTime 2026-10-31T02:14:29Z, 432 results), reading that report's OWN
# per-test skip annotations with jq rather than adding up what this file expects:
#
#   stomp-relay.spec.ts         4  = 2 tests x 2 projects   (#304, the ALLOW above)
#   vendor-refund-flow.spec.ts  2  = 1 test  x 2 projects   (the partial-refund test)
#                               -
#                               6 on main
#
# The partial-refund test is DELETED by PR #1065, which replaces it with
# stripe-refund-flow.spec.ts against Stripe TEST mode. A deleted test cannot skip, so its
# 2 leave the count and its ALLOW is RETIRED HERE, in the PR that deletes the test: left
# behind, S-3 reds the first nightly after the merge on a stale exemption ("matches no
# skipped test"), and --lint-conf (S-5) cannot see staleness, so nothing earlier would.
# Plan 30-23 lists "the ALLOW retired" as a step after its branch nightly; that step is
# already done — there is no refund ALLOW left for it to delete.
#
# BOTH REPORT SHAPES the nightly feeds this gate (--report twice, titles unioned, counts
# summed):
#   Phase 1  frontend/e2e-artifacts/report.json         the full suite, desktop + mobile,
#            STRIPE_E2E unset: expected 4 skipped, the stomp-relay ALLOW's.
#   Phase 2  frontend/e2e-artifacts/report-stripe.json  stripe-refund-flow.spec.ts, desktop,
#            keyed: 0 skipped — the nightly's "Assert the Stripe report" step already fails
#            the job on any skip there, so this gate never sees one from it.
#   Union    4.
#
# WHY THE CEILING MOVES WITH IT. At MAX_SKIPS 6 with the refund ALLOW gone, a report with a
# FIFTH skip under a declared title passes (measured: rc 0, "all 5 skip(s) are declared
# and within the budget of 6") — S-1 could not fail for that change. The ceiling equals the
# measured total, or the headroom silently absorbs the next new skip.
#
# HISTORY. 2026-08-28 (run 33142364550, 266 results) measured 6 = 4 + 2 and corrected an
# earlier "8" whose fourth test had skipped on the MOBILE project only; that test is an
# @desktop-only tag since phase 34 and its ALLOW was deleted then.
#
# RE-EARNED, NOT MAINTAINED BY HAND. Every spec edit changes the report's specDigest and
# VOIDs this gate until the suite runs again. If this number ever needs changing, change
# it from a fresh report's annotations — never by arithmetic on this comment.
MAX_SKIPS 4
