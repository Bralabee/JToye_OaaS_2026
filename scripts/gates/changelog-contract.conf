# changelog-contract.conf — the declared inputs for scripts/check-changelog-contract.sh
#
# Syntax: one directive per line. Blank lines and lines whose FIRST non-space
# character is '#' are ignored. Unknown directives are a VOID, not a shrug.
#
# ---------------------------------------------------------------------------
# FLOOR <commit-ish>
#
#   The gate checks every feat/fix commit merged AFTER this commit. Exclusive.
#
#   WHY IT IS NOT THE ROOT COMMIT. The gate proves a merged PR is cited by its
#   own "(#NNN)". Entries written before 2026-07-31 do not reliably carry the PR
#   number — the top entry cites the ISSUE it closed (#362) while the commit that
#   merged it was #363, and #363 appears nowhere in the file. Measured
#   2026-07-31: `grep -c '(#363)' docs/CHANGELOG.md` -> 0, `'(#362)'` -> 1.
#   Extending the floor backwards would therefore report historically CORRECT
#   entries as drift — a gate that cries wolf gets `|| true` appended to it.
#
#   ccb15e23 is that #363 commit, so the checked range begins immediately after
#   it: the nine PRs backfilled in #392, every one of which cites its own number.
#
#   MOVE IT FORWARD when a release is cut and the [Unreleased] section is rolled
#   into a version heading — not to silence a failure. Silencing is what EXEMPT
#   is for, and EXEMPT makes you write down why.
FLOOR ccb15e23

# ---------------------------------------------------------------------------
# EXEMPT <pr-number> <reason — required, free text to end of line>
#
#   Declares a merged feat/fix PR that legitimately has no changelog entry (a
#   revert of an unreleased change, a fix to something never shipped, a purely
#   internal refactor mislabelled feat, and so on).
#
#   An exemption RETIRES ITSELF, matching KNOWN_DATALESS in
#   scripts/check-alert-metrics.sh. C-2 FAILS an entry that is stale — one whose
#   PR is now cited in the changelog anyway, or that names a PR which is not an
#   uncited feat/fix commit in range at all. So a stale exemption is removed by
#   the gate going red, not by somebody remembering to review this file.
#
#   A reason is mandatory. An exemption with no reason is a VOID.
#
# There are none today, and that is the point: all nine PRs in range are cited.
