# postgres-major-parity.conf — declared pin sites for scripts/check-postgres-major-parity.sh
#
# Syntax:  ROLE|path|anchor|why this site is load-bearing
#   ROLE    SERVER  = a PostgreSQL server the project runs
#           TOOLING = a pg_dump/pg_restore client, or a tag naming one
#   path    repo-relative. A missing file is a VOID, never a skip.
#   anchor  a LITERAL string that must appear on the line, immediately followed by
#           the major version digits. Not a regex — see WHY ANCHORS below.
#   why     free text, printed on failure so the reader knows what breaks.
#
# ---------------------------------------------------------------------------
# WHY ANCHORS AND NOT A BARE `postgres:` TOKEN
#
#   Two real lines in this tree defeat a bare-token match, and both were found by
#   running the extractor over the actual files rather than reasoning about them:
#
#     docker-compose.full-stack.yml:130
#       KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
#     -> a bare `postgres:` token extracts **5432** as the major version.
#
#     infra/backups/Dockerfile:4
#       # postgres:15-alpine + `apk add aws-cli` failed inside the default-deny
#     -> a HISTORICAL note about the approach that was replaced. It describes what
#        did not work and must keep saying 15 forever. A bare token would treat it
#        as a live pin and fail this gate on a CORRECT tree the day the server
#        moves to 18 — an expected-value that is wrong precisely when the thing
#        being gated is right.
#
#   Anchoring on `image: postgres:` / `FROM postgres:` / `pin: "postgres:` matches
#   the declaration and nothing else. Note that Dockerfile:8's tag IS in a comment
#   and IS load-bearing (it is the documented build command), so "skip comments"
#   would have been the wrong rule — precision has to come from the anchor.
#
# ---------------------------------------------------------------------------
# ADDING A SITE
#
#   Add a row. Do not edit the script. If a new site ever pins the postgres major
#   and is not listed here, this gate cannot see it — the gate's coverage is
#   exactly this file, which is why P-5 fails when a declared site matches nothing.

# --- SERVER: the PostgreSQL servers this project actually runs -----------------
SERVER|docker-compose.full-stack.yml|image: postgres:|the canonical local dev + E2E runtime (CLAUDE.md) — the server every Playwright run and every developer talks to
SERVER|infra/docker-compose.yml|image: postgres:|the server scripts/start-dev.sh actually drives; leaving it behind splits dev from E2E
SERVER|.github/workflows/ci-cd.yaml|image: postgres:|the Run Tests service container — if this lags, CI proves the suite against a version nobody ships

# --- TOOLING: pg_dump / pg_restore, and the tags that name them ----------------
TOOLING|infra/backups/Dockerfile|FROM postgres:|the binaries that PRODUCE every backup and are used to restore it. Newer than the server = dumps the server's own tooling cannot read
TOOLING|infra/backups/Dockerfile|-t ghcr.io/bralabee/jtoye-pg-backup:|the documented build tag. The Dockerfile says "The tag must match the image referenced in k8s/base/pg-backup-cronjob.yaml" — this row is what makes that sentence enforceable
TOOLING|k8s/base/pg-backup-cronjob.yaml|image: ghcr.io/bralabee/jtoye-pg-backup:|the image the backup CronJob actually pulls and runs in staging/production

# --- Both roles also appear in the EOL horizon manifest ------------------------
# check-dependency-horizons.sh tracks each pin's end-of-life. If these drift from
# the runtime pins, the horizon gate is answering a question about a version that
# is no longer deployed — green, and about the wrong thing.
SERVER|infra/dependency-horizons.yaml|pin: "postgres:|the EOL horizon row for the server
TOOLING|infra/dependency-horizons.yaml|pin: "ghcr.io/bralabee/jtoye-pg-backup:|the EOL horizon row for the backup image
