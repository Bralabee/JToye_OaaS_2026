# object-store-residue-allowlist.conf — reasoned exemptions for scripts/check-no-object-store-residue.sh
#
# Format: <target>|<reason>. Full-line # comments and blank lines are ignored.
#
#   path/file:N      exactly line N          path/file      the whole file
#   path/file:N-M    lines N..M, inclusive   path/dir/      every file under the directory
#
# The bar for an entry: the line is a HISTORICAL RECORD (a dated report, an applied migration,
# verbatim command output from an earlier phase, a note that says what Phase 36 removed), or the
# retired token is FUNCTIONAL (a gate that rejects the old origin must name it), or the token is
# not the store at all (a section label that happens to read "S3"). Anything else is residue:
# rewrite it to the current storage — Azure Blob Storage, Azurite locally.
#
# The gate FAILS on a blank reason, a duplicate target, and a STALE entry (one that covers no
# current hit, including one shadowed by a more specific entry). Line entries are unforgiving on
# purpose: an edit that moves an allowed line turns the old number stale and the moved line into
# a violation, so the entry is renumbered in the same change and a reviewer sees it. Prefer a
# line entry to a file entry, and a file entry to a directory. Whole-file and directory entries
# exist only for records Phase 36 plan 36-16 classes as historical.
#
# Measured against the tree after 36-16 Task 1 (see 36-16-SUMMARY.md for the hit counts).

# ---- Dated record directories and whole historical files (plan 36-16, Task 2) --------------------
