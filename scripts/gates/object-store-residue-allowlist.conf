docs/audit/|dated audit and remediation records from 2026-04; they describe the platform as it was audited
docs/analysis/|dated analyses (2026-07-08 remediation backlog, the strategic analysis); point-in-time records
docs/planning/|dated planning records and session handoffs from 2026-04; point-in-time records
