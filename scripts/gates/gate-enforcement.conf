# gate-enforcement.conf — gates that deliberately do NOT run in CI.
#
# Read by scripts/check-gate-enforcement.sh. Format:
#
#     <gate-basename.sh>  <reason>
#
# Blank lines and full-line # comments are ignored. An entry naming a script that is
# not a scripts/check-*.sh is a VOID, not a warning: a table that can name a
# non-existent gate cannot be trusted to name the right ones.
#
# The bar for an entry is NOT "this gate is inconvenient in CI". It is "this gate
# inspects something a GitHub-hosted runner does not have, so it could only ever
# exit 2 (VOID) there" — and a permanently-VOID required job is worse than no job,
# because it teaches people to add `|| true`.
#
# If a self-hosted runner with a live stack ever exists, these become wirable and
# this file should shrink. That is the intended direction of travel.

check-runtime-freshness.sh Compares each built image's tag time against the newest commit touching its build inputs, and the running container's image id against the tag's. A hosted runner has no running stack and DEPLOY_ENABLED is unset, so there is no runtime to inspect.

check-container-config-drift.sh Reads the RUNNING container's effective config and compares it against the compose file that declares it (TS-16). With nothing running, there is no effective config to read.

check-infra-exposure.sh Assertion A (declared bind addresses) is static, but assertions B and C interrogate running containers and the live Grafana instance. Splitting A out is tracked separately; until then the script as a whole needs a stack. NOTE: this means the loopback-binding fix from #510 is currently unprotected against reintroduction in a PR.

check-alert-mute.sh Queries the live Alertmanager for active silences. A mute that has reached an environment is a runtime fact; there is no file that answers it.

# check-openapi-snapshot-fresh.sh is DELIBERATELY ABSENT from this table, and that absence is
# the interesting part. It needs a running core-java to curl, so 33-06 planned it as another
# exemption — but e2e-nightly.yml brings the full compose stack up with `--build` and already
# waits on http://localhost:9090/actuator/health, so a CI context with a live service does
# exist. It is wired there instead. Wiring beats exempting whenever a real runtime is
# available, and check-gate-enforcement.sh short-circuits on `refs > 0` before it ever reads
# this table, so an entry here would have been both unnecessary and untrue.

check-live-shop-coordinates.sh Reads shops.latitude out of the RUNNING dev Postgres through `docker exec`, as two different database roles, and needs DemoDataSeeder to have seeded and PostcodeCentroidImporter to have loaded 1.7M rows. A hosted runner has no container to exec into and no seeded database, so the script's own preconditions (container running, POSTGRES_USER readable, non-empty result) would exit 2 there on every run. Its whole purpose is to prove the DELIVERED RUNTIME matches the branch, which is by definition not a property of a source checkout — the Testcontainers suite (ShopCoordinateBackfillIntegrationTest) is what carries the same invariant into CI.

# check-media-content-types.sh is DELIBERATELY ABSENT from this table since plan 36-12, for the
# same reason as check-openapi-snapshot-fresh.sh above. It used to be exempt because it read the
# retired object store through `docker exec`; Phase 36 re-targeted it at Azurite's public
# container through the host az CLI, and e2e-nightly.yml has both a live Azurite and a
# preinstalled az, so it is WIRED there. An entry here would also be worse than untrue:
# check-gate-enforcement.sh only reads this table for gates no workflow references, so a stale
# entry would let the nightly step be deleted later with this gate still green.

# check-staging-edge.sh is DELIBERATELY ABSENT from this table. The old entry said a hosted runner
# "has no public staging to call and no cluster credential" and that "plan 29-21 runs it from the
# deploy job". Neither half was true: staging is public (the deploy job already curls it), the
# script's read-only run needs only curl, jq and getent (the kube context guard applies to
# --fail-arms alone, so the job holds no cluster credential), and plan 29-21 never wired it. It is WIRED as the
# `staging-edge-probe` job in ci-cd.yaml, a separate job (needs: deploy-staging) so a red never
# triggers the deploy's rollback, running the four read-only arms with --skip-burst. Its burst arm
# (timing-sensitive) and --fail-arms (creates a scratch Ingress) stay operator-run; they are
# options of the same script, not a reason to exempt the script.

# check-networkpolicy-enforcement.sh is DELIBERATELY ABSENT from this table. Its --selftest (22
# classifier arms, no cluster: a timeout is DENIED, a control that does not connect is VOID, a
# denied arm that connects is FAIL) is WIRED into k8s-validate. The LIVE probe (it creates agnhost
# probe pods, a probe namespace and a run-scoped egress policy on jtoye-stg-aks and needs an
# enforcing CNI) has no hosted-runner form and is still run by an operator against staging
# (DPLY-05, #297, plan 29-17). check-gate-enforcement.sh short-circuits on a workflow reference,
# so an entry here would never be read, and it would claim the script is not in CI when its
# verdict logic is.
